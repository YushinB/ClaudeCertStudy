<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCDV-F · Claude Certified Developer - Foundations</title>
<meta name="description" content="Bộ đề luyện thi CCAR-F.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-F')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

</style>

er":["B"],"multi":false,"explain":{"text":"The correct answer is B"}},{"id":"ccdvf-q027","n":27,"topic":1,"type":"mcq","stem":{"en":"Your Claude application makes high-volume API calls during business hours and very few calls overnight. The team is concerned about staying within rate limits during peak hours and wants to understand how the Claude API enforces those limits. How would you proceed?","vi":"\u1ee8ng d\u1ee5ng Claude c\u1ee7a b\u1ea1n th\u1ef1c hi\u1ec7n c\u00e1c cu\u1ed9c g\u1ecdi API s\u1ed1 l\u01b0\u1ee3ng l\u1edbn trong gi\u1edd l\u00e0m vi\u1ec7c v\u00e0 r\u1ea5t \u00edt cu\u1ed9c g\u1ecdi qua \u0111\u00eam. Nh\u00f3m lo ng\u1ea1i v\u1ec1 vi\u1ec7c duy tr\u00ec gi\u1edbi h\u1ea1n t\u1ed1c \u0111\u1ed9 trong gi\u1edd cao \u0111i\u1ec3m v\u00e0 mu\u1ed1n hi\u1ec3u c\u00e1ch API Claude th\u1ef1c thi c\u00e1c gi\u1edbi h\u1ea1n \u0111\u00f3. B\u1ea1n s\u1ebd ti\u1ebfn h\u00e0nh nh\u01b0 th\u1ebf n\u00e0o?","jp":"Claude \u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3\u306f\u3001\u55b6\u696d\u6642\u9593\u4e2d\u306b\u5927\u91cf\u306e API \u547c\u3073\u51fa\u3057\u3092\u884c\u3044\u307e\u3059\u304c\u3001\u591c\u9593\u306b\u306f\u307b\u3068\u3093\u3069\u547c\u3073\u51fa\u3057\u3092\u884c\u3044\u307e\u305b\u3093\u3002\u30c1\u30fc\u30e0\u306f\u3001\u30d4\u30fc\u30af\u6642\u306b\u30ec\u30fc\u30c8\u5236\u9650\u5185\u306b\u53ce\u307e\u308b\u3053\u3068\u3092\u61f8\u5ff5\u3057\u3066\u304a\u308a\u3001Claude API \u304c\u3053\u308c\u3089\u306e\u5236\u9650\u3092\u3069\u306e\u3088\u3046\u306b\u5f37\u5236\u3059\u308b\u304b\u3092\u7406\u89e3\u3057\u305f\u3044\u3068\u8003\u3048\u3066\u3044\u307e\u3059\u3002\u3069\u306e\u3088\u3046\u306b\u9032\u3081\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Review the API documentation for streaming endpoints and evaluate whether migrating peak-hour calls to streaming reduces exposure to rate limit enforcement.","vi":"Xem l\u1ea1i t\u00e0i li\u1ec7u API v\u1ec1 \u0111i\u1ec3m cu\u1ed1i ph\u00e1t tr\u1ef1c tuy\u1ebfn v\u00e0 \u0111 574\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"A manager and supervisor pattern with shared context, where the top-level agent and the subagents all share a single conversation history that grows as the request flows through the system.","vi":"M\u1eabu ng\u01b0\u1eddi qu\u1ea3n l\u00fd v\u00e0 ng\u01b0\u1eddi gi\u00e1m s\u00e1t c\u00f3 b\u1ed1i c\u1ea3nh chung, trong \u0111\u00f3 t\u1ed5ng \u0111\u00e0i vi\u00ean c\u1ea5p cao nh\u1ea5t v\u00e0 \u0111\u1ea1i l\u00fd ph\u1ee5 \u0111\u1ec1u chia s\u1ebb m\u1ed9t l\u1ecbch s\u1eed h\u1ed9i tho\u1ea1i duy nh\u1ea5t, l\u1ecbch s\u1eed n\u00e0y s\u1ebd ph\u00e1t tri\u1ec3n khi y\u00eau c\u1ea7u truy\u1ec1n qua h\u1ec7 th\u1ed1ng.","jp":"\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u3092\u5171\u6709\u3059\u308b\u30de\u30cd\u30fc\u30b8\u30e3\u30fc\u3068\u30b9\u30fc\u30d1\u30fc\u30d0\u30a4\u30b6\u30fc\u306e\u30d1\u30bf\u30fc\u30f3\u3002\u30c8\u30c3\u30d7\u30ec\u30d9\u30eb\u306e\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u3068\u30b5\u30d6\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306f\u3059\u3079\u3066\u3001\u30ea\u30af\u30a8\u30b9\u30c8\u304c\u30b7\u30b9\u30c6\u30e0\u5185\u3092\u6d41\u308c\u308b\u306b\u3064\u308c\u3066\u5897\u52a0\u3059\u308b\u5358\u4e00\u306e\u4f1a\u8a71\u5c65\u6b74\u3092\u5171\u6709\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"A pipeline pattern, where each component processes the user request in sequence and passes the full conversation history along with the request to the next component in the pipeline.","vi":"M\u1eabu quy tr\u00ecnh, trong \u0111\u00f3 m\u1ed7i th\u00e0nh ph\u1ea7n x\u1eed l\u00fd y\u00eau c\u1ea7u c\u1ee7a ng\u01b0\u1eddi d\u00f9ng theo tr\u00ecnh t\u1ef1 v\u00e0 chuy\u1ec3n to\u00e0n b\u1ed9 l\u1ecbch s\u1eed h\u1ed9i tho\u1ea1i c\u00f9ng v\u1edbi y\u00eau c\u1ea7u \u0111\u1ebfn th\u00e0nh ph\u1ea7n ti\u1ebfp theo trong quy tr\u00ecnh.","jp":"\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3 \u30d1\u30bf\u30fc\u30f3\u3002\u5404\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u304c\u30e6\u30fc\u30b6\u30fc \u30ea\u30af 0c8\u304c\u3001\u4e00\u6642\u7684\u306a\u30cd\u30c3\u30c8\u30ef\u30fc\u30af\u306e\u554f\u984c\u3084\u77ed\u3044\u30ec\u30fc\u30c8\u5236\u9650\u5fdc\u7b54\u306a\u3069\u3001\u4e00\u6642\u7684\u306a API \u30a8\u30e9\u30fc\u3092 Claude SDK \u304c\u3069\u306e\u3088\u3046\u306b\u51e6\u7406\u3059\u308b\u306e\u304b\u3092\u5c0b\u306d\u307e\u3057\u305f\u3002\u5f7c\u3089\u306f\u3001\u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3 \u30b3\u30fc\u30c9\u304c\u3059\u3079\u3066\u306e\u4e00\u6642\u7684\u306a\u30a8\u30e9\u30fc\u3092\u51e6\u7406\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u304b\u3069\u3046\u304b\u3001\u307e\u305f\u306f SDK \u304c\u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u52d5\u4f5c\u3092\u63d0\u4f9b\u3057\u3066\u3044\u308b\u304b\u3069\u3046\u304b\u3092\u77e5\u308a\u305f\u3044\u3068\u8003\u3048\u3066\u3044\u307e\u3059\u3002 SDK \u306e\u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u52d5\u4f5c\u3092\u3069\u306e\u3088\u3046\u306b\u8aac\u660e\u3057\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"The SDK provides default retry behavior for transient errors up to a fixed number of attempts, and this behavior is not configurable.","vi":"SDK cung c\u1ea5p h\u00e0nh vi th\u1eed l\u1ea1i m\u1eb7c \u0111\u1ecbnh cho c\u00e1c l\u1ed7i t\u1ea1m th\u1eddi l\u00ean t\u1edbi s\u1ed1 l\u1ea7n th\u1eed c\u1ed1 \u0111\u1ecbnh v\u00e0 h\u00e0nh vi n\u00e0y kh\u00f4ng th\u1ec3 \u0111\u1ecbnh c\u1ea5u h\u00ecnh \u0111\u01b0\u1ee3c.","jp":"SDK \u3067\u306f\u3001\u4e00\u6642\u7684\u306a\u30a8\u30e9\u30fc\u306b\u5bfe\u3057\u3066\u56fa\u5b9a\u8a66\u884c\u56de\u6570\u307e\u3067\u306e\u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u518d\u8a66\u884c\u52d5\u4f5c\u304c\u63d0\u4f9b\u3055\u308c\u3066\u3044\u307e\u3059\u304c\u3001\u3053\u306e\u52d5\u4f5c\u306f\u69cb\u6210\u3067\u304d\u307e\u305b\u3093\u3002"}},{"k":"B","t":{"en":"The SDK provides default retry behavior for network errors but surfaces rate-limit responses directly to the application code, which must implement its own retry logic for those cases.","vi":"SDK cung c\u1ea5p h\u00e0nh vi th\u1eed l\u1ea1i m\u1eb7c \u0111\u1ecbnh cho c\u00e1c l\u1ed7i m\u1ea1ng nh\u01b0ng hi\u1ec3n th\u1ecb ph\u1ea3n h\u1ed3i gi\u1edbi h\u1ea1n t\u1ed1c \u0111\u1ed9 tr\u1ef1c ti\u1ebfp cho m\u00e3 \u1ee9ng d\u1ee5ng, m\u00e3 n\u00e0y ph\u1ea3i tri\u1ec3n khai logic th\u1eed l\u1ea1i c\u1ee7a ri\u00eang m\u00ecnh cho nh\u1eefng tr\u01b0\u1eddng h\u1ee3p \u0111\u00f3.","jp":"SDK \u306f\u30cd\u30c3\u30c8\u30ef\u30fc\u30af \u30a8\u30e9\u30fc\u306b\u5bfe\u3059\u308b\u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u518d\u8a66\u884c\u52d5\u4f5c\u3092\u63d0\u4f9b\u3057\u307e\u3059\u304c\u3001\u30ec\u30fc\u30c8\u5236\u9650\u5fdc\u7b54\u3092\u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3 \u30b3\u30fc\u30c9\u306b\u76f4\u63a5\u8868\u793a\u3059\u308b\u305f\u3081\u3001\u30a2\u30d7\u30ea\u30b1\u30fc\u30b7\u30e7\u30f3 \u30b3\u30fc\u30c9\u306f\u305d\u306e\u3088\u3046\u306a\u5834\u5408\u306b\u72ec\u81ea\u306e\u518d\u8a66\u884c\u30ed\u30b8\u30c3\u30af\u3092\u5b9f\u88c5\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"C","t":{"en":"The SDK logs transient errors to a default error stream and continues execution without retrying, leaving the application code responsible for detecting and responding to failed calls.","vi":"SDK ghi l\u1ea1i c\u00e1c l\u1ed7i nh\u1ea5t th\u1eddi v\u00e0o lu\u1ed3ng l\u1ed7i m\u1eb7c \u0111\u1ecbnh v\u00e0 ti\u1ebfp t\u1ee5c th\u1ef1c thi m\u00e0 kh\u00f4ng c\u1ea7n th\u1eed l\u1ea1i, \u0111\u1ec3 l\u1ea1i m\u00e3 \u1ee9ng d\u1ee5ng ch\u1ecbu tr\u00e1ch nhi\u1ec7m ph\u00e1t hi\u1ec7n v\u00e0 ph\u1ea3n h\u1ed3i c\u00e1c l\u1ec7nh g\u1ecdi kh\u00f4ng th\u00e0nh c\u00f4ng.","jp":"SDK \u306f\u4e00\u6642\u7684\u306a\u30a8\u30e9\u30fc\u3092\u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u30a8\u30e9\u30fc \u30b9\u30c8\u30ea\u30fc\u30e0\u306b\u8a18\u9332\u3057\u3001\u518d\u8a66\u884c\u305b\u305a\u306b\u5b9f\u884c\u3092\u7d9a\u884c\u3057\u3001\u5931\u6557\u3057\u305f\u547c\u3073\u51fa\u3057\u306e\u691c\u51fa\u3068\u5fdc\u7b54\u306f\u30a2\u30d7\u30 gent passes along without catching. What is the most appropriate way to address these failures?","vi":"M\u1ed9t nh\u00f3m \u0111\u00e3 tri\u1ec3n khai m\u1ed9t h\u1ec7 th\u1ed1ng nhi\u1ec1u t\u00e1c nh\u00e2n, trong \u0111\u00f3 m\u1ed9t t\u00e1c nh\u00e2n ch\u00ednh ph\u00e2n t\u00e1ch c\u00e1c y\u00eau c\u1ea7u c\u1ee7a ng\u01b0\u1eddi d\u00f9ng v\u00e0 \u1ee7y quy\u1ec1n c\u00e1c nhi\u1ec7m v\u1ee5 ph\u1ee5 cho ba t\u00e1c nh\u00e2n ph\u1ee5 chuy\u00ean bi\u1ec7t: m\u1ed9t \u0111\u1ec3 truy xu\u1ea5t d\u1eef li\u1ec7u, m\u1ed9t \u0111\u1ec3 ph\u00e2n t\u00edch v\u00e0 m\u1ed9t \u0111\u1ec3 t\u1ea1o b\u00e1o c\u00e1o. Trong qu\u00e1 tr\u00ecnh s\u1ea3n xu\u1ea5t, nh\u00f3m quan s\u00e1t th\u1ea5y r\u1eb1ng c\u00e1c t\u00e1c nh\u00e2n ph\u1ee5 \u0111ang th\u1ef1c hi\u1ec7n c\u00e1c l\u1ec7nh g\u1ecdi c\u00f4ng c\u1ee5 d\u01b0 th\u1eeba, \u0111\u00f4i khi v\u01b0\u1ee3t qu\u00e1 ng\u00e2n s\u00e1ch m\u00e3 th\u00f4ng b\u00e1o v\u00e0 \u0111\u00f4i khi t\u1ea1o ra c\u00e1c k\u1ebft qu\u1ea3 \u0111\u1ea7u ra m\u00e2u thu\u1eabn v\u1edbi nhau - t\u1ea5t c\u1ea3 \u0111\u1ec1u \u0111\u01b0\u1ee3c t\u00e1c nh\u00e2n ch\u00ednh chuy\u1ec3n \u0111i m\u00e0 kh\u00f4ng n\u1eafm b\u1eaft \u0111\u01b0\u1ee3c. C\u00e1ch th\u00edch h\u1ee3p nh\u1ea5t \u0111\u1ec3 gi\u1ea3i quy\u1ebft nh\u1eefng th\u1ea5t b\u1ea1i n\u00e0y l\u00e0 g\u00ec?","jp":"\u30c1\u30fc\u30e0\u306f\u30de\u30eb\u30c1\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8 \u30b7\u30b9\u30c6\u30e0\u3092\u5c0e\u5165\u3057\u307e\u3057\u305f\u3002\u3053\u306e\u30b7\u30b9\u30c6\u30e0\u3067\u306f\u3001\u30d7\u30e9\u30a4\u30de\u30ea \u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u304c\u30e6\u30fc\u30b6\u30fc \u30ea\u30af\u30a8\u30b9\u30c8\u3092\u5206\u89e3\u3057\u3001\u30c7\u30fc\u30bf\u53d6\u5f97\u7528\u3001\u5206\u6790\u7528\u3001\u30ec\u30dd\u30fc\u30c8\u751f\u6210\u7528\u306e 3 \u3064\u306e\u7279\u6b8a\u306a\u30b5\u30d6\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306b\u30b5\u30d6\u30bf\u30b9\u30af\u3092\u59d4\u4efb\u3057\u307e\u3059\u3002\u904b\u75 let L = "vi";
const t = (k,...a) => { const v = T[L][k]; return typeof v === "function" ? v(...a) : v; };
/* văn bản song ngữ: luôn hiện bản tiếng Anh (đề gốc), kèm bản Việt khi giao diện là VI */
const tx = o => !o ? "" : o.en + ((L === "vi" && o.vi) ? `<span class="gloss">${o.vi}</span>` : (L === "jp" && o.jp) ? `<span class="gloss">${o.jp}</span>` : "");

/* ---------- dữ liệu phẳng ---------- */
const ALL = [], BY_ID = {};
DATA.topics.forEach(tp => tp.questions.forEach(q => {
  q.idx = ALL.length + 1;
  q.hay = fold(strip([q.stem.en, q.stem.vi, q.stem.jp,
    (q.options||[]).map(o => o.t.en + " " + (o.t.vi||"") + " " + (o.t.jp||"")).join(" "),
    (q.rows||[]).map(r => r.t.en + " " + (r.t.vi||"") + " " + (r.t.jp||"")).join(" "),
    (q.blanks||[]).map(b => (b.opts||[]).map(o => o.en).join(" ")).join(" "),
    q.explain && (q.explain.key || q.explain.text), (q.explain && q.explain.elim || []).join(" ")
  ].filter(Boolean).join(" ")));
  ALL.push(q); BY_ID[q.id] = q;
}));
const TOPICS = DATA.topics.map(d => d.n);
const TYPES = [...new Set(ALL.map(q => q.type))];
const PASS = DATA.meta.pass || 70;

/* ============================================================
   LOGIC THEO DẠNG CÂU
   ============================================================ */
function blankAnswer(q){
  if(q.type === "mcq")   return [];
  if(q.type === "yesno") return q.rows.map(() => null);
  return q.blanks.map(() => null);
}
function answeredCount(q, a){
  if(q.type === "mcq") return (a||[]).length;
  return (a||[]).filter(v => v !== null && v !== undefined).length;
}
function totalParts(q){
  if(q.type === "mcq") return q.answer.length;
  if(q.type === "yesno") return q.rows.length;
  return q.blanks.length;
}
function isComplete(q, a){ return answeredCount(q,a) >= totalParts(q); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "mcq")
    return a.length === q.answer.length && [...a].sort().join("") === [...q.answer].sort().join("");
  if(q.type === "yesno") return q.rows.every((r,i) => a[i] === r.a);
  return q.blanks.every((b,i) => a[i] === b.a);
}
function stampHTML(q){
  if(q.type === "mcq")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${q.answer.join(" ")}</span></div>`;
  if(q.type === "yesno")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${
      q.rows.map(r => r.a === "Y" ? "Y" : "N").join(" ")}</span></div>`;
  return `<div class="stamp txt"><span class="t">${t("ansTitle")}</span><span class="v">${
    q.blanks.map(b => strip(b.opts[b.a].en)).join(" · ")}</span></div>`;
}

/* ---------- thân câu hỏi (dùng chung cho ôn tập / thi / xem lại) ---------- */
function bodyHTML(q, a, done, act){
  const P = act ? `data-act="${act}"` : "";
  if(q.type === "mcq"){
    return `<ul class="opts">` + q.options.map(o => {
      const right = q.answer.includes(o.k), pick = (a||[]).includes(o.k);
      return `<li><button class="opt" ${P} data-k="${o.k}" data-right="${right?1:0}" data-pick="${pick?1:0}"
          ${done?'aria-disabled="true"':""}>
        <span class="k">${o.k}</span><span class="tx">${tx(o.t)}</span>
        <span class="mk mk-you">${t("markYou")}</span><span class="mk mk-ok">${t("markOk")}</span>
      </button></li>`; }).join("") + `</ul>`;
  }
  if(q.type === "yesno"){
    return `<ul class="ynlist">` + q.rows.map((r,i) => {
      const v = a ? a[i] : null;
      const right = v !== null && v === r.a;
      return `<li class="yn" data-right="${right?1:0}">
        <div class="ynt">${tx(r.t)}</div>
        <div class="ynb" role="group">
          <button ${P} data-i="${i}" data-v="Y" data-correct="${r.a==="Y"?1:0}" aria-pressed="${v==="Y"}">${t("yes")}</button>
          <button ${P} data-i="${i}" data-v="N" data-correct="${r.a==="N"?1:0}" aria-pressed="${v==="N"}">${t("no")}</button>
        </div></li>`; }).join("") + `</ul>`;
  }
  return `<div class="blanks">` + q.blanks.map((b,i) => {
    const v = a ? a[i] : null;
    const right = v !== null && v === b.a;
    return `<div class="blank" data-right="${right?1:0}">
      ${b.label ? `<span class="blabel">${tx(b.label)}</span>` : ""}
      <label class="sel ${v!==null?"on":""}">
        <select ${P} data-i="${i}">
          <option value="">— —</option>
          ${b.opts.map((o,j) => {
            const en = strip(o.en), vi = o.vi ? strip(o.vi) : "";
            return `<option value="${j}" ${v===j?"selected":""}${vi?` title="${esc(vi)}"`:""}>${esc(en)}</option>`;
          }).join("")}
        </select><span class="cap"></span>
      </label>
      <span class="ansline ${right?"ok":"bad"}">${t("ansTitle")}: ${esc(strip(b.opts[b.a].en))}${
        L === "vi" && b.opts[b.a].vi ? ` — ${esc(strip(b.opts[b.a].vi))}` : ""}${L === "jp" && b.opts[b.a].jp ? ` — ${esc(strip(b.opts[b.a].jp))}` : ""}</span>
    </div>`; }).join("") + `</div>`;
}

/* ---------- khối giải thích ---------- */
function noteHTML(r){
  return `<div class="notewrap"><span class="lbl">${t("secNote")}</span>
    <textarea data-act="note" rows="2" placeholder="${esc(t("notePh"))}">${esc(r.note||"")}</textarea></div>`;
}
function revealHTML(q, verdict, extra){
  const e = q.explain || {};
  const two = !!(e.key && e.elim && e.elim.length);
  let secs = "";
  if(e.key)  secs += `<div><h4 class="sech">${t("secKey")}</h4><p class="prose">${e.key}</p></div>`;
  if(e.elim && e.elim.length)
    secs += `<div><h4 class="sech">${t("secElim")}</h4><ul class="elim">${e.elim.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(e.text) secs += `<div><h4 class="sech">${t("secExp")}</h4><p class="prose">${e.text}</p></div>`;
  const conf = q.conf ? `<span class="conf ${q.conf.toLowerCase()}">${t("conf"+q.conf.toUpperCase())}</span>` : "";
  return `<div class="rev">
    <div class="revtop">${stampHTML(q)}${verdict}${conf}</div>
    <div class="revgrid ${two?"two":""}">${secs}</div>
    ${q.cite ? `<p class="cite">${t("source")}: ${q.cite}</p>` : ""}
    ${extra || ""}
  </div>`;
}

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const S = { mode:"study", f:{topic:"all",status:"all",type:"all",q:""},
            p:{}, history:[], cur:null, exam:null, reviewWrongOnly:false };
const rec = id => (S.p[id] ||= { a:null, done:0, ok:null, flag:0, note:"", n:0 });
const ansOf = q => { const r = rec(q.id); if(!r.a) r.a = blankAnswer(q); return r.a; };

function save(){
  const e = S.exam;
  const exam = (e && e.phase === "run") ? {
    ids:e.list.map(x=>x.id), order:e.order, answers:e.answers, flags:e.flags,
    pos:e.pos, started:e.started, duration:e.duration, cfg:e.cfg } : null;
  store.set(KEY, JSON.stringify({ v:2, lang:L, theme:document.documentElement.dataset.theme,
                                  p:S.p, history:S.history, exam }));
}
function load(){
  try{
    const d = JSON.parse(store.get(KEY) || "{}");
    if(d.p) S.p = d.p;
    if(Array.isArray(d.history)) S.history = d.history;
    if(d.lang) L = d.lang;
    if(d.exam && d.exam.ids){
      const list = d.exam.ids.map(id => {
        const q = BY_ID[id]; if(!q) return null;
        const ord = d.exam.order && d.exam.order[id];
        if(ord && q.options) return Object.assign({}, q, { options: ord.map(k => q.options.find(o=>o.k===k)).filter(Boolean) });
        return q;
      }).filter(Boolean);
      if(list.length === d.exam.ids.length)
        S.exam = { phase:"run", list, order:d.exam.order, answers:d.exam.answers||{}, flags:d.exam.flags||{},
                   pos:d.exam.pos||0, started:d.exam.started, duration:d.exam.duration, cfg:d.exam.cfg, timer:null };
    }
  }catch(e){}
}

/* ---------- lọc ---------- */
function filtered(){
  const term = fold(S.f.q.trim());
  return ALL.filter(q => {
    if(S.f.topic !== "all" && q.topic !== +S.f.topic) return false;
    if(S.f.type !== "all" && q.type !== S.f.type) return false;
    const r = S.p[q.id];
    if(S.f.status === "todo"  && r && r.done) return false;
    if(S.f.status === "right" && !(r && r.ok === true)) return false;
    if(S.f.status === "wrong" && !(r && r.ok === false)) return false;
    if(S.f.status === "flag"  && !(r && r.flag)) return false;
    if(term && !q.hay.includes(term)) return false;
    return true;
  });
}
function statsOf(list){
  let done=0, right=0, flag=0;
  list.forEach(q => { const r=S.p[q.id]; if(!r) return;
    if(r.ok === true || r.ok === false){ done++; if(r.ok) right++; }
    if(r.flag) flag++; });
  return { done, right, flag, total:list.length };
}

function applyI18n(){
  document.documentElement.lang = L;
  $$("[data-t]").forEach(el => { const v = T[L][el.dataset.t]; if(typeof v === "string") el.textContent = v; });
  $$("[data-t-ph]").forEach(el => { const v = T[L][el.dataset.tPh]; if(typeof v === "string") el.placeholder = v; });
  $("#storeNote").textContent = store.ok ? t("okStore") : t("noStore");
  $$("[data-lang]").forEach(b => b.setAttribute("aria-pressed", b.dataset.lang === L));
  $$("[data-mode]").forEach(b => b.setAttribute("aria-pressed", b.dataset.mode === S.mode));
}

function renderRail(){
  // một hàm dựng hàng dùng chung cho MỌI danh sách lọc — thêm bộ lọc mới thì
  // gọi lại nó, đừng đẻ ra kiểu hiển thị thứ hai.
  const listRow = (key, cur, v, lab, count, mark) =>
    `<button class="srow" data-f-key="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">
      <span class="dot ${mark||""}"></span><span class="nm">${esc(lab)}</span><span class="ct">${count}</span>
    </button>`;

  // ----- trạng thái -----
  const counts = (() => {
    let todo=0, right=0, wrong=0, flag=0;
    ALL.forEach(q => { const r = S.p[q.id];
      if(!r || !r.done) todo++;
      if(r && r.ok === true) right++;
      if(r && r.ok === false) wrong++;
      if(r && r.flag) flag++; });
    return {all:ALL.length, todo, right, wrong, flag};
  })();
  $("#fStatus").innerHTML = [
    ["all", t("sAll"), ""], ["todo", t("sTodo"), ""], ["right", t("sRight"), "g"],
    ["wrong", t("sWrong"), "r"], ["flag", t("sFlag"), "f"]
  ].map(([v,lab,mk]) => listRow("status", S.f.status, v, lab, counts[v], mk)).join("");

  // ----- dạng câu: chỉ hiện khi đề có từ hai dạng trở lên -----
  const typeInfo = {mcq:[t("kMcq"),"m-mcq"], yesno:[t("kYesno"),"m-yesno"], dropdown:[t("kDrop"),"m-drop"]};
  const typeBlock = $("#fTypeBlk");
  if(TYPES.length < 2) typeBlock.classList.add("hide");
  else {
    typeBlock.classList.remove("hide");
    const tc = Object.fromEntries(TYPES.map(x => [x, ALL.filter(q => q.type === x).length]));
    $("#fType").innerHTML = listRow("type", S.f.type, "all", t("kAll"), ALL.length, "")
      + TYPES.map(x => listRow("type", S.f.type, x, typeInfo[x][0], tc[x], typeInfo[x][1])).join("");
  }

  const row = (v, name, list) => {
    const s = statsOf(list);
    return `<button class="trow" data-f-key="topic" data-v="${v}" aria-pressed="${String(v)===String(S.f.topic)}">
      <span class="nm">${esc(name)}</span><span class="ct">${s.done}/${s.total}</span>
      <span class="meter"><i class="g" style="width:${pct(s.right,s.total)}%"></i><i class="r" style="width:${pct(s.done-s.right,s.total)}%"></i></span>
    </button>`;
  };
  $("#fTopics").innerHTML = row("all", t("sAll"), ALL) +
    TOPICS.map(n => row(n, t("topicN", n), ALL.filter(q => q.topic === n))).join("");
}

function renderAside(){
  const box = $("#asideBody");
  if(S.mode === "exam" && S.exam && S.exam.phase === "run"){ box.innerHTML = asideExam(); return; }
  if(S.mode === "stats"){ box.innerHTML = asideKeys(); return; }
  box.innerHTML = asideStudy() + asideKeys();
}
function asideStudy(){
  const s = statsOf(ALL);
  const queue = ALL.filter(q => { const r = S.p[q.id]; return r && (r.ok === false || r.flag); }).slice(0,40);
  return `<div class="blk">
    <span class="lbl">${t("progress")}</span>
    <div class="bigbar"><i style="width:${pct(s.right,s.total)}%;background:var(--ok)"></i><i style="width:${pct(s.done-s.right,s.total)}%;background:var(--bad)"></i></div>

function typeTag(q){
  if(q.type === "yesno") return `<span class="tag multi">${t("tYesno")}</span>`;
  if(q.type === "dropdown") return `<span class="tag multi">${t("tDrop")}</span>`;
  if(q.multi) return `<span class="tag multi">${t("multi", q.answer.length)}</span>`;
  return "";
}

function recordHTML(q){
  const r = rec(q.id), a = ansOf(q);
  const tags = [`<span class="tag">${esc(t("topicN", q.topic))}</span>`,
                `<span class="tag">${esc(t("qN", q.n))}</span>`, typeTag(q)];
  if(r.done && r.ok === true)  tags.push(`<span class="tag ok">${t("verdictOk")}</span>`);
  if(r.done && r.ok === false) tags.push(`<span class="tag bad">${t("verdictBad")}</span>`);
  tags.push(`<button class="flagbtn" data-act="flag" aria-pressed="${!!r.flag}"
      title="${esc(r.flag?t("unflag"):t("flag"))}" aria-label="${esc(r.flag?t("unflag"):t("flag"))}">${ICON.flag}</button>`);

  const n = answeredCount(q,a), total = totalParts(q);

    ? `<button class="btn" data-act="again">${t("again")}</button>`
    : `<button class="btn solid" data-act="check" ${isComplete(q,a)?"":"disabled"}>${t("check")}</button>

       <span class="note">${n===0 ? t("pickFirst") : n>=total ? t("answered") : t("partial", n, total)}</span>`;

                : r.ok === false ? `<span class="verdict bad">${t("verdictBad")}</span>`
                : `<span class="note">${t("verdictNone")}</span>`;

  return `<article class="rec ${S.cur===q.id?"cur":""}" id="rec-${q.id}" data-id="${q.id}" data-done="${r.done?1:0}">

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(q, a, el){
  if(q.type === "mcq"){
    const k = el.dataset.k;
    if(q.answer.length > 1){
      const i = a.indexOf(k);
      if(i >= 0) a.splice(i,1);
      else { if(a.length >= q.answer.length) a.shift(); a.push(k); }
    } else { a.length = 0; if(!el.dataset.was) a.push(k); }
  } else if(q.type === "yesno"){
    const i = +el.dataset.i;
    a[i] = a[i] === el.dataset.v ? null : el.dataset.v;
  } else {
    const i = +el.dataset.i;
    a[i] = el.value === "" ? null : +el.value;
  }
}

function checkRecord(id, revealOnly){
  const q = BY_ID[id], r = rec(id), a = ansOf(q);
  r.done = 1;
  r.ok = (revealOnly && answeredCount(q,a) === 0) ? null : isCorrect(q, a);
  r.n = (r.n||0) + 1;
  save(); refreshRecord(id); renderRail(); renderAside();
}
function setMode(m){
  S.mode = m;
  if(m === "exam" && !S.exam) S.exam = { phase:"setup", cfg:{count:30,mins:45,topic:"all",shuffle:"yes",source:"all"} };
  if(m === "exam" && S.exam.phase === "run" && !S.exam.timer && S.exam.duration){
    tickTimer(); S.exam.timer = setInterval(tickTimer, 1000);
  }
  renderAll(); window.scrollTo({top:0});
}
function startExam(){
  const cfg = S.exam.cfg, pool = examPool(cfg);
  if(!pool.length) return;
  const count = Math.max(1, Math.min(+cfg.count || 1, pool.length));
  const picked = shuffle(pool).slice(0, count);
  const order = {};
  const list = picked.map(q => {
    if(cfg.shuffle === "yes" && q.options){
      const opts = shuffle(q.options);
      order[q.id] = opts.map(o => o.k);
      return Object.assign({}, q, { options: opts });
    }
    return q;
  });
  clearInterval(S.exam.timer);
  S.exam = { phase:"run", list, order, answers:{}, flags:{}, pos:0, started:Date.now(),
             duration:(+cfg.mins||0)*60, cfg, timer:null };
  if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer, 1000); }
  save(); renderAll(); window.scrollTo({top:0});
}
function tickTimer(){
  const e = S.exam;
  if(!e || e.phase !== "run" || !e.duration) return;
  const left = e.duration - Math.floor((Date.now()-e.started)/1000);
  const txt = clock(Math.max(0,left));
  ["timerOut","timerHead"].forEach(id => {
    const n = document.getElementById(id);
    if(n){ n.textContent = txt; n.classList.toggle("low", left < 60); }
  });
  if(left <= 0){ gradeExam(); toast(t("timeUp")); }
}
function gradeExam(){
  const e = S.exam;
  if(!e || e.phase !== "run") return;
  clearInterval(e.timer); e.timer = null;
  let correct = 0, blank = 0;
  const detail = e.list.map((q,i) => {
    const given = e.answers[i] || blankAnswer(q);
    const filled = answeredCount(q, given) > 0;
    if(!filled) blank++;
    const ok = filled && isCorrect(q, given);
    if(ok) correct++;
    const r = rec(q.id);
    if(filled){ r.a = JSON.parse(JSON.stringify(given)); r.done = 1; r.ok = ok; r.n = (r.n||0)+1; }
    if(e.flags[i]) r.flag = 1;
    return { q, given, ok };
  });
  const secs = Math.floor((Date.now()-e.started)/1000);
  const scope = e.cfg.topic === "all" ? t("allTopics") : t("topicN", e.cfg.topic);
  e.result = { detail, correct, wrong:e.list.length-correct, blank, pct:pct(correct,e.list.length), secs };
  e.phase = "result"; S.mode = "exam"; S.reviewWrongOnly = false;
  S.history.push({ at:new Date().toISOString(), pct:e.result.pct, c:correct, t:e.list.length, secs, scope });
  save(); renderAll(); window.scrollTo({top:0});
}

/* ---------- hộp thoại ---------- */
function dialog(title, body, confirmLabel, onYes, danger){
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p>
    <div class="act"><button class="btn" data-no>${esc(t("cancel"))}</button>
    ${confirmLabel?`<button class="btn ${danger?"danger":"solid"}" data-yes>${esc(confirmLabel)}</button>`:""}</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => {
    if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove();
    if(ev.target.hasAttribute("data-yes")){ ov.remove(); onYes && onYes(); }
  });
  (ov.querySelector("[data-yes]") || ov.querySelector("[data-no]")).focus();
}
function helpDialog(){
  const rows = [["A B C D",t("kPick")],["Enter",t("kCheck")],["F",t("kFlag")],["← →",t("kNav")],["/",t("kSearch")],["?",t("kHelp")],["Esc",t("kEsc")]];
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(t("keysTitle"))}</h3>
    <div class="keys" style="margin-bottom:18px">${rows.map(([k,d])=>`<div class="keyrow"><kbd>${esc(k)}</kbd><span>${esc(d)}</span></div>`).join("")}</div>
    <div class="act"><button class="btn" data-no>${esc(t("close"))}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => { if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove(); });
  ov.querySelector("[data-no]").focus();
}
function zoom(src){
  const ov = document.createElement("div");
  ov.className = "ov zoom";
  ov.innerHTML = `<img src="${src}" alt="">`;
  ov.addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
}
let toastTimer = null;
function toast(msg){
  $$(".toast").forEach(n => n.remove());
  const n = document.createElement("div");
  n.className = "toast"; n.textContent = msg; n.setAttribute("role","status");
  document.body.appendChild(n);

}

}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d.p !== "object") throw 0;
      S.p = d.p; S.history = Array.isArray(d.history) ? d.history : [];
      save(); renderAll(); toast(t("imported"));
    }catch(e){ toast(t("badFile")); }
  };
  fr.onerror = () => toast(t("badFile"));
  fr.readAsText(file);
}

/* ============================================================
   SỰ KIỆN
   ============================================================ */
document.addEventListener("click", ev => {
  if(ev.target.matches("[data-zoom]")){ zoom(ev.target.src); return; }
  // <select> do bộ lắng nghe "change" lo. Nếu để lọt vào đây, việc vẽ lại bản
  // ghi sẽ thay thế chính phần tử đang mở, làm danh sách đóng sập ngay khi bấm.
  if(ev.target.tagName === "SELECT") return;
  const el = ev.target.closest("[data-mode],[data-lang],[data-f-key],[data-act],[data-jump],[data-go]");
  if(!el) return;

  if(el.dataset.mode){ setMode(el.dataset.mode); return; }
  if(el.dataset.lang){ L = el.dataset.lang; save(); renderAll(); return; }
  if(el.dataset.fKey){
    S.f[el.dataset.fKey] = el.dataset.v;
    renderRail(); renderMain();
    if(window.innerWidth < 900) document.body.classList.remove("rail-open");
    return;
  }
  if(el.dataset.jump){
    const id = el.dataset.jump;
    if(S.mode !== "study") S.mode = "study";
    S.f = {topic:"all",status:"all",type:"all",q:""}; $("#search").value = "";
    renderAll();
    const n = document.getElementById("rec-"+id);
    if(n) n.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(el.dataset.go !== undefined && S.exam && S.exam.phase === "run"){
    S.exam.pos = +el.dataset.go; save(); renderMain(); renderAside(); window.scrollTo({top:0}); return;
  }

  const recEl = el.closest(".rec"), id = recEl && recEl.dataset.id, act = el.dataset.act;
  switch(act){
    case "ans": {
      if(!id) break;
      const q = BY_ID[id], r = rec(id);
      if(r.done) break;
      const a = ansOf(q);
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save();
      refreshRecord(id, q.type === "mcq" ? `[data-act="ans"][data-k="${el.dataset.k}"]`
                                         : `[data-act="ans"][data-i="${el.dataset.i}"]`);
      break;
    }
    case "check":  if(id) checkRecord(id, false); break;
    case "reveal": if(id) checkRecord(id, true);  break;
    case "again": {
      if(!id) break;
      const r = rec(id); r.a = blankAnswer(BY_ID[id]); r.done = 0; r.ok = null;
      save(); refreshRecord(id, '[data-act="check"]'); renderRail(); renderAside(); break;
    }
    case "flag": {
      if(!id) break;
      const r = rec(id); r.flag = r.flag ? 0 : 1;
      save(); refreshRecord(id, '.flagbtn'); renderRail(); renderAside(); break;
    }
    case "start":  startExam(); break;
    case "resume": S.exam.phase = "run"; renderAll(); break;
    case "discard": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); break;
    case "eans": {
      const e = S.exam, q = e.list[e.pos];
      const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save(); renderMain(); renderAside(); break;
    }
    case "eprev": S.exam.pos = Math.max(0, S.exam.pos-1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "enext": S.exam.pos = Math.min(S.exam.list.length-1, S.exam.pos+1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "eflag": S.exam.flags[S.exam.pos] = !S.exam.flags[S.exam.pos]; save(); renderMain(); renderAside(); break;
    case "esubmit": {
      const e = S.exam;
      const blank = e.list.filter((q,i) => answeredCount(q, e.answers[i]) === 0).length;
      dialog(t("confirmSubmitT"), blank ? t("confirmSubmitD", blank) : t("confirmSubmitD0"), t("confirm"), gradeExam);
      break;
    }
    case "newexam": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); window.scrollTo({top:0}); break;
    case "togglewrong": S.reviewWrongOnly = !S.reviewWrongOnly; renderMain(); break;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "search"){ S.f.q = el.value; renderMain(); return; }
  if(el.dataset.act === "note"){
    const r = el.closest(".rec");
    if(r){ rec(r.dataset.id).note = el.value; clearTimeout(el._tm); el._tm = setTimeout(save, 400); }
    return;
  }
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); return; }
  if(el.dataset.act === "ans"){
    const r = el.closest(".rec"), q = BY_ID[r.dataset.id];
    if(rec(q.id).done) return;
    applyAnswer(q, ansOf(q), el);
    save(); refreshRecord(q.id, `[data-act="ans"][data-i="${el.dataset.i}"]`); return;
  }
  if(el.dataset.act === "eans"){
    const e = S.exam, q = e.list[e.pos];
    const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
    applyAnswer(q, a, el); save(); renderMain(); renderAside(); return;
  }
  if(el.id === "fileIn" && el.files && el.files[0]){ importData(el.files[0]); el.value = ""; }
});

document.addEventListener("focusin", ev => {
  const r = ev.target.closest && ev.target.closest(".rec");
  if(r && r.dataset.id && r.dataset.id !== S.cur){
    const prev = S.cur ? document.getElementById("rec-"+S.cur) : null;
    if(prev) prev.classList.remove("cur");
    S.cur = r.dataset.id; r.classList.add("cur");
  }
});

$("#themeBtn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  save();
});
$("#helpBtn").addEventListener("click", helpDialog);
$("#railToggle").addEventListener("click", e => {
  e.currentTarget.setAttribute("aria-expanded", document.body.classList.toggle("rail-open"));
});
$("#btnExport").addEventListener("click", exportData);
$("#btnImport").addEventListener("click", () => $("#fileIn").click());
$("#btnReset").addEventListener("click", () =>
  dialog(t("resetT"), t("resetD"), t("del"), () => {
    S.p = {}; S.history = []; S.cur = null;
    if(S.exam) clearInterval(S.exam.timer);
    S.exam = null;
    store.del(KEY); save(); renderAll(); toast(t("del"));
  }, true));

document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if(ev.key === "Escape"){ $$(".ov").forEach(n => n.remove()); if(typing) ev.target.blur(); return; }
  if(typing) return;
  if(ev.key === "/"){ ev.preventDefault(); $("#search").focus(); return; }
  if(ev.key === "?"){ ev.preventDefault(); helpDialog(); return; }
  if(document.querySelector(".ov")) return;

  const e = S.exam, inExam = S.mode === "exam" && e && e.phase === "run";
  if(inExam){
    if(ev.key === "ArrowLeft"  && e.pos > 0){ e.pos--; save(); renderMain(); renderAside(); return; }
    if(ev.key === "ArrowRight" && e.pos < e.list.length-1){ e.pos++; save(); renderMain(); renderAside(); return; }
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = document.querySelector(`[data-act="eans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ e.flags[e.pos] = !e.flags[e.pos]; save(); renderMain(); renderAside(); return; }
    return;
  }
  if(S.mode === "study" && S.cur){
    const node = document.getElementById("rec-"+S.cur);
    if(!node) return;
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = node.querySelector(`[data-act="ans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key === "Enter"){
      const b = node.querySelector('[data-act="check"]:not([disabled])') || node.querySelector('[data-act="reveal"]');
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ const b = node.querySelector('[data-act="flag"]'); if(b) b.click(); return; }
    if(ev.key === "ArrowDown" || ev.key === "ArrowRight"){ ev.preventDefault(); stepRecord(1); return; }
    if(ev.key === "ArrowUp"   || ev.key === "ArrowLeft"){  ev.preventDefault(); stepRecord(-1); return; }
  }
});
function stepRecord(d){
  const list = $$(".rec");
  const i = list.findIndex(n => n.dataset.id === S.cur);
  const next = list[Math.max(0, Math.min(list.length-1, i+d))];
  if(next){ const b = next.querySelector(".opt, .ynb button, select"); if(b) b.focus(); next.scrollIntoView({block:"nearest"}); }
}

/* ---------- khởi động ---------- */
$("#markCode").textContent = DATA.meta.code;
$$("[data-icon]").forEach(el => el.outerHTML = ICON[el.dataset.icon]);
load();
if(S.exam && S.exam.phase === "run"){ S.mode = "exam"; if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer,1000); } }
renderAll();

</script>
