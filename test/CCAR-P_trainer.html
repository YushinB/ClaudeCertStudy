<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CCAR-P · Claude Certified Architect - Professional</title>
<meta name="description" content="Bộ đề luyện thi CCAR-F.">
<meta name="color-scheme" content="dark light">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Serif:ital,wght@0,400;0,600;1,400&display=swap">
<script>
/* đặt theme trước khi vẽ để không nháy màu */
(function(){
  var th="dark";
  try{
    var d=JSON.parse(localStorage.getItem('examtrainer.CCAR-F')||"{}");
    if(d.theme) th=d.theme;
    else if(window.matchMedia&&window.matchMedia("(prefers-color-scheme: light)").matches) th="light";
  }catch(e){}
  document.documentElement.setAttribute("data-theme",th);
})();
</script>
<style>
/* ============================================================
   Exam Trainer — bảng điều khiển + tờ đề in (tông ấm)
   ============================================================ */

:root{                      /* TỐI — mỗi màu chữ đều đo trên nền sáng nhất mà nó nằm lên */
  --shell:#171310;          /* khung ngoài            */
  --shell-2:#201A15;        /* cột trái / cột phải    */
  --shell-3:#2E251C;        /* nền nổi khi rê chuột   */
  --sunken:#100D0A;         /* ô nhập liệu — chìm     */
  --paper:#1C1712;          /* vùng đọc               */
  --paper-2:#252019;
  --ink:#F1EFEA;            /* ≥13.1:1 mọi nền        */
  --ink-2:#C6BCAA;          /* ≥ 8.0:1 — nhãn, chú thích */
  --ink-3:#ABA08B;          /* ≥ 5.8:1 — số đếm, gợi ý ô nhập */
  --rule:#3D3428;           /* kẻ trang trí           */
  --rule-2:#786853;         /* viền điều khiển ≥3:1   */
  --on-accent:#171310;      /* chữ nằm trên mảng màu đặc */
  --ok:#8FD98C;
  --ok-bg:rgba(143,217,140,.15);
  --bad:#FF9781;
  --bad-bg:rgba(255,151,129,.15);
  --flag:#F7C25A;
  --flag-bg:rgba(247,194,90,.17);
  --pick:#8ECBF0;
  --pick-bg:rgba(142,203,240,.15);
  --stamp:#FF9781;
  --focus:#F7C25A;
  --thumb:#5A4E3D;
  color-scheme:dark;
}
[data-theme="light"]{       /* SÁNG — cùng nguyên tắc, giấy ngà để bớt chói */
  --shell:#E9E3D5;
  --shell-2:#F2EDE2;
  --shell-3:#E7E1D2;
  --sunken:#FFFFFF;
  --paper:#FDFBF5;
  --paper-2:#F5F1E6;
  --ink:#201C16;            /* ≥13.0:1 */
  --ink-2:#463E35;          /* ≥ 8.0:1 */
  --ink-3:#5B5347;          /* ≥ 5.8:1 */
  --rule:#DED6C4;
  --rule-2:#8F8269;
  --on-accent:#FFFFFF;
  --ok:#256B42;
  --ok-bg:rgba(37,107,66,.10);
  --bad:#B32E1F;
  --bad-bg:rgba(179,46,31,.09);
  --flag:#7F5405;
  --flag-bg:rgba(127,84,5,.13);
  --pick:#175D91;
  --pick-bg:rgba(23,93,145,.09);
  --stamp:#B32E1F;
  --focus:#7F5405;
  --thumb:#B0A48D;
  color-scheme:light;
}
:root{
  --sans:"IBM Plex Sans Condensed","Arial Narrow",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --serif:"IBM Plex Serif",Georgia,"Times New Roman",serif;
  --top:52px;
  --gut:clamp(16px,1.8vw,26px);
  --pad:clamp(24px,2.6vw,46px);
  --perf:26px;
  --recpad:clamp(12px,1.2vw,20px);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-gutter:stable}
*{scrollbar-width:thin;scrollbar-color:var(--thumb) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:transparent;border-left:1px solid var(--rule)}
::-webkit-scrollbar-thumb{background:var(--thumb);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-thumb:hover{background:var(--ink-3);border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-corner{background:transparent}
body{
  margin:0;background:var(--shell);color:var(--ink);
  font-family:var(--serif);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
b,strong{font-weight:600}
h1,h2,h3,h4{margin:0}
img{max-width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hide{display:none!important}
.grow{flex:1}

.lbl{
  font-family:var(--sans);font-size:10.5px;font-weight:600;letter-spacing:.13em;
  text-transform:uppercase;color:var(--ink-2);
}

/* ============================ TOP ============================ */
.top{
  position:sticky;top:0;z-index:60;height:var(--top);
  background:var(--shell-2);border-bottom:1px solid var(--rule);
  display:flex;align-items:center;gap:var(--gut);padding:0 var(--gut);
}
.mark{display:flex;align-items:baseline;gap:9px;flex:none}
.mark .w{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase}
.mark .w em{font-style:normal;color:var(--stamp)}
.mark .s{font-family:var(--sans);font-size:12px;letter-spacing:.02em;color:var(--ink-2);white-space:nowrap}

.seg{display:flex;border:1px solid var(--rule-2);flex:none}
.seg button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.12em;
  text-transform:uppercase;color:var(--ink-2);padding:6px 13px;cursor:pointer;line-height:1.45;
}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink);background:var(--shell-3)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--on-accent)}
.seg.mini button{padding:5px 9px;font-size:10px;letter-spacing:.1em}
.top .right{display:flex;gap:8px;align-items:center;flex:none}
.icb{
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
  width:29px;height:29px;display:grid;place-items:center;cursor:pointer;
  font-family:var(--sans);font-weight:700;font-size:12px;flex:none;
}
.icb:hover{color:var(--ink);border-color:var(--ink-3)}

/* ============================ GRID ============================ */
.app{
  display:grid;
  grid-template-columns:266px minmax(0,1fr) 304px;
  grid-template-areas:"rail main aside";
  align-items:stretch;min-height:calc(100vh - var(--top));
}
.rail{grid-area:rail;border-right:1px solid var(--rule);background:var(--shell-2)}
.main{grid-area:main;min-width:0;background:var(--paper);position:relative;min-height:calc(100vh - var(--top))}
.aside{grid-area:aside;border-left:1px solid var(--rule);background:var(--shell-2)}
.rail-in,.aside-in{
  position:sticky;top:var(--top);height:calc(100vh - var(--top));
  overflow-y:auto;overflow-x:hidden;padding:16px var(--gut) 40px;
}
@media(max-width:1319px){
  .app{grid-template-columns:244px minmax(0,1fr);grid-template-areas:"rail aside" "rail main";align-content:start}
  .aside{border-left:0;border-bottom:1px solid var(--rule)}
  .aside-in{position:static;height:auto;max-height:none;padding:12px var(--gut)}
  .aside .stack{grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 26px;align-items:start}
}
@media(max-width:899px){
  .app{grid-template-columns:minmax(0,1fr);grid-template-areas:"rail" "main" "aside"}
  .aside{border-top:1px solid var(--rule);border-bottom:0}
  .only-lg{display:none}
  .rail{border-right:0;border-bottom:1px solid var(--rule)}
  .rail-in{position:static;height:auto;max-height:none;padding:12px var(--gut) 18px}
  body:not(.rail-open) .rail-in{display:none}
  .rail-in .stack{grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px 26px;align-items:start}
}
@media(min-width:900px){ .railtoggle{display:none} }
@media(max-width:899px){
  .top{height:auto;min-height:var(--top);flex-wrap:wrap;gap:8px 10px;padding:8px var(--gut)}
  .mark .s{display:none}
  .top .right{margin-left:auto}
  .seg button{padding:6px 9px;font-size:10px;letter-spacing:.07em}
  .seg.mini button{padding:5px 7px}
}
@media(max-width:640px){
  :root{--perf:14px}
  .paper::before,.paper::after{background-size:100% 20px}
}

/* ============================ CONTROLS ============================ */
.blk{margin-bottom:22px}
.blk > .lbl{display:block;margin-bottom:8px}
.stack{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}

.fld{
  width:100%;background:var(--sunken);border:1px solid var(--rule-2);color:var(--ink);
  font-family:var(--serif);font-size:14.5px;padding:8px 10px;
}
.fld::placeholder{color:var(--ink-3);opacity:1}
.fld:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}

/* select tự vẽ — không dùng mũi tên mặc định của hệ điều hành */
.sel{position:relative;display:block}
.sel select{
  appearance:none;-webkit-appearance:none;-moz-appearance:none;
  width:100%;background:var(--sunken);color:var(--ink);
  border:1px solid var(--rule-2);border-radius:0;
  padding:9px 42px 9px 12px;font-family:var(--mono);font-size:13.5px;line-height:1.35;
  cursor:pointer;
}
.sel select:hover{border-color:var(--ink-3)}
.sel select:focus{outline:none;border-color:var(--stamp);box-shadow:inset 0 0 0 1px var(--stamp)}
.sel .cap{
  position:absolute;top:1px;right:1px;bottom:1px;width:30px;
  border-left:1px solid var(--rule-2);background:var(--shell-3);
  display:grid;place-items:center;pointer-events:none;
}
.sel .cap::after{
  content:"";width:0;height:0;
  border-left:4.5px solid transparent;border-right:4.5px solid transparent;
  border-top:5.5px solid var(--ink-2);
}
.sel select:hover + .cap::after{border-top-color:var(--ink)}
.sel select:focus + .cap{background:var(--stamp);border-left-color:var(--stamp)}
.sel select:focus + .cap::after{border-top-color:var(--on-accent)}
.sel.on select{border-color:var(--pick);box-shadow:inset 0 0 0 1px var(--pick)}
.sel.on .cap{border-left-color:var(--pick)}

.tlist{display:grid;gap:1px}
.slist{display:grid;border-top:1px solid var(--rule)}
.srow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);
  border-left:2px solid transparent;padding:8px 10px;
}
.srow:hover{background:var(--shell-3)}
.srow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.srow[aria-pressed="true"] .nm{color:var(--ink)}
.srow .dot{width:10px;height:10px;flex:none;position:relative;color:var(--ink-3)}
.srow[aria-pressed="true"] .dot{color:var(--ink)}
.srow .dot::before{content:"";position:absolute;inset:1px;border:1px solid currentColor}
.srow .dot.g{color:var(--ok)}   .srow .dot.g::before{background:currentColor}
.srow .dot.r{color:var(--bad)}  .srow .dot.r::before{background:currentColor}
.srow .dot.f{color:var(--flag)} .srow .dot.f::before{background:currentColor}
/* dấu hiệu của từng dạng câu, vẽ lại đúng hình dáng điều khiển tương ứng */
.srow .dot.m-mcq::before{box-shadow:inset 0 0 0 2px currentColor}
.srow .dot.m-yesno::before{border:0;background:linear-gradient(currentColor 0 34%,transparent 34% 66%,currentColor 66% 100%)}
.srow .dot.m-drop::before{border:0;background:currentColor;clip-path:polygon(0 22%,100% 22%,50% 86%)}
.srow .nm{flex:1;font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.03em;
  text-transform:uppercase;color:var(--ink-2)}
.srow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}

/* nhóm nút dữ liệu — hàng đầy chiều rộng, thống nhất với các danh sách khác */
.vlist{display:grid;border-top:1px solid var(--rule)}
.vrow{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;
  background:transparent;border:0;border-bottom:1px solid var(--rule);padding:10px;
  font-family:var(--sans);font-size:12px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;color:var(--ink-2);
}
.vrow:hover{background:var(--shell-3);color:var(--ink)}
.vrow svg{flex:none;width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.7}
.vrow.danger{color:var(--bad)}
.vrow.danger:hover{background:var(--bad-bg)}
.trow{
  display:grid;grid-template-columns:1fr auto;gap:3px 8px;align-items:center;
  background:transparent;border:0;border-left:2px solid transparent;
  padding:6px 8px;cursor:pointer;text-align:left;width:100%;min-width:0;
}
.trow:hover{background:var(--shell-3)}
.trow[aria-pressed="true"]{border-left-color:var(--stamp);background:var(--shell-3)}
.trow .nm{font-family:var(--sans);font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.trow .ct{font-family:var(--mono);font-size:11.5px;color:var(--ink-3)}
.meter{grid-column:1/-1;height:4px;background:var(--rule);display:flex;overflow:hidden}
.meter i{display:block;height:100%}
.meter .g{background:var(--ok)}
.meter .r{background:var(--bad)}

.act{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;background:transparent;color:var(--ink);
  border:1px solid var(--rule-2);padding:7px 13px;cursor:pointer;line-height:1.4;
}
.btn:hover{border-color:var(--ink);background:var(--shell-3)}
.btn:disabled{opacity:.45;cursor:default}
.btn:disabled:hover{border-color:var(--rule-2);background:transparent;color:var(--ink)}
.btn.solid{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}
.btn.solid:hover:not(:disabled){filter:brightness(1.12)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.danger:hover{background:var(--bad-bg)}
.btn.sm{padding:5px 10px;font-size:10px}

/* ============================ ASIDE ============================ */
.kv{display:flex;justify-content:space-between;gap:12px;align-items:baseline;padding:3px 0}
.kv span{font-family:var(--sans);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.kv b{font-family:var(--mono);font-size:12.5px;font-weight:600}
.bigbar{height:8px;border:1px solid var(--rule-2);display:flex;margin:6px 0;overflow:hidden}
.bigbar i{display:block;height:100%}
.queue{display:grid;gap:2px;max-height:270px;overflow:auto}
.qbtn{
  display:flex;gap:8px;align-items:baseline;background:transparent;border:0;
  border-left:2px solid var(--rule-2);padding:5px 8px;text-align:left;cursor:pointer;width:100%;min-width:0;
}
.qbtn:hover{background:var(--shell-3)}
.qbtn.is-wrong{border-left-color:var(--bad)}
.qbtn.is-flag{border-left-color:var(--flag)}
.qbtn .n{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);flex:none}
.qbtn .t{min-width:0;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.keys{display:grid;gap:3px}
.keyrow{display:flex;gap:8px;align-items:center;font-family:var(--serif);font-size:12.5px;color:var(--ink-2)}
kbd{
  font-family:var(--mono);font-size:10px;background:var(--shell-3);border:1px solid var(--rule-2);
  border-bottom-width:2px;padding:1px 5px;color:var(--ink);min-width:18px;text-align:center;
}

/* ============================ PAPER ============================ */
.paper{position:relative;padding:0 var(--perf);min-height:100%}
.paper::before,.paper::after{
  content:"";position:absolute;top:0;bottom:0;width:var(--perf);
  background:var(--paper-2);pointer-events:none;
}
.paper::before{left:0;border-right:1px solid var(--rule);box-shadow:inset -4px 0 0 -3px var(--rule)}
.paper::after{right:0;border-left:1px solid var(--rule);box-shadow:inset 4px 0 0 -3px var(--rule)}
.sheet{padding:0 var(--pad) 64px}

.head{padding:30px 0 18px;border-bottom:2px solid var(--ink);display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
.head h2{font-family:var(--sans);font-weight:700;font-size:clamp(22px,2.6vw,34px);letter-spacing:-.01em;text-transform:uppercase;line-height:1}
.head p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:8px 0 0;max-width:62ch}
.head .r{margin-left:auto;text-align:right}

.rec{
  border-bottom:1px solid var(--rule);
  padding:22px var(--recpad) 24px;margin:0 calc(-1 * var(--recpad));
  scroll-margin-top:calc(var(--top) + 12px);
}
.rec.cur{background:var(--paper-2);box-shadow:inset 3px 0 0 var(--stamp)}
.rec.cur .idx{color:var(--stamp)}
.rechead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;margin-bottom:10px;max-width:86ch}
.idx{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--ink-2);letter-spacing:.05em}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto;align-items:center}
.flagbtn{
  flex:none;width:26px;height:24px;display:grid;place-items:center;cursor:pointer;
  background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);
}
.flagbtn svg{width:12px;height:14px;stroke:currentColor;fill:none;stroke-width:1.9}
.flagbtn:hover{color:var(--flag);border-color:var(--flag)}
.flagbtn[aria-pressed="true"]{color:var(--flag);border-color:var(--flag);background:var(--flag-bg)}
.flagbtn[aria-pressed="true"] svg{fill:currentColor}
.tag{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid var(--rule-2);color:var(--ink-2);padding:2px 6px;white-space:nowrap;
}
.tag.ok{color:var(--ok);border-color:var(--ok)}
.tag.bad{color:var(--bad);border-color:var(--bad)}
.tag.flag{color:var(--flag);border-color:var(--flag)}
.tag.multi{color:var(--pick);border-color:var(--pick)}

.stem{font-family:var(--mono);font-size:14.5px;line-height:1.62;margin:0;max-width:78ch}
.gloss{
  display:block;font-family:var(--serif);font-size:14.5px;line-height:1.6;
  color:var(--ink-2);max-width:74ch;margin:4px 0 0;
}
.qbody{margin-top:16px}
.qimg{display:block;margin:14px 0 4px;border:1px solid var(--rule-2);max-width:min(100%,620px);cursor:zoom-in}

/* --- phương án nhiều lựa chọn --- */
.opts{list-style:none;margin:0;padding:0;display:grid;gap:2px;max-width:86ch}
.opt{
  display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;
  background:transparent;border:1px solid transparent;color:var(--ink);
  padding:8px 10px;cursor:pointer;
}
.opt:hover{border-color:var(--rule-2)}
.opt .k{
  flex:none;width:22px;height:22px;display:grid;place-items:center;margin-top:1px;
  border:1px solid var(--rule-2);font-family:var(--mono);font-weight:600;font-size:11.5px;
}
.opt .tx{flex:1;min-width:0;font-family:var(--mono);font-size:13.5px;line-height:1.55}
.opt .tx .gloss{font-size:13.5px;margin-top:3px}
.opt .mk{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;
  text-transform:uppercase;white-space:nowrap;padding-top:5px;display:none;
}
.opt[data-pick="1"]{border-color:var(--pick);background:var(--pick-bg)}
.opt[data-pick="1"] .k{background:var(--pick);border-color:var(--pick);color:var(--on-accent)}
.opt[data-pick="1"] .mk-you{display:block;color:var(--pick)}
.rec[data-done="1"] .opt{cursor:default}
.rec[data-done="1"] .opt:hover{border-color:transparent}
.rec[data-done="1"] .opt[data-right="1"]{border-color:var(--ok);background:var(--ok-bg)}
.rec[data-done="1"] .opt[data-right="1"] .k{background:var(--ok);border-color:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-right="1"] .mk-ok{display:block;color:var(--ok)}
.rec[data-done="1"] .opt[data-right="1"] .mk-you{display:none}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"]{border-color:var(--bad);background:var(--bad-bg)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .k{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .opt[data-pick="1"][data-right="0"] .mk-you{display:block;color:var(--bad)}

/* --- dạng Có / Không theo dòng --- */
.ynlist{list-style:none;margin:0;padding:0;max-width:92ch;border-top:1px solid var(--rule)}
.yn{
  display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;align-items:center;
  padding:12px 10px;border-bottom:1px solid var(--rule);
}
.yn .ynt{font-family:var(--mono);font-size:13.5px;line-height:1.55;min-width:0}
.yn .ynt .gloss{font-size:13.5px;margin-top:3px}
.ynb{display:flex;flex:none;border:1px solid var(--rule-2)}
.ynb button{
  background:transparent;border:0;border-right:1px solid var(--rule-2);
  font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-2);padding:6px 14px;cursor:pointer;min-width:64px;
}
.ynb button:last-child{border-right:0}
.ynb button:hover{background:var(--shell-3);color:var(--ink)}
.ynb button[aria-pressed="true"]{background:var(--pick);color:var(--on-accent)}
.rec[data-done="1"] .ynb button{cursor:default}
.rec[data-done="1"] .ynb button:hover{background:transparent;color:var(--ink-2)}
.rec[data-done="1"] .ynb button[aria-pressed="true"]{background:var(--bad);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="1"] .ynb button[aria-pressed="true"]{background:var(--ok);color:var(--on-accent)}
.rec[data-done="1"] .yn[data-right="0"] .ynb button[data-correct="1"]{box-shadow:inset 0 0 0 2px var(--ok);color:var(--ok)}

/* --- dạng chọn từ danh sách --- */
.blanks{display:grid;gap:18px;max-width:78ch}
.blank .blabel{display:block;font-family:var(--mono);font-size:13px;line-height:1.55;margin-bottom:8px;color:var(--ink)}
.blank .blabel .gloss{font-size:13px;margin-top:3px}
.blank .ansline{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  margin-top:7px;display:none;
}
.rec[data-done="1"] .blank[data-right="0"] .ansline{display:block}
.blank .ansline.ok{color:var(--ok)}
.blank .ansline.bad{color:var(--bad)}
.rec[data-done="1"] .sel select{pointer-events:none}
.rec[data-done="1"] .blank[data-right="1"] select{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.rec[data-done="1"] .blank[data-right="0"] select{border-color:var(--bad);box-shadow:inset 0 0 0 1px var(--bad)}

.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:18px;max-width:86ch}
.note{font-family:var(--serif);font-size:13.5px;color:var(--ink-2)}

/* --- khối đáp án --- */
.rev{display:none;margin-top:20px;border-top:1px solid var(--ink);padding-top:18px}
.rec[data-done="1"] .rev{display:block}
.revtop{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.stamp{
  border:2.5px solid var(--stamp);color:var(--stamp);padding:5px 13px 6px;
  transform:rotate(-2.2deg);box-shadow:inset 0 0 0 1px var(--stamp);
  display:flex;align-items:baseline;gap:10px;flex:none;max-width:100%;
}
.stamp .t{font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.2em;text-transform:uppercase}
.stamp .v{font-family:var(--sans);font-weight:700;font-size:26px;line-height:1;letter-spacing:.06em}
.stamp.txt .v{font-size:15px;letter-spacing:.02em;font-family:var(--mono);font-weight:600;line-height:1.35}
.verdict{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase}
.verdict.ok{color:var(--ok)}
.verdict.bad{color:var(--bad)}
.conf{
  font-family:var(--sans);font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  border:1px solid currentColor;padding:3px 8px;
}
.conf.h{color:var(--ok)}
.conf.m{color:var(--flag)}
.conf.l{color:var(--bad)}

.revgrid{display:grid;gap:20px 36px}
@media(min-width:1500px){ .revgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)} }
.sech{
  font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-2);display:flex;align-items:center;gap:10px;margin-bottom:8px;
}
.sech::after{content:"";flex:1;height:0;border-top:1px dotted var(--rule-2)}
.prose{font-family:var(--serif);font-size:15.5px;line-height:1.7;max-width:72ch;margin:0}
.prose b{box-shadow:inset 0 -2px 0 var(--flag)}
ul.elim{list-style:none;margin:0;padding:0;max-width:72ch}
ul.elim li{font-family:var(--serif);font-size:15px;line-height:1.65;padding-left:20px;position:relative;margin-bottom:6px}
ul.elim li::before{content:"\00D7";position:absolute;left:2px;top:-1px;font-family:var(--sans);font-weight:700;color:var(--bad);font-size:16px}
.cite{
  font-family:var(--mono);font-size:12px;color:var(--ink-2);margin-top:16px;
  padding-top:10px;border-top:1px dotted var(--rule-2);max-width:78ch;word-break:break-word;
}
.notewrap{margin-top:20px;padding-top:16px;border-top:1px dotted var(--rule-2)}
.notewrap .lbl{display:block;margin-bottom:6px}
.notewrap textarea{
  display:block;width:100%;max-width:72ch;min-height:64px;resize:vertical;background:var(--sunken);
  border:1px solid var(--rule-2);color:var(--ink);font-family:var(--serif);font-size:14.5px;padding:9px 11px;
}
.notewrap textarea:focus{outline:none;border-color:var(--stamp)}

/* ============================ EXAM ============================ */
.panel{border:1px solid var(--rule-2);background:var(--paper-2);padding:24px var(--pad);margin-top:24px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:18px 24px;align-items:end}
.grid2 .lbl{min-height:15px}
.fldw{display:grid;gap:6px}
.timer{font-family:var(--mono);font-size:22px;font-weight:600;letter-spacing:.06em}
.timer.low{color:var(--bad)}
.pal{display:flex;flex-wrap:wrap;gap:4px}
.pd{
  width:30px;height:28px;border:1px solid var(--rule-2);background:transparent;color:var(--ink-2);
  font-family:var(--mono);font-size:11px;cursor:pointer;position:relative;
}
.pd:hover{border-color:var(--ink-3);color:var(--ink)}
.pd.is-ans{border-color:var(--pick);color:var(--pick)}
.pd.is-flag::after{content:"";position:absolute;top:2px;right:2px;width:4px;height:4px;background:var(--flag)}
.pd.is-cur{background:var(--ink);border-color:var(--ink);color:var(--on-accent)}

.score{display:flex;gap:36px;align-items:center;flex-wrap:wrap}
.ring{position:relative;width:132px;height:132px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .n b{font-family:var(--sans);font-weight:700;font-size:34px;line-height:1}
.ring .n span{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);letter-spacing:.1em;text-transform:uppercase}
.result-h{font-family:var(--sans);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase}
.result-h.ok{color:var(--ok)}
.result-h.bad{color:var(--flag)}
.figs{display:flex;gap:28px;flex-wrap:wrap;margin-top:12px}
.fig b{display:block;font-family:var(--mono);font-size:23px;font-weight:600}

/* ============================ TABLE ============================ */
.tw{overflow-x:auto;margin-top:12px}
.tw table{min-width:440px}
table{border-collapse:collapse;width:100%;font-family:var(--mono);font-size:12.5px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--rule)}
th{font-family:var(--sans);font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-2);border-bottom-color:var(--rule-2)}
td:first-child{font-family:var(--sans);font-size:13px;font-weight:600;letter-spacing:.02em}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono)}
.sbar{height:5px;background:var(--rule);display:flex;min-width:70px}
.sbar i{display:block;height:100%}

.empty{padding:64px 10px;text-align:center;font-family:var(--serif);font-size:14.5px;color:var(--ink-2)}
.empty b{display:block;font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);margin-bottom:8px}

/* ============================ OVERLAY ============================ */
.ov{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:20px}
.ov .box{background:var(--shell-2);border:1px solid var(--rule-2);max-width:520px;width:100%;padding:22px 24px;max-height:86vh;overflow:auto}
.ov h3{font-family:var(--sans);font-weight:700;font-size:17px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:14px}
.ov p{font-family:var(--serif);font-size:14.5px;color:var(--ink-2);margin:0 0 16px}
.ov.zoom{cursor:zoom-out}
.ov.zoom img{max-width:96vw;max-height:92vh;border:1px solid var(--rule-2)}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--on-accent);font-family:var(--mono);font-size:12.5px;
  padding:9px 16px;border:1px solid var(--ink);
}

/* ============ RESPONSIVE OVERRIDES (phải nằm sau mọi component) ============ */
@media(max-width:640px){
  .yn{grid-template-columns:minmax(0,1fr);gap:12px}
  .ynb{justify-self:start}
  .ynb button{min-width:84px;padding:7px 16px}
  .stem,.opt .tx,.yn .ynt{font-size:13.5px}
  .revtop{gap:12px}
  .stamp{transform:none}
}

/* ============================ PRINT ============================ */
@media print{
  body{background:#fff;color:#000}
  .top,.rail,.aside,.bar,.notewrap,.ov,.toast{display:none!important}
  .app{display:block}
  .main{background:#fff}
  .paper{padding:0}
  .paper::before,.paper::after{display:none}
  .rec{break-inside:avoid;background:#fff!important}
  .rev{display:block!important}
}
@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto!important}
}

</style>

0ea duy\u1ec7t quy\u1ec1n truy c\u1eadp Bash kh\u00f4ng h\u1ea1n ch\u1ebf nh\u01b0 \u0111\u00e3 vi\u1ebft tr\u00ean c\u01a1 s\u1edf vi\u1ec7c thu h\u1eb9p c\u00e1c quy t\u1eafc s\u1ebd l\u00e0m t\u0103ng th\u00eam \u0111\u1ed9 ph\u1ee9c t\u1ea1p c\u1ee7a c\u1ea5u h\u00ecnh, ch\u1ea5p nh\u1eadn to\u00e0n b\u1ed9 b\u1ec1 m\u1eb7t t\u1ea5n c\u00f4ng cho t\u1ea5t c\u1ea3 c\u00e1c k\u1ef9 s\u01b0 trong t\u1ea5t c\u1ea3 c\u00e1c d\u1ef1 \u00e1n.","jp":"\u30eb\u30fc\u30eb\u3092\u72ed\u3081\u308b\u3068\u69cb\u6210\u304c\u8907\u96d1\u306b\u306a\u308a\u3001\u3059\u3079\u3066\u306e\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u306e\u3059\u3079\u3066\u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u304c\u653b\u6483\u5bfe\u8c61\u9818\u57df\u3092\u5b8c\u5168\u306b\u53d7\u3051\u5165\u308c\u308b\u3053\u3068\u306b\u306a\u308b\u3068\u3044\u3046\u7406\u7531\u3067\u3001\u66f8\u304b\u308c\u3066\u3044\u308b\u3088\u3046\u306b\u7121\u5236\u9650\u306e Bash \u30a2\u30af\u30bb\u30b9\u3092\u627f\u8a8d\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Replace unrestricted Bash with narrowly scoped tool patterns that allow only the specific commands the workflows require, and add explicit deny rules for sensitive operations.","vi":"Thay th\u1ebf Bash kh\u00f4ng h\u1ea1n ch\u1ebf b\u1eb1ng c\u00e1c m\u1eabu c\u00f4ng c\u1ee5 c\u00f3 ph\u1ea1m vi h\u1eb9p ch\u1ec9 cho ph\u00e9p c\u00e1c l\u1ec7nh c\u1ee5 th\u1ec3 m\u00e0 quy tr\u00ecnh c\u00f4ng vi\u1ec7c y\u00eau c\u1ea7u v\u00e0 th\u00eam c\u00e1c quy t\u1eafc t\u1eeb ch\u1ed1i r\u00f5 r\u00e0ng cho c\u00e1c ho\u1ea1t \u0111\u1ed9ng nh\u1ea1y c\u1ea3m.","jp":"\u5236\u9650\u306e\u306a\u3044 Bash \u3092\u3001\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u306b\u5fc5\u8981\u306a\u7279\u5b9a\u306e\u30b3\u30de\u30f3\u30c9\u306e\u307f\u3092\u8a31\u53ef\u3059\u308b\u72ed\u3044\u7bc4\u56f2\u306e\u30c4\u30fc\u30eb \u30d1\u30bf\u30fc\u30f3\u306b\u7f6e\u304d\u63db\u3048\u3001\u6a5f\u5bc6\u6027\u306e\u9ad8\u3044\u64cd\u4f5c\u306b\u5bfe\u3057\u3066\u660e\u793a\u7684\u306a\u62d2\u5426\u30eb\u30fc\u30eb\u3092\u8ffd\u52a0\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Disable all permission rules for the enterprise rollout so every command across every project runs without any tool-pattern scoping or explicit deny rules for sensitive operations.","vi":"V\u00f4 hi\u1ec7u h\u00f3a t\u1ea5t c\u1ea3 c\u00e1c quy t\u1eafc c\u1ea5p ph\u00e9p cho qu\u00e1 tr\u00ecnh tri\u1ec3n khai doanh nghi\u1ec7p \u0111\u1ec3 m\u1ecdi l\u1ec7nh tr\u00ean m\u1ecdi d\u1ef1 \u00e1n \u0111\u1ec1u ch\u1ea1y m\u00e0 kh\u00f4ng c\u00f3 b\u1ea5t k\u1ef3 ph\u1ea1m vi m\u1eabu c\u00f4ng c\u1ee5 n\u00e0o ho\u1eb7c quy t\u1eafc t\u1eeb ch\u1ed1i r\u00f5 r\u00e0ng \u0111\u1ed1i v\u1edbi c\u00e1c ho\u1ea1t \u0111\u1ed9ng nh\u1ea1y c\u1ea3m.","jp":"\u30a8\u30f3\u30bf\u30fc\u30d7\u30e9\u30a4\u30ba \u30ed\u30fc\u30eb\u30a2\u30a6\u30c8\u306e\u3059\u3079\u3066\u306e\u6a29\u9650\u30eb\u30fc\u30eb\u3092\u7121\u52b9\u306b\u3059\u308b\u3068\u3001\u30c4\u30fc\u30eb \u30d1\u30bf\u30fc\u30f3\u306e\u30b9\u30b3\u30fc\u30d7\u6307\u5b9a\u3084\u6a5f\u5bc6\u6027\u306e\u9ad8\u3044\u64cd\u4f5c\u306b\u5bfe\u3059\u308b\u660e\u793a\u7684\u306a\u62d2\u5426\u30eb\u30fc\u30eb\u306a\u3057\u3067\u3001\u3059\u3079\u3066\u306e\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u306e\u3059\u3079\u3066\u306e\u30b3\u30de\u30f3\u30c9\u304c\u5b9f\u884c\u3055\u308c\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Unrestricted Bash access exposes filesystem, credential, process, network, package-management, and potentially infrastructure-administration capabilities across every repository. Option C applies least privilege by identifying the commands genuinely required by approved workflows and permitting only those patterns.<br>Explicit deny rules should protect destructive commands, sensitive files, credential stores, deployment systems, and other prohibited operations.<br>Anthropic's permission system supports allow, ask, and deny rules, with deny evaluated before ask and allow.<br>It also warns that command p..."}},{"id":"ccarp-q004","n":4,"topic":1,"type":"mcq","stem":{"en":"A senior architect is managing stakeholder expectations for a Claude-based reporting assistant midway through development. Stakeholders have escalating concerns about response latency. Which two actions most directly address stakeholder expectation alignment in this situation? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"M\u1ed9t ki\u1ebfn \u200b\u200btr\u00fac s\u01b0 c\u1ea5p cao \u0111ang qu\u1ea3n l\u00fd nh\u1eefng k\u1ef3 v\u1ecdng c\u1ee7a c\u00e1c b\u00ean li\u00ean quan \u0111\u1ed1i v\u1edbi tr\u1ee3 l\u00fd b\u00e1o c\u00e1o l\u00e0m vi\u1ec7c t\u1ea1i Claude trong qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n. C\u00e1c b\u00ean li\u00ean quan ng\u00e0y c\u00e0ng lo ng\u1ea1i v\u1ec1 \u0111\u1ed9 tr\u1ec5 ph\u1ea3n h\u1ed3i. Hai h\u00e0nh \u0111\u1ed9ng n\u00e0o gi\u1ea3i quy\u1ebft tr\u1ef1c ti\u1ebfp nh\u1ea5t s\u1ef1 ph\u00f9 h\u1ee3p k\u1ef3 v\u1ecdng c\u1ee7a c\u00e1c b\u00ean li\u00ean quan trong t\u00ecnh hu\u1ed1ng n\u00e0y? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u4e0a\u7d1a\u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306f\u3001\u958b\u767a\u306e\u9014\u4e2d\u3067\u30af\u30ed\u30fc\u30c9\u30d9\u30fc\u30b9\u306e\u30ec\u30dd\u30fc\u30c8\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u306b\u5bfe\u3059\u308b\u95a2\u4fc2\u8005\u306e\u671f\u5f85\u3092\u7ba1\u7406\u3057\u3066\u3044\u307e\u3059\u3002\u95a2\u4fc2\u8005\u306e\u5fdc\u7b54\u9045\u5ef6\u306b\u5bfe\u3059\u308b\u61f8\u5ff5\u306f\u9ad8\u307e\u3063\u3066\u3044\u307e\u3059\u3002 \u3053\u306e\u72b6\u6cc1\u3067\u30b9\u30c6\u30fc\u30af\u30db\u30eb\u30c0\u30fc\u306e\u671f\u5f85\u306e\u4e00\u81f4\u306b\u6700\u3082\u76f4\u63a5\u7684\u306b\u5bfe\u51e6\u3059\u308b 2 \u3064\u306e\u30a2\u30af\u30b7\u30e7\u30f3\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Present measured p50 and p95 latency baselines against the agreed SLA thresholds so stakeholders have accurate data.","vi":"Tr\u00ecnh b\u00e0y c\u00e1c \u0111\u01b0\u1eddng c\u01a1 s\u1edf v\u1ec1 \u0111\u1ed9 tr\u1ec5 p50 v\u00e0 p95 \u0111\u01b0\u1ee3c \u0111o l\u01b0\u1eddng so v\u1edbi ng\u01b0\u1ee1ng SLA \u0111\u00e3 th\u1ed1ng nh\u1ea5t \u0111\u1ec3 c\u00e1c b\u00ean li\u00ean quan c\u00f3 d\u1eef li\u1ec7u ch\u00ednh x\u00e1c.","jp":"\u95a2\u4fc2\u8005\u304c\u6b63\u78ba\u306a\u30c7\u30fc\u30bf\u3092\u5165\u624b\u3067\u304d\u308b\u3088\u3046\u306b\u3001\u5408\u610f\u3055\u308c\u305f SLA \u3057\u304d\u3044\u5024\u306b\u5bfe\u3057\u3066\u6e2c\u5b9a\u3055\u308c\u305f p50 \u304a\u3088\u3073 p95 \u9045\u5ef6\u30d9\u30fc\u30b9\u30e9\u30a4\u30f3\u3092\u63d0\u793a\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Pause all development and reallocate engineering resources entirely to latency optimization.","vi":"T\u1ea1m d\u1eebng t\u1ea5t c\u1ea3 qu\u00e1 tr\u00ecnh ph\u00e1t tri\u1ec3n v\u00e0 ph\u00e2n b\u1ed5 l\u1ea1i to\u00e0n b\u1ed9 ngu\u1ed3n l\u1ef1c k\u1ef9 thu\u1eadt \u0111\u1ec3 t\u1ed1i \u01b0u h\u00f3a \u0111\u1ed9 tr\u1ec5.","jp":"\u3059\u3079\u3066\u306e\u958b\u767a\u3092\u4e00\u6642\u505c\u6b62\u3057\u3001\u30ec\u30a4\u30c6\u30f3\u30b7\u306e\u6700\u9069\u5316\u306e\u305f\u3081\u306b\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0 \u30ea\u30bd\u30fc\u30b9\u3092\u5b8c\u5168\u306b\u518d\u5272\u308a\u5f53\u3066\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Communicate that latency concerns are a known LLM limitation and outside the architecture team's control.","vi":"Truy\u1ec1n \u0111\u1ea1t r\u1eb1ng nh\u1eefng lo ng\u1ea1i v\u1ec1 \u0111\u1ed9 tr\u1ec5 l\u00e0 m\u1ed9t h\u1ea1n ch\u1ebf LLM \u0111\u00e3 bi\u1ebft v\u00e0 n\u1eb1m ngo\u00e0i t\u1ea7m ki\u1ec3m so\u00e1t c\u1ee7a nh\u00f3m ki\u1ebfn \u200b\u200btr\u00fac.","jp":"\u9045\u5ef6\u306e\u554f\u984c\u306f LLM \u306e\u65e2\u77e5\u306e\u5236\u9650\u3067\u3042\u308a\u3001\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 \u30c1\u30fc\u30e0\u306e\u5236\u5fa1\u306e\u7bc4\u56f2\u5916\u3067\u3042\u308b\u3053\u3068\u3092\u4f1d\u3048\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Replace the current Claude model with a third-party model that may offer lower latency without evaluation.","vi":"Thay th\u1ebf m\u00f4 h\u00ecnh Claude hi\u1ec7n t\u1ea1i b\u1eb1ng m\u00f4 h\u00ecnh c\u1ee7a b\u00ean th\u1ee9 ba c\u00f3 th\u1ec3 mang l\u1ea1i \u0111\u1ed9 tr\u1ec5 th\u1ea5p h\u01a1n m\u00e0 kh\u00f4ng c\u1ea7n \u0111\u00e1nh gi\u00e1.","jp":"\u73fe\u5728\u306e Claude \u30e2\u30c7\u30eb\u3092\u3001\u8a55\u4fa1\u306a\u3057\u3067\u3088\u308a\u4f4e\u3044\u30ec\u30a4\u30c6\u30f3\u30b7\u3092\u63d0\u4f9b\u3067\u304d\u308b\u30b5\u30fc\u30c9\u30d1\u30fc\u30c6\u30a3 \u30e2\u30c7\u30eb\u306b\u7f6e\u304d\u63db\u3048\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Revise the SLA definition collaboratively with stakeholders if current targets are not achievable given production constraints.","vi":"Ph\u1ed1i h\u1ee3p s\u1eeda \u0111\u1ed5i \u0111\u1ecbnh ngh\u0129a SLA v\u1edbi c\u00e1c b\u00ean li\u00ean quan n\u1ebfu c\u00e1c m\u1ee5c ti\u00eau hi\u1ec7n t\u1ea1i kh\u00f4ng th\u1ec3 \u0111\u1ea1t \u0111\u01b0\u1ee3c do h\u1ea1n ch\u1ebf v\u1ec1 s\u1ea3n xu\u1ea5t.","jp":"\u751f\u7523\u4e0a\u306e\u5236\u7d04\u306b\u3088\u308a\u73fe\u5728\u306e\u76ee\u6a19\u304c\u9054\u6210\u3067\u304d\u306a\u3044\u5834\u5408\u306f\u3001\u95a2\u4fc2\u8005\u3068\u5354\u529b\u3057\u3066 SLA \u5b9a\u7fa9\u3092\u6539\u8a02\u3057\u307e\u3059\u3002"}}],"answer":["A","E"],"multi":true,"explain":{"text":"Expectation alignment begins with measured evidence. Option A gives stakeholders the median experience through p50 latency and the slower-tail experience through p95, then compares both with the agreed SLA.<br>The measurements should reflect representative input sizes, concurrency, retrieval activity, tool calls, geographic routing, and cache conditions.<br>If the target remains infeasible after reasonable optimization, Option E establishes the correct governance response. The architect should collaboratively revise the SLA, scope, cost envelope, model choice, or user- experience design rather than ..."}},{"id":"ccarp-q005","n":5,"topic":1,"type":"mcq","stem":{"en":"You are supporting a team whose Claude Code sessions consistently load 60 or more MCP tools from many servers, exhausting context budget before the session begins. Which adjustment most directly addresses this issue without removing capability?","vi":"B\u1ea1n \u0111ang h\u1ed7 tr\u1ee3 m\u1ed9t nh\u00f3m c\u00f3 phi\u00ean Claude Code t\u1ea3i li\u00ean t\u1ee5c 60 c\u00f4ng c\u1ee5 MCP tr\u1edf l\u00ean t\u1eeb nhi\u1ec1u m\u00e1y ch\u1ee7, l\u00e0m c\u1ea1n ki\u1ec7t ng\u00e2n s\u00e1ch ng\u1eef c\u1ea3nh tr\u01b0\u1edbc khi phi\u00ean b\u1eaft \u0111\u1ea7u. \u0110i\u1ec1u ch\u1ec9nh n\u00e0o gi\u1ea3i quy\u1ebft tr\u1ef1c ti\u1ebfp nh\u1ea5t v\u1ea5n \u0111\u1ec1 n\u00e0y m\u00e0 kh\u00f4ng lo\u1ea1i b\u1ecf kh\u1ea3 n\u0103ng?","jp":"\u3042\u306a\u305f\u306f\u3001Claude Code \u30bb\u30c3\u30b7\u30e7\u30f3\u304c\u591a\u6570\u306e\u30b5\u30fc\u30d0\u30fc\u304b\u3089 60 \u4ee5\u4e0a\u306e MCP \u30c4\u30fc\u30eb\u3092\u5e38\u306b\u30ed\u30fc\u30c9\u3057\u3001\u30bb\u30c3\u30b7\u30e7\u30f3\u304c\u59cb\u307e\u308b\u524d\u306b\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8 \u30d0\u30b8\u30a7\u30c3\u30c8\u3092\u4f7f\u3044\u679c\u305f\u3057\u3066\u3044\u308b\u30c1\u30fc\u30e0\u3092\u30b5\u30dd\u30fc\u30c8\u3057\u3066\u3044\u307e\u3059\u3002 \u6a5f\u80fd\u3092\u524a\u9664\u305b\u305a\u306b\u3053\u306e\u554f\u984c\u306b\u6700\u3082\u76f4\u63a5\u7684\u306b\u5bfe\u51e6\u3059\u308b\u8abf\u6574\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Enable Tool Search so tool definitions are deferred and discovered on demand rather than loaded into context upfront.","vi":"B\u1eadt T\u00ecm ki\u1ebfm c\u00f4ng c\u1ee5 \u0111\u1ec3 c\u00e1c \u0111\u1ecbnh ngh\u0129a c\u00f4ng c\u1ee5 \u0111\u01b0\u1ee3c tr\u00ec ho\u00e3n v\u00e0 ph\u00e1t hi\u1ec7n theo y\u00eau c\u1ea7u thay v\u00ec \u0111\u01b0\ der a least-privilege service principal scoped to the requested action.","vi":"C\u00e1c cu\u1ed9c g\u1ecdi c\u00f4ng c\u1ee5 th\u1ef1c thi ph\u00eda m\u00e1y ch\u1ee7 theo nguy\u00ean t\u1eafc d\u1ecbch v\u1ee5 c\u00f3 \u0111\u1eb7c quy\u1ec1n t\u1ed1i thi\u1ec3u trong ph\u1ea1m vi h\u00e0nh \u0111\u1ed9ng \u0111\u01b0\u1ee3c y\u00eau c\u1ea7u.","jp":"\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u306f\u3001\u8981\u6c42\u3055\u308c\u305f\u30a2\u30af\u30b7\u30e7\u30f3\u3092\u7bc4\u56f2\u3068\u3059\u308b\u6700\u5c0f\u7279\u6a29\u306e\u30b5\u30fc\u30d3\u30b9 \u30d7\u30ea\u30f3\u30b7\u30d1\u30eb\u306e\u4e0b\u3067\u30b5\u30fc\u30d0\u30fc\u5074\u3067\u5b9f\u884c\u3055\u308c\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Service credentials are placed in the prompt context, where they can leak into logs and traces.","vi":"Th\u00f4ng tin x\u00e1c th\u1ef1c d\u1ecbch v\u1ee5 \u0111\u01b0\u1ee3c \u0111\u1eb7t trong ng\u1eef c\u1ea3nh nh\u1eafc nh\u1edf, n\u01a1i ch\u00fang c\u00f3 th\u1ec3 b\u1ecb r\u00f2 r\u1ec9 v\u00e0o nh\u1eadt k\u00fd v\u00e0 d\u1ea5u v\u1ebft.","jp":"\u30b5\u30fc\u30d3\u30b9\u8cc7\u683c\u60c5\u5831\u306f\u30d7\u30ed\u30f3\u30d7\u30c8 \u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u306b\u914d\u7f6e\u3055\u308c\u308b\u305f\u3081\u3001\u30ed\u30b0\u3084\u30c8\u30ec\u30fc\u30b9\u306b\u6f0f\u6d29\u3059\u308b\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Role-based access control is enforced only at the response-rendering layer after the model accesses restricted data.","vi":"Ki\u1ec3m so\u00e1t truy c\u1eadp d\u1ef1a tr\u00ean vai tr\u00f2 ch\u1ec9 \u0111\u01b0\u1ee3c th\u1ef1c thi \u1edf l\u1edbp k\u1ebft xu\u1ea5t ph\u1ea3n h\u1ed3i sau khi m\u00f4 h\u00ecnh truy c\u1eadp d\u1eef li\u1ec7u b\u1ecb h\u1ea1n ch\u1ebf.","jp":"\u30ed\u30fc\u30eb\u30d9\u30fc\u30b9\u306e\u30a2\u30af\u30bb\u30b9\u5236\u5fa1\u306f\u3001\u30e2\u30c7\u30eb\u304c\u5236\u9650\u3055\u308c\u305f\u30c7\u30fc\u30bf\u306b\u30a2\u30af\u30bb\u30b9\u3057\u305f\u5f8c\u3001\u5fdc\u7 r unauthorized data has already entered model context.<br>Authorization must be enforced before retrieval and prompt construction. Options A, D, and E describe appropriate controls: least-privilege service identities, per-user ..."}},{"id":"ccarp-q007","n":7,"topic":1,"type":"mcq","stem":{"en":"You are investigating an MCP server that fails on first launch but succeeds on subsequent runs. System permission dialogs appeared during the first launch. Which response is most appropriate?","vi":"B\u1ea1n \u0111ang \u0111i\u1ec1u tra m\u1ed9t m\u00e1y ch\u1ee7 MCP kh\u00f4ng th\u00e0nh c\u00f4ng trong l\u1ea7n kh\u1edfi ch\u1ea1y \u0111\u1ea7u ti\u00ean nh\u01b0ng th\u00e0nh c\u00f4ng \u1edf nh\u1eefng l\u1ea7n ch\u1ea1y ti\u1ebfp theo. H\u1ed9p tho\u1ea1i c\u1ea5p ph\u00e9p h\u1ec7 th\u1ed1ng xu\u1ea5t hi\u1ec7n trong l\u1ea7n kh\u1edfi ch\u1ea1y \u0111\u1ea7u ti\u00ean. Ph\u1ea3n \u1ee9ng n\u00e0o l\u00e0 ph\u00f9 h\u1ee3p nh\u1ea5t?","jp":"\u6700\u521d\u306e\u8d77\u52d5\u3067\u306f\u5931\u6557\u3059\u308b\u304c\u3001\u305d\u306e\u5f8c\u306e\u5b9f\u884c\u3067\u306f\u6210\u529f\u3059\u308b MCP \u30b5\u30fc\u30d0\u30fc\u3092\u8abf\u67fb\u3057\u3066\u3044\u307e\u3059\u3002 \u6700\u521d\u306e\u8d77\u52d5\u6642\u306b\u30b7\u30b9\u30c6\u30e0\u8a31\u53ef\u30c0\u30a4\u30a2\u30ed\u30b0\u304c\u8868\u793a\u3055\u308c\u307e\u3057\u305f\u3002 \u3069\u306e\u5bfe\u5fdc\u304c\u6700\u3082\u9069\u5207\u3067\u3057\u3087\u3046\u304b?"},"options":[{"k":"A","t":{"en":"Recognize the first-run permission grant as the cause, document the expected behavior in onboarding guidance, and confirm that subsequent runs succeed.","vi":"Nh\u1eadn bi\u1ebft vi\u1ec7c c\u1ea5p quy\u1ec1n cho l\u1ea7n ch\u1ea1y \u0111\u1ea7u ti\u00ean l\u00e0 nguy\u00ean nh\u00e2n, ghi l\u1ea1i h\u00e0nh vi d\u1ef1 ki\u1ebfn \u200b\u200btrong h\u01b0\u1edbng d\u1eabn tri\u1ec3n khai v\u00e0 x\u00e1c nh\u1eadn r\u1eb1ng c\u00e1c l\u1ea7n ch\u1ea1y ti\u1ebfp theo th\u00e0nh c\u00f4ng.","jp":"\u6700\u521d\u306e\u5b9f\u884c\u306 ession context consumption.","vi":"C\u00e0i \u0111\u1eb7t hi\u1ec3n th\u1ecb ph\u00f4ng ch\u1eef ho\u1eb7c t\u1ef7 l\u1ec7 hi\u1ec3n th\u1ecb c\u1ee7a IDE \u0111ang chuy\u1ec3n \u0111\u1ed5i k\u1ebft qu\u1ea3 tr\u1ef1c quan th\u00e0nh m\u00e3 th\u00f4ng b\u00e1o ng\u1eef c\u1ea3nh b\u1ed5 sung, g\u00e2y ra m\u1ee9c ti\u00eau th\u1ee5 ng\u1eef c\u1ea3nh tr\u01b0\u1edbc phi\u00ean cao.","jp":"IDE \u306e\u30d5\u30a9\u30f3\u30c8 \u30ec\u30f3\u30c0\u30ea\u30f3\u30b0\u307e\u305f\u306f\u8868\u793a\u30b9\u30b1\u30fc\u30ea\u30f3\u30b0\u8a2d\u5b9a\u306b\u3088\u308a\u3001\u30d3\u30b8\u30e5\u30a2\u30eb\u51fa\u529b\u304c\u8ffd\u52a0\u306e\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8 \u30c8\u30fc\u30af\u30f3\u306b\u5909\u63db\u3055\u308c\u3001\u30bb\u30c3\u30b7\u30e7\u30f3\u524d\u306e\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u6d88\u8cbb\u91cf\u304c\u5897\u52a0\u3057\u307e\u3059\u3002"}}],"answer":["B"],"multi":false,"explain":{"text":"Claude Code constructs the model context before the first user message. That initial context can include the system prompt, project instructions, subagent configuration, MCP server instructions, and tool definitions expressed as JSON schemas. When numerous MCP servers expose many tools and Tool Search is disabled, those schemas must be loaded upfront. A large collection of verbose tool descriptions and parameter schemas can therefore consume tens of thousands of tokens before the engineer enters any text.<br>Tool Search is specifically designed to prevent this form of context inflation. With Tool..."}},{"id":"ccarp-q012","n":12,"topic":1,"type":"mcq","stem":{"en":"A team manager wants all engineers working on the same repository to share identical MCP server definitions without manual synchronization. Which configuration approach satisfies this requirement?","vi":"Ng\u01b0\u1eddi qu\u1ea3n l\u00fd nh\u00f3m mu\u1ed1n t\u1ea5t c\u1ea3 c\u00e1c k\u1ef9 s\u01b0 l\u00e0m vi\u1ec7c tr\u00ean c\u00f9ng m\u1ed9t kho l\u01b0u tr\u1eef chia s\u1ebb c\u00e1c \u0111\u1ecbnh \u01b0u tr\u1eef","jp":"\u30ea\u30dd\u30b8\u30c8\u30ea\u306b\u30b3\u30df\u30c3\u30c8\u3055\u308c\u305f project-scope \u306e .claude/settings.json \u304a\u3088\u3073 .mcp.json \u30d5\u30a1\u30a4\u30eb"}},{"k":"D","t":{"en":"each engineer maintains a personal ~/.claude/settings.json with the shared definitions","vi":"m\u1ed7i k\u1ef9 s\u01b0 duy tr\u00ec m\u1ed9t ~/.claude/settings.json c\u00e1 nh\u00e2n v\u1edbi c\u00e1c \u0111\u1ecbnh ngh\u0129a \u0111\u01b0\u1ee3c chia s\u1ebb","jp":"\u5404\u30a8\u30f3\u30b8\u30cb\u30a2\u306f\u3001\u5171\u6709\u5b9a\u7fa9\u3092\u542b\u3080\u500b\u4eba\u7528 ~/.claude/settings.json \u3092\u7ba1\u7406\u3057\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Project-scoped configuration is the appropriate mechanism for repository-specific settings that must remain consistent across collaborators. Claude Code recognizes `.claude/settings.json` as the shared project settings file and `.mcp.json` as the project-level MCP server configuration. When these files are committed to source control, every engineer receives the same definitions through the repository's normal clone, pull, review, and versioning workflow.<br>Anthropic's scope hierarchy distinguishes project configuration from user and local configuration.<br>Files under the user scope apply to one e..."}},{"id":"ccarp-q013","n":13,"topic":1,"type":"mcq","stem":{"en":"You are supporting an engineer whose Claude Code session reports a permission denial when the engineer expected the action to be allowed. Which resolution step is most appropriate?","vi":"B\u1ea1n \u0111ang h\u1ed7 tr\u1ee3 m\u1ed9t k\u1ef9 s\u01b0 c\u00f3 phi\u00ean M\u00e3 Claude b\u00e1o c\u00e1o vi\u1ec7c t\u1eeb ch\u1ed1i c\u1ea5p ph\u00e9p khi k\u1ef9 s\u01b0 \u0111\u00f3 mong \u0111\u1ee3i h\u00e0nh \u0111\u1ed9ng \u0111\u00f3 s\u1ebd \u0111\u01b0\u1ee3c cho ph\u00e9p. B\u01b0\u1edbc gi\u1ea3i quy\u1ebft n\u00e0o l\u00e0 ph\u00f9 h\u1ee3p nh\u1ea5t?","jp":"\u3042\u306a\u305f\u306f\u3001\u30a2 \u00e0n to\u00e0n h\u1ec7 th\u1ed1ng c\u1ea5p ph\u00e9p tr\u00ean t\u1ea5t c\u1ea3 c\u00e1c ph\u1ea1m vi \u0111\u1ec3 lo\u1ea1i b\u1ecf vi\u1ec7c t\u1eeb ch\u1ed1i, lo\u1ea1i b\u1ecf t\u1ea5t c\u1ea3 c\u00e1c bi\u1ec7n ph\u00e1p ki\u1ec3m so\u00e1t m\u1eabu c\u00f4ng c\u1ee5 v\u00e0 quy t\u1eafc t\u1eeb ch\u1ed1i thay v\u00ec x\u00e1c \u0111\u1ecbnh v\u00e0 s\u1eeda \u0111\u1ed5i quy t\u1eafc c\u1ee5 th\u1ec3.","jp":"\u3059\u3079\u3066\u306e\u30b9\u30b3\u30fc\u30d7\u3067\u6a29\u9650\u30b7\u30b9\u30c6\u30e0\u3092\u5b8c\u5168\u306b\u7121\u52b9\u306b\u3057\u3066\u62d2\u5426\u3092\u524a\u9664\u3057\u3001\u7279\u5b9a\u306e\u30eb\u30fc\u30eb\u3092\u7279\u5b9a\u3057\u3066\u4fee\u6b63\u3059\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u3059\u3079\u3066\u306e\u30c4\u30fc\u30eb\u30d1\u30bf\u30fc\u30f3\u3068\u62d2\u5426\u30eb\u30fc\u30eb\u306e\u5236\u5fa1\u3092\u524a\u9664\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Inspect the active permission rules across all scopes-managed, command-line, local, project, and user-to identify which rule is denying the action and confirm whether it should be amended or remain denied.","vi":"Ki\u1ec3m tra c\u00e1c quy t\u1eafc c\u1ea5p ph\u00e9p ho\u1ea1t \u0111\u1ed9ng tr\u00ean t\u1ea5t c\u1ea3 c\u00e1c ph\u1ea1m vi \u0111\u01b0\u1ee3c qu\u1ea3n l\u00fd, d\u00f2ng l\u1ec7nh, c\u1ee5c b\u1ed9, d\u1ef1 \u00e1n v\u00e0 ng\u01b0\u1eddi d\u00f9ng \u0111\u1ec3 x\u00e1c \u0111\u1ecbnh quy t\u1eafc n\u00e0o \u0111ang t\u1eeb ch\u1ed1i h\u00e0nh \u0111\u1ed9ng v\u00e0 x\u00e1c nh\u1eadn xem li\u1ec7u quy t\u1eafc \u0111\u00f3 c\u00f3 n\u00ean \u0111\u01b0\u1ee3c s\u1eeda \u0111\u1ed5i hay v\u1eabn b\u1ecb t\u1eeb ch\u1ed1i hay kh\u00f4ng.","jp":"\u3059\u3079\u3066\u306e\u30b9\u30b3\u30fc\u30d7 (\u7ba1\u7406\u5bfe\u8c61\u3001\u30b3\u30de\u30f3\u30c9\u30e9\u30a4\u30f3\u3001\u30ed\u30fc\u30ab\u30eb\u3001\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u3001\u304a\u3088\u3073\u30e6\u30fc\u30b6\u30fc) \u306b\u308f\u305f\u308b\u30a2\u30af\u30c6\u30a3\u30d6\u306a\u6a29\u9650\u30eb\u30fc\u30eb\u3092\u691c\u67fb\u3057\u3066\u3001\u30a2\u30af\u30b7\u30e7\u30f3\u3092\u62d2\u5426\u3057\u3066\u3044\u308b\u30eb\u30fc\u30eb\u3092\u7279\u5b9a\u3057\u3001\u4fee\u6b63\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u304b\u3001\u62d2\u5426\u3055\u308c\u305f\u307e\u307e\u306b\u3059\u308b\u304b\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Grant the engineer unrestricted Bash access to bypass the specific rule causing the denial, removing all tool-pattern constraints rather than amending only the rule in question.","vi":"C\u1ea5p cho k\u1ef9 s\u01b0 quy\u1ec1n truy c\u1eadp Bash kh\u00f4ng h\u1ea1n ch\u1ebf \u0111\u1ec3 b\u1ecf qua quy t\u1eafc c\u1ee5 th\u1ec3 g\u00e2y ra s\u1ef1 t\u1eeb ch\u1ed1i, lo\u1ea1i b\u1ecf t\u1ea5t c\u1ea3 c\u00e1c r\u00e0ng bu\u1ed9c v\u1ec1 m\u1eabu c\u00f4ng c\u1ee5 thay v\u00ec ch\u1ec9 s\u1eeda \u0111\u1ed5i quy t\u1eafc \u0111\u01b0\u1ee3c \u0111\u1ec1 c\u1eadp.","jp":"\u30a8\u30f3\u30b8\u30cb\u30a2\u306b\u7121\u5236\u9650\u306e Bash \u30a2\u30af\u30bb\u30b9\u3092\u8a31\u53ef\u3057\u3066\u3001\u62d2\u5426\u306e\u539f\u56e0\u3068\u306a\u3063\u3066\u3044\u308b\u7279\u5b9a\u306e\u30eb\u30fc\u30eb\u3092\u30d0\u30a4\u30d1\u30b9\u3057\u3001\u554f\u984c\u306e\u30eb\u30fc\u30eb\u306e\u307f\u3092\u4fee\u6b63\u3059\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u3059\u3079\u3066\u306e\u30c4\u30fc\u30eb \u30d1\u30bf\u30fc\u30f3\u306e\u5236\u7d04\u3092\u524a\u9664\u3057\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Claude Code permission decisions can be affected by multiple configuration scopes. The appropriate diagnostic action is to inspect the effective rules and identify the exact deny pattern. Managed policy has the highest precedence, and a deny rule from any applicable scope cannot be overridden by an allow rule elsewhere. The architect must then determine whether the denial represents an intentional security boundary or an incorrectly scoped rule. If correction is justified, only the specific rule should be amended. Repeated retries cannot change a deterministic permission decision.<br>Disabling pe..."}},{"id":"ccarp-q014","n":14,"topic":1,"type":"mcq","stem":{"en":"You are integrating Claude Code into the team's pull-request workflow. The team wants AIassisted review without removing human approval. Which integration design best fits this requirement?","vi":"B\u1ea1n \u0111ang t\u00edch h\u1ee3p M\u00e3 Claude v\u00e0o quy tr\u00ecnh l\u00e0m vi\u1ec7c theo y\u00eau c\u1ea7u k\u00e9o c\u1ee7a nh\u00f3m. Nh\u00f3m mu\u1ed1n \u0111\u00e1nh gi\u00e1 \u0111\u01b0\u1ee3c h\u1ed7 tr\u1ee3 b\u1edfi AI m\u00e0 kh\u00f4ng c\u1ea7n lo\u1ea1i b\u1ecf s\u1ef1 ph\u00ea duy\u1ec7t c\u1ee7a con ng\u01b0\u1eddi. Thi\u1ebft k\u1ebf t\u00edch h\u1ee3p n\u00e0o ph\u00f9 h\u1ee3p nh\u1ea5t v\u1edbi y\u00eau c\u1ea7u n\u00e0y?","jp":"\u3042\u306a\u305f\u306f\u3001Claude Code \u3092\u30c1\u30fc\u30e0\u306e\u30d7\u30eb\u30ea\u30af\u30a8\u30b9\u30c8 \u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u306b\u7d71\u5408\u3057\u3066\u3044\u307e\u3059\u3002\u30c1\u30fc\u30e0\u306f\u4eba\u9593\u306e\u627f\u8a8d\u3092\u524a\u9664\u305b\u305a\u306b AI \u652f\u63f4\u306b\u3088\u308b\u30ec\u30d3\u30e5\u30fc\u3092\u671b\u3093\u3067\u3044\u307e\u3059\u3002 \u3053\u306e\u8981\u4ef6\u306b\u6700\u3082\u9069\u3057\u305f\u7d71\u5408\u8a2d\u8a08\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Claude Code reviews the pull request and posts a structured analysis as a comment, while a human reviewer retains the approval decision under the existing branch-protection rules.","vi":"Claude Code xem x\u00e9t y\u00eau c\u1ea7u k\u00e9o v\u00e0 \u0111\u0103ng b\u1ea3n ph\u00e2n t\u00edch c\u00f3 c\u1ea5u tr\u00fac d\u01b0\u1edbi d\u1ea1ng nh\u1eadn x\u00e9t, trong khi ng\u01b0\u1eddi \u0111\u00e1nh gi\u00e1 v\u1eabn gi\u1eef nguy\u00ean quy\u1ebft \u0111\u1ecbnh ph\u00ea duy\u1ec7t theo c\u00e1c quy t\u1eafc b\u1ea3o v\u1ec7 chi nh\u00e1nh hi\u1ec7n c\u00f3.","jp":"Claude Code \u306f\ ."}},{"id":"ccarp-q019","n":19,"topic":1,"type":"mcq","stem":{"en":"A solutions architect is analyzing stakeholder feedback collected after the first quarter of a Claude-powered procurement automation deployment. The feedback includes four statements: (1) \"Our procurement team is processing 3x more purchase orders per analyst per day.\" (2) \"We have eliminated the manual data entry role entirely and redeployed those staff to vendor relationship management.\" (3) \"The API integration costs are running 40% over the projected per-transaction budget.\" (4) \"Response latency during end-of-month batch runs is averaging 11 seconds, against our committed 5-second SLA.\" Which of the following correctly identifies the primary business value pillar each stakeholder statement represents?","vi":"M\u1ed9t ki\u1ebfn \u200b\u200btr\u00fac s\u01b0 gi\u1ea3i ph\u00e1p \u0111ang ph\u00e2n t\u00edch ph\u1ea3n h\u1ed3i c\u1ee7a c\u00e1c b\u00ean li\u00ean quan \u0111\u01b0\u1ee3c thu th\u1eadp sau qu\u00fd \u0111\u1ea7u ti\u00ean c\u1ee7a qu\u00e1 tr\u00ecnh tri\u1ec3n khai t\u1ef1 \u0111\u1ed9ng h\u00f3a mua s\u1eafm do Claude h\u1ed7 tr\u1ee3. Ph\u1ea3n h\u1ed3i bao g\u1ed3m b\u1ed1n tuy\u00ean b\u1ed1: (1) \"Nh\u00f3m mua s\u1eafm c\u1ee7a ch\u00fang t\u00f4i \u0111ang x\u1eed l\u00fd g\u1ea5p 3 l\u1ea7n \u0111\u01a1n \u0111\u1eb7t h\u00e0ng cho m\u1ed7i nh\u00e0 ph\u00e2n t\u00edch m\u1ed7i ng\u00e0y.\" (2) \"Ch\u00fang t\u00f4i \u0111\u00e3 lo\u1ea1i b\u1ecf ho\u00e0n to\u00e0n vai tr\u00f2 nh\u1eadp d\u1eef li\u1ec7u th\u1ee7 c\u00f4ng v\u00e0 b\u1ed1 tr\u00ed l\u1ea1i nh\u1eefng nh\u00e2n vi\u00ean \u0111\u00f3 \u0111\u1ec3 qu\u1ea3n l\u00fd m\u1ed1i quan h\u1ec7 v\u1edbi nh\u00e0 cung c\u1ea5p.\" (3) \"Chi ph\u00ed t\u00edch h\u1ee3p API \u0111ang chi\u1ebfm 40% so v\u1edbi ng\u00e2n s\u00e1ch d\u1ef1 ki\u1ebfn \u200b\u200bcho m\u1ed7i giao d\u1ecbch.\" (4) \"\u0110\u1ed9 tr\u1ec5 ph\u1ea3n h\u1ed3i trong qu\u00e1 tr\u00ecnh ch\u1ea1y h\u00e0ng lo\u1ea1t cu\u1ed1i th\u00e1n inistrative authority inside a prompt is untrusted data, not authenticated identity or authorization evidence. Option B correctly combines independent controls across the model, runtime, authorization, and monitoring layers.<br>Prompt instructions establish that user content cannot override system policy. Runtime classifiers detect known and generalized attempts to bypass controls. Tool permissions are enforced outside the model and must derive from authenticated identity, role, and approved scope-not statements contained in the conversation. Audit logging records the actor, atte..."}},{"id":"ccarp-q026","n":26,"topic":2,"type":"mcq","stem":{"en":"An operations engineer reports that a Claude-based pipeline began returning malformed JSON responses after a scheduled maintenance window, causing downstream processing failures. Which two investigative steps most directly isolate the root cause? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"M\u1ed9t k\u1ef9 s\u01b0 v\u1eadn h\u00e0nh b\u00e1o c\u00e1o r\u1eb1ng quy tr\u00ecnh d\u1ef1a tr\u00ean Claude b\u1eaft \u0111\u1ea7u tr\u1ea3 v\u1ec1 c\u00e1c ph\u1ea3n h\u1ed3i JSON kh\u00f4ng \u0111\u00fang \u0111\u1ecbnh d\u1ea1ng sau kho\u1ea3ng th\u1eddi gian b\u1ea3o tr\u00ec theo l\u1ecbch tr\u00ecnh, g\u00e2y ra l\u1ed7i x\u1eed l\u00fd xu\u00f4i d\u00f2ng. Hai b\u01b0\u1edbc \u0111i\u1ec1u tra n\u00e0o gi\u00fap c\u00f4 l\u1eadp nguy\u00ean nh\u00e2n g\u1ed1c r\u1ec5 m\u1ed9t c\u00e1ch tr\u1ef1c ti\u1ebfp nh\u1ea5t? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u904b\u7528\u30a8\u30f3\u30b8\u30cb\u30a2\u306f\u3001\u30b9\u30b1\u30b8\u30e5\u30fc\u30eb\u3055\u308c\u305f\u30e1\u30f3\u30c6\u30ca\u30f3\u30b9\u6642\u9593\u67a0\u306e\u5f8c\u306b\u30af\u30ed\u30fc\u30c9\u30d9\u30fc\u30b9\u306e\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u304c\u4e0d\u6b63\u306a JSON \u5fdc\u7b54\u3092\u8fd4\u3057\u59cb\u3081\u3001\u30c0\u30a6\u30f3\u30b9\u30c8\u30ea\u30fc\u30e0\u51e6\u7406\u30a8\u30e9\u30fc\u304c\u767a\u751f\u3057\u3 factor.","vi":"Chuy\u1ec3n sang c\u1ea5p m\u00f4 h\u00ecnh Claude kh\u00e1c \u0111\u1ec3 lo\u1ea1i tr\u1eeb c\u00e1c thay \u0111\u1ed5i t\u1eeb ph\u00eda nh\u00e0 cung c\u1ea5p \u0111\u01b0\u1ee3c coi l\u00e0 y\u1ebfu t\u1ed1 g\u00f3p ph\u1ea7n.","jp":"\u30d7\u30ed\u30d0\u30a4\u30c0\u30fc\u5074\u200b\u200b\u306e\u5909\u66f4\u304c\u8981\u56e0\u3067\u3042\u308b\u53ef\u80fd\u6027\u3092\u6392\u9664\u3059\u308b\u306b\u306f\u3001\u5225\u306e\u30af\u30ed\u30fc\u30c9 \u30e2\u30c7\u30eb\u5c64\u306b\u5207\u308a\u66ff\u3048\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Increase the max_tokens limit to determine whether output truncation is causing incomplete JSON structures.","vi":"T\u0103ng gi\u1edbi h\u1ea1n max_tokens \u0111\u1ec3 x\u00e1c \u0111\u1ecbnh xem vi\u1ec7c c\u1eaft b\u1edbt \u0111\u1ea7u ra c\u00f3 g\u00e2y ra c\u1ea5u tr\u00fac JSON kh\u00f4ng \u0111\u1ea7y \u0111\u1ee7 hay kh\u00f4ng.","jp":"max_tokens \u5236\u9650\u3092\u5897\u3084\u3057\u3066\u3001\u51fa\u529b\u306e\u5207\u308a\u6368\u3066\u304c\u4e0d\u5b8c\u5168\u306a JSON \u69cb\u9020\u3092\u5f15\u304d\u8d77\u3053\u3057\u3066\u3044\u308b\u304b\u3069\u3046\u304b\u3092\u5224\u65ad\u3057\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Replay a set of premaintenance requests against the current configuration and inspect the raw model output before downstream parsing.","vi":"Ph\u00e1t l\u1ea1i m\u1ed9t t\u1eadp h\u1ee3p c\u00e1c y\u00eau c\u1ea7u b\u1ea3o tr\u00ec tr\u01b0\u1edbc \u0111\u1ed1i v\u1edbi c\u1ea5u h\u00ecnh hi\u1ec7n t\u1ea1i v\u00e0 ki\u1ec3m tra \u0111\u1ea7u ra c\u1ee7a m\u00f4 h\u00ecnh th\u00f4 tr\u01b0\u1edbc khi ph\u00e2n t\u00edch c\u00fa ph\u00e1p xu\u00f4i d\u00f2ng.","jp":"\u73fe\u5728\u306e\u69cb\u6210\u306b\u5bfe\u3057\u3066\u4e00\u9023\u306e\u4e8b\u524d\u30e1\u30f3\u30c6\u30ca\u30f3\u30b9 \u30ea\u30af\u30a8\u30b9\u30c8\u3092\u518d\u751f\u3057\u3001\u30c0\u30a6\u30f3\u30b9\u30c8\u30ea\u30fc\u30e0\u89e3\u6790\u306e\u524d\u306b\u751f\u306e\u30e2\u30c7\u30eb\u51fa\u529b\u3092\u691c\u67fb\u3057\u307e\u3059\u3002"}}],"answer":["B","E"],"multi":true,"explain":{"text":"The strongest investigation combines configuration comparison with controlled replay. Comparing the current system prompt and output-schema settings against the last known good version identifies maintenance-related configuration drift. Relevant differences include removed formatting instructions, altered schema requirements, incompatible parser expectations, changed stop sequences, or a disabled structured-output mechanism.<br>Replaying known premaintenance requests against the current configuration creates a controlled test set.<br>Inspecting the raw response before parsing then establishes whethe..."}},{"id":"ccarp-q027","n":27,"topic":2,"type":"mcq","stem":{"en":"Engineering leadership wants to roll out Claude Skills to 280 developers across 14 teams. Skills will encode internal coding standards, code-review checklists, and incident-postmortem templates. Leadership has asked how to govern Skill authorship so that Skills remain trustworthy without bottlenecking on a single central team. Which governance model should you recommend?","vi":"L\u00e3nh \u0111\u1ea1o k\u1ef9 thu\u1eadt mu\u1ed1n tri\u1ec3n khai Claude Skills cho 280 nh\u00e0 ph\u00e1t tri\u1ec3n thu\u1ed9c 14 nh\u00f3m. C\u00e1c k\u1ef9 n\u0103ng s\u1ebd m\u00e3 h\u00f3a c\u00e1c ti\u00eau chu\u1ea9n m\u00e3 h\u00f3a n\u1ed9i b\u1ed9, danh s\u00e1ch ki\u1ec3m tra \u0111\u00e1nh gi\u00e1 m\u00e3 v\u00e0 c\u00e1c m\u1eabu sau khi x\u1ea3y ra s\u1ef1 c\u1ed1. Ban l\u00e3nh \u0111\u1ea1o \u0111\u00e3 h\u1ecfi c\u00e1ch qu\u1ea3n l\u00fd quy\u1ec1n t\u00e1c gi\u1ea3 K\u1ef9 n\u0103ng \u0111\u1ec3 K\u1ef9 n\u0103ng v\u1eabn \u0111\u00e1ng tin c\u1eady m\u00e0 kh\u00f4ng g\u00e2y c\u1ea3n tr\u1edf cho m\u1ed9t nh\u00f3m trung t\u00e2m duy nh\u1ea5t. B\u1ea1n n\u00ean gi\u1edbi thi\u1ec7u m\u00f4 h\u00ecnh qu\u1ea3n tr\u1ecb n\u00e0o?","jp":"\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0\u306e\u30ea\u30fc\u30c0\u30fc\u30b7\u30c3\u30d7\u306f\u300114 \u30c1\u30fc\u30e0\u306e 280 \u4eba\u306e\u958b\u767a\u8005\u306b\u30af\u30ed\u30fc\u30c9 \u30b9\u30ad\u30eb\u3092\u5c55\u958b\u3057\u305f\u3044\u3068\u8003\u3048\u3066\u3044\u307e\u3059\u3002 \u30b9\u30ad\u30eb\u306f\u3001\u5185\u90e8\u30b3\u30fc\u30c7\u30a3\u30f3\u30b0\u6a19\u6e96\u3001\u30b3\u30fc\u30c9\u30ec\u30d3\u30e5\u30fc\u30c1\u30a7\u30c3\u30af\u30ea\u30b9\u30c8\u3001\u30a4\u30f3\u30b7\u30c7\u30f3\u30c8\u4e8b\u5f8c\u5206\u6790\u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\u3092\u30a8\u30f3\u30b3\u30fc\u30c9\u3057\u307e\u3059\u3002\u30ea\u30fc\u30c0\u30fc\u305f\u3061\u306f\u3001\u5358\u4e00\u306e\u4e2d\u592e\u30c1\u30fc\u30e0\u304c\u30dc\u30c8\u30eb\u30cd\u30c3\u30af\u306b\u306a\u308b\u3053\u3068\u306a\u304f\u30b9\u30ad\u30eb\u306e\u4fe1\u983c\u6027\u3092\u7dad\u6301\u3067\u304d\u308b\u3088\u3046\u306b\u3001\u30b9\u30ad\u30eb\u306e\u4f5c\u6210\u8005\u3092\u7ba1\u7406\u3059\u308b\u65b9\u6cd5\u3092\u6c42\u3081\u3066\u3044\u307e\u3059\u3002 \u3069\u306e\u30ac\u30d0\u30ca\u30f3\u30b9 \u30e2\u30c7\u30eb\u3092\u63a8\u5968\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Per-developer authorship across the 280 engineers with no team-level coordination required.","vi":"Quy\u1ec1n t\u00e1c gi\u1ea3 c\u1ee7a m\u1ed7i nh\u00e0 ph\u00e1t tri\u1ec3n \u0111\u1ed1i v\u1edbi 280 k\u1ef9 s\u01b0 m\u00e0 kh\u00f4ng c\u1ea7n s\u1ef1 ph\u1ed1i h\u1ee3p \u1edf c\u1ea5p \u0111\u1ed9 nh\u00f3m.","jp":"\u30c1\u30fc\u30e0\u30ec\u30d9\u30eb\u306e\u8abf\u6574\u3092\u5fc5\u8981\u3068\u305b\u305a\u3001280 \u4eba\u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u5168\u4f53\u306b\u308f\u305f\u308b\u958b\u767a\u8005\u3054\u3068\u306e\u30aa\u30fc\u30b5\u30fc\u30b7\u30c3\u30d7\u3002"}},{"k":"B","t":{"en":"Centralized authorship by a single platform team responsible for every Skill produced.","vi":"Quy\u1ec1n t\u00e1c gi\u1ea3 t\u1eadp trung b\u1edfi m\u1ed9t nh\u00f3m n\u1ec1n t\u1ea3ng duy nh\u1ea5t ch\u1ecbu tr\u00e1ch nhi\u1ec7m v\u1ec1 m\u1ecdi K\u1ef9 n\u0103ng \u0111\u01b0\u1ee3c t\u1ea1o ra.","jp":"\u4f5c\u6210\u3055\u308c\u305f\u3059\u3079\u3066\u306e\u30b9\u30ad\u30eb\u3092\u62c5\u5f53\u3059\u308b\u5358\u4e00\u306e\u30d7\u30e9\u30c3\u30c8\u30d5\u30a9\u30fc\u30e0 \u30c1\u30fc\u30e0\u306b\u3088\u308b\u96c6\u4e2d\u7684\u306a\u6a29\u9650\u3002"}},{"k":"C","t":{"en":"Fully decentralized authorship across the 14 teams with no review before publication.","vi":"Quy\u1ec1n t\u00e1c gi\u1ea3 \u0111\u01b0\u1ee3c ph\u00e2n c\u1ea5p ho\u00e0n to\u00e0n tr\u00ean 14 nh\u00f3m m\u00e0 kh\u00f4ng c\u1ea7n xem x\u00e9t tr\u01b0\u1edbc khi xu\u1ea5t b\u1ea3n.","jp":"\u8457\u8005\u306f 14 \u30c1\u30fc\u30e0\u306b\u5b8c\u5168\u306b\u5206\u6563\u3055\u308c\u3066\u304a\u308a\u3001\u51fa\u7248\u524d\u306b\u30ec\u30d3\u30e5\u30fc\u306f\u3042\u308a\u307e\u305b\u3093\u3002"}},{"k":"D","t":{"en":"Federated authorship across the 14 teams with a central review and publication gate.","vi":"Quy\u1ec1n t\u00e1c gi\u1ea3 li\u00ean k\u1ebft gi\u1eefa 14 nh\u00f3m v\u1edbi c\u1ed5ng xu\u1ea5t b\u1ea3n v\u00e0 \u0111\u00e1nh gi\u00e1 trung t\u00e2m.","jp":"\u4e2d\u592e\u306e\u30ec\u30d3\u30e5\u30fc\u3068\u51fa\u7248\u30b2\u30fc\u30c8\u3092\u5099\u3048\u305f 14 \u30c1\u30fc\u30e0\u306b\u308f\u305f\u308b\u8457\u8005\u306e\u9023\u5408\u3002"}}],"answer":["D"],"multi":false,"explain":{"text":"Federated authorship allows each domain team to maintain the procedural knowledge it understands while preserving organization-wide trust through a central publication gate. Team authors can update coding standards, review practices, and postmortem procedures without waiting for a single platform group to write every change. Central reviewers can validate ownership, security, tool permissions, duplication, versioning, testing evidence, and compliance before publication. Perdeveloper or fully decentralized publication creates inconsistent and potentially unsafe Skills. Fully centralized authors..."}},{"id":"ccarp-q028","n":28,"topic":2,"type":"mcq","stem":{"en":"You are transitioning a Claude-based deployment from design into implementation. Which handoff package most directly supports a clean transition?","vi":"B\u1ea1n \u0111ang chuy\u1ec3n qu\u00e1 tr\u00ecnh tri\u1ec3n khai d\u1ef1a tr\u00ean Claude t\u1eeb thi\u1ebft k\u1ebf sang tri\u1ec3n khai. G\u00f3i chuy\u1ec3n giao n\u00e0o h\u1ed7 tr\u1ee3 tr\u1ef1c ti\u1ebfp nh\u1ea5t cho qu\u00e1 tr\u00ecnh chuy\u1ec3n \u0111\u1ed5i r\u00f5 r\u00e0ng?","jp":"\u3042\u306a\u305f\u306f\u3001Claude \u30d9\u30fc\u30b9\u306e\u5c55\u958b\u3092\u8a2d\u8a08\u304b\u3089\u5b9f\u88c5\u306b\u79fb\u884c\u3057\u3066\u3044\u307e\u3059\u3002 \u30af\u30ea\u30fc\u30f3\u306a\u79fb\u884c\u3092\u6700\u3082\u76f4\u63a5\u7684\u306b\u30b5\u30dd\u30fc\u30c8\u3059\u308b\u30cf\u30f3\u30c9\u30aa\u30d5 \u30d1\u30c3\u30b1\u30fc\u30b8\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"The most recent set of design presentation slides without component-level diagrams, interface contracts, an evaluation framework with a reference set, runbooks, or a known-limitations register.","vi":"B\u1ed9 trang tr\u00ecnh b\u00e0y thi\u1ebft k\u1ebf m\u1edbi nh\u1ea5t kh\u00f4ng c\u00f3 s\u01a1 \u0111\u1ed3 c\u1ea5p th\u00e0nh ph\u1ea7n, h\u1ee3p \u0111\u1ed3ng giao di\u1ec7n, khung \u0111\u00e1nh gi\u00e1 v\u1edbi b\u1ed9 tham chi\u1ebfu, s\u1ed5 tay ho\u1eb7c s\u1ed5 \u0111\u0103ng k\u00fd c\u00e1c gi\u1edbi h\u1ea1n \u0111\u00e3 bi\u1ebft.","jp":"\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8 \u30ec\u30d9\u30eb\u306e\u56f3\u3001\u30a4\u30f3\u30bf\u30fc\u30d5\u30a7\u30a4\u30b9 \u30b3\u30f3\u30c8\u30e9\u30af\u30c8\u3001\u30ea\u30d5\u30a1\u30ec\u30f3\u30b9 \u30bb\u30c3\u30c8\u3092\u542b\u3080\u8a55\u4fa1\u30d5\u30ec\u30fc\u30e0\u30ef\u30fc\u30af\u3001\u904b\u7528\u624b\u9806\u66f8\u3001\u307e\u305f\u306f\u65e2\u77e5\u306e\u5236\u9650\u4e8b\u9805\u30ec\u30b8\u30b9\u30bf\u3092\u542b\u307e\u306a\u3044\u3001\u6700\u65b0\u306e\u8a2d\u8a08\u30d7\u30ec\u30bc\u30f3\u30c6\u30fc\u30b7\u30e7\u30f3 \u30b9\u30e9\u30a4\u30c9
