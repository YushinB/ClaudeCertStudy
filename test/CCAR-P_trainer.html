bf\u30fc\u30f3\u3092\u6bd4\u8f03\u3057\u3066\u3044\u307e\u3059\u3002 \u30e1\u30bf\u30c7\u30fc\u30bf\u3092\u62bd\u51fa\u3057\u3001\u5206\u985e\u3057\u3001\u8981\u7d04\u3057\u3001\u6c38\u7d9a\u5316\u3057\u307e\u3059\u3002 \u3069\u306e\u30d1\u30bf\u30fc\u30f3\u304c\u6700\u9069\u3067\u3059\u304b?\u307e\u305f\u305d\u306e\u7406\u7531\u306f\u4f55\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"A workflow pattern, because agentic patterns do not support tool invocations and therefore cannot execute the persist step that writes results to the downstream store.","vi":"M\u1ed9t m\u1eabu quy tr\u00ecnh l\u00e0m vi\u1ec7c, v\u00ec c\u00e1c m\u1eabu t\u00e1c nh\u00e2n kh\u00f4ng h\u1ed7 tr\u1ee3 l\u1ec7nh g\u1ecdi c\u00f4ng c\u1ee5 v\u00e0 do \u0111\u00f3 kh\u00f4ng th\u1ec3 th\u1ef1c thi b\u01b0\u1edbc l\u01b0u gi\u1eef ghi k\u1ebft qu\u1ea3 v\u00e0o kho l\u01b0u tr\u1eef ph\u00eda d\u01b0\u1edbi.","jp":"\u30ef\u30fc\u30af\u30d5\u30ed\u30fc \u30d1\u30bf\u30fc\u30f3\u3002\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8 \u30d1\u30bf\u30fc\u30f3\u306f\u30c4\u30fc\u30eb\u306e\u547c\u3073\u51fa\u3057\u3092\u30b5\u30dd\u30fc\u30c8\u3057\u3066\u3044\u306a\u3044\u305f\u3081\u3001\u7d50\u679c\u3092\u30c0\u30a6\u30f3\u30b9\u30c8\u30ea\u30fc\u30e0 \u30b9\u30c8\u30a2\u306b\u66f8\u304d\u8fbc\u3080\u6c38\u7d9a\u5316\u30b9\u30c6\u30c3\u30d7\u3092\u5b9f\u884c\u3067\u304d\u307e\u305b\u3093\u3002"}},{"k":"B","t":{"en":"An agentic pattern, because the open-ended planning capability of agents produces more consistent structured outputs than a fixed workflow graph on classification tasks.","vi":"M\u1ed9t m\u1eabu t\u00e1c nh\u00e2n, v\u00ec kh\u1ea3 n\u0103ng l\u1eadp k\u1ebf ho\u1ea1ch m\u1edf c\u1ee7a c\u00e1c t\u00e1c nh\u00e2n t\u1ea1o ra k\u1ebft qu\u1ea3 \u0111\u1ea7u ra c\u00f3 c\u1ea5u tr\u00fac nh\u1ea5t qu\u00e1n h\u01a1n so v\u1edbi bi\u1ec3u \u0111\u1ed3 quy tr\u00ecnh l\u00e0m vi\u1ec7c c\u1ed1 \u0111\u1ecbnh v\u1ec1 c\u00e1c nhi\u1ec7m v\u1ee5 ph\u00e2n lo\u1ea1i.","jp":"\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u30d1\u30bf\u30fc\u30f3\u3002\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u7121\u5236\u9650\u306e\u8a08\u753b\u6a5f\u80fd\u306b\u3088\u308a\u3001\u5206\u985e\u30bf\u30b9\u30af\u306b\u95a2\u3059\u308b\u56fa\u5b9a\u30ef\u30fc\u30af\u30d5\u30ed\u30fc \u30b0\u30e9\u30d5\u3088\u308a\u3082\u4e00\u8cab\u3057\u305f\u69cb\u9020\u5316\u3055\u308c\u305f\u51fa\u529b\u304c\u751f\u6210\u3055\u308c\u307e\u3059\u3002"}},{"k":"C","t":{"en":"An agentic pattern, because agents are categorically more accurate than workflows and therefore always preferable regardless of step predictability.","vi":"M\u1ed9t m\u1eabu t\u00e1c nh\u00e2n, v\u00ec c\u00e1c t\u00e1c nh\u00e2n c\u00f3 \u0111\u1ed9 ch\u00ednh x\u00e1c cao h\u01a1n v\u1ec1 m\u1eb7t ph\u00e2n lo\u1ea1i so v\u1edbi quy tr\u00ecnh l\u00e0m vi\u1ec7c v\u00e0 do \u0111\u00f3 lu\u00f4n \u0111\u01b0\u1ee3c \u01b0u ti\u00ean h\u01a1n b\u1ea5t k\u1ec3 kh\u1ea3 n\u0103ng d\u1ef1 \u0111o\u00e1n b\u01b0\u1edbc.","jp":"\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8 \u30d1\u30bf\u30fc\u30f3\u3002\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306f\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u3088\u308a\u3082\u65ad\u7136\u6b63\u78ba\u3067\u3042\u308b\u305f\u3081\u3001\u30b9\u30c6\u30c3\u30d7\u306e\u4e88\u6e2c\u53ef\u80fd\u6027\u306b\u95a2\u4fc2\u306a\u304f\u5e38\u306b\u63a8\u5968\u3055\u308c\u307e\u3059\u3002"}},{"k":"D","t":{"en":"A workflow pattern, because the steps are well-defined and predictable per-request token cost is preferred over flexibility.","vi":"M\u1eabu quy tr\u00ecnh l\u00e0m vi\u1ec7c v\u00ec c\u00e1c b\u01b0\u1edbc \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh r\u00f5 r\u00e0ng v\u00e0 chi ph\u00ed m\u00e3 th\u00f4ng b\u00e1o theo y\u00eau c\u1ea7u c\u00f3 th\u1ec3 d\u1ef1 \u0111o\u00e1n \u0111\u01b0\u1ee3c \u0111\u01b0\u1ee3c \u01b0u ti\u00ean h\u01a1n l\u00e0 t\u00ednh linh ho\u1ea1t.","jp":"\u30ef\u30fc\u30af\u30d5\u30ed\u30fc \u30d1\u30bf\u30fc\u30f3\u3002\u30b9\u30c6\u30c3\u30d7\u304c\u660e\u78ba\u306b\u5b9a\u7fa9\u3055\u308c\u3066\u304a\u308a\u3001\u8981\u6c42\u3054\u3068\u306e\u30c8\u30fc\u30af\u30f3 \u30b3\u30b9\u30c8\u304c\u4e88\u6e2c\u53ef\u80fd\u306a\u305f\u3081\u3001\u67d4\u8edf\u6027\u3088\u308a\u3082\u512a\u5148\u3055\u308c\u307e\u3059\u3002"}}],"answer":["D"],"multi":false,"explain":{"text":"A workflow is appropriate when processing stages and transitions are known in advance. Metadata extraction, classification, summarization, and persistence can be represented as deterministic nodes with explicit schemas, validation rules, retry policies, and failure handling. This provides predictable execution, cost, observability, and testability without paying for repeated model-driven planning.<br>Anthropic's Building Effective AI Agents distinguishes workflows, where predefined code paths control execution, from agents, where the model dynamically determines its process. Option A reaches the ..."}},{"id":"ccarp-q067","n":67,"topic":4,"type":"mcq","stem":{"en":"A managed agent deployment for claims triage has grown from 6 tools to 34 tools over 18 months as product teams added capabilities. Triage accuracy has declined from 91 percent to 78 percent, and average tool- selection latency has increased by 2.3 seconds. A junior engineer has proposed adding a tool-router agent in front of the current agent to filter the tool list per request. Which two findings should you present to justify capability decomposition before adding the router? (Select two.) Each correct answer presents part of the solution.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"Vi\u1ec7c tri\u1ec3n khai t\u00e1c nh\u00e2n \u0111\u01b0\u1ee3c qu\u1ea3n l\u00fd \u0111\u1ec3 ph\u00e2n lo\u1ea1i khi\u1ebfu n\u1ea1i \u0111\u00e3 t\u0103ng t\u1eeb 6 c\u00f4ng c\u1ee5 l\u00ean 34 c\u00f4ng c\u1ee5 trong 18 th\u00e1ng khi c\u00e1c nh\u00f3m s\u1ea3n ph\u1ea9m b\u1ed5 sung th\u00eam c\u00e1c ch\u1ee9c n\u0103ng. \u0110\u1ed9 ch\u00ednh x\u00e1c c\u1ee7a vi\u1ec7c ph\u00e2n lo\u1ea1i \u0111\u00e3 gi\u1ea3m t\u1eeb 91 ph\u1ea7n tr\u0103m n":68,"topic":4,"type":"mcq","stem":{"en":"A Claude architect needs to ensure that a security-hardening flag cannot be disabled by any individual engineer after it is set. Which configuration scope correctly enforces this requirement?","vi":"Ki\u1ebfn tr\u00fac s\u01b0 Claude c\u1ea7n \u0111\u1ea3m b\u1ea3o r\u1eb1ng c\u1edd t\u0103ng c\u01b0\u1eddng b\u1ea3o m\u1eadt kh\u00f4ng th\u1ec3 b\u1ecb v\u00f4 hi\u1ec7u h\u00f3a b\u1edfi b\u1ea5t k\u1ef3 k\u1ef9 s\u01b0 c\u00e1 nh\u00e2n n\u00e0o sau khi n\u00f3 \u0111\u01b0\u1ee3c \u0111\u1eb7t. Ph\u1ea1m vi c\u1ea5u h\u00ecnh n\u00e0o th\u1ef1c thi ch\u00ednh x\u00e1c y\u00eau c\u1ea7u n\u00e0y?","jp":"\u30af\u30ed\u30fc\u30c9 \u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306f\u3001\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u5f37\u5316\u30d5\u30e9\u30b0\u3092\u8a2d\u5b9a\u3057\u305f\u5f8c\u3001\u500b\u3005\u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u304c\u305d\u306e\u30d5\u30e9\u30b0\u3092\u7121\u52b9\u306b\u3067\u304d\u306a\u3044\u3088\u3046\u306b\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002 \u3053\u306e\u8981\u4ef6\u3092\u6b63\u3057\u304f\u9069\u7528\u3059\u308b\u69cb\u6210\u30b9\u30b3\u30fc\u30d7\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"User scope (~/.claude/settings.json) on each engineer's machine","vi":"Ph\u1ea1m vi ng\u01b0\u1eddi d\u00f9ng (~/.claude/settings.json) tr\u00ean m\u00e1y c\u1ee7a m\u1ed7i k\u1ef9 s\u01b0","jp":"\u5404\u30a8\u30f3\u30b8\u30cb\u30a2\u306e\u30de\u30b7\u30f3\u4e0a\u306e\u30e6\u30fc\u30b6\u30fc \u30b9\u30b3\u30fc\u30d7 (~/.claude/settings.json)"}},{"k":"B","t":{"en":"Environment variable defined in the CI/CD pipeline only","vi":"Bi\u1ebfn m\u00f4i tr\u01b0\u1eddng ch\u1ec9 \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh trong \u0111\u01b0\u1eddng d\u1eabn CI/CD","jp":"CI/CD \u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u3067\u306e\u307f\u5b9a\u7fa9\u3055\u308c\u305f\u74b0\u5883\u5909\u6570"}},{"k":"C","t":{"en":"Managed configuration applied centrally and marked as non-overridab urces are insufficient.<br>Regression evaluation in Option B may detect the failure but does not itself prevent unsupported claims. OAuth addresses identity and authorization, while input classifiers address malicious o..."}},{"id":"ccarp-q073","n":73,"topic":4,"type":"mcq","stem":{"en":"You are defining escalation criteria for ambiguous cases in an automated workflow. Which set of criteria best supports consistent escalation?","vi":"B\u1ea1n \u0111ang x\u00e1c \u0111\u1ecbnh ti\u00eau ch\u00ed leo thang cho c\u00e1c tr\u01b0\u1eddng h\u1ee3p kh\u00f4ng r\u00f5 r\u00e0ng trong quy tr\u00ecnh l\u00e0m vi\u1ec7c t\u1ef1 \u0111\u1ed9ng. B\u1ed9 ti\u00eau ch\u00ed n\u00e0o h\u1ed7 tr\u1ee3 t\u1ed1t nh\u1ea5t cho vi\u1ec7c leo thang nh\u1ea5t qu\u00e1n?","jp":"\u81ea\u52d5\u5316\u3055\u308c\u305f\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u3067\u3042\u3044\u307e\u3044\u306a\u30b1\u30fc\u30b9\u306e\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\u57fa\u6e96\u3092\u5b9a\u7fa9\u3057\u3066\u3044\u307e\u3059\u3002 \u4e00\u8cab\u3057\u305f\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\u3092\u6700\u3082\u3088\u304f\u30b5\u30dd\u30fc\u30c8\u3059\u308b\u57fa\u6e96\u30bb\u30c3\u30c8\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"No escalation criteria; the model decides independently on every turn whether to escalate, without explicit confidence thresholds, impact categories, or classifier-based ambiguity flags.","vi":"Kh\u00f4ng c\u00f3 ti\u00eau ch\u00ed leo thang; m\u00f4 h\u00ecnh quy\u1ebft \u0111\u1ecbnh m\u1ed9t c\u00e1ch \u0111\u1ed9c l\u1eadp \u1edf m\u1ed7i l\u01b0\u1ee3t xem c\u00f3 n\u00ean leo thang hay kh\u00f4ng m\u00e0 kh\u00f4ng c\u00f3 ng\u01b0\u1ee1ng tin c\u1eady r\u00f5 r\u00e0ng, danh m\u1ee5c t\u00e1c \u0111\u1ed9ng ho\u1eb7c c\u1edd m\u01a1 h\u1ed3 d\u1ef1a tr\u00ean ph\u00e2n lo\u1ea1i.","jp":"\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\u57fa\u6e96\u306f\u3042\u308a\u307e\u305b\u3093\u3002\u30e2\u30c7\u30eb\u306f\u3001\u660e\u793a\u7684\u306a\u4fe1\u983c\u3057\u304d\u3044\u5024\u3001\u5f71\u97ff\u30ab\u30c6\u30b4\u30ea\u30fc\u3001\u307e\u305f\u306f\u5206\u985e\u5b50\u30d9\u30fc\u30b9\u306e\u66d6\u6627\u6027\u30d5\u30e9\u30b0\u3092\u4f7f\u7528\u305b\u305a\u306b\u3001\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\u3059\u308b\u304b\u3069\u3046\u304b\u3092\u6bce\u30bf\u30fc\u30f3\u72ec\u7acb\u3057\u3066\u6c7a\u5b9a\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Escalation only after an affected customer has contacted support to complain, after the automated workflow has already completed without human review.","vi":"Ch\u1ec9 chuy\u1ec3n l\u00ean c\u1ea5p cao h\u01a1n sau khi kh\u00e1ch h\u00e0ng b\u1ecb \u1ea3nh h\u01b0\u1edfng \u0111\u00e3 li\u00ean h\u1ec7 v\u1edbi b\u1ed9 ph\u1eadn h\u1ed7 tr\u1ee3 \u0111\u1ec3 khi\u1ebfu n\u1ea1i, sau khi quy tr\u00ecnh l\u00e0m vi\u1ec7c t\u1ef1 \u0111\u1ed9ng \u0111\u00e3 ho\u00e0n t\u1ea5t m\u00e0 kh\u00f4ng c\u00f3 s\u1ef1 \u0111\u00e1nh gi\u00e1 c\u1ee7a con ng\u01b0\u1eddi.","jp":"\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\u306f\u3001\u5f71\u97ff\u3092\u53d7\u3051\u308b\u9867\u5ba2\u304c\u30b5\u30dd\u30fc\u30c8\u306b\u82e6\u60c5\u3092\u9023\u7d61\u3057\u305f\u5f8c\u3001\u81ea\u52d5\u5316\u3055\u308c\u305f\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u304c\u4eba\u9593\u306b\u3088\u308b\u30ec\u30d3\u30e5\u30fc\u306a\u3057\u3067\u3059\u3067\u306b\u5b8c\u4e86\u3057\u305f\u5f8c\u306b\u306e\u307f\u884c\u308f\u308c\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Escalation at the discretion of whoever is available when the team's on-call engineer has spare capacity, without a defined threshold, category, or ambiguity criterion.","vi":"N\u00e2ng c\u1ea5p theo quy\u1ebft \u0111\u1ecbnh c\u1ee7a b\u1ea5t k\u1ef3 ai c\u00f3 m\u1eb7t khi k\u1ef9 s\u01b0 tr\u1ef1c c\u1ee7a nh\u00f3m c\u00f3 n\u0103ng l\u1ef1c d\u1ef1 ph\u00f2ng m\u00e0 kh\u00f4ng c\u00f3 ng\u01b0\u1ee1ng, danh m\u1ee5c ho\u1eb7c ti\u00eau ch\u00ed m\u01a1 h\u1ed3 x\u00e1c \u0111\u1ecbnh.","jp":"\u5b9a\u7fa9\u3055\u308c\u305f\u3057\u304d\u3044\u5024\u3001\u30ab\u30c6\u30b4\u30ea\u3001\u307e\u305f\u306f\u66d6\u6627\u3055\u306e\u57fa\u6e96\u306a\u3057\u3067\u3001\u30c1\u30fc\u30e0\u306e\u30aa\u30f3\u30b3\u30fc\u30eb \u30a8\u30f3\u30b8\u30cb\u30a2\u306b\u4f59\u88d5\u304c\u3042\u308b\u5834\u5408\u306b\u5bfe\u5fdc\u53ef\u80fd\u306a\u62c5\u5f53\u8005\u306e\u88c1\u91cf\u3067\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"A confidence score below a defined threshold, presence of high-impact decision categories, ambiguity flags raised by content classifiers, and the user's explicit request for review.","vi":"\u0110i\u1ec3m tin c\u1eady d\u01b0\u1edbi ng\u01b0\u1ee1ng x\u00e1c \u0111\u1ecbnh, s\u1ef1 hi\u1ec7n di\u1ec7n c\u1ee7a c\u00e1c danh m\u1ee5c quy\u1ebft \u0111\u1ecbnh c\u00f3 t\u00e1c \u0111\u1ed9ng cao, c\u1edd m\u01a1 h\u1ed3 do b\u1ed9 ph\u00e2n lo\u1ea1i n\u1ed9i dung \u0111\u01b0a ra v\u00e0 y\u00eau c\u1ea7u xem x\u00e9t r\u00f5 r\u00e0ng c\u1ee7a ng\u01b0\u1eddi d\u00f9ng.","jp":"\u5b9a\u7fa9\u3055\u308c\u305f\u3057\u304d\u3044\u5024\u3092\u4e0b\u56de\u308b\u4fe1\u983c\u30b9\u30b3\u30a2\u3001\u5f71\u97ff\u306e\u5927\u304d\u3044\u6c7a\u5b9a\u30ab\u30c6\u30b4\u30ea\u306e\u5b58\u5728\u3001\u30b3\u30f3\u30c6\u30f3\u30c4\u5206\u985e\u5b50\u306b\u3088\u3063\u3066\u751f\u6210\u3055\u308c\u305f\u66d6\u6627\u3055\u30d5\u30e9\u30b0\u3001\u304a\u3088\u3073\u30e6\u30fc\u30b6\u30fc\u306e\u660e\u793a\u7684\u306a\u30ec\u30d3\u30e5\u30fc\u8981\u6c42\u3002"}}],"answer":["D"],"multi":false,"explain":{"text":"Option D defines observable and repeatable escalation triggers. Confidence thresholds identify cases where the system lacks sufficient certainty. High-impact categories ensure that legally, financially, medically, or operationally consequential decisions receive human attention regardless of nominal confidence. Classifier- generated ambiguity flags add an independent control, while an explicit user request preserves the individual' s ability to obtain review. These triggers should be documented, tested, logged, and mapped to reviewer authority and response-time objectives. Options A and C make..."}},{"id":"ccarp-q074","n":74,"topic":4,"type":"mcq","stem":{"en":"After a prompt-template update, several previously passing test cases now produce unexpected outputs. Which test type is specifically designed to detect this category of failure?","vi":"Sau khi c\u1eadp nh\u1eadt m\u1eabu nh\u1eafc nh\u1edf, m\u1ed9t s\u1ed1 tr\u01b0\u1eddng h\u1ee3p th\u1eed nghi\u1ec7m \u0111\u00e3 v\u01b0\u1ee3t qua tr\u01b0\u1edbc \u0111\u00e2y hi\u1ec7n t\u1ea1o ra k\u1ebft qu\u1ea3 \u0111\u1ea7u ra kh\u00f4ng mong mu\u1ed1n. Lo\u1ea1i th\u1eed nghi\u1ec7m n\u00e0o \u0111\u01b0\u1ee3c thi\u1ebft k\u1ebf \u0111\u1eb7c bi\u1ec7t \u0111\u1ec3 ph\u00e1t hi\u1ec7n lo\u1ea1i l\u1ed7i n\u00e0y?","jp":"\u30d7\u30ed\u30f3\u30d7\u30c8 \u30c6\u30f3\u30d7\u30ec\u30fc\u30c8\u306e\u66f4\u65b0\u5f8c\u3001\u4ee5\u524d\u306b\u5408\u683c\u3057\u305f\u3044\u304f\u3064\u304b\u306e\u30c6\u30b9\u30c8 \u30b1\u30fc\u30b9\u304c\u4e88\u671f\u3057\u306a\u3044\u51fa\u529b\u3092\u751f\u6210\u3059\u308b\u3088\u3046\u306b\u306a\u308a\u307e\u3057\u305f\u3002 \u3053\u306e\u30ab\u30c6\u30b4\u30ea\u306e\u969c\u5bb3\u3092\u691c\u51fa\u3059\u308b\u305f\u3081\u306b\u7279\u5225\u306b\u8a2d\u8a08\u3055\u308c\u305f\u30c6\u30b9\u30c8 \u30bf\u30a4\u30d7\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Integration tests that validate cross-component pipeline behavior.","vi":"Ki\u1ec3m tra t\u00edch h\u1ee3p x\u00e1c nh\u1eadn h\u00e0nh vi \u0111\u01b0\u1eddng \u1ed1ng nhi\u1ec1u th\u00e0nh ph\u1ea7n.","jp":"\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u9593\u306e\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u52d5\u4f5c\u3092\u691c\u8a3c\u3059\u308b\u7d71\u5408\u30c6\u30b9\u30c8\u3002"}},{"k":"B","t":{"en":"Adversarial tests that probe for prompt-injection vulnerabilities.","vi":"C\u00e1c th\u1eed nghi\u1ec7m \u0111\u1ed1i ngh\u1ecbch nh\u1eb1m th\u0103m d\u00f2 c\u00e1c l\u1ed7 h\u1ed5ng \u0111\u01b0\u1ee3c ti\u00eam nhanh.","jp":"\u30d7\u30ed\u30f3\u30d7\u30c8\u30a4\u30f3\u30b8\u30a7\u30af\u30b7\u30e7\u30f3\u306e\u8106\u5f31\u6027\u3092\u8abf\u67fb\u3059\u308b\u6575\u5bfe\u7684\u30c6\u30b9\u30c8\u3002"}},{"k":"C","t":{"en":"Regression tests scored against a stable reference set of known-good behavior.","vi":"C\u00e1c b\u00e0i ki\u1ec3m tra h\u1ed3i quy \u0111\u01b0\u1ee3c t\u00ednh \u0111i\u1ec3m d\u1ef1a tr\u00ean m\u1ed9t t\u1eadp h\u1ee3p tham chi\u1ebfu \u1ed5n \u0111\u1ecbnh v\u1ec1 h\u00e0nh vi \u0111\u01b0\u1ee3c bi\u1ebft \u0111\u1ebfn l\u00e0 t\u1ed1t.","jp":"\u56de\u5e30\u30c6\u30b9\u30c8\u306f\u3001\u65e2\u77e5\u306e\u826f\u597d\u306a\u52d5\u4f5c\u306e\u5b89\u5b9a\u3057\u305f\u53c2\u7167\u30bb\u30c3\u30c8\u306b\u5bfe\u3057\u3066\u30b9\u30b3\u30a2\u3092\u4ed8\u3051\u307e\u3057\u305f\u3002"}},{"k":"D","t":{"en":"Smoke tests that confirm high-level system availability after the change.","vi":"Ki\u1ec3m tra kh\u00f3i x\u00e1c nh\u1eadn t\u00ednh kh\u1ea3 d\u1ee5ng c\u1ee7a h\u1ec7 th\u1ed1ng c\u1ea5p cao sau khi thay \u0111\u1ed5i.","jp":"\u5909\u66f4\u5f8c\u306e\u9ad8\u30ec\u30d9\u30eb\u306e\u30b7\u30b9\u30c6\u30e0\u53ef\u7528\u6027\u3092\u78ba\u8a8d\u3059\u308b\u30b9\u30e2\u30fc\u30af \u30c6\u30b9\u30c8\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Regression tests determine whether behavior that previously met requirements still passes after a change. A stable reference set provides identical inputs, expected outcomes, and scoring rules across prompt versions, allowing the team to attribute failures to the update. Integration tests verify interactions among components but may not measure detailed output behavior. Adversarial tests target attacks and misuse cases, while smoke tests establish only that essential system paths remain available. The failed cases should be added to or retained within the regression suite, and the old and new ..."}},{"id":"ccarp-q075","n":75,"topic":4,"type":"mcq","stem":{"en":"A Claude architect at a health services organization is defining evaluation metrics for a clinical-summary pipeline. The pipeline must remain within a per-query cost ceiling and must never surface patient data to unauthorized roles. Which two metrics directly address these requirements? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"Ki\u1ebfn tr\u00fac s\u01b0 Claude t\u1ea1i m\u1ed9t t\u1ed5 ch\u1ee9c d\u1ecbch v\u1ee5 y t\u1ebf \u0111ang x\u00e1c \u0111\u1ecbnh c\u00e1c s\u1ed1 li\u1ec7u \u0111\u00e1nh gi\u00e1 cho quy tr\u00ecnh t\u00f3m t\u1eaft l\u00e2m s\u00e0ng. Quy tr\u00ecnh ph\u1ea3i duy tr\u00ec trong m\u1ee9c tr\u1ea7n chi ph\u00ed cho m\u1ed7i truy v\u1ea5n v\u00e0 kh\u00f4ng bao gi\u1edd \u0111\u01b0\u1ee3c chuy\u1ec3n d\u1eef li\u1ec7u b\u1ec7nh nh\u00e2n sang c\u00e1c vai tr\u00f2 tr\u00e1i ph\u00e9p. Hai s\u1ed1 li\u1ec7u n\u00e0o tr\u1ef1c ti\u1ebfp gi\u1ea3i quy\u1ebft c\u00e1c y\u00eau c\u1ea7u n\u00e0y? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u533b\u7642\u30b5\u30fc\u30d3\u30b9\u7d44\u7e54\u306e\u30af\u30ed\u30fc\u30c9 \u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306f\u3001\u81e8\u5e8a\u6982\u8981\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u306e\u8a55\u4fa1\u6307\u6a19\u3092\u5b9a\u7fa9\u3057\u3066\u3044\u307e\u3059\u3002\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u306f\u30af\u30a8\u30ea\u3054\u3068\u306e\u30b3\u30b9\u30c8\u4e0a\u9650\u5185\u306b\u3068\u3069\u307e\u308b\u5fc5\u8981\u304c\u3042\u308a\u3001\u60a3\u8005\u30c7\u30fc\u30bf\u3092\u8a31\u53ef\u3055\u308c\u3066\u3044\u306a\u3044\u5f79\u5272\u306b\u6c7a\u3057\u3066\u516c\u958b\u3057\u3066\u306f\u306a\u308a\u307e\u305b\u3093\u3002 \u3053\u308c\u3089\u306e\u8981\u4ef6\u306b\u76f4\u63a5\u5bfe\u5fdc\u3059\u308b 2 \u3064\u306e\u6307\u6a19\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"BLEU score computed against a human-annotated reference summary set","vi":"\u0110i\u1ec3m BLEU \u0111\u01b0\u1ee3c t\u00ednh to\u00e1n d\u1ef1a tr\u00ean t\u1eadp h\u1ee3p t\u00f3m t\u1eaft tham chi\u1ebfu c\u00f3 ch\u00fa th\u00edch c\u1ee7a con ng\u01b0\u1eddi","jp":"\u4eba\u9593\u304c\u6ce8\u91c8\u3092\u4ed8\u3051\u305f\u53c2\u7167\u6982\u8981\u30bb\u30c3\u30c8\u306b\u5bfe\u3057\u3066\u8a08\u7b97\u3055\u308c\u305f BLEU \u30b9\u30b3\u30a2"}},{"k":"B","t":{"en":"Role-based access-control enforcement rate measured on a red-team dataset","vi":"T\u1ef7 l\u1ec7 th\u1ef1c thi ki\u1ec3m so\u00e1t truy c\u1eadp d\u1ef1a tr\u00ean vai tr\u00f2 \u0111\u01b0\u1ee3c \u0111o tr\u00ean t\u1eadp d\u1eef li\u1ec7u c\u1ee7a \u0111\u1ed9i \u0111\u1ecf","jp":"\u30ec\u30c3\u30c9\u30c1\u30fc\u30e0 \u30c7\u30fc\u30bf\u30bb\u30c3\u30c8\u3067\u6e2c\u5b9a\u3055\u308c\u305f\u30ed\u30fc\u30eb\u30d9\u30fc\u30b9\u306e\u30a2\u30af\u30bb\u30b9\u5236\u5fa1\u306e\u9069\u7528\u7387"}},{"k":"C","t":{"en":"Throughput measured as successful requests processed per minute","vi":"Th\u00f4ng l\u01b0\u1ee3ng \u0111\u01b0\u1ee3c \u0111o b\u1eb1ng c\u00e1c y\u00eau c\u1ea7u \u0111\u01b0\u1ee3c x\u1eed l\u00fd th\u00e0nh c\u00f4ng m\u1ed7i ph\u00fat","jp":"\u30b9\u30eb\u30fc\u30d7\u30c3\u30c8\u306f\u30011 \u5206\u3042\u305f\u308a\u306b\u51e6\u7406\u3055\u308c\u305f\u6210\u529f\u3057\u305f\u30ea\u30af\u30a8\u30b9\u30c8\u3068\u3057\u3066\u6e2c\u5b9a\u3055\u308c\u307e\u3059"}},{"k":"D","t":{"en":"Per-query token cost measured against the defined cost ceiling","vi":"Chi ph\u00ed m\u00e3 th\u00f4ng b\u00e1o cho m\u1ed7i truy v\u1ea5n \u0111\u01b0\u1ee3c \u0111o d\u1ef1a tr\u00ean m\u1ee9c tr\u1ea7n chi ph\u00ed \u0111\u00e3 x\u00e1c \u0111\u1ecbnh","jp":"\u5b9a\u7fa9\u3055\u308c\u305f\u30b3\u30b9\u30c8\u4e0a\u9650\u306b\u5bfe\u3057\u3066\u6e2c\u5b9a\u3055\u308c\u305f\u30af\u30a8\u30ea\u3054\u3068\u306e\u30c8\u30fc\u30af\u30f3 \u30b3\u30b9\u30c8"}},{"k":"E","t":{"en":"Response latency at the 95th percentile across a one-week sample window","vi":"\u0110\u1ed9 tr\u1ec5 ph\u1ea3n h\u1ed3i \u1edf ph\u00e2n v\u1ecb th\u1ee9 95 trong kho\u1ea3ng th\u1eddi gian m\u1eabu m\u1ed9t tu\u1ea7n","jp":"1 \u9031\u9593\u306e\u30b5\u30f3\u30d7\u30eb\u671f\u9593\u306b\u304a\u3051\u308b 95 \u30d1\u30fc\u30bb\u30f3\u30bf\u30a4\u30eb\u3067\u306e\u5fdc\u7b54\u5f85\u3061\u6642\u9593"}}],"answer":["B","D"],"multi":true,"explain":{"text":"The evaluation metrics must map directly to the two stated requirements. Role-based access-control enforcement rate, tested against a red-team dataset, measures whether requests from unauthorized identities, roles, or access paths are consistently denied. It converts the privacy and authorization requirement into an observable security metric and exposes bypass conditions that ordinary functional tests may miss. Because the requirement says patient data must never reach unauthorized roles, the acceptance threshold should be effectively 100% enforcement across representative and adversarial cas..."}},{"id":"ccarp-q076","n":76,"topic":4,"type":"mcq","stem":{"en":"You are choosing the level of detail for an implementation guide. The audience is a delivery team that will build the deployment. Which guidance composition best serves them?","vi":"B\u1ea1n \u0111ang ch\u1ecdn m\u1ee9c \u0111\u1ed9 chi ti\u1ebft cho h\u01b0\u1edbng d\u1eabn tri\u1ec3n khai. \u0110\u1ed1i t\u01b0\u1ee3ng l\u00e0 nh\u00f3m ph\u00e2n ph\u1ed1i s\u1ebd x\u00e2y d\u1ef1ng qu\u00e1 tr\u00ecnh tri\u1ec3n khai. Th\u00e0nh ph\u1ea7n h\u01b0\u1edbng d\u1eabn n\u00e0o ph\u1ee5c v\u1ee5 h\u1ecd t\u1ed1t nh\u1ea5t?","jp":"\u5b9f\u88c5\u30ac\u30a4\u30c9\u306e\u8a73\u7d30\u30ec\u30d9\u30eb\u3092\u9078\u629e\u3057\u3066\u3044\u307e\u3059\u3002\u5bfe\u8c61\u8005\u306f\u3001\u30c7\u30d7\u30ed\u30a4\u30e1\u30f3\u30c8\u3092\u69cb\u7bc9\u3059\u308b\u914d\u4fe1\u30c1\u30fc\u30e0\u3067\u3059\u3002 \u3069\u306e\u30ac\u30a4\u30c0\u30f3\u30b9\u69cb\u6210\u304c\u5f7c\u3089\u306b\u6700\u3082\u5f79\u7acb\u3064\u3067\u3057\u3087\u3046\u304b?"},"options":[{"k":"A","t":{"en":"Component responsibilities, contracts between components, sequence diagrams of the dominant flows, configuration parameters with defaults, and operational runbooks.","vi":"Tr\u00e1ch nhi\u1ec7m c\u1ee7a th\u00e0nh ph\u1ea7n, h\u1ee3p \u0111\u1ed3ng gi\u1eefa c\u00e1c th\u00e0nh ph\u1ea7n, s\u01a1 \u0111\u1ed3 tu\u1ea7n t\u1ef1 c\u1ee7a c\u00e1c lu\u1ed3ng ch\u00ednh, tham s\u1ed1 c\u1ea5u h\u00ecnh c\u00f3 gi\u00e1 tr\u1ecb m\u1eb7c \u0111\u1ecbnh v\u00e0 s\u1ed5 s\u00e1ch v\u1eadn h\u00e0nh.","jp":"\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u306e\u8cac\u4efb\u3001\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u9593\u306e\u5951\u7d04\u3001\u4e3b\u8981\u306a\u30d5\u30ed\u30fc\u306e\u30b7\u30fc\u30b1\u30f3\u30b9\u56f3\u3001\u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u69cb\u6210\u30d1\u30e9\u30e1\u30fc\u30bf\u30fc\u3001\u304a\u3088\u3073\u904b\u7528\u30e9\u30f3\u30d6\u30c3\u30af\u3002"}},{"k":"B","t":{"en":"Component responsibilities and interface contracts only, without sequence diagrams of the dominant flows, configuration parameters with defaults, or runbooks to guide operational tasks.","vi":"Ch\u1ec9 c\u00f3 tr\u00e1ch nhi\u1ec7m c\u1ee7a th\u00e0nh ph\u1ea7n v\u00e0 h\u1ee3p \u0111\u1ed3ng giao di\u1ec7n, kh\u00f4ng c\u00f3 s\u01a1 \u0111\u1ed3 tu\u1ea7n t\u1ef1 c\u1ee7a c\u00e1c lu\u1ed3ng ch\u00ednh, c\u00e1c tham s\u1ed1 c\u1ea5u h\u00ecnh c\u00f3 gi\u00e1 tr\u1ecb m\u1eb7c \u0111\u1ecbnh ho\u1eb7c s\u1ed5 s\u00e1ch h\u01b0\u1edbng d\u1eabn c\u00e1c t\u00e1c v\u1ee5 v\u1eadn h\u00e0nh.","jp":"\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u306e\u8cac\u4efb\u3068\u30a4\u30f3\u30bf\u30fc\u30d5\u30a7\u30a4\u30b9 \u30b3\u30f3\u30c8\u30e9\u30af\u30c8\u306e\u307f\u3002\u4e3b\u8981\u306a\u30d5\u30ed\u30fc\u306e\u30b7\u30fc\u30b1\u30f3\u30b9\u56f3\u3001\u30c7\u30d5\u30a9\u30eb\u30c8\u306e\u69cb\u6210\u30d1\u30e9\u30e1\u30fc\u30bf\u30fc\u3001\u307e\u305f\u306f\u904b\u7528\u30bf\u30b9\u30af\u3092\u30ac\u30a4\u30c9\u3059\u308b\u30e9\u30f3\u30d6\u30c3\u30af\u306f\u3042\u308a\u307e\u305b\u3093\u3002"}},{"k":"C","t":{"en":"An architecture overview and sequence diagrams for the dominant flows, without interface contracts, configuration-parameter tables, or operational runbooks for the delivery team to follow.","vi":"T\u1ed5ng quan v\u1ec1 ki\u1ebfn \u200b\u200btr\u00fac v\u00e0 s\u01a1 \u0111\u1ed3 tr\u00ecnh t\u1ef1 cho c\u00e1c lu\u1ed3ng ch\u00ednh, kh\u00f4ng c\u00f3 h\u1ee3p \u0111\u1ed3ng giao di\u1ec7n, b\u1ea3ng tham s\u1ed1 c\u1ea5u h\u00ecnh ho\u1eb7c s\u1ed5 tay v\u1eadn h\u00e0nh \u0111\u1ec3 nh\u00f3m ph\u00e2n ph\u1ed1i tu\u00e2n theo.","jp":"\u4e3b\u8981\u306a\u30d5\u30ed\u30fc\u306e\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u306e\u6982\u8981\u3068\u30b7\u30fc\u30b1\u30f3\u30b9\u56f3\u3002\u30a4\u30f3\u30bf\u30fc\u30d5\u30a7\u30a4\u30b9\u5951\u7d04\u3001\u69cb\u6210\u30d1\u30e9\u30e1\u30fc\u30bf \u30c6\u30fc\u30d6\u30eb\u3001\u914d\u4fe1\u30c1\u30fc\u30e0\u304c\u5f93\u3046\u904b\u7528\u624b\u9806\u66f8\u306f\u542b\u307e\u308c\u3066\u3044\u307e\u305b\u3093\u3002"}},{"k":"D","t":{"en":"An architecture overview and a list of known limitations, without component-level diagrams, interface contracts, configuration parameters, or operational runbooks to support implementation.","vi":"T\u1ed5ng quan v\u1ec1 ki\u1ebfn \u200b\u200btr\u00fac v\u00e0 danh s\u00e1ch c\u00e1c h\u1ea1n ch\u1ebf \u0111\u00e3 bi\u1ebft, kh\u00f4ng c\u00f3 s\u01a1 \u0111\u1ed3 c\u1ea5p th\u00e0nh ph\u1ea7n, h\u1ee3p \u0111\u1ed3ng giao di\u1ec7n, tham s\u1ed1 c\u1ea5u h\u00ecnh ho\u1eb7c s\u1ed5 s\u00e1ch v\u1eadn h\u00e0nh \u0111\u1ec3 h\u1ed7 tr\u1ee3 tri\u1ec3n khai.","jp":"\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u306e\u6982\u8981\u3068\u65e2\u77e5\u306e\u5236\u9650\u306e\u30ea\u30b9\u30c8\u3002\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8 \u30ec\u30d9\u30eb\u306e\u56f3\u3001\u30a4\u30f3\u30bf\u30fc\u30d5\u30a7\u30a4\u30b9\u5951\u7d04\u3001\u69cb\u6210\u30d1\u30e9\u30e1\u30fc\u30bf\u3001\u5b9f\u88c5\u3092\u30b5\u30dd\u30fc\u30c8\u3059\u308b\u904b\u7528\u30d6\u30c3\u30af\u306f\u542b\u307e\u308c\u3066\u3044\u307e\u305b\u3093\u3002"}}],"answer":["A"],"multi":false,"explain":{"text":"A delivery team needs implementation-level direction rather than an executive architecture summary.<br>Component responsibilities establish ownership and boundaries, while interface contracts define schemas, accepted inputs, outputs, errors, and behavioral expectations. Sequence diagrams show how components interact across dominant and failure flows. Configuration tables with defaults prevent inconsistent assumptions between environments. Operational runbooks ensure that deployment, recovery, monitoring, and routine maintenance are addressed during implementation rather than improvised after rele..."}},{"id":"ccarp-q077","n":77,"topic":4,"type":"mcq","stem":{"en":"You are identifying the highest-impact optimization for a deployment whose token cost is dominated by a long, repeated system prompt and a large retrieved context per request. Which optimization most directly targets the dominant cost driver?","vi":"B\u1ea1n \u0111ang x\u00e1c \u0111\u1ecbnh c\u00e1ch t\u1ed1i \u01b0u h\u00f3a c\u00f3 t\u00e1c \u0111\u1ed9ng cao nh\u1ea5t cho ho\u1ea1t \u0111\u1ed9ng tri\u1ec3n khai c\u00f3 chi ph\u00ed m\u00e3 th\u00f4ng b\u00e1o b\u1ecb chi ph\u1ed1i b\u1edfi l\u1eddi nh\u1eafc h\u1ec7 th\u1ed1ng d\u00e0i, l\u1eb7p l\u1ea1i v\u00e0 ng\u1eef c\u1ea3nh \u0111\u01b0\u1ee3c truy xu\u1ea5t l\u1edbn cho m\u1ed7i y\u00eau c\u1ea7u. T\u1ed1i \u01b0u h\u00f3a n\u00e0o nh\u1eafm m\u1ee5c ti\u00eau tr\u1ef1c ti\u1ebfp nh\u1ea5t \u0111\u1ebfn tr\u00ecnh \u0111i\u1ec1u khi\u1ec3n chi ph\u00ed ch\u00ednh?","jp":"\u3042\u306a\u305f\u306f\u3001\u9577\u304f\u7e70\u308a\u8fd4\u3055\u308c\u308b\u30b7\u30b9\u30c6\u30e0 \u30d7\u30ed\u30f3\u30d7\u30c8\u3068\u30ea\u30af\u30a8\u30b9\u30c8\u3054\u3068\u306b\u53d6\u5f97\u3055\u308c\u308b\u5927\u91cf\u306e\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u306b\u3088\u3063\u3066\u30c8\u30fc\u30af\u30f3 \u30b3\u30b9\u30c8\u304c\u652f\u914d\u3055\u308c\u308b\u30c7\u30d7\u30ed\u30a4\u30e1\u30f3\u30c8\u306b\u5bfe\u3057\u3066\u3001\u6700\u3082\u5f71\u97ff\u306e\u5927\u304d\u3044\u6700\u9069\u5316\u3092\u7279\u5b9a\u3057\u3066\u3044\u307e\u3059\u3002 \u4e3b\u8981\u306a\u30b3\u30b9\u30c8\u8981\u56e0\u3092\u6700\u3082\u76f4\u63a5\u7684\u306b\u30bf\u30fc\u30b2\u30c3\u30c8\u306b\u3057\u305f\u6700\u9069\u5316\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Increase retrieval depth on every request to maximize recall, worsening the dominant cost driver by adding more retrieved tokens per request rather than reducing them.","vi":"T\u0103ng \u0111\u1ed9 s\u00e2u truy xu\u1ea5t tr\u00ean m\u1ecdi y\u00eau c\u1ea7u \u0111\u1ec3 t\u1ed1i \u0111a h\u00f3a kh\u1ea3 n\u0103ng thu h\u1ed3i, l\u00e0m x\u1ea5u \u0111i tr\u00ecnh \u0111i\u1ec1u khi\u1ec3n chi ph\u00ed chi ph\u1ed1i b\u1eb1ng c\u00e1ch th\u00eam nhi\u1ec1u m\u00e3 th\u00f4ng b\u00e1o \u0111\u01b0\u1ee3c truy xu\u1ea5t cho m\u1ed7i y\u00eau c\u1ea7u thay v\u00ec gi\u1ea3m ch\u00fang.","jp":"\u3059\u3079\u3066\u306e\u30ea\u30af\u30a8\u30b9\u30c8\u306e\u53d6\u5f97\u6df1\u5ea6\u3092\u5897\u3084\u3057\u3066\u30ea\u30b3\u30fc\u30eb\u3092\u6700\u5927\u5316\u3057\u3001\u30ea\u30af\u30a8\u30b9\u30c8\u3054\u3068\u306b\u53d6\u5f97\u3055\u308c\u308b\u30c8\u30fc\u30af\u30f3\u3092\u6e1b\u3089\u3059\u306e\u3067\u306f\u306a\u304f\u8ffd\u52a0\u3059\u308b\u3053\u3068\u3067\u4e3b\u306a\u30b3\u30b9\u30c8\u8981\u56e0\u3092\u60aa\u5316\u3055\u305b\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Add additional repeated content to the system prompt to give the model more guidance.","vi":"Th\u00eam n\u1ed9i dung l\u1eb7p l\u1ea1i b\u1ed5 sung v\u00e0o l\u1eddi nh\u1eafc c\u1ee7a h\u1ec7 th\u1ed1ng \u0111\u1ec3 cung c\u1ea5p th\u00eam h\u01b0\u1edbng d\u1eabn cho m\u00f4 h\u00ecnh.","jp":"\u7e70\u308a\u8fd4\u3057\u306e\u30b3\u30f3\u30c6\u30f3\u30c4\u3092\u30b7\u30b9\u30c6\u30e0 \u30d7\u30ed\u30f3\u30d7\u30c8\u306b\u8ffd\u52a0\u3057\u3066\u3001\u30e2\u30c7\u30eb\u306b\u3055\u3089\u306a\u308b\u30ac\u30a4\u30c0\u30f3\u30b9\u3092\u63d0\u4f9b\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Move the long, repeated system prompt into a cacheable prefix and trim retrieved context to the spans relevant to each query.","vi":"Di chuy\u1ec3n l\u1eddi nh\u1eafc h\u1ec7 th\u1ed1ng d\u00e0i, l\u1eb7p \u0111i l\u1eb7p l\u1ea1i v\u00e0o ti\u1ec1n t\u1ed1 c\u00f3 th\u1ec3 l\u01b0u v\u00e0o b\u1ed9 nh\u1edb \u0111\u1ec7m v\u00e0 c\u1eaft b\u1edbt ng\u1eef c\u1ea3nh \u0111\u01b0\u1ee3c truy xu\u1ea5t theo c\u00e1c kho\u1ea3ng c\u00f3 li\u00ean quan \u0111\u1ebfn t\u1eebng truy v\u1ea5n.","jp":"\u9577\u304f\u7e70\u308a\u8fd4\u3055\u308c\u308b\u30b7\u30b9\u30c6\u30e0 \u30d7\u30ed\u30f3\u30d7\u30c8\u3092\u30ad\u30e3\u30c3\u30b7\u30e5\u53ef\u80fd\u306a\u30d7\u30ec\u30d5\u30a3\u30c3\u30af\u30b9\u306b\u79fb\u52d5\u3057\u3001\u53d6\u5f97\u3057\u305f\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u3092\u5404\u30af\u30a8\u30ea\u306b\u95a2\u9023\u3059\u308b\u7bc4\u56f2\u306b\u30c8\u30ea\u30df\u30f3\u30b0\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Switch every request to the heaviest available model to maximize output quality, accepting that higher per-request inference cost compounds rather than addresses the dominant cost driver.","vi":"Chuy\u1ec3n m\u1ecdi y\u00eau c\u1ea7u sang m\u00f4 h\u00ecnh c\u00f3 s\u1eb5n n\u1eb7ng nh\u1ea5t \u0111\u1ec3 t\u1ed1i \u0111a h\u00f3a ch\u1ea5t l\u01b0\u1ee3ng \u0111\u1ea7u ra, ch\u1ea5p nh\u1eadn r\u1eb1ng chi ph\u00ed suy lu\u1eadn theo y\u00eau c\u1ea7u cao h\u01a1n s\u1ebd g\u1ed9p l\u1ea1i thay v\u00ec gi\u1ea3i quy\u1ebft tr\u00ecnh \u0111i\u1ec1u khi\u1ec3n chi ph\u00ed ch\u00ednh.","jp":"\u3059\u3079\u3066\u306e\u30ea\u30af\u30a8\u30b9\u30c8\u3092\u5229\u7528\u53ef\u80fd\u306a\u6700\u3082\u91cd\u3044\u30e2\u30c7\u30eb\u306b\u5207\u308a\u66ff\u3048\u3066\u3001\u51fa\u529b\u54c1\u8cea\u3092\u6700\u5927\u5316\u3057\u307e\u3059\u3002\u30ea\u30af\u30a8\u30b9\u30c8\u3054\u3068\u306e\u63a8\u8ad6\u30b3\u30b9\u30c8\u304c\u9ad8\u304f\u306a\u308b\u3068\u3001\u4e3b\u306a\u30b3\u30b9\u30c8\u8981\u56e0\u306b\u5bfe\u51e6\u3059\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u3055\u3089\u306b\u60aa\u5316\u3059\u308b\u3053\u3068\u3092\u53d7\u3051\u5165\u308c\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Option C addresses both components responsible for the excessive cost. Anthropic prompt caching allows stable, repeatedly submitted prompt material-such as system instructions, tool definitions, and reusable background information-to be placed in a consistent prefix. After that prefix is written to the cache, qualifying subsequent requests can reuse it at the lower cache-read cost instead of repeatedly processing the same content at the standard input-token rate.<br>Retrieval must be optimized separately. Supplying an entire document collection or excessively deep search results increases cost, c..."}},{"id":"ccarp-q078","n":78,"topic":4,"type":"mcq","stem":{"en":"You are defining transparency practices for a customer-facing assistant whose responses are materially shaped by AI. Which transparency practice most directly supports responsible deployment?","vi":"B\u1ea1n \u0111ang x\u00e1c \u0111\u1ecbnh c\u00e1c ph\u01b0\u01a1ng ph\u00e1p th\u1ef1c h\u00e0nh minh b\u1ea1ch cho tr\u1ee3 l\u00fd l\u00e0m vi\u1ec7c tr\u1ef1c ti\u1ebfp v\u1edbi kh\u00e1ch h\u00e0ng c\u00f3 ph\u1ea3n h\u1ed3i \u0111\u01b0\u1ee3c \u0111\u1ecbnh h\u00ecnh c\u1ee5 th\u1ec3 b\u1edfi AI. Bi\u1ec7n ph\u00e1p minh b\u1ea1ch n\u00e0o h\u1ed7 tr\u1ee3 tr\u1ef1c ti\u1ebfp nh\u1ea5t cho vi\u1ec7c tri\u1ec3n khai c\u00f3 tr\u00e1ch nhi\u1ec7m?","jp":"\u3042\u306a\u305f\u306f\u3001AI \u306b\u3088\u3063\u3066\u5b9f\u8cea\u7684\u306b\u5fdc\u7b54\u304c\u5f62\u6210\u3055\u308c\u308b\u9867\u5ba2\u5bfe\u5fdc\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u306e\u900f\u660e\u6027\u5b9f\u8df5\u3092\u5b9a\u7fa9\u3057\u3066\u3044\u307e\u3059\u3002 \u8cac\u4efb\u3042\u308b\u5c55\u958b\u3092\u6700\u3082\u76f4\u63a5\u7684\u306b\u30b5\u30dd\u30fc\u30c8\u3059\u308b\u900f\u660e\u6027\u306e\u5b9f\u8df5\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Misrepresent the AI's role in producing responses in order to make the assistant feel more trustworthy or more human, undermining informed user consent and organizational transparency.","vi":"Tr\u00ecnh b\u00e0y sai vai tr\u00f2 c\u1ee7a AI trong vi\u1ec7c \u0111\u01b0a ra ph\u1ea3n h\u1ed3i nh\u1eb1m l\u00e0m cho tr\u1ee3 l\u00fd c\u1ea3m th\u1ea5y \u0111\u00e1ng tin c\u1eady h\u01a1n ho\u1eb7c gi\u1ed1ng con ng\u01b0\u1eddi h\u01a1n, l\u00e0m suy y\u1ebfu s\u1ef1 \u0111\u1ed3ng \u00fd c\u1ee7a ng\u01b0\u1eddi d\u00f9ng v\u00e0 t\u00ednh minh b\u1ea1ch c\u1ee7a t\u1ed5 ch\u1ee9c.","jp":"\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u304c\u3088\u308a\u4fe1\u983c\u3067\u304d\u308b\u3001\u3088\u308a\u4eba\u9593\u7684\u3067\u3042\u308b\u3068\u611f\u3058\u3055\u305b\u308b\u305f\u3081\u306b\u3001\u5fdc\u7b54\u3092\u751f\u6210\u3059\u308b AI \u306e\u5f79\u5272\u3092\u8aa4\u3063\u3066\u4f1d\u3048\u3001\u30a4\u30f3\u30d5\u30a9\u30fc\u30e0\u30c9 \u30e6\u30fc\u30b6\u30fc\u306e\u540c\u610f\u3068\u7d44\u7e54\u306e\u900f\u660e\u6027\u3092\u640d\u306a\u3046\u3002"}},{"k":"B","t":{"en":"Refuse to answer any user question about how the responses were produced or whether AI was involved, treating the AI's role as confidential operational information.","vi":"T\u1eeb ch\u1ed1i tr\u1ea3 l\u1eddi b\u1ea5t k\u1ef3 c\u00e2u h\u1ecfi n\u00e0o c\u1ee7a ng\u01b0\u1eddi d\u00f9ng v\u1ec1 c\u00e1ch t\u1ea1o ra c\u00e1c c\u00e2u tr\u1ea3 l\u1eddi ho\u1eb7c li\u1ec7u AI c\u00f3 li\u00ean quan hay kh\u00f4ng, coi vai tr\u00f2 c\u1ee7a AI l\u00e0 th\u00f4ng tin v\u1eadn h\u00e0nh b\u00ed m\u1eadt.","jp":"\u5fdc\u7b54\u304c\u3069\u306e\u3088\u3046\u306b\u751f\u6210\u3055\u308c\u305f\u304b\u3001\u307e\u305f\u306f AI \u304c\u95a2\u4e0e\u3057\u3066\u3044\u308b\u304b\u3069\u3046\u304b\u306b\u95a2\u3059\u308b\u30e6\u30fc\u30b6\u30fc\u306e\u8cea\u554f\u3078\u306e\u56de\u7b54\u3092\u62d2\u5426\u3057\u3001AI \u306e\u5f79\u5272\u3092\u6a5f\u5bc6\u306e\u904b\u7528\u60c5\u5831\u3068\u3057\u3066\u6271\u3044\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Disclose AI involvement to end users in line with the organization's transparency policy and provide a documented path to reach a human when needed.","vi":"Ti\u1ebft l\u1ed9 s\u1ef1 tham gia c\u1ee7a AI cho ng\u01b0\u1eddi d\u00f9ng cu\u1ed1i theo ch\u00ednh s\u00e1ch minh b\u1ea1ch c\u1ee7a t\u1ed5 ch\u1ee9c v\u00e0 cung c\u1ea5p \u0111\u01b0\u1eddng d\u1eabn \u0111\u01b0\u1ee3c ghi l\u1ea1i \u0111\u1ec3 ti\u1ebfp c\u1eadn con ng\u01b0\u1eddi khi c\u1ea7n.","jp":"\u7d44\u7e54\u306e\u900f\u660e\u6027\u30dd\u30ea\u30b7\u30fc\u306b\u5f93\u3063\u3066 AI \u306e\u95a2\u4e0e\u3092\u30a8\u30f3\u30c9 \u30e6\u30fc\u30b6\u30fc\u306b\u958b\u793a\u3057\u3001\u5fc5\u8981\u306a\u3068\u304d\u306b\u4eba\u9593\u306b\u9023\u7d61\u3059\u308b\u305f\u3081\u306e\u6587\u66f8\u5316\u3055\u308c\u305f\u30d1\u30b9\u3092\u63d0\u4f9b\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Disclose AI involvement only to internal staff and operators while withholding that information from the end users whose interactions are materially shaped by the AI system.","vi":"Ch\u1ec9 ti\u1ebft l\u1ed9 s\u1ef1 tham gia c\u1ee7a AI cho nh\u00e2n vi\u00ean n\u1ed9i b\u1ed9 v\u00e0 ng\u01b0\u1eddi v\u1eadn h\u00e0nh \u0111\u1ed3ng th\u1eddi gi\u1eef k\u00edn th\u00f4ng tin \u0111\u00f3 v\u1edbi ng\u01b0\u1eddi d\u00f9ng cu\u1ed1i c\u00f3 t\u01b0\u01a1ng t\u00e1c \u0111\u01b0\u1ee3c \u0111\u1ecbnh h\u00ecnh c\u1ee5 th\u1ec3 b\u1edfi h\u1ec7 th\u1ed1ng AI.","jp":"AI \u306e\u95a2\u4e0e\u3092\u5185\u90e8\u30b9\u30bf\u30c3\u30d5\u3068\u30aa\u30da\u30ec\u30fc\u30bf\u30fc\u306b\u306e\u307f\u958b\u793a\u3057\u3001\u5bfe\u8a71\u304c\u5b9f\u8cea\u7684\u306b AI \u30b7\u30b9\u30c6\u30e0\u306b\u3088\u3063\u3066\u5f62\u6210\u3055\u308c\u308b\u30a8\u30f3\u30c9 \u30e6\u30fc\u30b6\u30fc\u306b\u306f\u305d\u306e\u60c5\u5831\u3092\u5dee\u3057\u63a7\u3048\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Responsible deployment requires users to receive an accurate representation of the system with which they are interacting. Option C provides that transparency while also establishing a practical escalation path.<br>Disclosure should be proportionate to the material role AI plays, expressed in language appropriate to the audience, and aligned with organizational policy and applicable regulatory obligations.<br>A documented human-contact route is important when the assistant cannot resolve an issue, produces a disputed result, encounters a high-impact exception, or handles a matter requiring human aut..."}},{"id":"ccarp-q079","n":79,"topic":4,"type":"mcq","stem":{"en":"An engineering organization is adopting Claude Code across 200 developers. A team lead proposes that AI- generated pull requests bypass standard code review for changes under 50 lines because small changes are considered low risk and review capacity is constrained. Which two Diligence-competency objections should you raise? (Select two.) Each correct answer presents part of the solution.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"M\u1ed9t t\u1ed5 ch\u1ee9c k\u1ef9 thu\u1eadt \u0111ang \u00e1p d\u1ee5ng Claude Code cho 200 nh\u00e0 ph\u00e1t tri\u1ec3n. Tr\u01b0\u1edfng nh\u00f3m \u0111\u1ec1 xu\u1ea5t r\u1eb1ng c\u00e1c y\u00eau c\u1ea7u k\u00e9o do AI t\u1ea1o ra s\u1ebd b\u1ecf qua vi\u1ec7c xem x\u00e9t m\u00e3 ti\u00eau chu\u1ea9n \u0111\u1ed1i v\u1edbi nh\u1eefng thay \u0111\u1ed5i d\u01b0\u1edbi 50 d\u00f2ng v\u00ec nh\u1eefng thay \u0111\u1ed5i nh\u1ecf \u0111\u01b0\u1ee3c coi l\u00e0 c\u00f3 r\u1ee7i ro th\u1ea5p v\u00e0 kh\u1ea3 n\u0103ng xem x\u00e9t b\u1ecb h\u1ea1n ch\u1ebf. B\u1ea1n n\u00ean n\u00eau ra hai ph\u1ea3n \u0111\u1ed1i n\u00e0o v\u1ec1 Si\u00eang n\u0103ng-n\u0103ng l\u1ef1c? (Ch\u1ecdn hai.) M\u1ed7i \u200b\u200bc\u00e2u tr\u1ea3 l\u1eddi \u0111\u00fang tr\u00ecnh b\u00e0y m\u1ed9t ph\u1ea7n c\u1ee7a gi\u1ea3i ph\u00e1p.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u3042\u308b\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0\u7d44\u7e54\u306f\u3001200 \u4eba\u306e\u958b\u767a\u8005\u306b\u30af\u30ed\u30fc\u30c9 \u30b3\u30fc\u30c9\u3092\u63a1\u7528\u3057\u3066\u3044\u307e\u3059\u3002\u30c1\u30fc\u30e0\u30ea\u30fc\u30c0\u30fc\u306f\u3001\u5c0f\u3055\u306a\u5909\u66f4\u306f\u30ea\u30b9\u30af\u304c\u4f4e\u3044\u3068\u307f\u306a\u3055\u308c\u3001\u30ec\u30d3\u30e5\u30fc\u80fd\u529b\u304c\u5236\u9650\u3055\u308c\u3066\u3044\u308b\u305f\u3081\u3001AI \u306b\u3088\u3063\u3066\u751f\u6210\u3055\u308c\u305f\u30d7\u30eb \u30ea\u30af\u30a8\u30b9\u30c8\u306f 50 \u884c\u672a\u6e80\u306e\u5909\u66f4\u306b\u3064\u3044\u3066\u306f\u6a19\u6e96\u306e\u30b3\u30fc\u30c9 \u30ec\u30d3\u30e5\u30fc\u3092\u30d0\u30a4\u30d1\u30b9\u3059\u308b\u3053\u3068\u3092\u63d0\u6848\u3057\u3066\u3044\u307e\u3059\u3002 \u52e4\u52c9\u80fd\u529b\u306b\u95a2\u3059\u308b\u7570\u8b70\u3092 2 \u3064\u63d0\u8d77\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u306e\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) \u305d\u308c\u305e\u308c\u306e\u6b63\u89e3\u306f\u3001\u89e3\u6c7a\u7b56\u306e\u4e00\u90e8\u3092\u793a\u3057\u3066\u3044\u307e\u3059\u3002  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Removing review eliminates the verification mechanism required for AI-generated output across the workflow.","vi":"Vi\u1ec7c x\u00f3a \u0111\u00e1nh gi\u00e1 s\u1ebd lo\u1ea1i b\u1ecf c\u01a1 ch\u1ebf x\u00e1c minh c\u1ea7n thi\u1ebft cho \u0111\u1ea7u ra do AI t\u1ea1o ra trong to\u00e0n b\u1ed9 quy tr\u00ecnh l\u00e0m vi\u1ec7c.","jp":"\u30ec\u30d3\u30e5\u30fc\u3092\u524a\u9664\u3059\u308b\u3068\u3001\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u5168\u4f53\u3067 AI \u306b\u3088\u3063\u3066\u751f\u6210\u3055\u308c\u305f\u51fa\u529b\u306b\u5fc5\u8981\u306a\u691c\u8a3c\u30e1\u30ab\u30cb\u30ba\u30e0\u304c\u6392\u9664\u3055\u308c\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Code-review capacity should be expanded to handle every code change submitted across the team.","vi":"N\u0103ng l\u1ef1c \u0111\u00e1nh gi\u00e1 m\u00e3 c\u1ea7n \u0111\u01b0\u1ee3c m\u1edf r\u1ed9ng \u0111\u1ec3 x\u1eed l\u00fd m\u1ecdi thay \u0111\u1ed5i m\u00e3 \u0111\u01b0\u1ee3c g\u1eedi trong nh\u00f3m.","jp":"\u30c1\u30fc\u30e0\u5168\u4f53\u3067\u63d0\u51fa\u3055\u308c\u305f\u3059\u3079\u3066\u306e\u30b3\u30fc\u30c9\u5909\u66f4\u3092\u51e6\u7406\u3067\u304d\u308b\u3088\u3046\u306b\u3001\u30b3\u30fc\u30c9\u30ec\u30d3\u30e5\u30fc\u306e\u80fd\u529b\u3092\u62e1\u5f35\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"C","t":{"en":"The threshold should be increased to 200 lines to capture more changes.","vi":"Ng\u01b0\u1ee1ng ph\u1ea3i \u0111\u01b0\u1ee3c t\u0103ng l\u00ean 200 d\u00f2ng \u0111\u1ec3 n\u1eafm b\u1eaft \u0111\u01b0\u1ee3c nhi\u1ec1u thay \u0111\u1ed5i h\u01a1n.","jp":"\u3088\u308a\u591a\u304f\u306e\u5909\u66f4\u3092\u30ad\u30e3\u30d7\u30c1\u30e3\u3059\u308b\u306b\u306f\u3001\u3057\u304d\u3044\u5024\u3092 200 \u884c\u306b\u5897\u3084\u3059\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"D","t":{"en":"AI-generated pull requests should be rejected by default across the organization.","vi":"C\u00e1c y\u00eau c\u1ea7u k\u00e9o do AI t\u1ea1o ra ph\u1ea3i b\u1ecb t\u1eeb ch\u1ed1i theo m\u1eb7c \u0111\u1ecbnh trong to\u00e0n t\u1ed5 ch\u1ee9c.","jp":"AI \u306b\u3088\u3063\u3066\u751f\u6210\u3055\u308c\u305f\u30d7\u30eb \u30ea\u30af\u30a8\u30b9\u30c8\u306f\u3001\u7d44\u7e54\u5168\u4f53\u3067\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u62d2\u5426\u3055\u308c\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Line count is a poor proxy for the actual risk introduced by a code change.","vi":"S\u1ed1 d\u00f2ng l\u00e0 m\u1ed9t \u0111\u1ea1i di\u1ec7n k\u00e9m cho r\u1ee7i ro th\u1ef1c t\u1ebf do thay \u0111\u1ed5i m\u00e3 g\u00e2y ra.","jp":"\u884c\u6570\u306f\u3001\u30b3\u30fc\u30c9\u5909\u66f4\u306b\u3088\u3063\u3066\u3082\u305f\u3089\u3055\u308c\u308b\u5b9f\u969b\u306e\u30ea\u30b9\u30af\u3092\u8868\u3059\u306b\u306f\u4e0d\u5341\u5206\u3067\u3059\u3002"}}],"answer":["A","E"],"multi":true,"explain":{"text":"AI-generated code requires verification through the same controlled engineering workflow as human-authored changes. Removing review eliminates the gate that can detect incorrect assumptions, security defects, missing tests, and unintended behavior. Line count is not a defensible risk measure: a one-line authorization change, dependency alteration, or command-execution defect can be more consequential than a large documentation update. Review requirements should instead be determined by affected components, privilege, data sensitivity, reversibility, test coverage, and deployment impact. Expand..."}},{"id":"ccarp-q080","n":80,"topic":4,"type":"mcq","stem":{"en":"You are defining an SLA for a Claude-based assistant. Which SLA definition is most operationally meaningful?","vi":"B\u1ea1n \u0111ang x\u00e1c \u0111\u1ecbnh SLA cho tr\u1ee3 l\u00fd d\u1ef1a tr\u00ean Claude. \u0110\u1ecbnh ngh\u0129a SLA n\u00e0o c\u00f3 \u00fd ngh\u0129a nh\u1ea5t v\u1ec1 m\u1eb7t ho\u1ea1t \u0111\u1ed9ng?","jp":"\u30af\u30ed\u30fc\u30c9\u30d9\u30fc\u30b9\u306e\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u306e SLA \u3092\u5b9a\u7fa9\u3057\u3066\u3044\u307e\u3059\u3002 \u904b\u7528\u4e0a\u6700\u3082\u610f\u5473\u306e\u3042\u308b SLA \u5b9a\u7fa9\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"A target tied to a stakeholder sentiment measure such as \"the team feels satisfied,\" which cannot be measured objectively or used to trigger a documented breach response.","vi":"M\u1ee5c ti\u00eau g\u1eafn li\u1ec1n v\u1edbi th\u01b0\u1edbc \u0111o c\u1ea3m t\u00ednh c\u1ee7a c\u00e1c b\u00ean li\u00ean quan, ch\u1eb3ng h\u1ea1n nh\u01b0 \"nh\u00f3m c\u1ea3m th\u1ea5y h\u00e0i l\u00f2ng\", kh\u00f4ng th\u1ec3 \u0111o l\u01b0\u1eddng m\u1ed9t c\u00e1ch kh\u00e1ch quan ho\u1eb7c \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng \u0111\u1ec3 k\u00edch ho\u1ea1t ph\u1ea3n h\u1ed3i vi ph\u1ea1m \u0111\u01b0\u1ee3c ghi l\u1ea1i.","jp":"\u300c\u30c1\u30fc\u30e0\u306f\u6e80\u8db3\u3057\u3066\u3044\u308b\u300d\u306a\u3069\u306e\u5229\u5bb3\u95a2\u4fc2\u8005\u306e\u611f\u60c5\u5c3a\u5ea6\u306b\u95a2\u9023\u4ed8\u3051\u3089\u308c\u305f\u76ee\u6a19\u3002\u5ba2\u89b3\u7684\u306b\u6e2c\u5b9a\u3057\u305f\u308a\u3001\u6587\u66f8\u5316\u3055\u308c\u305f\u9055\u53cd\u5bfe\u5fdc\u3092\u5f15\u304d\u8d77\u3053\u3059\u305f\u3081\u306b\u4f7f\u7528\u3057\u305f\u308a\u3059\u308b\u3053\u3068\u306f\u3067\u304d\u307e\u305b\u3093\u3002"}},{"k":"B","t":{"en":"A measurable target with a defined metric, threshold, evaluation window, and consequence for breach- for example, \"p95 per-request latency under 800 ms over a 28-day window.\"","vi":"M\u1ee5c ti\u00eau c\u00f3 th\u1ec3 \u0111o l\u01b0\u1eddng \u0111\u01b0\u1ee3c v\u1edbi ch\u1ec9 s\u1ed1, ng\u01b0\u1ee1ng, kho\u1ea3ng th\u1eddi gian \u0111\u00e1nh gi\u00e1 \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh v\u00e0 h\u1eadu qu\u1ea3 \u0111\u1ed1i v\u1edbi vi ph\u1ea1m - v\u00ed d\u1ee5: \"\u0111\u1ed9 tr\u1ec5 p95 cho m\u1ed7i y\u00eau c\u1ea7u d\u01b0\u1edbi 800 mili gi\u00e2y trong kho\u1ea3ng th\u1eddi gian 28 ng\u00e0y\".","jp":"\u5b9a\u7fa9\u3055\u308c\u305f\u30e1\u30c8\u30ea\u30af\u30b9\u3001\u3057\u304d\u3044\u5024\u3001\u8a55\u4fa1\u30a6\u30a3\u30f3\u30c9\u30a6\u3001\u304a\u3088\u3073\u9055\u53cd\u306e\u5f71\u97ff\u3092\u542b\u3080\u6e2c\u5b9a\u53ef\u80fd\u306a\u76ee\u6a19\u3002\u305f\u3068\u3048\u3070\u3001\u300c28 \u65e5\u9593\u306e\u30a6\u30a3\u30f3\u30c9\u30a6\u3067\u3001\u30ea\u30af\u30a8\u30b9\u30c8\u3042\u305f\u308a\u306e p95 \u30ec\u30a4\u30c6\u30f3\u30b7\u304c 800 \u30df\u30ea\u79d2\u672a\u6e80\u300d\u3002"}},{"k":"C","t":{"en":"A qualitative commitment such as \"the system will be fast and reliable,\" which names no metric, threshold, or evaluation window.","vi":"Cam k\u1ebft \u0111\u1ecbnh t\u00ednh ch\u1eb3ng h\u1ea1n nh\u01b0 \"h\u1ec7 th\u1ed1ng s\u1ebd nhanh v\u00e0 \u0111\u00e1ng tin c\u1eady\", kh\u00f4ng n\u00eau t\u00ean s\u1ed1 li\u1ec7u, ng\u01b0\u1ee1ng ho\u1eb7c kho\u1ea3ng th\u1eddi gian \u0111\u00e1nh gi\u00e1.","jp":"\u300c\u30b7\u30b9\u30c6\u30e0\u306f\u9ad8\u901f\u3067\u4fe1\u983c\u6027\u304c\u9ad8\u304f\u306a\u308a\u307e\u3059\u300d\u306a\u3069\u306e\u5b9a\u6027\u7684\u306a\u7d04\u675f\u3067\u3042\u308a\u3001\u6307\u6a19\u3001\u3057\u304d\u3044\u5024\u3001\u8a55\u4fa1\u30a6\u30a3\u30f3\u30c9\u30a6\u306f\u6307\u5b9a\u3055\u308c\u3066\u3044\u307e\u305b\u3093\u3002"}},{"k":"D","t":{"en":"A target that names the metric and threshold but omits the evaluation window and breach consequence, leaving compliance periods and remediation triggers undefined.","vi":"M\u1ee5c ti\u00eau n\u00eau t\u00ean ch\u1ec9 s\u1ed1 v\u00e0 ng\u01b0\u1ee1ng nh\u01b0ng b\u1ecf qua kho\u1ea3ng th\u1eddi gian \u0111\u00e1nh gi\u00e1 v\u00e0 h\u1eadu qu\u1ea3 vi ph\u1ea1m, khi\u1ebfn kho\u1ea3ng th\u1eddi gian tu\u00e2n th\u1ee7 v\u00e0 tr\u00ecnh k\u00edch ho\u1ea1t kh\u1eafc ph\u1ee5c kh\u00f4ng \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh.","jp":"\u30e1\u30c8\u30ea\u30c3\u30af\u3068\u3057\u304d\u3044\u5024\u3092\u6307\u5b9a\u3059\u308b\u30bf\u30fc\u30b2\u30c3\u30c8\u3067\u3059\u304c\u3001\u8a55\u4fa1\u30a6\u30a3\u30f3\u30c9\u30a6\u3068\u9055\u53cd\u306e\u7d50\u679c\u304c\u7701\u7565\u3055\u308c\u3001\u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\u671f\u9593\u3068\u4fee\u5fa9\u30c8\u30ea\u30ac\u30fc\u304c\u672a\u5b9a\u7fa9\u306e\u307e\u307e\u306b\u306a\u308a\u307e\u3059\u3002"}}],"answer":["B"],"multi":false,"explain":{"text":"An operational SLA must be objectively measurable and enforceable. Option B defines the metric, percentile, threshold, and observation window, allowing both parties to determine whether service performance complied with the agreement. A complete SLA also defines what follows a breach, such as escalation, remediation, service credits, capacity changes, or architectural review. Percentile latency is preferable to an average because it exposes degraded tail performance experienced by a meaningful portion of users. Anthropic provides usage, cost, and operational data that can support monitoring an..."}}]},{"n":5,"title":{"en":"Practice Set 5","vi":"B\u1ed9 \u0111\u1ec1 s\u1ed1 5","jp":"\u7df4\u7fd2\u554f\u984c 5"},"questions":[{"id":"ccarp-q081","n":81,"topic":5,"type":"mcq","stem":{"en":"A Claude architect is designing a HIPAA-compliant pipeline that processes patient records. Which two design decisions directly support HIPAA compliance requirements? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"M\u1ed9t ki\u1ebfn \u200b\u200btr\u00fac s\u01b0 Claude \u0111ang thi\u1ebft k\u1ebf m\u1ed9t quy tr\u00ecnh tu\u00e2n th\u1ee7 HIPAA \u0111\u1ec3 x\u1eed l\u00fd h\u1ed3 s\u01a1 b\u1ec7nh nh\u00e2n. Hai quy\u1ebft \u0111\u1ecbnh thi\u1ebft k\u1ebf n\u00e0o tr\u1ef1c ti\u1ebfp h\u1ed7 tr\u1ee3 c\u00e1c y\u00eau c\u1ea7u tu\u00e2n th\u1ee7 HIPAA? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u30af\u30ed\u30fc\u30c9 \u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306f\u3001\u60a3\u8005\u8a18\u9332\u3092\u51e6\u7406\u3059\u308b HIPAA \u6e96\u62e0\u306e\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u3092\u8a2d\u8a08\u3057\u3066\u3044\u307e\u3059\u3002 HIPAA \u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9\u8981\u4ef6\u3092\u76f4\u63a5\u30b5\u30dd\u30fc\u30c8\u3059\u308b 2 \u3064\u306e\u8a2d\u8a08\u4e0a\u306e\u6c7a\u5b9a\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Setting max_tokens to a low value to minimize the volume of text generated per request.","vi":"\u0110\u1eb7t max_tokens th\u00e0nh gi\u00e1 tr\u1ecb th\u1ea5p \u0111\u1ec3 gi\u1ea3m thi\u1ec3u kh\u1ed1i l\u01b0\u1ee3ng v\u0103n b\u1ea3n \u0111\u01b0\u1ee3c t\u1ea1o theo y\u00eau c\u1ea7u.","jp":"max_tokens \u3092\u4f4e\u3044\u5024\u306b\u8a2d\u5b9a\u3057\u3066\u3001\u30ea\u30af\u30a8\u30b9\u30c ft l\u1eadp nh\u00f3m \u0111\u1ec3 tri\u1ec3n khai M\u00e3 Claude trong m\u1ed9t t\u1ed5 ch\u1ee9c k\u1ef9 thu\u1eadt. Hai th\u1ef1c h\u00e0nh n\u00e0o thu\u1ed9c danh s\u00e1ch? (Ch\u1ecdn hai.) M\u1ed7i \u200b\u200bc\u00e2u tr\u1ea3 l\u1eddi \u0111\u00fang tr\u00ecnh b\u00e0y m\u1ed9t gi\u1ea3i ph\u00e1p ho\u00e0n ch\u1ec9nh.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u3042\u306a\u305f\u306f\u3001\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0\u7d44\u7e54\u5168\u4f53\u306b\u30af\u30ed\u30fc\u30c9 \u30b3\u30fc\u30c9\u3092\u5c55\u958b\u3059\u308b\u305f\u3081\u306e\u30c1\u30fc\u30e0\u8a2d\u5b9a\u306e\u5b9f\u8df5\u65b9\u6cd5\u3092\u307e\u3068\u3081\u3066\u3044\u307e\u3059\u3002 \u30ea\u30b9\u30c8\u306b\u542b\u307e\u308c\u308b 2 \u3064\u306e\u5b9f\u8df5\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) \u305d\u308c\u305e\u308c\u306e\u6b63\u89e3\u306f\u5b8c\u5168\u306a\u89e3\u6c7a\u7b56\u3092\u793a\u3057\u307e\u3059\u3002  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Use project scope for team-shared Model Context Protocol (MCP) servers and permission rules under version control.","vi":"S\u1eed d\u1ee5ng ph\u1ea1m vi d\u1ef1 \u00e1n cho c\u00e1c m\u00e1y ch\u1ee7 Giao th\u1ee9c b\u1ed1i c\u1ea3nh m\u00f4 h\u00ecnh (MCP) \u0111\u01b0\u1ee3c nh\u00f3m chia s\u1ebb v\u00e0 c\u00e1c quy t\u1eafc c\u1ea5p ph\u00e9p trong ki\u1ec3m so\u00e1t phi\u00ean b\u1ea3n.","jp":"\u30c1\u30fc\u30e0\u5171\u6709\u30e2\u30c7\u30eb \u30b3\u30f3\u30c6\u30ad\u30b9\u30c8 \u30d7\u30ed\u30c8\u30b3\u30eb (MCP) \u30b5\u30fc\u30d0\u30fc\u3068\u30d0\u30fc\u30b8\u30e7\u30f3\u7ba1\u7406\u4e0b\u306e\u6a29\u9650\u30eb\u30fc\u30eb\u306e\u30d7\u30ed\u30b8\u30a7\u30af\u30c8 \u30b9\u30b3\u30fc\u30d7\u3092\u4f7f\u7528\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Apply managed configuration centrally for security-critical settings that must not be overridden by individual engineers.","vi":"\u00c1p d\u1ee5ng t\u1eadp trung c\u1ea5 06e\u30a8\u30f3\u30b8\u30cb\u30a2\u304c\u4e00\u8cab\u3057\u305f\u30a2\u30af\u30bb\u30b9\u6a29\u3092\u5f97\u308b\u3053\u3068\u304c\u3067\u304d\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Use project scope for personal editor preferences so the preferences apply consistently within the project.","vi":"S\u1eed d\u1ee5ng ph\u1ea1m vi d\u1ef1 \u00e1n cho c\u00e1c t\u00f9y ch\u1ecdn bi\u00ean t\u1eadp c\u00e1 nh\u00e2n \u0111\u1ec3 c\u00e1c t\u00f9y ch\u1ecdn n\u00e0y \u0111\u01b0\u1ee3c \u00e1p d\u1ee5ng nh\u1ea5t qu\u00e1n trong d\u1ef1 \u00e1n.","jp":"\u500b\u4eba\u306e\u30a8\u30c7\u30a3\u30bf\u30fc\u8a2d\u5b9a\u306b\u30d7\u30ed\u30b8\u30a7\u30af\u30c8 \u30b9\u30b3\u30fc\u30d7\u3092\u4f7f\u7528\u3057\u3066\u3001\u8a2d\u5b9a\u304c\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u5185\u3067\u4e00\u8cab\u3057\u3066\u9069\u7528\u3055\u308c\u308b\u3088\u3046\u306b\u3057\u307e\u3059\u3002"}}],"answer":["A","B"],"multi":true,"explain":{"text":"Project scope is designed for repository-specific configuration shared through version control, including MCP server definitions, project permissions, hooks, and team instructions. This gives every contributor a consistent baseline while keeping changes reviewable. Managed configuration is appropriate for mandatory security and compliance controls because administrators can deploy it centrally and prevent lower scopes from overriding it. Local scope is machine-specific and unsuitable for organization-wide enforcement. User scope follows one engineer across projects, so it cannot guarantee that..."}},{"id":"ccarp-q084","n":84,"topic":5,"type":"mcq","stem":{"en":"You are reviewing a customer-support agent's configuration. Each candidate tool falls into one of four categories: (1) required to complete defined tasks, (2) frequently used and reduces handoffs, (3) occasionally useful for unrelated work, (4) speculative future utility. Which categories should typically remain in the agent configuration?","vi":"B\u1ea1n \u0111ang xem l\u1ea1i c\u1ea5u h\u00ecnh c\u1ee7a nh\u00e2n vi\u00ean h\u1ed7 tr\u1ee3 kh\u00e1ch h\u00e0ng. M\u1ed7i c\u00f4ng c\u1ee5 \u1ee9ng c\u1eed vi\u00ean thu\u1ed9c m\u1ed9t trong b\u1ed1n lo\u1ea1i: (1) c\u1ea7n thi\u1ebft \u0111\u1ec3 ho\u00e0n th\u00e0nh c\u00e1c nhi\u1ec7m v\u1ee5 \u0111\u00e3 x\u00e1c \u0111\u1ecbnh, (2) \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng th\u01b0\u1eddng xuy\u00ean v\u00e0 gi\u1ea3m thi\u1ec3u s\u1ef1 chuy\u1ec3n giao, (3) \u0111\u00f4i khi h\u1eefu \u00edch cho c\u00e1c c\u00f4ng vi\u1ec7c kh\u00f4ng li\u00ean quan, (4) ti\u1ec7n \u00edch \u0111\u1ea7u c\u01a1 trong t\u01b0\u01a1ng lai. Nh\u1eefng danh m\u1ee5c n\u00e0o th\u01b0\u1eddng n\u00ean c\u00f3 trong c\u1ea5u h\u00ecnh t\u1ed5ng \u0111\u00e0i vi\u00ean?","jp":"\u30ab\u30b9\u30bf\u30de\u30fc \u30b5\u30dd\u30fc\u30c8 \u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u69cb\u6210\u3092\u78ba\u8a8d\u3057\u3066\u3044\u307e\u3059\u3002\u5404\u5019\u88dc\u30c4\u30fc\u30eb\u306f 4 \u3064\u306e\u30ab\u30c6\u30b4\u30ea\u306e\u3044\u305a\u308c\u304b\u306b\u5206\u985e\u3055\u308c\u307e\u3059: (1) \u5b9a\u7fa9\u3055\u308c\u305f\u30bf\u30b9\u30af\u3092\u5b8c\u4e86\u3059\u308b\u305f\u3081\u306b\u5fc5\u8981\u3001(2) \u983b\u7e41\u306b\u4f7f\u7528\u3055\u308c\u30cf\u30f3\u30c9\u30aa\u30d5\u304c\u8efd\u6e1b\u3055\u308c\u308b\u3001(3) \u7121\u95a2\u4fc2\u306a\u4f5c\u696d\u306b\u6642\u6298\u5f79\u7acb\u3064\u3001(4) \u5c06\u6765\u306e\u63a8\u6e2c\u4e0a\u306e\u6709\u7528\u6027\u3002 \u901a\u5e38\u3001\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u69cb\u6210\u306b\u6b8b\u3059\u3079\u304d\u30ab\u30c6\u30b4\u30ea\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Only category 3, because occasionally useful tools for unrelated work provide broader coverage and should take priority over tools required for the agent's defined tasks.","vi":"Ch\u1ec9 lo\u1ea1i 3, v\u00ec \u0111\u00f4i khi c\u00e1c c\u00f4ng c\u1ee5 h\u1eefu \u00edch cho c\u00f4ng vi\u1ec7c kh\u00f4ng li\u00ean quan cung c\u1ea5p ph\u1ea1m vi bao qu\u00e1t r\u1ed9ng h\u01a1n v\u00e0 ph\u1ea3i \u0111\u01b0\u1ee3c \u01b0u ti\u00ean h\u01a1n c\u00e1c c\u00f4ng c\u1ee5 c\u1ea7n thi\u1ebft cho c\u00e1c nhi\u1ec7m v\u1ee5 \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh c\u1ee7a t\u1ed5ng \u0111\u00e0i vi\u00ean.","jp":"\u30ab\u30c6\u30b4\u30ea 3 \u306e\u307f\u3002\u7121\u95a2\u4fc2\u306a\u4f5c\u696d\u306b\u5f79\u7acb\u3064\u30c4\u30fc\u30eb\u304c\u3088\u308a\u5e83\u7bc4\u56f2\u306b\u9069\u7528\u3055\u308c\u308b\u5834\u5408\u304c\u3042\u308a\u3001\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u5b9a\u7fa9\u3055\u308c\u305f\u30bf\u30b9\u30af\u306b\u5fc5\u8981\u306a\u30c4\u30fc\u30eb\u3088\u308a\u3082\u512a\u5148\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u305f\u3081\u3067\u3059\u3002"}},{"k":"B","t":{"en":"Only category 4, because speculative future-utility tools provide the most flexibility and should be configured even when no defined task currently requires them.","vi":"Ch\u1ec9 lo\u1ea1i 4, v\u00ec c\u00e1c c\u00f4ng c\u1ee5 ti\u1ec7n \u00edch t\u01b0\u01a1ng lai mang t\u00ednh suy \u0111o\u00e1n mang l\u1ea1i t\u00ednh linh ho\u1ea1t cao nh\u1ea5t v\u00e0 ph\u1ea3i \u0111\u01b0\u1ee3c \u0111\u1ecbnh c\u1ea5u h\u00ecnh ngay c\u1ea3 khi hi\u1ec7n t\u1ea1i kh\u00f4ng c\u00f3 t\u00e1c v\u1ee5 x\u00e1c \u0111\u1ecbnh n\u00e0o y\u00eau c\u1ea7u ch\u00fang.","jp":"\u30ab\u30c6\u30b4\u30ea 4 \u306e\u307f\u3002\u6295\u6a5f\u7684\u5c06\u6765\u30e6\u30fc\u30c6\u30a3\u30ea\u30c6\u30a3 \u30c4\u30fc\u30eb\u306f\u6700\u3082\u67d4\u8edf\u6027\u304c\u9ad8\u304f\u3001\u73fe\u5728\u305d\u308c\u3089\u3092\u5fc5\u8981\u3068\u3059\u308b\u5b9a\u7fa9\u6e08\u307f\u30bf\u30b9\u30af\u304c\u306a\u3044\u5834\u5408\u3067\u3082\u69cb\u6210\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u305f\u3081\u3067\u3059\u3002"}},{"k":"C","t":{"en":"Categories 1 and 2 only, because they map to defined tasks and the agent's regular hand-offs.","vi":"Ch\u1ec9 lo\u1ea1i 1 v\u00e0 2, v\u00ec ch\u00fang \u00e1nh x\u1ea1 t\u1edbi c\u00e1c nhi\u1ec7m v\u1ee5 \u0111\u00e3 x\u00e1c \u0111\u1ecbnh v\u00e0 s\u1ef1 chuy\u1ec3n giao th\u01b0\u1eddng xuy\u00ean c\u1ee7a t\u1ed5ng \u0111\u00e0i vi\u00ean.","jp":"\u30ab\u30c6\u30b4\u30ea 1 \u3068 2 \u306e\u307f\u3002\u5b9a\u7fa9\u3055\u308c\u305f\u30bf\u30b9\u30af\u3068\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u901a\u5e38\u306e\u5f15\u304d\u7d99\u304e\u306b\u30de\u30c3\u30d7\u3055\u308c\u308b\u305f\u3081\u3067\u3059\u3002"}},{"k":"D","t":{"en":"All four categories, because broader tool access is categorically better for agent performance regardless of whether the tools map to defined tasks or regular hand-offs.","vi":"T\u1ea5t c\u1ea3 b\u1ed1n lo\u1ea1i, b\u1edfi v\u00ec kh\u1ea3 n\u0103ng truy c\u1eadp c\u00f4ng c\u1ee5 r\u1ed9ng h\u01a1n v\u1ec1 m\u1eb7t ph\u00e2n lo\u1ea1i s\u1ebd t\u1ed1t h\u01a1n cho hi\u1ec7u su\u1ea5t c\u1ee7a t\u00e1c nh\u00e2n b\u1ea5t k\u1ec3 c\u00f4ng c\u1ee5 \u0111\u00f3 c\u00f3 \u00e1nh x\u1ea1 t\u1edbi c\u00e1c nhi\u1ec7m v\u1ee5 \u0111\u00e3 x\u00e1c \u0111\u1ecbnh hay chuy\u1ec3n giao th\u00f4ng th\u01b0\u1eddng hay kh\u00f4ng.","jp":"4 \u3064\u306e\u30ab\u30c6\u30b4\u30ea\u3059\u3079\u3066\u3002\u30c4\u30fc\u30eb\u304c\u5b9a\u7fa9\u3055\u308c\u305f\u30bf\u30b9\u30af\u306b\u30de\u30c3\u30d7\u3055\u308c\u3066\u3044\u308b\u304b\u3001\u901a\u5e38\u306e\u5f15\u304d\u7d99\u304e\u306b\u30de\u30c3\u30d7\u3055\u308c\u3066\u3044\u308b\u304b\u306b\u95a2\u4fc2\u306a\u304f\u3001\u30c4\u30fc\u30eb\u3078\u306e\u30a2\u30af\u30bb\u30b9\u304c\u5e83\u7bc4\u3067\u3042\u308b\u65b9\u304c\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306e\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9\u304c\u65ad\u7136\u5411\u4e0a\u3059\u308b\u305f\u3081\u3067\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Category 1 tools are necessary for the agent to complete its approved responsibilities and must remain.<br>Category 2 tools are also justified when they are regularly used and eliminate predictable hand-offs without expanding the agent beyond its defined operating role.<br>Categories 3 and 4 create capability bloat. A tool that is occasionally useful only for unrelated work does not belong to this agent's responsibility boundary. A speculative tool has no validated requirement and adds attack surface, context consumption, authorization complexity, evaluation burden, and operational dependencies with..."}},{"id":"ccarp-q085","n":85,"topic":5,"type":"mcq","stem":{"en":"You are documenting an architectural decision to support future audit and onboarding. Which artifact is the strongest fit?","vi":"B\u1ea1n \u0111ang ghi l\u1ea1i m\u1ed9t quy\u1ebft \u0111\u1ecbnh v\u1ec1 ki\u1ebfn \u200b\u200btr\u00fac \u0111\u1ec3 h\u1ed7 tr\u1ee3 qu\u00e1 tr\u00ecnh ki\u1ec3m tra v\u00e0 tri\u1ec3n khai trong t\u01b0\u01a1ng lai. Hi\u1ec7n v\u1eadt n\u00e0o ph\u00f9 h\u1ee3p nh\u1ea5t?","jp":"\u3042\u306a\u305f\u306f\u3001\u5c06\u6765\u306e\u76e3\u67fb\u3068\u30aa\u30f3\u30dc\u30fc\u30c7\u30a3\u30f3\u30b0\u3092\u30b5\u30dd\u30fc\u30c8\u3059\u308b\u305f\u3081\u306e\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u4e0a\u306e\u6c7a\u5b9a\u3092\u6587\u66f8\u5316\u3057\u3066\u3044\u307e\u3059\u3002 \u3069\u306e\u30a2\u30fc\u30c6\u30a3\u30d5\u30a1\u30af\u30c8\u304c\u6700\u3082\u9069\u5408\u3057\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"A slide deck in a presentation folder with no accompanying written rationale.","vi":"M\u1ed9t b\u1ea3n tr\u00ecnh b\u00e0y trong m\u1ed9t th\u01b0 m\u1ee5c thuy\u1ebft tr\u00ecnh kh\u00f4ng c\u00f3 l\u00fd do b\u1eb1ng v\u0103n b\u1ea3n k\u00e8m theo.","jp":"\u30d7\u30ec\u30bc\u30f3\u30c6\u30fc\u30b7\u30e7\u30f3 \u30d5\u30a9\u30eb\u30c0\u30fc\u5185\u306e\u30b9\u30e9\u30a4\u30c9 \u30c7\u30c3\u30ad\u3002\u6839\u62e0\u304c\u66f8\u304b\u308c\u3066\u3044\u306a\u3044\u3002"}},{"k":"B","t":{"en":"A code comment in a single file that contains an opinion of one engineer.","vi":"M\u1ed9t nh\u1eadn x\u00e9t v\u1ec1 m\u00e3 trong m\u1ed9t t\u1ec7p ch\u1ee9a \u00fd ki\u1ebfn \u200b\u200bc\u1ee7a m\u1ed9t k\u1ef9 s\u01b0.","jp":"1 \u4eba\u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u306e  reviewer can trace why a model, integration patt..."}},{"id":"ccarp-q086","n":86,"topic":5,"type":"mcq","stem":{"en":"During an architectural review, the security team identifies a risk that adversarial content injected into retrieved documents could manipulate the model's behavior. Which mitigation most directly addresses this threat?","vi":"Trong qu\u00e1 tr\u00ecnh \u0111\u00e1nh gi\u00e1 ki\u1ebfn \u200b\u200btr\u00fac, nh\u00f3m b\u1ea3o m\u1eadt x\u00e1c \u0111\u1ecbnh nguy c\u01a1 n\u1ed9i dung \u0111\u1ed1i ngh\u1ecbch \u0111\u01b0\u1ee3c \u0111\u01b0a v\u00e0o t\u00e0i li\u1ec7u \u0111\u01b0\u1ee3c truy xu\u1ea5t c\u00f3 th\u1ec3 thao t\u00fang h\u00e0nh vi c\u1ee7a m\u00f4 h\u00ecnh. Bi\u1ec7n ph\u00e1p gi\u1ea3m thi\u1ec3u n\u00e0o gi\u1ea3i quy\u1ebft tr\u1ef1c ti\u1ebfp nh\u1ea5t m\u1ed1i \u0111e d\u1ecda n\u00e0y?","jp":"\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3 \u30c1\u30fc\u30e0\u306f\u3001\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u306e\u30ec\u30d3\u30e5\u30fc\u4e2d\u306b\u3001\u53d6\u5f97\u3057\u305f\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u306b\u633f\u5165\u3055\u308c\u305f\u6575\u5bfe\u7684\u306a\u30b3\u30f3\u30c6\u30f3\u30c4\u306b\u3088\u3063\u3066\u30e2\u30c7\u30eb\u306e\u52d5\u4f5c\u304c\u64cd\u4f5c\u3055\u308c\u308b\u53ef\u80fd\u6027\u304c\u3042\u308b\u30ea\u30b9\u30af\u3092\u7279\u5b9a\u3057\u307e\u3057\u305f\u3002 \u3053\u306e\u8105\u5a01\u306b\u6700\u3082\u76f4\u63a5\u7684\u306b\u5bfe\u51e6\u3059\u308b\u7de9\u548c\u7b56\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Treat all retrieved content as untrusted input and apply input classifiers with output validation.","vi":"H\u00e3y coi t\u1ea5t c\u1ea3 n\u1ed9i dung \u0111\u01b0\u1ee3c truy xu\u1ea5t l\u00e0 d\u1eef li\u1ec7u \u0111\u1ea7u v\u00e0o kh\u00f4ng \u0111\u00e1ng tin c\u1eady v\u00e0 \u00e1p d\u1ee5ng b\u1ed9 ph\u00e2n lo\u1ea1i \u0111\u1ea7u v\u00e0o c\u00f9ng v\u1edbi x\u00e1c th\u1ef1c \u0111\u1ea7u ra.","jp":"\u53d6\u5f97\u3055\u308c\u305f\u3059\u3079\u3066\u306e
