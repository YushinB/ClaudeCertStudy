\u306e\u63a8\u5968\u4e8b\u9805\u3092\u63d0\u793a\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002 \u5404\u5229\u5bb3\u95a2\u4fc2\u8005\u306f\u3001\u610f\u601d\u6c7a\u5b9a\u306e\u3055\u307e\u3056\u307e\u306a\u5074\u9762\u3092\u8003\u616e\u3057\u307e\u3059\u3002 \u63a8\u5968\u6587\u66f8\u306f\u3069\u306e\u3088\u3046\u306b\u69cb\u6210\u3059\u308c\u3070\u3088\u3044\u3067\u3057\u3087\u3046\u304b?"},"options":[{"k":"A","t":{"en":"Lead with the technical architecture diagram and the full component list before any other section.","vi":"D\u1eabn \u0111\u1ea7u b\u1eb1ng s\u01a1 \u0111\u1ed3 ki\u1ebfn \u200b\u200btr\u00fac k\u1ef9 thu\u1eadt v\u00e0 danh s\u00e1ch th\u00e0nh ph\u1ea7n \u0111\u1ea7y \u0111\u1ee7 tr\u01b0\u1edbc b\u1ea5t k\u1ef3 ph\u1ea7n n\u00e0o kh\u00e1c.","jp":"\u4ed6\u306e\u30bb\u30af\u30b7\u30e7\u30f3\u306e\u524d\u306b\u3001\u6280\u8853\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u56f3\u3068\u5b8c\u5168\u306a\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u306e\u30ea\u30b9\u30c8\u3092\u7406\u89e3\u3057\u3066\u304f\u3060\u3055\u3044\u3002"}},{"k":"B","t":{"en":"Lead with detailed cost projections across the full multi-year horizon before the rationale section.","vi":"D\u1eabn \u0111\u1ea7u v\u1edbi c\u00e1c d\u1ef1 b\u00e1o chi ph\u00ed chi ti\u1ebft trong to\u00e0n b\u1ed9 th\u1eddi gian nhi\u1ec1u n\u0103m tr\u01b0\u1edbc ph\u1ea7n l\u00fd do.","jp":"\u7406\u8ad6\u7684\u6839\u62e0\u306e\u30bb\u30af\u30b7\u30e7\u30f3\u306e\u524d\u306b\u3001\u8907\u6570\u5e74\u306b\u308f\u305f\u308b\u8a73\u7d30\u306a\u30b3\u30b9\u30c8\u4e88\u6e2c\u3092\u793a\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Present the same dense narrative throughout with no stakeholder differentiation in any section.","vi":"Tr\u00ecnh b\u00e0y c\u00f9ng m\u1ed9t c\u00e2u chuy\u1ec7n d\u00e0y \u0111\u1eb7c xuy\u00ean su\u1ed1t m\u00e0 kh\u00f4ng c\u00f3 s\u1ef1 ph\u00e2n bi\u1ec7t c\u00e1c b\u00ean li\u00ean quan trong b\u1ea5t k\u1ef3 ph\u1ea7n n\u00e0o.","jp":"\u3069\u306e\u30bb\u30af\u30b7\u30e7\u30f3\u3067\u3082\u95a2\u4fc2\u8005\u3092\u533a\u5225\u305b\u305a\u306b\u3001\u4e00\u8cab\u3057\u3066\u540c\u3058\u5bc6\u5ea6\u306e\u9ad8\u3044\u7269\u8a9e\u3092\u63d0\u793a\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Lead with the architectural decision, then address each stakeholder's primary concerns directly.","vi":"D\u1eabn \u0111\u1ea7u v\u1edbi quy\u1ebft \u0111\u1ecbnh v\u1ec1 ki\u1ebfn \u200b\u200btr\u00fac, sau \u0111\u00f3 gi\u1ea3i quy\u1ebft tr\u1ef1c ti\u1ebfp m\u1ed1i quan t\u00e2m ch\u00ednh c\u1ee7a t\u1eebng b\u00ean li\u00ean quan.","jp":"\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u4e0a\u306e\u6c7a\u5b9a\u3092\u4e3b\u5c0e\u3057\u3001\u5404\u95a2\u4fc2\u8005\u306e\u4e3b\u306a\u61f8\u5ff5\u4e8b\u9805\u306b\u76f4\u63a5\u5bfe\u51e6\u3057\u307e\u3059\u3002"}}],"answer":["D"],"multi":false,"explain":{"text":"A steering committee needs an answer-first recommendation that states the proposed architectural decision, the business outcome it supports, and the approval or action required. After establishing that common decision frame, the document should address each stakeholder's concerns separately.<br>The CFO requires implementation and operating costs, expected savings, consumption assumptions, financial exposure, and cost-control mechanisms. General counsel needs evidence concerning confidentiality, privilege, data handling, human legal review, explainability, retention, and regulatory risk. The CIO n..."}},{"id":"ccarp-q089","n":89,"topic":5,"type":"mcq","stem":{"en":"You are compiling a diagnostic toolkit for Claude Code operational issues. Which two diagnostic actions belong in the toolkit? (Select two.) Each correct answer presents a complete solution.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"B\u1ea1n \u0111ang bi\u00ean so\u1ea1n b\u1ed9 c\u00f4ng c\u1ee5 ch\u1ea9n \u0111o\u00e1n cho c\u00e1c v\u1ea5n \u0111\u1ec1 v\u1eadn h\u00e0nh c\u1ee7a M\u00e3 Claude. Hai h\u00e0nh \u0111\u1ed9ng ch\u1ea9n \u0111o\u00e1n n\u00e0o thu\u1ed9c v\u1ec1 b\u1ed9 c\u00f4ng c\u1ee5? (Ch\u1ecdn hai.) M\u1ed7i \u200b\u200bc\u00e2u tr\u1ea3 l\u1eddi \u0111\u00fang tr\u00ecnh b\u00e0y m\u1ed9t gi\u1ea3i ph\u00e1p ho\u00e0n ch\u1ec9nh.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u30af\u30ed\u30fc\u30c9 \u30b3\u30fc\u30c9\u306e\u904b\u7528\u4e0a\u306e\u554f\u984c\u306b\u5bfe\u3059\u308b\u8a3a\u65ad\u30c4\u30fc\u30eb\u30ad\u30c3\u30c8\u3092\u30b3\u30f3\u30d1\u30a4\u30eb\u3057\u3066\u3044\u307e\u3059\u3002 \u30c4\u30fc\u30eb\u30ad\u30c3\u30c8\u306b\u542b\u307e\u308c\u308b 2 \u3064\u306e\u8a3a\u65ad\u30a2\u30af\u30b7\u30e7\u30f3\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) \u305d\u308c\u305e\u308c\u306e\u6b63\u89e3\u306f\u5b8c\u5168\u306a\u89e3\u6c7a\u7b56\u3092\u793a\u3057\u307e\u3059\u3002  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Increase the model sampling temperature so that intermittent issues surface more frequently for analysis.","vi":"T\u0103ng nhi\u1ec7t \u0111\u1ed9 l\u1ea5y m\u1eabu m\u00f4 h\u00ecnh \u0111\u1ec3 c\u00e1c v\u1ea5n \u0111\u1ec1 gi\u00e1n \u0111o\u1ea1n xu\u1ea5t hi\u1ec7n th\u01b0\u1eddng xuy\u00ean h\u01a1n khi ph\u00e2n t\u00edch.","jp":"\u30e2\u30c7\u30eb\u306e\u30b5\u30f3\u30d7\u30ea\u30f3\u30b0\u6e29\u5ea6\u3092\u4e0a\u3052\u3066\u3001\u65ad\u7d9a\u7684\u306a\u554f\u984c\u304c\u3088\u308a\u983b\u7e41\u306b\u8868\u9762\u5316\u3057\u3066\u89e3\u6790\u3067\u304d\u308b\u3088\u3046\u306b\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"File a support ticket with vendor support before any local reproduction or evidence collection.","vi":"G\u1eedi phi\u1ebfu h\u1ed7 tr\u1ee3 v\u1edbi b\u1ed9 ph\u1eadn h\u1ed7 tr\u1ee3 c\u1ee7a nh\u00e0 cung c\u1ea5p tr\u01b0\u1edbc khi sao ch\u00e9p ho\u1eb7c thu th\u1eadp b\u1eb1ng ch\u1ee9ng t\u1ea1i \u0111\u1ecba ph\u01b0\u01a1ng.","jp":"\u30ed\u30fc\u30ab\u30eb\u3067\u8907\u88fd\u307e\u305f\u306f\u8a3c\u62e0\u3092\u53ce\u96c6\u3059\u308b\u524d\u306b\u3001\u30d9\u30f3\u30c0\u30fc \u30b5\u30dd\u30fc\u30c8\u306b\u30b5\u30dd\u30fc\u30c8 \u30c1\u30b1\u30c3\u30c8\u3092\u63d0\u51fa\u3057\u3066\u304f\u3060\u3055\u3044\u3002"}},{"k":"C","t":{"en":"Reproduce the issue with a minimal reproduction case that isolates one variable at a time.","vi":"T\u00e1i t\u1ea1o s\u1ef1 c\u1ed1 b\u1eb1ng tr\u01b0\u1eddng h\u1ee3p t\u00e1i t\u1ea1o t\u1ed1i thi\u1ec3u nh\u1eb1m t\u00e1ch bi\u1ec7t m\u1ed9t bi\u1ebfn t\u1ea1i m\u1ed9t th\u1eddi \u0111i\u1ec3m.","jp":"\u4e00\u5ea6\u306b 1 \u3064\u306e\u5909\u6570\u3092\u5206\u96e2\u3059\u308b\u6700\u5c0f\u9650\u306e\u518d\u73fe\u30b1\u30fc\u30b9\u3067\u554f\u984c\u3092\u518d\u73fe\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Roll back to the previous Claude Code version immediately to confirm whether the issue is version specific.","vi":"Quay l\u1ea1i phi\u00ean b\u1ea3n Claude Code tr\u01b0\u1edbc \u0111\u00f3 ngay l\u1eadp t\u1ee9c \u0111\u1ec3 x\u00e1c nh\u1eadn xem s\u1ef1 c\u1ed1 c\u00f3 ph\u1ea3i l\u00e0 phi\u00ean b\u1ea3n c\u1ee5 th\u1ec3 hay kh\u00f4ng.","jp":"\u3059\u3050\u306b\u4ee5\u524d\u306e\u30af\u30ed\u30fc\u30c9 \u30b3\u30fc\u30c9 \u30d0\u30fc\u30b8\u30e7\u30f3\u306b\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u3057\u3066\u3001\u554f\u984c\u304c\u30d0\u30fc\u30b8\u30e7\u30f3\u56fa\u6709\u306e\u3082\u306e\u3067\u3042\u308b\u304b\u3069\u3046\u304b\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002"}},{"k":"E","t":{"en":"List the configured Model Context Protocol (MCP) servers and inspect server status to identify connection failures.","vi":"Li\u1ec7t k\u00ea c\u00e1c m\u00e1y ch\u1ee7 Giao th\u1ee9c b\u1ed1i c\u1ea3nh m\u00f4 h\u00ecnh (MCP) \u0111\u00e3 \u0111\u1ecbnh c\u1ea5u h\u00ecnh v\u00e0 ki\u1ec3m tra tr\u1ea1ng th\u00e1i m\u00e1y ch\u1ee7 \u0111\u1ec3 x\u00e1c \u0111\u1ecbnh l\u1ed7i k\u1ebft n\u1ed1i.","jp":"\u69cb\u6210\u3055\u308c\u305f\u30e2\u30c7\u30eb \u30b3\u30f3\u30c6\u30ad\u30b9\u30c8 \u30d7\u30ed\u30c8\u30b3\u30eb (MCP) \u30b5\u30fc\u30d0\u30fc\u3092\u4e00\u89a7\u8868\u793a\u3057\u3001\u30b5\u30fc\u30d0\u30fc\u306e\u30b9\u30c6\u30fc\u30bf\u30b9\u3092\u691c\u67fb\u3057\u3066\u63a5\u7d9a\u30a8\u30e9\u30fc\u3092\u7279\u5b9a\u3057\u307e\u3059\u3002"}}],"answer":["C","E"],"multi":true,"explain":{"text":"A minimal reproduction and MCP status inspection are foundational diagnostic actions because they produce direct, interpretable evidence. A minimal reproduction removes unrelated prompts, tools, settings, hooks, and repository state while changing one variable at a time. This determines whether the failure follows a particular configuration, server, command, model request, or project artifact. It also creates a reproducible evidence package if escalation later becomes necessary.<br>MCP inspection addresses a common Claude Code failure domain. `claude mcp list` displays configured servers and thei..."}},{"id":"ccarp-q090","n":90,"topic":5,"type":"mcq","stem":{"en":"A Claude Architect is reviewing a post-deployment performance report for an AI-assisted legal-document summarization system. The report includes these observations: * Average summarization time decreased from 47 minutes to 6 minutes per document. * Associates spend less time on summaries, but overall billable output has not measurably changed. * Infrastructure costs increased by 22% because redundant retry logic generated additional API calls. * Some summaries require attorney correction, adding an average of 8 minutes of review per document. Which analysis correctly attributes each observation to the appropriate business-value pillar?","vi":"Ki\u1ebfn tr\u00fac s\u01b0 Claude \u0111ang xem x\u00e9t b\u00e1o c\u00e1o hi\u1ec7u su\u1ea5t sau tri\u1ec3n khai cho h\u1ec7 th\u1ed1ng t\u00f3m t\u1eaft t\u00e0i li\u1ec7u ph\u00e1p l\u00fd \u0111\u01b0\u1ee3c h\u1ed7 tr\u1ee3 b\u1edfi AI. B\u00e1o c\u00e1o bao g\u1ed3m nh\u1eefng quan s\u00e1t sau: * Th\u1eddi gian t\u00f3m t\u1eaft trung b\u00ecnh gi\u1ea3m t\u1eeb 47 ph\u00fat xu\u1ed1ng c\u00f2n 6 ph\u00fat/t\u00e0i li\u1ec7u. * C\u00e1c c\u1ed9ng s\u1ef1 d\u00e0nh \u00edt th\u1eddi gian h\u01a1n cho vi\u1ec7c t\u00f3m t\u1eaft, nh\u01b0ng t\u1ed5ng s\u1ea3n l\u01b0\u1ee3ng c\u00f3 th\u1ec3 l\u1eadp h\u00f3a \u0111\u01a1n kh\u00f4ng thay \u0111\u1ed5i \u0111\u00e1ng k\u1ec3. * Chi ph\u00ed c\u01a1 s\u1edf h\u1ea1 t\u1ea7ng t\u0103ng 22% do logic th\u1eed l\u1ea1i d\u01b0 th\u1eeba t\u1ea1o ra c\u00e1c l\u1ec7nh g\u1ecdi API b\u1ed5 sung. * M\u1ed9t s\u1ed1 b\u1ea3n t\u00f3m t\u1eaft y\u00eau c\u1ea7u lu\u1eadt s\u01b0 ch\u1ec9nh s\u1eeda, th\u00eam trung b\u00ecnh 8 ph\u00fat xem x\u00e9t cho m\u1ed7i t\u00e0i li\u1ec7u. Ph\u00e2n t\u00edch n\u00e0o quy \u0111\u1ecbnh ch\u00ednh x\u00e1c t\u1eebng quan s\u00e1t cho tr\u1ee5 c\u1ed9t gi\u00e1 tr\u1ecb kinh doanh th\u00edch h\u1ee3p?","jp":"\u30af\u30ed\u30fc\u30c9 \u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306f\u3001AI \u652f\u63f4\u306e\u6cd5\u7684\u6587\u66f8\u8981\u7d04\u30b7\u30b9\u30c6\u30e0\u306e\u5c0e\u5165\u5f8c\u306e\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9 \u30ec\u30dd\u30fc\u30c8\u3092\u30ec\u30d3\u30e5\u30fc\u3057\u3066\u3044\u307e\u3059\u3002\u30ec\u30dd\u30fc\u30c8\u306b\u306f\u6b21\u306e\u3088\u3046\u306a\u89b3\u5bdf\u7d50\u679c\u304c\u542b\u307e\u308c\u3066\u3044\u307e\u3059\u3002 * \u5e73\u5747\u8981\u7d04\u6642\u9593\u306f\u3001\u6587\u66f8\u3042\u305f\u308a 47 \u5206\u304b\u3089 6 \u5206\u306b\u77ed\u7e2e\u3055\u308c\u307e\u3057\u305f\u3002 * \u5f93\u696d\u54e1\u304c\u8981\u7d04\u306b\u8cbb\u3084\u3059\u6642\u9593\u306f\u6e1b\u308a\u307e\u3057\u305f\u304c\u3001\u8acb\u6c42\u5bfe\u8c61\u3068\u306a\u308b\u5168\u4f53\u7684\u306a\u751f\u7523\u9ad8\u306f\u76ee\u306b\u898b\u3048\u308b\u307b\u3069\u5909\u5316\u3057\u3066\u3044\u307e\u305b\u3093\u3002 * \u5197\u9577\u306a\u518d\u8a66\u884c\u30ed\u30b8\u30c3\u30af\u306b\u3088\u308a\u8ffd\u52a0\u306e API \u547c\u3073\u51fa\u3057\u304c\u751f\u6210\u3055\u308c\u305f\u305f\u3081\u3001\u30a4\u30f3\u30d5\u30e9\u30b9\u30c8\u30e9\u30af\u30c1\u30e3\u306e\u30b3\u30b9\u30c8\u304c 22% \u5897\u52a0\u3057\u307e\u3057\u305f\u3002 * \u4e00\u90e8\u306e\u8981\u7d04\u3067\u306f\u5f01\u8b77\u58eb\u306b\u3088\u308b\u4fee\u6b63\u304c\u5fc5\u8981\u3068\u306a\u308a\u3001\u6587\u66f8\u3054\u3068\u306b\u5e73\u5747 8 \u5206\u306e\u30ec\u30d3\u30e5\u30fc\u304c\u8ffd\u52a0\u3055\u308c\u307e\u3059\u3002 \u5404\u89b3\u5bdf\u3092\u9069\u5207\u306a\u30d3\u30b8\u30cd\u30b9\u4fa1\u5024\u306e\u67f1\u306b\u6b63\u3057\u304f\u5e30\u5c5e\u3055\u305b\u308b\u5206\u6790\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Observations 1 and 2 both indicate efficiency gains; Observation 3 is a solution-cost issue; Observation 4 is a performance-SLA issue.","vi":"Quan s\u00e1t 1 v\u00e0 2 \u0111\u1ec1u cho th\u1ea5y m\u1ee9c t\u0103ng hi\u1ec7u qu\u1ea3; Quan s\u00e1t 3 l\u00e0 v\u1ea5n \u0111\u1ec1 v\u1ec1 gi\u1ea3i ph\u00e1p-chi ph\u00ed; Quan s\u00e1t 4 l\u00e0 v\u1ea5n \u0111\u1ec1 v\u1ec1 hi\u1ec7u su\u1ea5t-SLA.","jp":"\u89b3\u5bdf 1 \u3068 2 \u306f\u4e21\u65b9\u3068\u3082\u52b9\u7387\u306e\u5411\u4e0a\u3092\u793a\u3057\u3066\u3044\u307e\u3059\u3002\u89b3\u5bdf 3 \u306f\u3001\u89e3\u6c7a\u7b56\u306e\u30b3\u30b9\u30c8\u306e\u554f\u984c\u3067\u3059\u3002\u89b3\u5bdf 4 \u306f\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9 SLA \u306e\u554f\u984c\u3067\u3059\u3002"}},{"k":"B","t":{"en":"Observation 1 is a transformation outcome; Observation 2 is an efficiency gain; Observation 3 is a performance-SLA degradation; Observation 4 is a solution-cost issue.","vi":"Quan s\u00e1t 1 l\u00e0 k\u1ebft qu\u1ea3 chuy\u1ec3n \u0111\u1ed5i; Quan s\u00e1t 2 l\u00e0 \u0111\u1ea1t \u0111\u01b0\u1ee3c hi\u1ec7u qu\u1ea3; Quan s\u00e1t 3 l\u00e0 s\u1ef1 suy gi\u1ea3m SLA v\u1ec1 hi\u1ec7u su\u1ea5t; Quan s\u00e1t 4 l\u00e0 v\u1ea5n \u0111\u1ec1 v\u1ec1 gi\u1ea3i ph\u00e1p-chi ph\u00ed.","jp":"\u89b3\u5bdf 1 \u306f\u5909\u63db\u306e\u7d50\u679c\u3067\u3059\u3002\u89b3\u5bdf 2 \u306f\u52b9\u7387\u306e\u5411\u4e0a\u3067\u3059\u3002\u89b3\u5bdf 3 \u306f\u3001\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9 SLA \u306e\u4f4e\u4e0b\u3067\u3059\u3002\u89b3\u5bdf 4 \u306f\u3001\u89e3\u6c7a\u7b56\u306e\u30b3\u30b9\u30c8\u306e\u554f\u984c\u3067\u3059\u3002"}},{"k":"C","t":{"en":"Observations 1 and 4 together indicate a net performance-SLA improvement; Observation 2 is a transformation gap; Observation 3 is a productivity drain from over-engineering.","vi":"C\u00e1c quan s\u00e1t 1 v\u00e0 4 c\u00f9ng nhau cho th\u1ea5y s\u1ef1 c\u1ea3i thi\u1ec7n SLA hi\u1ec7u su\u1ea5t r\u00f2ng; Quan s\u00e1t 2 l\u00e0 kho\u1ea3ng tr\u1ed1ng chuy\u1ec3n \u0111\u1ed5i; Quan s\u00e1t 3 l\u00e0 s\u1ef1 s\u1ee5t gi\u1ea3m n\u0103ng su\u1ea5t do s\u1eed d\u1ee5ng k\u1ef9 thu\u1eadt qu\u00e1 m\u1ee9c.","jp":"\u89b3\u5bdf 1 \u3068 4 \u306f\u5408\u308f\u305b\u3066\u3001\u6b63\u5473\u306e\u30d1\u30d5\u30a9\u30fc\u30de\u30f3\u30b9 SLA \u306e\u6539\u5584\u3092\u793a\u3057\u3066\u3044\u307e\u3059\u3002\u89b3\u5bdf 2 \u306f\u5909\u63db\u30ae\u30e3\u30c3\u30d7\u3067\u3059\u3002\u89b3\u5bdf 3 \u306f\u3001\u904e\u5270\u306a\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0\u306b\u3088\u308b\u751f\u7523\u6027\u306e\u4f4e\u4e0b\u3067\u3059\u3002"}},{"k":"D","t":{"en":"Observation 1 indicates an efficiency gain; Observation 2 shows that productivity has not yet been realized; Observation 3 is a solution-cost issue; Observation 4 is an efficiency loss that partially offsets Observation 1.","vi":"Quan s\u00e1t 1 cho th\u1ea5y m\u1ee9c t\u0103ng hi\u1ec7u qu\u1ea3; Quan s\u00e1t 2 cho th\u1ea5y n\u0103ng su\u1ea5t ch\u01b0a \u0111\u01b0\u1ee3c hi\u1ec7n th\u1ef1c h\u00f3a; Quan s\u00e1t 3 l\u00e0 v\u1ea5n \u0111\u1ec1 v\u1ec1 gi\u1ea3i ph\u00e1p-chi ph\u00ed; Quan s\u00e1t 4 l\u00e0 t\u1ed5n th\u1ea5t v\u1ec1 hi\u1ec7u qu\u1ea3 b\u00f9 \u0111\u1eafp m\u1ed9t ph\u1ea7n cho Quan s\u00e1t 1.","jp":"\u89b3\u5bdf 1 \u306f\u52b9\u7387\u306e\u5411\u4e0a\u3092\u793a\u3057\u3066\u3044\u307e\u3059\u3002\u89b3\u5bdf 2 \u306f\u3001\u751f\u7523\u6027\u304c\u307e\u3060\u5b9f\u73fe\u3055\u308c\u3066\u3044\u306a\u3044\u3053\u3068\u3092\u793a\u3057\u3066\u3044\u307e\u3059\u3002\u89b3\u5bdf 3 \u306f\u3001\u89e3\u6c7a\u7b56\u306e\u30b3\u30b9\u30c8\u306e\u554f\u984c\u3067\u3059\u3002\u89b3\u6e2c 4 \u306f\u3001\u89b3\u6e2c 1 \u3092\u90e8\u5206\u7684\u306b\u76f8\u6bba\u3059\u308b\u52b9\u7387\u306e\u640d\u5931\u3067\u3059\u3002"}}],"answer":["D"],"multi":false,"explain":{"text":"Observation 1 is a direct efficiency improvement because the time required for one summarization task fell substantially. Observation 2 shows that local time savings have not yet translated into higher organizational productivity or billable output. Observation 3 is explicitly a solution-cost problem caused by unnecessary API calls. Observation 4 introduces additional human correction time and therefore partially offsets the gross efficiency gain reported in Observation 1. Option D is the only answer that keeps these value dimensions distinct. Measuring only generation speed would overstate re..."}},{"id":"ccarp-q091","n":91,"topic":5,"type":"mcq","stem":{"en":"You are supporting an engineer whose newly added MCP server does not appear in their Claude Code session. Which diagnostic step should be tried first?","vi":"B\u1ea1n \u0111ang h\u1ed7 tr\u1ee3 m\u1ed9t k\u1ef9 s\u01b0 c\u00f3 m\u00e1y ch\u1ee7 MCP m\u1edbi \u0111\u01b0\u1ee3c th\u00eam v\u00e0o kh\u00f4ng xu\u1ea5t hi\u1ec7n trong phi\u00ean M\u00e3 Claude c\u1ee7a h\u1ecd. B\u01b0\u1edbc ch\u1ea9n \u0111o\u00e1n n\u00e0o n\u00ean \u0111\u01b0\u1ee3c th\u1eed \u0111\u1ea7u ti\u00ean?","jp":"\u3042\u306a\u305f\u306f\u3001\u65b0\u3057\u304f\u8ffd\u52a0\u3055\u308c\u305f MCP \u30b5\u30fc\u30d0\u30fc\u304c\u30af\u30ed\u30fc\u30c9 \u30b3\u30fc\u30c9 \u30bb\u30c3\u30b7\u30e7\u30f3\u306b\u8868\u793a\u3055\u308c\u306a\u3044\u30a8\u30f3\u30b8\u30cb\u30a2\u3092\u30b5\u30dd\u30fc\u30c8\u3057\u3066\u3044\u307e\u3059\u3002 \u6700\u521d\u306b\u3069\u306e\u8a3a\u65ad\u30b9\u30c6\u30c3\u30d7\u3092\u8a66\u884c\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Disable every MCP server in the configuration to isolate the issue, removing all tool access rather than confirming whether the new server is registered.","vi":"V\u00f4 hi\u1ec7u h\u00f3a m\u1ecdi m\u00e1y ch\u1ee7 MCP trong c\u1ea5u h\u00ecnh \u0111\u1ec3 t\u00e1ch bi\u1ec7t s\u1ef1 c\u1ed1, x\u00f3a t\u1ea5t c\u1ea3 quy\u1ec1n truy c\u1eadp v\u00e0o c\u00f4ng c\u1ee5 thay v\u00ec x\u00e1c nh\u1eadn xem m\u00e1y ch\u1ee7 m\u1edbi c\u00f3 \u0111\u01b0\u1ee3c \u0111\u0103ng k\u00fd hay kh\u00f4ng.","jp":"\u69cb\u6210\u5185\u306e\u3059\u3079\u3066\u306e MCP \u30b5\u30fc\u30d0\u30fc\u3092\u7121\u52b9\u306b\u3057\u3066\u554f\u984c\u3092\u5207\u308a\u5206\u3051\u3001\u65b0\u3057\u3044\u30b5\u30fc\u30d0\u30fc\u304c\u767b\u9332\u3055\u308c\u3066\u3044\u308b\u304b\u3069\u3046\u304b\u3092\u78ba\u8a8d\u3059\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u3059\u3079\u3066\u306e\u30c4\u30fc\u30eb\u3078\u306e\u30a2\u30af\u30bb\u30b9\u3092\u524a\u9664\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Switch the team to a different Claude product family unrelated to the existing workflow, abandoning the current configuration rather than diagnosing the registration issue.","vi":"Chuy\u1ec3n nh\u00f3m sang d\u00f2ng s\u1ea3n ph\u1ea9m Claude kh\u00e1c kh\u00f4ng li\u00ean quan \u0111\u1ebfn quy tr\u00ecnh l\u00e0m vi\u1ec7c hi\u1ec7n t\u1ea1i, t\u1eeb b\u1ecf c\u1ea5u h\u00ecnh hi\u1ec7n t\u1ea1i thay v\u00ec ch\u1ea9n \u0111o\u00e1n v\u1ea5n \u0111\u1ec1 \u0111\u0103ng k\u00fd.","jp":"\u767b\u9332\u306e\u554f\u984c\u3092\u8a3a\u65ad\u3059\u308b\u306e\u3067\u306f\u306a\u304f\u3001\u73fe\u5728\u306e\u69cb\u6210\u3092\u653e\u68c4\u3057\u3066\u3001\u65e2\u5b58\u306e\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u3068\u306f\u95a2\u4fc2\u306e\u306a\u3044\u5225\u306e\u30af\u30ed\u30fc\u30c9\u88fd\u54c1\u30d5\u30a1\u30df\u30ea\u30fc\u306b\u30c1\u30fc\u30e0\u3092\u5207\u308a\u66ff\u3048\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Verify the MCP server is registered using the listing command, then reconnect the session if needed, since configuration changes typically require a restart to take effect.","vi":"X\u00e1c minh m\u00e1y ch\u1ee7 MCP \u0111\u00e3 \u0111\u01b0\u1ee3c \u0111\u0103ng k\u00fd b\u1eb1ng l\u1ec7nh li\u1ec7t k\u00ea, sau \u0111\u00f3 k\u1ebft n\u1ed1i l\u1ea1i phi\u00ean n\u1ebfu c\u1ea7n, v\u00ec c\u00e1c thay \u0111\u1ed5i c\u1ea5u h\u00ecnh th\u01b0\u1eddng y\u00eau c\u1ea7u kh\u1edfi \u0111\u1ed9ng l\u1ea1i \u0111\u1ec3 c\u00f3 hi\u1ec7u l\u1ef1c.","jp":"\u69cb\u6210\u306e\u5909\u66f4\u3092\u6709\u52b9\u306b\u3059\u308b\u306b\u306f\u901a\u5e38\u3001\u518d\u8d77\u52d5\u304c\u5fc5\u8981\u3067\u3042\u308b\u305f\u3081\u3001listing \u30b3\u30de\u30f3\u30c9\u3092\u4f7f\u7528\u3057\u3066 MCP \u30b5\u30fc\u30d0\u30fc\u304c\u767b\u9332\u3055\u308c\u3066\u3044\u308b\u3053\u3068\u3092\u78ba\u8a8d\u3057\u3001\u5fc5\u8981\u306b\u5fdc\u3058\u3066\u30bb\u30c3\u30b7\u30e7\u30f3\u3092\u518d\u63a5\u7d9a\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Reinstall the developer's operating system from scratch, discarding all local configuration and tool state before attempting any targeted diagnostic steps.","vi":"C\u00e0i \u0111\u1eb7t l\u1ea1i h\u1ec7 \u0111i\u1ec1u h\u00e0nh c\u1ee7a nh\u00e0 ph\u00e1t tri\u1ec3n t\u1eeb \u0111\u1ea7u, lo\u1ea1i b\u1ecf t\u1ea5t c\u1ea3 tr\u1ea1ng th\u00e1i c\u00f4ng c\u1ee5 v\u00e0 c\u1ea5u h\u00ecnh c\u1ee5c b\u1ed9 tr\u01b0\u1edbc khi th\u1eed b\u1ea5t k\u1ef3 b\u01b0\u1edbc ch\u1ea9n \u0111o\u00e1n \u0111\u01b0\u1ee3c nh\u1eafm m\u1ee5c ti\u00eau n\u00e0o.","jp":"\u5bfe\u8c61\u306e\u8a3a\u65ad\u624b\u9806\u3092\u8a66\u884c\u3059\u308b\u524d\u306b\u3001\u958b\u767a\u8005\u306e\u30aa\u30da\u30ec\u30fc\u30c6\u30a3\u30f3\u30b0 \u30b7\u30b9\u30c6\u30e0\u3092\u6700\u521d\u304b\u3089\u518d\u30a4\u30f3\u30b9\u30c8\u30fc\u30eb\u3057\u3001\u30ed\u30fc\u30ab\u30eb\u69cb\u6210\u3068\u30c4\u30fc\u30eb\u306e\u72b6\u614b\u3092\u3059\u3079\u3066\u7834\u68c4\u3057\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"The first diagnostic ac he new requirements without changes to component responsibilities or core contracts.","vi":"Ki\u1ebfn tr\u00fac hi\u1ec7n t\u1ea1i c\u1ee7a h\u1ec7 th\u1ed1ng kh\u00f4ng th\u1ec3 \u0111\u00e1p \u1ee9ng c\u00e1c y\u00eau c\u1ea7u m\u1edbi n\u1ebfu kh\u00f4ng c\u00f3 nh\u1eefng thay \u0111\u1ed5i v\u1ec1 tr\u00e1ch nhi\u1ec7m th\u00e0nh ph\u1ea7n ho\u1eb7c h\u1ee3p \u0111\u1ed3ng c\u1ed1t l\u00f5i.","jp":"\u30b7\u30b9\u30c6\u30e0\u306e\u73fe\u5728\u306e\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u306f\u3001\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u306e\u8cac\u4efb\u3084\u30b3\u30a2\u5951\u7d04\u3092\u5909\u66f4\u3057\u306a\u3044\u9650\u308a\u3001\u65b0\u3057\u3044\u8981\u4ef6\u3092\u6e80\u305f\u3059\u3053\u3068\u306f\u3067\u304d\u307e\u305b\u3093\u3002"}}],"answer":["D"],"multi":false,"explain":{"text":"A new design cycle is warranted when the required change crosses an architectural boundary. Option D explicitly states that the existing architecture cannot satisfy the new requirements without redistributing component responsibilities or altering core contracts. Such changes may affect service ownership, orchestration, data flows, integration interfaces, security boundaries, failure handling, evaluation strategy, and operational accountability. They therefore require renewed discovery, impact analysis, design review, stakeholder approval, and regression planning.<br>Options A, B, and C are local..."}},{"id":"ccarp-q106","n":106,"topic":6,"type":"mcq","stem":{"en":"You are rolling out a standardized Claude Code configuration to an engineering team and must complete the planning steps before piloting the configuration. Which two steps must be completed BEFORE piloting the configuration with a small group of engineers? (Select two.) Each correct answer presents part of the solution.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"B\u1ea1n \u0111ang tri\u1ec3n khai c\u1ea5u h\u00ecnh M\u00e3 Claude \u0111\u01b0\u1ee3c ti\u00eau chu\u1ea9n h\u00f3a cho nh\u00f3m k\u1ef9 thu\u ) \u30b5\u30fc\u30d0\u30fc\u3001\u6a29\u9650\u30eb\u30fc\u30eb\u3001\u304a\u3088\u3073\u30b5\u30d6\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u3092\u5bfe\u8c61\u3068\u3059\u308b\u30d7\u30ed\u30b8\u30a7\u30af\u30c8 \u30b9\u30b3\u30fc\u30d7\u306e\u30d9\u30fc\u30b9\u30e9\u30a4\u30f3\u3092\u5b9a\u7fa9\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Onboard every engineer in the organization to the new configuration through mandatory training sessions.","vi":"\u0110\u01b0a m\u1ecdi k\u1ef9 s\u01b0 trong t\u1ed5 ch\u1ee9c v\u00e0o c\u1ea5u h\u00ecnh m\u1edbi th\u00f4ng qua c\u00e1c bu\u1ed5i \u0111\u00e0o t\u1ea1o b\u1eaft bu\u1ed9c.","jp":"\u5fc5\u9808\u306e\u30c8\u30ec\u30fc\u30cb\u30f3\u30b0 \u30bb\u30c3\u30b7\u30e7\u30f3\u3092\u901a\u3058\u3066\u3001\u7d44\u7e54\u5185\u306e\u3059\u3079\u3066\u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u3092\u65b0\u3057\u3044\u69cb\u6210\u306b\u6163\u308c\u3055\u305b\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Roll out the stabilized configuration to additional teams with documentation and a defined support channel.","vi":"Tri\u1ec3n khai c\u1ea5u h\u00ecnh \u1ed5n \u0111\u1ecbnh cho c\u00e1c nh\u00f3m b\u1ed5 sung k\u00e8m theo t\u00e0i li\u1ec7u v\u00e0 k\u00eanh h\u1ed7 tr\u1ee3 \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh.","jp":"\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u3068\u5b9a\u7fa9\u3055\u308c\u305f\u30b5\u30dd\u30fc\u30c8 \u30c1\u30e3\u30cd\u30eb\u3092\u4f7f\u7528\u3057\u3066\u3001\u5b89\u5b9a\u3057\u305f\u69cb\u6210\u3092\u8ffd\u52a0\u306e\u30c1\u30fc\u30e0\u306b\u5c55\u958b\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Identify the team workflows, security boundaries, and which decisions belong to managed configuration versus project scope.","vi":"X\u00e1c \u0111\u1ecbnh quy tr\u00ecnh l\u00e0m vi\u1ec7c c\u1ee7a nh\u00f3m, ranh gi\u1edbi b\u1ea3o m\u1eadt v\u00e0 quy\u1ebft \u0111\u1ecbnh n\u00e0o thu\u1ed9c v\u1ec1 c\u1ea5u h\u00ecnh \u0111\u01b0\u1ee3c qu\u1ea3n l\u00fd so v\u1edbi ph\u1ea1m vi d\u1ef1 \u00e1n.","jp":"\u30c1\u30fc\u30e0\u306e\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u3001\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u5883\u754c\u3001\u304a\u3088\u3073\u7ba1\u7406\u5bfe\u8c61\u306e\u69cb\u6210\u3068\u30d7\u30ed\u30b8\u30a7\u30af\u30c8\u306e\u7bc4\u56f2\u306b\u5c5e\u3059\u308b\u6c7a\u5b9a\u3092\u7279\u5b9a\u3057\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Iterate the configuration based on the pilot findings and stabilize the baseline before broader rollout.","vi":"L\u1eb7p l\u1ea1i c\u1ea5u h\u00ecnh d\u1ef1a tr\u00ean nh\u1eefng ph\u00e1t hi\u1ec7n th\u00ed \u0111i\u1ec3m v\u00e0 \u1ed5n \u0111\u1ecbnh \u0111\u01b0\u1eddng c\u01a1 s\u1edf tr\u01b0\u1edbc khi tri\u1ec3n khai r\u1ed9ng h\u01a1n.","jp":"\u30d1\u30a4\u30ed\u30c3\u30c8\u306e\u7d50\u679c\u306b\u57fa\u3065\u3044\u3066\u69cb\u6210\u3092\u7e70\u308a\u8fd4\u3057\u3001\u3088\u308a\u5e83\u7bc4\u56f2\u306b\u5c55\u958b\u3059\u308b\u524d\u306b\u30d9\u30fc\u30b9\u30e9\u30a4\u30f3\u3092\u5b89\u5b9a\u3055\u305b\u307e\u3059\u3002"}}],"answer":["A","D"],"multi":true,"explain":{"text":"Before a pilot begins, the architect must understand the workflows being enabled, the associated security boundaries, and the correct ownership of each configuration decision. Option D establishes this foundation.<br>Organization-wide, non-overridable controls belong in managed configuration, whereas repositoryspecific MCP servers, shared permissions, and team subagents generally belong in project scope.<br>Option A then converts those decisions into an initial project baseline that the pilot group can use.<br>The baseline should identify approved MCP endpoints, minimum permission rules, denied operati..."}},{"id":"ccarp-q107","n":107,"topic":6,"type":"mcq","stem":{"en":"A healthcare organization is evaluating two Claude-powered AI architectures for a clinical documentation assistant. Architecture X produces higher output quality scores but costs $0.18 per documentation session and averages 4.2 seconds per response. Architecture Y scores slightly lower on quality metrics but costs $0.09 per session and averages 2.1 seconds per response. The stated SLA requires responses under 3 seconds, and the annual volume is projected at 2 million documentation sessions. Which evaluation approach correctly applies business value pillar analysis to this decision?","vi":"M\u1ed9t t\u1ed5 ch\u1ee9c ch\u0103m s\u00f3c s\u1ee9c kh\u1ecfe \u0111ang \u0111\u00e1nh gi\u00e1 hai ki\u1ebfn \u200b\u200btr\u00fac AI do Claude cung c\u1ea5p cho vai tr\u00f2 tr\u1ee3 l\u00fd t\u00e0i li\u1ec7u l\u00e2m s\u00e0ng. Ki\u1ebfn tr\u00fac X t\u1ea1o ra \u0111i\u1ec3m ch\u1ea5t l\u01b0\u1ee3ng \u0111\u1ea7u ra cao h\u01a1n nh\u01b0ng c\u00f3 gi\u00e1 0,18 USD cho m\u1ed7i phi\u00ean t\u00e0i li\u1ec7u v\u00e0 trung b\u00ecnh 4,2 gi\u00e2y cho m\u1ed7i ph\u1ea3n h\u1ed3i. Ki\u1ebfn tr\u00fac Y \u0111\u1ea1t \u0111i\u1ec3m th\u1ea5p h\u01a1n m\u1ed9t ch\u00fat v\u1ec1 s\u1ed1 li\u1ec7u ch\u1ea5t l\u01b0\u1ee3ng nh\u01b0ng c\u00f3 gi\u00e1 0,09 USD m\u1ed7i phi\u00ean v\u00e0 trung b\u00ecnh 2,1 gi\u00e2y cho m\u1ed7i ph\u1ea3n h\u1ed3i. SLA \u0111\u00e3 n\u00eau y\u00eau c\u1ea7u ph\u1ea3n h\u1ed3i d\u01b0\u1edbi 3 gi\u00e2y v\u00e0 kh\u1ed1i l\u01b0\u1ee3ng h\u00e0ng n\u0103m d\u1ef1 ki\u1ebfn \u200b\u200bl\u00e0 2 tri\u1ec7u phi\u00ean t\u00e0i li\u1ec7u. Ph\u01b0\u01a1ng ph\u00e1p \u0111\u00e1nh gi\u00e1 n\u00e0o \u00e1p d\u1ee5ng ch\u00ednh x\u00e1c ph\u00e2n t\u00edch tr\u1ee5 c\u1ed9t gi\u00e1 tr\u1ecb kinh doanh cho quy\u1ebft \u0111\u1ecbnh n\u00e0y?","jp":"\u3042\u308b\u533b\u7642\u6a5f\u95a2\u306f\u3001\u81e8\u5e8a\u6587\u66f8\u4f5c\u6210\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u7528\u306b\u3001Claude \u3092\u5229\u7528\u3057\u305f 2 \u3064\u306e AI \u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u3092\u8a55\u4fa1\u3057\u3066\u3044\u307e\u3059\u3002\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 X \u306f\u3088\u308a\u9ad8\u3044\u51fa\u529b\u54c1\u8cea\u30b9\u30b3\u30a2\u3092\u751f\u6210\u3057\u307e\u3059\u304c\u3001\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8 \u30bb\u30c3\u30b7\u30e7\u30f3\u3054\u3068\u306b 0.18 \u30c9\u30eb\u306e\u30b3\u30b9\u30c8\u304c\u304b\u304b\u308a\u3001\u5fdc\u7b54\u3054\u3068\u306b\u5e73\u5747 4.2 \u79d2\u304b\u304b\u308a\u307e\u3059\u3002\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 Y \u306e\u54c1\u8cea\u30e1\u30c8\u30ea\u30af\u30b9\u306e\u30b9\u30b3\u30a2\u306f\u308f\u305a\u304b\u306b\u4f4e\u304f\u306a\u308a\u307e\u3059\u304c\u3001\u30bb\u30c3\u30b7\u30e7\u30f3\u3042\u305f\u308a\u306e\u30b3\u30b9\u30c8\u306f 0.09 \u30c9\u30eb\u3067\u3001\u5fdc\u7b54\u3042\u305f\u308a\u306e\u5e73\u5747\u6642\u9593\u306f 2.1 \u79d2\u3067\u3059\u3002\u898f\u5b9a\u3055\u308c\u3066\u3044\u308b SLA \u3067\u306f 3 \u79d2\u4ee5\u5185\u306e\u5fdc\u7b54\u304c\u5fc5\u8981\u3067\u3001\u5e74\u9593\u91cf\u306f 200 \u4e07\u56de\u306e\u6587\u66f8\u5316\u30bb\u30c3\u30b7\u30e7\u30f3\u3068\u4e88\u6e2c\u3055\u308c\u3066\u3044\u307e\u3059\u3002 \u30d3\u30b8\u30cd\u30b9\u4fa1\u5024\u67f1\u5206\u6790\u3092\u3053\u306e\u6c7a\u5b9a\u306b\u6b63\u3057\u304f\u9069\u7528\u3059\u308b\u8a55\u4fa1\u30a2\u30d7\u30ed\u30fc\u30c1\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Select Architecture Y based solely on the 50% cost reduction, since solution cost is the most important value pillar in healthcare budget-constrained environments.","vi":"Ch\u1ecdn Ki\u1ebfn tr\u00fac Y ch\u1ec9 d\u1ef1a tr\u00ean vi\u1ec7c gi\u1ea3m 50% chi ph\u00ed, v\u00ec chi ph\u00ed gi\u1ea3i ph\u00e1p l\u00e0 tr\u1ee5 c\u1ed9t gi\u00e1 tr\u1ecb quan tr\u1ecdng nh\u1ea5t trong m\u00f4i tr\u01b0\u1eddng c\u00f3 ng\u00e2n s\u00e1ch ch\u0103m s\u00f3c s\u1ee9c kh\u1ecfe h\u1ea1n ch\u1ebf.","jp":"\u533b\u7642\u4e88\u7b97\u306b\u5236\u7d04\u306e\u3042\u308b\u74b0\u5883\u3067\u306f\u30bd\u30ea\u30e5\u30fc\u30b7\u30e7\u30f3\u306e\u30b3\u30b9\u30c8\u304c\u6700\u3082\u91cd\u8981\u306a\u4fa1\u5024\u306e\u67f1\u3067\u3042\u308b\u305f\u3081\u300150% \u306e\u30b3\u30b9\u30c8\u524a\u6e1b\u306e\u307f\u306b\u57fa\u3065\u3044\u3066\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 Y \u3092\u9078\u629e\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Select Architecture X because the higher quality scores justify the cost premium, and any SLA gap can be addressed through infrastructure optimization after deployment.","vi":"Ch\u1ecdn Ki\u1ebfn tr\u00fac X v\u00ec \u0111i\u1ec3m ch\u1ea5t l\u01b0\u1ee3ng cao h\u01a1n s\u1ebd b\u00f9 \u0111\u1eafp cho chi ph\u00ed cao h\u01a1n v\u00e0 m\u1ecdi kho\u1ea3ng c\u00e1ch SLA \u0111\u1ec1u c\u00f3 th\u1ec3 \u0111\u01b0\u1ee3c gi\u1ea3i quy\u1ebft th\u00f4ng qua t\u1ed1i \u01b0u h\u00f3a c\u01a1 s\u1edf h\u1ea1 t\u1ea7ng sau khi tri\u1ec3n khai.","jp":"\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 X \u3092\u9078\u629e\u3057\u307e\u3059\u3002\u3053\u308c\u306f\u3001\u54c1\u8cea\u30b9\u30b3\u30a2\u304c\u9ad8\u3044\u307b\u3069\u30b3\u30b9\u30c8\u5272\u5897\u304c\u6b63\u5f53\u5316\u3055\u308c\u3001SLA \u30ae\u30e3\u30c3\u30d7\u306f\u5c55\u958b\u5f8c\u306e\u30a4\u30f3\u30d5\u30e9\u30b9\u30c8\u30e9\u30af\u30c1\u30e3\u306e\u6700\u9069\u5316\u306b\u3088\u3063\u3066\u5bfe\u51e6\u3067\u304d\u308b\u305f\u3081\u3067\u3059\u3002"}},{"k":"C","t":{"en":"Eliminate Architecture X on SLA grounds, then evaluate Architecture Y against the efficiency and solution cost pillars by calculating annual cost difference and assessing whether the quality delta materially impacts clinical workflow productivity.","vi":"Lo\u1ea1i b\u1ecf Ki\u1ebfn tr\u00fac X tr\u00ean c\u01a1 s\u1edf SLA, sau \u0111\u00f3 \u0111\u00e1nh gi\u00e1 Ki\u1ebfn tr\u00fac Y d\u1ef1a tr\u00ean c\u00e1c tr\u1ee5 c\u1ed9t chi ph\u00ed v\u00e0 hi\u1ec7u qu\u1ea3 c\u1ee7a gi\u1ea3i ph\u00e1p b\u1eb1ng c\u00e1ch t\u00ednh to\u00e1n ch\u00eanh l\u1ec7ch chi ph\u00ed h\u00e0ng n\u0103m v\u00e0 \u0111\u00e1nh gi\u00e1 xem li\u1ec7u \u0111\u1ed3ng b\u1eb1ng ch\u1ea5t l\u01b0\u1ee3ng c\u00f3 \u1ea3nh h\u01b0\u1edfng tr\u1ecdng y\u1ebfu \u0111\u1ebfn n\u0103ng su\u1ea5t quy tr\u00ecnh l\u00e0m vi\u1ec7c l\u00e2m s\u00e0ng hay kh\u00f4ng.","jp":"SLA \u306b\u57fa\u3065\u3044\u3066\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 X \u3092\u524a\u9664\u3057\u3001\u5e74\u9593\u30b3\u30b9\u30c8\u5dee\u3092\u8a08\u7b97\u3057\u3001\u54c1\u8cea\u306e\u5dee\u5206\u304c\u81e8\u5e8a\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u306e\u751f\u7523\u6027\u306b\u91cd\u5927\u306a\u5f71\u97ff\u3092\u4e0e\u3048\u308b\u304b\u3069\u3046\u304b\u3092\u8a55\u4fa1\u3059\u308b\u3053\u3068\u3067\u3001\u52b9\u7387\u3068\u30bd\u30ea\u30e5\u30fc\u30b7\u30e7\u30f3\u306e\u30b3\u30b9\u30c8\u306e\u67f1\u306b\u7167\u3089\u3057\u3066\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 Y \u3092\u8a55\u4fa1\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Recommend a hybrid approach using Architecture X for complex cases and Architecture Y for routine cases, without additional analysis, since this preserves quality where it matters most.","vi":"\u0110\u1ec1 xu\u1ea5t c\u00e1ch ti\u1ebfp c\u1eadn k\u1ebft h\u1ee3p s\u1eed d\u1ee5ng Ki\u1ebfn tr\u00fac X cho c\u00e1c tr\u01b0\u1eddng h\u1ee3p ph\u1ee9c t\u1ea1p v\u00e0 Ki\u1ebfn tr\u00fac Y cho c\u00e1c tr\u01b0\u1eddng h\u1ee3p th\u00f4ng th\u01b0\u1eddng m\u00e0 kh\u00f4ng c\u1ea7n ph\u00e2n t\u00edch b\u1ed5 sung v\u00ec \u0111i\u1ec1u n\u00e0y gi\u00fap duy tr\u00ec ch\u1ea5t l\u01b0\u1ee3ng \u1edf nh\u1eefng n\u01a1i quan tr\u1ecdng nh\u1ea5t.","jp":"\u8907\u96d1\u306a\u30b1\u30fc\u30b9\u306b\u306f\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 X \u3092\u4f7f\u7528\u3057\u3001\u65e5\u5e38\u7684\u306a\u30b1\u30fc\u30b9\u306b\u306f\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3 Y \u3092\u4f7f\u7528\u3057\u3001\u8ffd\u52a0\u306e\u5206\u6790\u3092\u884c\u308f\u305a\u306b\u30cf\u30a4\u30d6\u30ea\u30c3\u30c9 \u30a2\u30d7\u30ed\u30fc\u30c1\u3092\u63a8\u5968\u3057\u307e\u3059\u3002\u3053\u308c\u306b\u3088\u308a\u3001\u6700\u3082\u91cd\u8981\u306a\u54c1\u8cea\u304c\u7dad\u6301\u3055\u308c\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Architecture X fails a stated production gate: its 4.2-second average exceeds the required threesecond response SLA. It should therefore not remain a qualifying architecture unless it is redesigned and retested before selection. A promise to optimize after deployment is not evidence of compliance .<br>Architecture Y meets the latency requirement at 2.1 seconds. Its annual inference cost is $180,000 at two million sessions, compared with $360,000 for Architecture X-a difference of $180,000 annually.<br>However, cost alone does not establish suitability. The organization must determine whether Y's low..."}},{"id":"ccarp-q108","n":108,"topic":6,"type":"mcq","stem":{"en":"You are a solution architect designing a Claude-based assistant with access to 60 internal tools across multiple business domains. Loading every tool definition on every request increases token usage and time to first response. Which design pattern best addresses this issue without sacrificing capability breadth?","vi":"B\u1ea1n l\u00e0 ki\u1ebfn \u200b\u200btr\u00fac s\u01b0 gi\u1ea3i ph\u00e1p \u0111ang thi\u1ebft k\u1ebf m\u1ed9t tr\u1ee3 l\u00fd d\u1ef1a tr\u00ean Claude v\u1edbi quy\u1ec1n truy c\u1eadp v\u00e0o 60 c\u00f4ng c\u1ee5 n\u1ed9i b\u1ed9 tr\u00ean nhi\u1ec1u l\u0129nh v\u1ef1c kinh doanh. T\u1ea3i m\u1ecdi \u0111\u1ecbnh ngh\u0129a c\u00f4ng c\u1ee5 cho m\u1ed7i y\u00eau c\u1ea7u s\u1ebd t\u0103ng m\u1ee9c s\u1eed d\u1ee5ng m\u00e3 th\u00f4ng b\u00e1o v\u00e0 th\u1eddi gian cho ph\u1ea3n h\u1ed3i \u0111\u1ea7u ti\u00ean. M\u1eabu thi\u1ebft k\u1ebf n\u00e0o gi\u1ea3i quy\u1ebft t\u1ed1t nh\u1ea5t v\u1ea5n \u0111\u1ec1 n\u00e0y m\u00e0 kh\u00f4ng ph\u1ea3i hy sinh kh\u1ea3 n\u0103ng m\u1edf r\u1ed9ng?","jp":"\u3042\u306a\u305f\u306f\u3001\u8907\u6570\u306e\u30d3\u30b8\u30cd\u30b9 \u30c9\u30e1\u30a4\u30f3\u306b\u308f\u305f\u308b 60 \u306e\u5185\u90e8\u30c4\u30fc\u30eb\u306b\u30a2\u30af\u30bb\u30b9\u3067\u304d\u308b\u30af\u30ed\u30fc\u30c9 \u30d9\u30fc\u30b9\u306e\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u3092\u8a2d\u8a08\u3059\u308b\u30bd\u30ea\u30e5\u30fc\u30b7\u30e7\u30f3 \u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306 let L = "vi";
const t = (k,...a) => { const v = T[L][k]; return typeof v === "function" ? v(...a) : v; };
/* văn bản song ngữ: luôn hiện bản tiếng Anh (đề gốc), kèm bản Việt khi giao diện là VI */
const tx = o => !o ? "" : o.en + ((L === "vi" && o.vi) ? `<span class="gloss">${o.vi}</span>` : (L === "jp" && o.jp) ? `<span class="gloss">${o.jp}</span>` : "");

/* ---------- dữ liệu phẳng ---------- */
const ALL = [], BY_ID = {};
DATA.topics.forEach(tp => tp.questions.forEach(q => {
  q.idx = ALL.length + 1;
  q.hay = fold(strip([q.stem.en, q.stem.vi, q.stem.jp,
    (q.options||[]).map(o => o.t.en + " " + (o.t.vi||"") + " " + (o.t.jp||"")).join(" "),
    (q.rows||[]).map(r => r.t.en + " " + (r.t.vi||"") + " " + (r.t.jp||"")).join(" "),
    (q.blanks||[]).map(b => (b.opts||[]).map(o => o.en).join(" ")).join(" "),
    q.explain && (q.explain.key || q.explain.text), (q.explain && q.explain.elim || []).join(" ")
  ].filter(Boolean).join(" ")));
  ALL.push(q); BY_ID[q.id] = q;
}));
const TOPICS = DATA.topics.map(d => d.n);
const TYPES = [...new Set(ALL.map(q => q.type))];
const PASS = DATA.meta.pass || 70;

/* ============================================================
   LOGIC THEO DẠNG CÂU
   ============================================================ */
function blankAnswer(q){
  if(q.type === "mcq")   return [];
  if(q.type === "yesno") return q.rows.map(() => null);
  return q.blanks.map(() => null);
}
function answeredCount(q, a){
  if(q.type === "mcq") return (a||[]).length;
  return (a||[]).filter(v => v !== null && v !== undefined).length;
}
function totalParts(q){
  if(q.type === "mcq") return q.answer.length;
  if(q.type === "yesno") return q.rows.length;
  return q.blanks.length;
}
function isComplete(q, a){ return answeredCount(q,a) >= totalParts(q); }
function isCorrect(q, a){
  if(!a) return false;
  if(q.type === "mcq")
    return a.length === q.answer.length && [...a].sort().join("") === [...q.answer].sort().join("");
  if(q.type === "yesno") return q.rows.every((r,i) => a[i] === r.a);
  return q.blanks.every((b,i) => a[i] === b.a);
}
function stampHTML(q){
  if(q.type === "mcq")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${q.answer.join(" ")}</span></div>`;
  if(q.type === "yesno")
    return `<div class="stamp"><span class="t">${t("ansTitle")}</span><span class="v">${
      q.rows.map(r => r.a === "Y" ? "Y" : "N").join(" ")}</span></div>`;
  return `<div class="stamp txt"><span class="t">${t("ansTitle")}</span><span class="v">${
    q.blanks.map(b => strip(b.opts[b.a].en)).join(" · ")}</span></div>`;
}

/* ---------- thân câu hỏi (dùng chung cho ôn tập / thi / xem lại) ---------- */
function bodyHTML(q, a, done, act){
  const P = act ? `data-act="${act}"` : "";
  if(q.type === "mcq"){
    return `<ul class="opts">` + q.options.map(o => {
      const right = q.answer.includes(o.k), pick = (a||[]).includes(o.k);
      return `<li><button class="opt" ${P} data-k="${o.k}" data-right="${right?1:0}" data-pick="${pick?1:0}"
          ${done?'aria-disabled="true"':""}>
        <span class="k">${o.k}</span><span class="tx">${tx(o.t)}</span>
        <span class="mk mk-you">${t("markYou")}</span><span class="mk mk-ok">${t("markOk")}</span>
      </button></li>`; }).join("") + `</ul>`;
  }
  if(q.type === "yesno"){
    return `<ul class="ynlist">` + q.rows.map((r,i) => {
      const v = a ? a[i] : null;
      const right = v !== null && v === r.a;
      return `<li class="yn" data-right="${right?1:0}">
        <div class="ynt">${tx(r.t)}</div>
        <div class="ynb" role="group">
          <button ${P} data-i="${i}" data-v="Y" data-correct="${r.a==="Y"?1:0}" aria-pressed="${v==="Y"}">${t("yes")}</button>
          <button ${P} data-i="${i}" data-v="N" data-correct="${r.a==="N"?1:0}" aria-pressed="${v==="N"}">${t("no")}</button>
        </div></li>`; }).join("") + `</ul>`;
  }
  return `<div class="blanks">` + q.blanks.map((b,i) => {
    const v = a ? a[i] : null;
    const right = v !== null && v === b.a;
    return `<div class="blank" data-right="${right?1:0}">
      ${b.label ? `<span class="blabel">${tx(b.label)}</span>` : ""}
      <label class="sel ${v!==null?"on":""}">
        <select ${P} data-i="${i}">
          <option value="">— —</option>
          ${b.opts.map((o,j) => {
            const en = strip(o.en), vi = o.vi ? strip(o.vi) : "";
            return `<option value="${j}" ${v===j?"selected":""}${vi?` title="${esc(vi)}"`:""}>${esc(en)}</option>`;
          }).join("")}
        </select><span class="cap"></span>
      </label>
      <span class="ansline ${right?"ok":"bad"}">${t("ansTitle")}: ${esc(strip(b.opts[b.a].en))}${
        L === "vi" && b.opts[b.a].vi ? ` — ${esc(strip(b.opts[b.a].vi))}` : ""}${L === "jp" && b.opts[b.a].jp ? ` — ${esc(strip(b.opts[b.a].jp))}` : ""}</span>
    </div>`; }).join("") + `</div>`;
}

/* ---------- khối giải thích ---------- */
function noteHTML(r){
  return `<div class="notewrap"><span class="lbl">${t("secNote")}</span>
    <textarea data-act="note" rows="2" placeholder="${esc(t("notePh"))}">${esc(r.note||"")}</textarea></div>`;
}
function revealHTML(q, verdict, extra){
  const e = q.explain || {};
  const two = !!(e.key && e.elim && e.elim.length);
  let secs = "";
  if(e.key)  secs += `<div><h4 class="sech">${t("secKey")}</h4><p class="prose">${e.key}</p></div>`;
  if(e.elim && e.elim.length)
    secs += `<div><h4 class="sech">${t("secElim")}</h4><ul class="elim">${e.elim.map(x=>`<li>${x}</li>`).join("")}</ul></div>`;
  if(e.text) secs += `<div><h4 class="sech">${t("secExp")}</h4><p class="prose">${e.text}</p></div>`;
  const conf = q.conf ? `<span class="conf ${q.conf.toLowerCase()}">${t("conf"+q.conf.toUpperCase())}</span>` : "";
  return `<div class="rev">
    <div class="revtop">${stampHTML(q)}${verdict}${conf}</div>
    <div class="revgrid ${two?"two":""}">${secs}</div>
    ${q.cite ? `<p class="cite">${t("source")}: ${q.cite}</p>` : ""}
    ${extra || ""}
  </div>`;
}

/* ============================================================
   TRẠNG THÁI
   ============================================================ */
const S = { mode:"study", f:{topic:"all",status:"all",type:"all",q:""},
            p:{}, history:[], cur:null, exam:null, reviewWrongOnly:false };
const rec = id => (S.p[id] ||= { a:null, done:0, ok:null, flag:0, note:"", n:0 });
const ansOf = q => { const r = rec(q.id); if(!r.a) r.a = blankAnswer(q); return r.a; };

function save(){
  const e = S.exam;
  const exam = (e && e.phase === "run") ? {
    ids:e.list.map(x=>x.id), order:e.order, answers:e.answers, flags:e.flags,
    pos:e.pos, started:e.started, duration:e.duration, cfg:e.cfg } : null;
  store.set(KEY, JSON.stringify({ v:2, lang:L, theme:document.documentElement.dataset.theme,
                                  p:S.p, history:S.history, exam }));
}
function load(){
  try{
    const d = JSON.parse(store.get(KEY) || "{}");
    if(d.p) S.p = d.p;
    if(Array.isArray(d.history)) S.history = d.history;
    if(d.lang) L = d.lang;
    if(d.exam && d.exam.ids){
      const list = d.exam.ids.map(id => {
        const q = BY_ID[id]; if(!q) return null;
        const ord = d.exam.order && d.exam.order[id];
        if(ord && q.options) return Object.assign({}, q, { options: ord.map(k => q.options.find(o=>o.k===k)).filter(Boolean) });
        return q;
      }).filter(Boolean);
      if(list.length === d.exam.ids.length)
        S.exam = { phase:"run", list, order:d.exam.order, answers:d.exam.answers||{}, flags:d.exam.flags||{},
                   pos:d.exam.pos||0, started:d.exam.started, duration:d.exam.duration, cfg:d.exam.cfg, timer:null };
    }
  }catch(e){}
}

/* ---------- lọc ---------- */
function filtered(){
  const term = fold(S.f.q.trim());
  return ALL.filter(q => {
    if(S.f.topic !== "all" && q.topic !== +S.f.topic) return false;
    if(S.f.type !== "all" && q.type !== S.f.type) return false;
    const r = S.p[q.id];
    if(S.f.status === "todo"  && r && r.done) return false;
    if(S.f.status === "right" && !(r && r.ok === true)) return false;
    if(S.f.status === "wrong" && !(r && r.ok === false)) return false;
    if(S.f.status === "flag"  && !(r && r.flag)) return false;
    if(term && !q.hay.includes(term)) return false;
    return true;
  });
}
function statsOf(list){
  let done=0, right=0, flag=0;
  list.forEach(q => { const r=S.p[q.id]; if(!r) return;
    if(r.ok === true || r.ok === false){ done++; if(r.ok) right++; }
    if(r.flag) flag++; });
  return { done, right, flag, total:list.length };
}

}

function renderRail(){
  // một hàm dựng hàng dùng chung cho MỌI danh sách lọc — thêm bộ lọc mới thì
  // gọi lại nó, đừng đẻ ra kiểu hiển thị thứ hai.

    `<button class="srow" data-f-key="${key}" data-v="${v}" aria-pressed="${String(v)===String(cur)}">
      <span class="dot ${mark||""}"></span><span class="nm">${esc(lab)}</span><span class="ct">${count}</span>
    </button>`;

  // ----- trạng thái -----
  const counts = (() => {
    let todo=0, right=0, wrong=0, flag=0;
    ALL.forEach(q => { const r = S.p[q.id];
      if(!r || !r.done) todo++;
      if(r && r.ok === true) right++;
      if(r && r.ok === false) wrong++;
      if(r && r.flag) flag++; });
    return {all:ALL.length, todo, right, wrong, flag};
  })();
  $("#fStatus").innerHTML = [
    ["all", t("sAll"), ""], ["todo", t("sTodo"), ""], ["right", t("sRight"), "g"],
    ["wrong", t("sWrong"), "r"], ["flag", t("sFlag"), "f"]
  ].map(([v,lab,mk]) => listRow("status", S.f.status, v, lab, counts[v], mk)).join("");

  // ----- dạng câu: chỉ hiện khi đề có từ hai dạng trở lên -----
  const typeInfo = {mcq:[t("kMcq"),"m-mcq"], yesno:[t("kYesno"),"m-yesno"], dropdown:[t("kDrop"),"m-drop"]};
  const typeBlock = $("#fTypeBlk");
  if(TYPES.length < 2) typeBlock.classList.add("hide");
  else {
    typeBlock.classList.remove("hide");
    const tc = Object.fromEntries(TYPES.map(x => [x, ALL.filter(q => q.type === x).length]));
    $("#fType").innerHTML = listRow("type", S.f.type, "all", t("kAll"), ALL.length, "")
      + TYPES.map(x => listRow("type", S.f.type, x, typeInfo[x][0], tc[x], typeInfo[x][1])).join("");
  }

  const row = (v, name, list) => {
    const s = statsOf(list);
    return `<button class="trow" data-f-key="topic" data-v="${v}" aria-pressed="${String(v)===String(S.f.topic)}">
      <span class="nm">${esc(name)}</span><span class="ct">${s.done}/${s.total}</span>
      <span class="meter"><i class="g" style="width:${pct(s.right,s.total)}%"></i><i class="r" style="width:${pct(s.done-s.right,s.total)}%"></i></span>
    </button>`;
  };
  $("#fTopics").innerHTML = row("all", t("sAll"), ALL) +
    TOPICS.map(n => row(n, t("topicN", n), ALL.filter(q => q.topic === n))).join("");
}

function typeTag(q){
  if(q.type === "yesno") return `<span class="tag multi">${t("tYesno")}</span>`;
  if(q.type === "dropdown") return `<span class="tag multi">${t("tDrop")}</span>`;
  if(q.multi) return `<span class="tag multi">${t("multi", q.answer.length)}</span>`;
  return "";
}

function recordHTML(q){
  const r = rec(q.id), a = ansOf(q);
  const tags = [`<span class="tag">${esc(t("topicN", q.topic))}</span>`,
                `<span class="tag">${esc(t("qN", q.n))}</span>`, typeTag(q)];
  if(r.done && r.ok === true)  tags.push(`<span class="tag ok">${t("verdictOk")}</span>`);
  if(r.done && r.ok === false) tags.push(`<span class="tag bad">${t("verdictBad")}</span>`);
  tags.push(`<button class="flagbtn" data-act="flag" aria-pressed="${!!r.flag}"
      title="${esc(r.flag?t("unflag"):t("flag"))}" aria-label="${esc(r.flag?t("unflag"):t("flag"))}">${ICON.flag}</button>`);

  const n = answeredCount(q,a), total = totalParts(q);
  const bar = r.done
    ? `<button class="btn" data-act="again">${t("again")}</button>`
    : `<button class="btn solid" data-act="check" ${isComplete(q,a)?"":"disabled"}>${t("check")}</button>
       <button class="btn" data-act="reveal">${t("reveal")}</button>
       <span class="note">${n===0 ? t("pickFirst") : n>=total ? t("answered") : t("partial", n, total)}</span>`;

  const verdict = r.ok === true  ? `<span class="verdict ok">${t("verdictOk")}</span>`
                : r.ok === false ? `<span class="verdict bad">${t("verdictBad")}</span>`
                : `<span class="note">${t("verdictNone")}</span>`;

  return `<article class="rec ${S.cur===q.id?"cur":""}" id="rec-${q.id}" data-id="${q.id}" data-done="${r.done?1:0}">
    <div class="rechead"><span class="idx">${pad2(q.idx)}</span><div class="tags">${tags.join("")}</div></div>
    <p class="stem">${tx(q.stem)}</p>
    ${q.img ? `<img class="qimg" src="${q.img}" alt="" data-zoom>` : ""}
    <div class="qbody">${bodyHTML(q, a, r.done, "ans")}</div>
    <div class="bar">${bar}</div>
    ${revealHTML(q, verdict, noteHTML(r))}
  </article>`;
}

function refreshRecord(id, focusSel){
  const q = BY_ID[id];
  let node = document.getElementById("rec-"+id);
  if(!q || !node) return;
  node.outerHTML = recordHTML(q);
  node = document.getElementById("rec-"+id);
  if(node && focusSel){ const n = node.querySelector(focusSel); if(n) n.focus(); }
}

/* ---------- ghi nhận câu trả lời ---------- */
function applyAnswer(q, a, el){
  if(q.type === "mcq"){
    const k = el.dataset.k;
    if(q.answer.length > 1){
      const i = a.indexOf(k);
      if(i >= 0) a.splice(i,1);
      else { if(a.length >= q.answer.length) a.shift(); a.push(k); }
    } else { a.length = 0; if(!el.dataset.was) a.push(k); }
  } else if(q.type === "yesno"){
    const i = +el.dataset.i;
    a[i] = a[i] === el.dataset.v ? null : el.dataset.v;
  } else {
    const i = +el.dataset.i;
    a[i] = el.value === "" ? null : +el.value;
  }
}

  let p = ALL;
  if(cfg.topic !== "all") p = p.filter(q => q.topic === +cfg.topic);
  if(cfg.source === "wrong") p = p.filter(q => { const r=S.p[q.id]; return r && r.ok === false; });
  if(cfg.source === "flag")  p = p.filter(q => { const r=S.p[q.id]; return r && r.flag; });
  return p;
}
function viewExam(){
  const e = S.exam;

}

/* ============================================================
   HÀNH ĐỘNG
   ============================================================ */
function checkRecord(id, revealOnly){
  const q = BY_ID[id], r = rec(id), a = ansOf(q);
  r.done = 1;
  r.ok = (revealOnly && answeredCount(q,a) === 0) ? null : isCorrect(q, a);
  r.n = (r.n||0) + 1;
  save(); refreshRecord(id); renderRail(); renderAside();
}
function setMode(m){
  S.mode = m;
  if(m === "exam" && !S.exam) S.exam = { phase:"setup", cfg:{count:30,mins:45,topic:"all",shuffle:"yes",source:"all"} };
  if(m === "exam" && S.exam.phase === "run" && !S.exam.timer && S.exam.duration){
    tickTimer(); S.exam.timer = setInterval(tickTimer, 1000);
  }
  renderAll(); window.scrollTo({top:0});
}
function startExam(){
  const cfg = S.exam.cfg, pool = examPool(cfg);
  if(!pool.length) return;
  const count = Math.max(1, Math.min(+cfg.count || 1, pool.length));
  const picked = shuffle(pool).slice(0, count);
  const order = {};
  const list = picked.map(q => {
    if(cfg.shuffle === "yes" && q.options){
      const opts = shuffle(q.options);
      order[q.id] = opts.map(o => o.k);
      return Object.assign({}, q, { options: opts });
    }
    return q;
  });
  clearInterval(S.exam.timer);
  S.exam = { phase:"run", list, order, answers:{}, flags:{}, pos:0, started:Date.now(),
             duration:(+cfg.mins||0)*60, cfg, timer:null };
  if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer, 1000); }
  save(); renderAll(); window.scrollTo({top:0});
}
function tickTimer(){
  const e = S.exam;
  if(!e || e.phase !== "run" || !e.duration) return;
  const left = e.duration - Math.floor((Date.now()-e.started)/1000);
  const txt = clock(Math.max(0,left));
  ["timerOut","timerHead"].forEach(id => {
    const n = document.getElementById(id);
    if(n){ n.textContent = txt; n.classList.toggle("low", left < 60); }
  });
  if(left <= 0){ gradeExam(); toast(t("timeUp")); }
}
function gradeExam(){
  const e = S.exam;
  if(!e || e.phase !== "run") return;
  clearInterval(e.timer); e.timer = null;
  let correct = 0, blank = 0;
  const detail = e.list.map((q,i) => {
    const given = e.answers[i] || blankAnswer(q);
    const filled = answeredCount(q, given) > 0;
    if(!filled) blank++;
    const ok = filled && isCorrect(q, given);
    if(ok) correct++;
    const r = rec(q.id);
    if(filled){ r.a = JSON.parse(JSON.stringify(given)); r.done = 1; r.ok = ok; r.n = (r.n||0)+1; }
    if(e.flags[i]) r.flag = 1;
    return { q, given, ok };
  });
  const secs = Math.floor((Date.now()-e.started)/1000);
  const scope = e.cfg.topic === "all" ? t("allTopics") : t("topicN", e.cfg.topic);
  e.result = { detail, correct, wrong:e.list.length-correct, blank, pct:pct(correct,e.list.length), secs };
  e.phase = "result"; S.mode = "exam"; S.reviewWrongOnly = false;
  S.history.push({ at:new Date().toISOString(), pct:e.result.pct, c:correct, t:e.list.length, secs, scope });
  save(); renderAll(); window.scrollTo({top:0});
}

/* ---------- hộp thoại ---------- */
function dialog(title, body, confirmLabel, onYes, danger){
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(title)}</h3><p>${esc(body)}</p>
    <div class="act"><button class="btn" data-no>${esc(t("cancel"))}</button>
    ${confirmLabel?`<button class="btn ${danger?"danger":"solid"}" data-yes>${esc(confirmLabel)}</button>`:""}</div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => {
    if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove();
    if(ev.target.hasAttribute("data-yes")){ ov.remove(); onYes && onYes(); }
  });
  (ov.querySelector("[data-yes]") || ov.querySelector("[data-no]")).focus();
}
function helpDialog(){
  const rows = [["A B C D",t("kPick")],["Enter",t("kCheck")],["F",t("kFlag")],["← →",t("kNav")],["/",t("kSearch")],["?",t("kHelp")],["Esc",t("kEsc")]];
  const ov = document.createElement("div");
  ov.className = "ov";
  ov.innerHTML = `<div class="box" role="dialog" aria-modal="true"><h3>${esc(t("keysTitle"))}</h3>
    <div class="keys" style="margin-bottom:18px">${rows.map(([k,d])=>`<div class="keyrow"><kbd>${esc(k)}</kbd><span>${esc(d)}</span></div>`).join("")}</div>
    <div class="act"><button class="btn" data-no>${esc(t("close"))}</button></div></div>`;
  document.body.appendChild(ov);
  ov.addEventListener("click", ev => { if(ev.target === ov || ev.target.hasAttribute("data-no")) ov.remove(); });
  ov.querySelector("[data-no]").focus();
}
function zoom(src){
  const ov = document.createElement("div");
  ov.className = "ov zoom";
  ov.innerHTML = `<img src="${src}" alt="">`;
  ov.addEventListener("click", () => ov.remove());
  document.body.appendChild(ov);
}
let toastTimer = null;
function toast(msg){
  $$(".toast").forEach(n => n.remove());
  const n = document.createElement("div");
  n.className = "toast"; n.textContent = msg; n.setAttribute("role","status");
  document.body.appendChild(n);
  clearTimeout(toastTimer); toastTimer = setTimeout(() => n.remove(), 2800);
}

/* ---------- xuất / nhập ---------- */
function exportData(){
  const blob = new Blob([JSON.stringify({v:2, code:DATA.meta.code, exportedAt:new Date().toISOString(),
                                         p:S.p, history:S.history}, null, 2)], {type:"application/json"});
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${DATA.meta.code.toLowerCase()}-progress-${new Date().toISOString().slice(0,10)}.json`;
  a.click(); URL.revokeObjectURL(a.href); toast(t("exported"));
}
function importData(file){
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const d = JSON.parse(fr.result);
      if(!d || typeof d.p !== "object") throw 0;
      S.p = d.p; S.history = Array.isArray(d.history) ? d.history : [];
      save(); renderAll(); toast(t("imported"));
    }catch(e){ toast(t("badFile")); }
  };
  fr.onerror = () => toast(t("badFile"));
  fr.readAsText(file);
}

/* ============================================================
   SỰ KIỆN
   ============================================================ */
document.addEventListener("click", ev => {
  if(ev.target.matches("[data-zoom]")){ zoom(ev.target.src); return; }
  // <select> do bộ lắng nghe "change" lo. Nếu để lọt vào đây, việc vẽ lại bản
  // ghi sẽ thay thế chính phần tử đang mở, làm danh sách đóng sập ngay khi bấm.
  if(ev.target.tagName === "SELECT") return;
  const el = ev.target.closest("[data-mode],[data-lang],[data-f-key],[data-act],[data-jump],[data-go]");
  if(!el) return;

  if(el.dataset.mode){ setMode(el.dataset.mode); return; }
  if(el.dataset.lang){ L = el.dataset.lang; save(); renderAll(); return; }
  if(el.dataset.fKey){
    S.f[el.dataset.fKey] = el.dataset.v;
    renderRail(); renderMain();
    if(window.innerWidth < 900) document.body.classList.remove("rail-open");
    return;
  }
  if(el.dataset.jump){
    const id = el.dataset.jump;
    if(S.mode !== "study") S.mode = "study";
    S.f = {topic:"all",status:"all",type:"all",q:""}; $("#search").value = "";
    renderAll();
    const n = document.getElementById("rec-"+id);
    if(n) n.scrollIntoView({behavior:"smooth",block:"start"});
    return;
  }
  if(el.dataset.go !== undefined && S.exam && S.exam.phase === "run"){
    S.exam.pos = +el.dataset.go; save(); renderMain(); renderAside(); window.scrollTo({top:0}); return;
  }

  const recEl = el.closest(".rec"), id = recEl && recEl.dataset.id, act = el.dataset.act;
  switch(act){
    case "ans": {
      if(!id) break;
      const q = BY_ID[id], r = rec(id);
      if(r.done) break;
      const a = ansOf(q);
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save();
      refreshRecord(id, q.type === "mcq" ? `[data-act="ans"][data-k="${el.dataset.k}"]`
                                         : `[data-act="ans"][data-i="${el.dataset.i}"]`);
      break;
    }
    case "check":  if(id) checkRecord(id, false); break;
    case "reveal": if(id) checkRecord(id, true);  break;
    case "again": {
      if(!id) break;
      const r = rec(id); r.a = blankAnswer(BY_ID[id]); r.done = 0; r.ok = null;
      save(); refreshRecord(id, '[data-act="check"]'); renderRail(); renderAside(); break;
    }
    case "flag": {
      if(!id) break;
      const r = rec(id); r.flag = r.flag ? 0 : 1;
      save(); refreshRecord(id, '.flagbtn'); renderRail(); renderAside(); break;
    }
    case "start":  startExam(); break;
    case "resume": S.exam.phase = "run"; renderAll(); break;
    case "discard": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); break;
    case "eans": {
      const e = S.exam, q = e.list[e.pos];
      const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
      if(q.type === "mcq" && q.answer.length === 1 && a[0] === el.dataset.k) el.dataset.was = "1";
      applyAnswer(q, a, el);
      save(); renderMain(); renderAside(); break;
    }
    case "eprev": S.exam.pos = Math.max(0, S.exam.pos-1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "enext": S.exam.pos = Math.min(S.exam.list.length-1, S.exam.pos+1); save(); renderMain(); renderAside(); window.scrollTo({top:0}); break;
    case "eflag": S.exam.flags[S.exam.pos] = !S.exam.flags[S.exam.pos]; save(); renderMain(); renderAside(); break;
    case "esubmit": {
      const e = S.exam;
      const blank = e.list.filter((q,i) => answeredCount(q, e.answers[i]) === 0).length;
      dialog(t("confirmSubmitT"), blank ? t("confirmSubmitD", blank) : t("confirmSubmitD0"), t("confirm"), gradeExam);
      break;
    }
    case "newexam": clearInterval(S.exam.timer);
                    S.exam = {phase:"setup", cfg:S.exam.cfg}; save(); renderAll(); window.scrollTo({top:0}); break;
    case "togglewrong": S.reviewWrongOnly = !S.reviewWrongOnly; renderMain(); break;
  }
});

document.addEventListener("input", ev => {
  const el = ev.target;
  if(el.id === "search"){ S.f.q = el.value; renderMain(); return; }
  if(el.dataset.act === "note"){
    const r = el.closest(".rec");
    if(r){ rec(r.dataset.id).note = el.value; clearTimeout(el._tm); el._tm = setTimeout(save, 400); }
    return;
  }
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); }
});
document.addEventListener("change", ev => {
  const el = ev.target;
  if(el.dataset.cfg && S.exam){ S.exam.cfg[el.dataset.cfg] = el.value; renderMain(); return; }
  if(el.dataset.act === "ans"){
    const r = el.closest(".rec"), q = BY_ID[r.dataset.id];
    if(rec(q.id).done) return;
    applyAnswer(q, ansOf(q), el);
    save(); refreshRecord(q.id, `[data-act="ans"][data-i="${el.dataset.i}"]`); return;
  }
  if(el.dataset.act === "eans"){
    const e = S.exam, q = e.list[e.pos];
    const a = e.answers[e.pos] || (e.answers[e.pos] = blankAnswer(q));
    applyAnswer(q, a, el); save(); renderMain(); renderAside(); return;
  }
  if(el.id === "fileIn" && el.files && el.files[0]){ importData(el.files[0]); el.value = ""; }
});

document.addEventListener("focusin", ev => {
  const r = ev.target.closest && ev.target.closest(".rec");
  if(r && r.dataset.id && r.dataset.id !== S.cur){
    const prev = S.cur ? document.getElementById("rec-"+S.cur) : null;
    if(prev) prev.classList.remove("cur");
    S.cur = r.dataset.id; r.classList.add("cur");
  }
});

$("#themeBtn").addEventListener("click", () => {
  document.documentElement.dataset.theme = document.documentElement.dataset.theme === "light" ? "dark" : "light";
  save();
});
$("#helpBtn").addEventListener("click", helpDialog);
$("#railToggle").addEventListener("click", e => {
  e.currentTarget.setAttribute("aria-expanded", document.body.classList.toggle("rail-open"));
});
$("#btnExport").addEventListener("click", exportData);
$("#btnImport").addEventListener("click", () => $("#fileIn").click());
$("#btnReset").addEventListener("click", () =>
  dialog(t("resetT"), t("resetD"), t("del"), () => {
    S.p = {}; S.history = []; S.cur = null;
    if(S.exam) clearInterval(S.exam.timer);
    S.exam = null;
    store.del(KEY); save(); renderAll(); toast(t("del"));
  }, true));

document.addEventListener("keydown", ev => {
  const tag = (ev.target.tagName || "").toLowerCase();
  const typing = tag === "input" || tag === "textarea" || tag === "select";
  if(ev.key === "Escape"){ $$(".ov").forEach(n => n.remove()); if(typing) ev.target.blur(); return; }
  if(typing) return;
  if(ev.key === "/"){ ev.preventDefault(); $("#search").focus(); return; }
  if(ev.key === "?"){ ev.preventDefault(); helpDialog(); return; }
  if(document.querySelector(".ov")) return;

  const e = S.exam, inExam = S.mode === "exam" && e && e.phase === "run";
  if(inExam){
    if(ev.key === "ArrowLeft"  && e.pos > 0){ e.pos--; save(); renderMain(); renderAside(); return; }
    if(ev.key === "ArrowRight" && e.pos < e.list.length-1){ e.pos++; save(); renderMain(); renderAside(); return; }
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = document.querySelector(`[data-act="eans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ e.flags[e.pos] = !e.flags[e.pos]; save(); renderMain(); renderAside(); return; }
    return;
  }
  if(S.mode === "study" && S.cur){
    const node = document.getElementById("rec-"+S.cur);
    if(!node) return;
    if(/^[a-fA-F]$/.test(ev.key) && ev.key.toLowerCase() !== "f"){
      const b = node.querySelector(`[data-act="ans"][data-k="${ev.key.toUpperCase()}"]`);
      if(b) b.click(); return;
    }
    if(ev.key === "Enter"){
      const b = node.querySelector('[data-act="check"]:not([disabled])') || node.querySelector('[data-act="reveal"]');
      if(b) b.click(); return;
    }
    if(ev.key.toLowerCase() === "f"){ const b = node.querySelector('[data-act="flag"]'); if(b) b.click(); return; }
    if(ev.key === "ArrowDown" || ev.key === "ArrowRight"){ ev.preventDefault(); stepRecord(1); return; }
    if(ev.key === "ArrowUp"   || ev.key === "ArrowLeft"){  ev.preventDefault(); stepRecord(-1); return; }
  }
});
function stepRecord(d){
  const list = $$(".rec");
  const i = list.findIndex(n => n.dataset.id === S.cur);
  const next = list[Math.max(0, Math.min(list.length-1, i+d))];
  if(next){ const b = next.querySelector(".opt, .ynb button, select"); if(b) b.focus(); next.scrollIntoView({block:"nearest"}); }
}

/* ---------- khởi động ---------- */
$("#markCode").textContent = DATA.meta.code;
$$("[data-icon]").forEach(el => el.outerHTML = ICON[el.dataset.icon]);
load();
if(S.exam && S.exam.phase === "run"){ S.mode = "exam"; if(S.exam.duration){ tickTimer(); S.exam.timer = setInterval(tickTimer,1000); } }
renderAll();
