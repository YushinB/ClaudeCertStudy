\u30ec\u30a4\u30d6\u30c3\u30af\u3001\u65e2\u77e5\u306e\u5236\u9650\u4e8b\u9805\u3002"}},{"k":"D","t":{"en":"Source code alone with no integrating architecture overview, ADRs, component contracts, evaluation framework, runbooks, on-call playbook, or known-limitations register to support the delivery team.","vi":"Ch\u1ec9 ri\u00eang m\u00e3 ngu\u1ed3n m\u00e0 kh\u00f4ng c\u00f3 t\u1ed5ng quan v\u1ec1 ki\u1ebfn \u200b\u200btr\u00fac t\u00edch h\u1ee3p, ADR, h\u1ee3p \u0111\u1ed3ng th\u00e0nh ph\u1ea7n, khung \u0111\u00e1nh gi\u00e1, s\u1ed5 tay, s\u1ed5 tay theo y\u00eau c\u1ea7u ho\u1eb7c \u0111\u0103ng k\u00fd gi\u1edbi h\u1ea1n \u0111\u00e3 bi\u1ebft \u0111\u1ec3 h\u1ed7 tr\u1ee3 nh\u00f3m ph\u00e2n ph\u1ed1i.","jp":"\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u306e\u6982\u8981\u3001ADR\u3001\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u5951\u7d04\u3001\u8a55\u4fa1\u30d5\u30ec\u30fc\u30e0\u30ef\u30fc\u30af\u3001\u30e9\u30f3\u30d6\u30c3\u30af\u3001\u30aa\u30f3\u30b3\u30fc\u30eb \u30d7\u30ec\u30a4\u30d6\u30c3\u30af\u3001\u307e\u305f\u306f\u65e2\u77e5\u306e\u5236\u9650\u304c\u7d71\u5408\u3055\u308c\u3066\u3044\u306a\u3044\u30bd\u30fc\u30b9 \u30b3\u30fc\u30c9\u306e\u307f\u304c\u3001\u914d\u4fe1\u30c1\u30fc\u30e0\u3092\u30b5\u30dd\u30fc\u30c8\u3057\u307e\u3059\u3002"}}],"answer":["C"],"multi":false,"explain":{"text":"Option C provides the minimum coherent package required to move from architectural intent to implementable and supportable delivery. The architecture overview establishes system boundaries and component relationships. Architecture Decision Records preserve the context and trade-offs behind key choices. Component contracts define interfaces, schemas, responsibilities, failure behavior, and integration assumptions.<br>The evaluation framework and reference set allow the implementation team to confirm that prompts, models, retrieval components, and tool integrations continue to meet the defined qual..."}},{"id":"ccarp-q029","n":29,"topic":2,"type":"mcq","stem":{"en":"A security audit uncovers two issues: (1) all end users share a single API key, and (2) tool calls are executed without logging the initiating user. Which two mitigations directly address these specific findings? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"Qu\u00e1 tr\u00ecnh ki\u1ec3m tra b\u1ea3o m\u1eadt ph\u00e1t hi\u1ec7n ra hai v\u1ea5n \u0111\u1ec1: (1) t\u1ea5t c\u1ea3 ng\u01b0\u1eddi d\u00f9ng cu\u1ed1i \u0111\u1ec1u chia s\u1ebb m\u1ed9t kh\u00f3a API duy nh\u1ea5t v\u00e0 (2) l\u1ec7nh g\u1ecdi c\u00f4ng c\u1ee5 \u0111\u01b0\u1ee3c th\u1ef1c thi m\u00e0 kh\u00f4ng ghi nh\u1eadt k\u00fd ng\u01b0\u1eddi d\u00f9ng ban \u0111\u1ea7u. Hai bi\u1ec7n ph\u00e1p gi\u1ea3m thi\u1ec3u n\u00e0o tr\u1ef1c ti\u1ebfp gi\u1ea3i quy\u1ebft nh\u1eefng ph\u00e1t hi\u1ec7n c\u1ee5 th\u1ec3 n\u00e0y? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u76e3\u67fb\u306b\u3088\u308a\u3001(1) \u3059\u3079\u3066\u306e\u30a8\u30f3\u30c9 \u30e6\u30fc\u30b6\u30fc\u304c\u5358\u4e00\u306e API \u30ad\u30fc\u3092\u5171\u6709\u3059\u308b\u3001(2) \u958b\u59cb\u30e6\u30fc\u30b6\u30fc\u306e\u30ed\u30b0\u3092\u8a18\u9332\u305b\u305a\u306b\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u304c\u5b9f\u884c\u3055\u308c\u308b\u3068\u3044\u3046 2 \u3064\u306e\u554f\u984c\u304c\u660e\u3089\u304b\u306b\u306a\u308a\u307e\u3059\u3002 \u3053\u308c\u3089\u306e\u7279\u5b9a\u306e\u8abf\u67fb\u7d50\u679c\u306b\u76f4\u63a5\u5bfe\u51e6\u3059\u308b 2 \u3064\u306e\u7de9\u548c\u7b56\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Validate structured outputs against a schema before downstream actions are executed.","vi":"X\u00e1c th\u1ef1c c\u00e1c k\u1ebft qu\u1ea3 \u0111\u1ea7u ra c\u00f3 c\u1ea5u tr\u00fac d\u1ef1a tr\u00ean l\u01b0\u1ee3c \u0111\u1ed3 tr\u01b0\u1edbc khi th\u1ef1c thi c\u00e1c h\u00e0nh \u0111\u1ed9ng ti\u1ebfp theo.","jp":"\u30c0\u30a6\u30f3\u30b9\u30c8\u30ea\u30fc\u30e0\u30a2\u30af\u30b7\u30e7\u30f3\u304c\u5b9f\u884c\u3055\u308c\u308b\u524d\u306b\u3001\u30b9\u30ad\u30fc\u30de\u306b\u5bfe\u3057\u3066\u69cb\u9020\u5316\u51fa\u529b\u3092\u691c\u8a3c\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Enforce RBAC at the retrieval layer before content enters the model context.","vi":"Th\u1ef1c thi RBAC \u1edf l\u1edbp truy xu\u1ea5t tr\u01b0\u1edbc khi n\u1ed9i dung \u0111i v\u00e0o ng\u1eef c\u1ea3nh m\u00f4 h\u00ecnh.","jp":"\u30b3\u30f3\u30c6\u30f3\u30c4\u304c\u30e2\u30c7\u30eb \u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u306b\u5165\u308b\u524d\u306b\u3001\u53d6\u5f97\u30ec\u30a4\u30e4\u30fc\u3067 RBAC \u3092\u5f37\u5236\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Move credentials out of the prompt context and resolve them from a server-side secret store.","vi":"Di chuy\u1ec3n th\u00f4ng tin x\u00e1c th\u1ef1c ra kh\u1ecfi ng\u1eef c\u1ea3nh \u0111\u01b0\u1ee3c nh\u1eafc v\u00e0 gi\u1ea3i quy\u1ebft ch\u00fang t\u1eeb kho l\u01b0u tr\u1eef b\u00ed m\u1eadt ph\u00eda m\u00e1y ch\u1ee7.","jp":"\u8cc7\u683c\u60c5\u5831\u3092\u30d7\u30ed\u30f3\u30d7\u30c8 \u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u306e\u5916\u306b\u79fb\u52d5\u3057\u3001\u30b5\u30fc\u30d0\u30fc\u5074\u306e\u30b7\u30fc\u30af\u30ec\u30c3\u30c8 \u30b9\u30c8\u30a2\u304b\u3089\u89e3\u6c7a\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Add actor attribution to tool-call logs so each call records the initiating user identity.","vi":"Th\u00eam ph\u00e2n b\u1ed5 t\u00e1c nh\u00e2n v\u00e0o nh\u1eadt k\u00fd cu\u1ed9c g\u1ecdi c\u00f4ng c\u1ee5 \u0111\u1ec3 m\u1ed7i cu\u1ed9c g\u1ecdi ghi l\u1ea1i danh t\u00ednh ng\u01b0\u1eddi d\u00f9ng b\u1eaft \u0111\u1ea7u.","jp":"\u30a2\u30af\u30bf\u30fc\u306e\u5c5e\u6027\u3092\u30c4\u30fc\u30eb\u547c\u3073\u51fa\u3057\u30ed\u30b0\u306b\u8ffd\u52a0\u3057\u3066\u3001\u5404\u547c\u3073\u51fa\u3057\u304c\u958b\u59cb\u30e6\u30fc\u30b6\u30fc ID \u3092\u8a18\u9332\u3067\u304d\u308b\u3088\u3046\u306b\u3057\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Replace the shared API key with per-user OAuth tokens carrying scope-restricted permissions.","vi":"Thay th\u1ebf kh\u00f3a API \u0111\u01b0\u1ee3c chia s\u1ebb b\u1eb1ng m\u00e3 th\u00f4ng b\u00e1o OAuth cho m\u1ed7i ng\u01b0\u1eddi d\u00f9ng mang c\u00e1c quy\u1ec1n c\u00f3 gi\u1edbi h\u1ea1n ph\u1ea1m vi.","jp":"\u5171\u6709 API \u30ad\u30fc\u3092\u3001\u30b9\u30b3\u30fc\u30d7\u5236\u9650\u3055\u308c\u305f\u30a2\u30af\u30bb\u30b9\u8a31\u53ef\u3092\u6301\u3064\u30e6\u30fc\u30b6\u30fc\u3054\u3068\u306e OAuth \u30c8\u30fc\u30af\u30f3\u306b\u7f6e\u304d\u63db\u3048\u307e\u3059\u3002"}}],"answer":["D","E"],"multi":true,"explain":{"text":"Per-user, scope-restricted OAuth tokens directly eliminate the shared-credential weakness. Each token represents a distinct user or delegated identity, carries only the permissions required for that user's role, and can be revoked independently. This supports least privilege, limits the blast radius of credential compromise, and enables authorization decisions to be tied to a specific principal instead of an undifferentiated shared API key.<br>Actor attribution in tool-call logs directly resolves the second finding. Each audit event should record the authenticated user, delegated service identity..."}},{"id":"ccarp-q030","n":30,"topic":2,"type":"mcq","stem":{"en":"An architect is reviewing a Claude-based candidate-screening tool prior to deployment. A stakeholder asserts that because the model was not trained on company data, no bias evaluation is necessary. Which two responses most accurately challenge this assertion? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"M\u1ed9t ki\u1ebfn \u200b\u200btr\u00fac s\u01b0 \u0111ang xem x\u00e9t c\u00f4ng c\u1ee5 s\u00e0ng l\u1ecdc \u1ee9ng vi\u00ean d\u1ef1a tr\u00ean Claude tr\u01b0\u1edbc khi tri\u1ec3n khai. M\u1ed9t b\u00ean li\u00ean quan kh\u1eb3ng \u0111\u1ecbnh r\u1eb1ng v\u00ec m\u00f4 h\u00ecnh kh\u00f4ng \u0111\u01b0\u1ee3c \u0111\u00e0o t\u1ea1o d\u1ef1a tr\u00ean d\u1eef li\u1ec7u c\u1ee7a c\u00f4ng ty n\u00ean kh\u00f4ng c\u1ea7n \u0111\u00e1nh gi\u00e1 sai l\u1ec7ch. Hai c\u00e2u tr\u1ea3 l\u1eddi n\u00e0o th\u00e1ch th\u1ee9c ch\u00ednh x\u00e1c nh\u1ea5t kh\u1eb3ng \u0111\u1ecbnh n\u00e0y? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306f\u3001\u5c0e\u5165\u524d\u306b\u30af\u30ed\u30fc\u30c9\u30d9\u30fc\u30b9\u306e\u5019\u88dc\u8005\u30b9\u30af\u30ea\u30fc\u30cb\u30f3\u30b0 \u30c4\u30fc\u30eb\u3092\u30ec\u30d3\u30e5\u30fc\u3057\u3066\u3044\u307e\u3059\u3002\u95a2\u4fc2\u8005\u306f\u3001\u30e2\u30c7\u30eb\u304c\u4f01\u696d\u30c7\u30fc\u30bf\u306b\u57fa\u3065\u3044\u3066\u30c8\u30ec\u30fc\u30cb\u30f3\u30b0\u3055\u308c\u3066\u3044\u306a\u3044\u305f\u3081\u3001\u30d0\u30a4\u30a2\u30b9\u8a55\u4fa1\u306f\u5fc5\u8981\u306a\u3044\u3068\u4e3b\u5f35\u3057\u3066\u3044\u307e\u3059\u3002 \u3053\u306e\u4e3b\u5f35\u306b\u6700\u3082\u6b63\u78ba\u306b\u7570\u8b70\u3092\u5531\u3048\u308b 2 \u3064\u306e\u56de\u7b54\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Transparency obligations are satisfied by disclosing that an AI system is in use, without further evaluation.","vi":"Ngh\u0129a v\u1ee5 minh b\u1ea1ch \u0111\u01b0\u1ee3c \u0111\u00e1p \u1ee9ng b\u1eb1ng c\u00e1ch ti\u1ebft l\u1ed9 r\u1eb1ng h\u1ec7 th\u1ed1ng AI \u0111ang \u0111\u01b0\u1ee3c s\u1eed d\u1ee5ng m\u00e0 kh\u00f4ng c\u1ea7n \u0111\u00e1nh gi\u00e1 th\u00eam.","jp":"\u900f\u660e\u6027\u7fa9\u52d9\u306f\u3001\u3055\u3089\u306a\u308b\u8a55\u4fa1\u3092\u884c\u308f\u305a\u306b AI \u30b7\u30b9\u30c6\u30e0\u304c\u4f7f\u7528\u3055\u308c\u3066\u3044\u308b\u3053\u3068\u3092\u958b\u793a\u3059\u308b\u3053\u3068\u3067\u6e80\u305f\u3055\u308c\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Fairness testing is required only when the training dataset is known to contain protected-class labels.","vi":"Ki\u1ec3m tra t\u00ednh c\u00f4ng b\u1eb1ng ch\u1ec9 \u0111\u01b0\u1ee3c y\u00eau c\u1ea7u khi t\u1eadp d\u1eef li\u1ec7u hu\u1ea5n luy\u1ec7n \u0111\u01b0\u1ee3c bi\u1ebft l\u00e0 c\u00f3 ch\u1ee9a nh\u00e3n l\u1edbp \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7.","jp":"\u516c\u5e73\u6027\u30c6\u30b9\u30c8\u306f\u3001\u30c8\u30ec\u30fc\u30cb\u30f3\u30b0 \u30c7\u30fc\u30bf\u30bb\u30c3\u30c8\u306b\u4fdd\u8b77\u30af\u30e9\u30b9 \u30e9\u30d9\u30eb\u304c\u542b\u307e\u308c\u3066\u3044\u308b\u3053\u3068\u304c\u308f\u304b\u3063\u3066\u3044\u308b\u5834\u5408\u306b\u306e\u307f\u5fc5\u8981\u3067\u3059\u3002"}},{"k":"C","t":{"en":"The model may carry demographic biases from pretraining that manifest in screening outcomes regardless of fine-tuning.","vi":"M\u00f4 h\u00ecnh n\u00e0y c\u00f3 th\u1ec3 mang theo nh\u1eefng th\u00e0nh ki\u1ebfn \u200b\u200bv\u1ec1 nh\u00e2n kh\u1ea9u h\u1ecdc t\u1eeb qu\u00e1 tr\u00ecnh \u0111\u00e0o t\u1ea1o tr\u01b0\u1edbc, bi\u1ec3u hi\u1ec7n \u1edf k\u1ebft qu\u1ea3 s\u00e0ng l\u1ecdc b\u1ea5t k\u1ec3 tinh ch\u1ec9nh.","jp":"\u30e2\u30c7\u30eb\u306b\u306f\u3001\u5fae\u8abf\u6574\u306b\u95a2\u4fc2\u306a\u304f\u3001\u30b9\u30af\u30ea\u30fc\u30cb\u30f3\u30b0\u7d50\u679c\u306b\u73fe\u308c\u308b\u4e8b\u524d\u30c8\u30ec\u30fc\u30cb\u30f3\u30b0\u306b\u3088\u308b\u4eba\u53e3\u7d71\u8a08\u4e0a\u306e\u30d0\u30a4\u30a2\u30b9\u304c\u542b\u307e\u308c\u308b\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"D","t":{"en":"The system should be evaluated on outcome-disparity metrics across protected groups before deployment.","vi":"H\u1ec7 th\u1ed1ng ph\u1ea3i \u0111\u01b0\u1ee3c \u0111\u00e1nh gi\u00e1 d\u1ef1a tr\u00ean c\u00e1c s\u1ed1 li\u1ec7u ch\u00eanh l\u1ec7ch v\u1ec1 k\u1ebft qu\u1ea3 gi\u1eefa c\u00e1c nh\u00f3m \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 tr\u01b0\u1edbc khi tri\u1ec3n khai.","jp":"\u30b7\u30b9\u30c6\u30e0\u306f\u3001\u5c55\u958b\u524d\u306b\u3001\u4fdd\u8b77\u3055\u308c\u305f\u30b0\u30eb\u30fc\u30d7\u9593\u306e\u7d50\u679c\u683c\u5dee\u30e1\u30c8\u30ea\u30af\u30b9\u306b\u57fa\u3065\u3044\u3066\u8a55\u4fa1\u3055\u308c\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Bias evaluation is unnecessary when the model provider has published a responsible-use policy.","vi":"\u0110\u00e1nh gi\u00e1 sai l\u1ec7ch l\u00e0 kh\u00f4ng c\u1ea7n thi\u1ebft khi nh\u00e0 cung c\u1ea5p m\u00f4 h\u00ecnh \u0111\u00e3 c\u00f4ng b\u1ed1 ch\u00ednh s\u00e1ch s\u1eed d\u1ee5ng c\u00f3 tr\u00e1ch nhi\u1ec7m.","jp":"\u30e2\u30c7\u30eb\u30d7\u30ed\u30d0\u30a4\u30c0\u30fc\u304c\u8cac\u4efb\u3042\u308b\u4f7f\u7528\u30dd\u30ea\u30b7\u30fc\u3092\u516c\u958b\u3057\u3066\u3044\u308b\u5834\u5408\u3001\u30d0\u30a4\u30a2\u30b9\u8a55\u4fa1\u306f\u4e0d\u8981\u3067\u3059\u3002"}}],"answer":["C","D"],"multi":true,"explain":{"text":"The absence of company-specific training does not establish unbiased behavior. A foundation model may reflect demographic associations or unequal treatment patterns originating from pretraining data, model behavior, prompt framing, retrieval content, or the surrounding decision workflow.<br>Because candidate screening can materially affect employment opportunities, the complete system must be evaluated across relevant protected groups before deployment. Appropriate measures include selection-rate differences, false- positive and false-negative rates, calibration, intersectional slices, and human ..."}},{"id":"ccarp-q031","n":31,"topic":2,"type":"mcq","stem":{"en":"You are distinguishing functional from non-functional requirements during discovery. Which item is a non-functional requirement?","vi":"B\u1ea1n \u0111ang ph\u00e2n bi\u1ec7t c\u00e1c y\u00eau c\u1ea7u ch\u1ee9c n\u0103ng v\u00e0 phi ch\u1ee9c n\u0103ng trong qu\u00e1 tr\u00ecnh kh\u00e1m ph\u00e1. M\u1ee5c n\u00e0o l\u00e0 y\u00eau c\u1ea7u phi ch\u1ee9c n\u0103ng?","jp":"\u691c\u51fa\u4e2d\u306b\u6a5f\u80fd\u8981\u4ef6\u3068\u975e\u6a5f\u80fd\u8981\u4ef6\u3092\u533a\u5225\u3057\u307e\u3059\u3002 \u3069\u306e\u9805\u76ee\u304c\u975e\u6a5f\u80fd\u8981\u4ef6\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"The system must extract a defined set of specific fields from invoice attachments and populate a downstream data record.","vi":"H\u1ec7 th\u1ed1ng ph\u1ea3i tr\u00edch xu\u1ea5t m\u1ed9t t\u1eadp h\u1ee3p c\u00e1c tr\u01b0\u1eddng c\u1ee5 th\u1ec3 \u0111\u00e3 x\u00e1c \u0111\u1ecbnh t\u1eeb t\u1ec7p \u0111\u00ednh k\u00e8m h\u00f3a \u0111\u01a1n v\u00e0 \u0111i\u1ec1n v\u00e0o b\u1ea3n ghi d\u1eef li\u1ec7u xu\u00f4i d\u00f2ng.","jp":"\u30b7\u30b9\u30c6\u30e0\u306f\u3001\u8acb\u6c42\u66f8\u306e\u6dfb\u4ed8\u30d5\u30a1\u30a4\u30eb\u304b\u3089\u5b9a\u7fa9\u6e08\u307f\u306e\u7279\u5b9a\u30d5\u30a3\u30fc\u30eb\u30c9\u306e\u30bb\u30c3\u30c8\u3092\u62bd\u51fa\u3057\u3001\u30c0\u30a6\u30f3\u30b9\u30c8\u30ea\u30fc\u30e0 \u30c7\u30fc\u30bf \u30ec\u30b3\u30fc\u30c9\u306b\u30c7\u30fc\u30bf\u3092\u5165\u529b\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"B","t":{"en":"The system must produce a draft response that a human reviewer can edit before sending.","vi":"H\u1ec7 th\u1ed1ng ph\u1ea3i t\u1ea1o ra ph\u1ea3n h\u1ed3i nh\u00e1p m\u00e0 ng\u01b0\u1eddi \u0111\u00e1nh gi\u00e1 c\u00f3 th\u1ec3 ch\u1ec9nh s\u1eeda tr\u01b0\u1edbc khi g\u1eedi.","jp":"\u30b7\u30b9\u30c6\u30e0\u306f\u3001\u4eba\u9593\u306e\u30ec\u30d3\u30e5\u30fc\u62c5\u5f53\u8005\u304c\u9001\u4fe1\u524d\u306b\u7de8\u96c6\u3067\u304d\u308b\u5fdc\u7b54\u8349\u6848\u3092\u4f5c\u6210\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"C","t":{"en":"The system must classify inbound tickets into a defined set of categories.","vi":"H\u1ec7 th\u1ed1ng ph\u1ea3i ph\u00e2n lo\u1ea1i v\u00e9 v\u00e0o th\u00e0nh m\u1ed9t nh\u00f3m danh m\u1ee5c x\u00e1c \u0111\u1ecbnh.","jp":"\u30b7\u30b9\u30c6\u30e0\u306f\u3001\u53d7\u4fe1\u30c1\u30b1\u30c3\u30c8\u3092\u5b9a\u7fa9\u3055\u308c\u305f\u4e00\u9023\u306e\u30ab\u30c6\u30b4\u30ea\u306b\u5206\u985e\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a t establish performance on the organization's prompts, data, edge cases, tools, or required output format.<br>Anthropic recommends benchmark tests specific ..."}},{"id":"ccarp-q038","n":38,"topic":2,"type":"mcq","stem":{"en":"The engineering lead at Trenova Systems, Inc. is evaluating two proposals for improving developer workflows using Claude-assisted tooling. Proposal A adds Claude Code to the IDE for inline code generation and review. Proposal B routes all code-generation requests through a shared Slack bot without IDE integration. Which two observations most accurately evaluate these proposals against workflow-improvement objectives? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"Tr\u01b0\u1edfng nh\u00f3m k\u1ef9 thu\u1eadt t\u1ea1i Trenova Systems, Inc. \u0111ang \u0111\u00e1nh gi\u00e1 hai \u0111\u1ec1 xu\u1ea5t nh\u1eb1m c\u1ea3i thi\u1ec7n quy tr\u00ecnh l\u00e0m vi\u1ec7c c\u1ee7a nh\u00e0 ph\u00e1t tri\u1ec3n b\u1eb1ng c\u00e1ch s\u1eed d\u1ee5ng c\u00f4ng c\u1ee5 \u0111\u01b0\u1ee3c Claude h\u1ed7 tr\u1ee3. \u0110\u1ec1 xu\u1ea5t A th\u00eam M\u00e3 Claude v\u00e0o IDE \u0111\u1ec3 t\u1ea1o v\u00e0 xem x\u00e9t m\u00e3 n\u1ed9i tuy\u1ebfn. \u0110\u1ec1 xu\u1ea5t B \u0111\u1ecbnh tuy\u1ebfn t\u1ea5t c\u1ea3 c\u00e1c y\u00eau c\u1ea7u t\u1ea1o m\u00e3 th\u00f4ng qua bot Slack \u0111\u01b0\u1ee3c chia s\u1ebb m\u00e0 kh\u00f4ng t\u00edch h\u1ee3p IDE. Hai quan s\u00e1t n\u00e0o \u0111\u00e1nh gi\u00e1 ch\u00ednh x\u00e1c nh\u1ea5t nh\u1eefng \u0111\u1ec1 xu\u1ea5t n\u00e0y so v\u1edbi c\u00e1c m\u1ee5c ti\u00eau c\u1ea3i thi\u1ec7n quy tr\u00ecnh l\u00e0m vi\u1ec7c? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"Trenova Systems, Inc. \u306e\u30a8\u30f3\u30b8\u30cb\u30a2\u30ea\u30f3\u30b0 \u30ea\u30fc\u30c0\u30fc\u306f\u3001Claude \u652f\u63f4\u30c4\u30fc\u30eb\u3092\u4f7f\u7528\u3057\u3066\u958b\u767a\u8005\u306e\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u3092\u6539\u5584\u3059\u308b\u305f\u3081\u306e 2 \u3064\u306e\u63d0\u6848\u3092\u8a55\ au c\u1ea7u c\u00e1c nh\u00e0 ph\u00e1t tri\u1ec3n r\u1eddi kh\u1ecfi IDE, l\u00e0m suy y\u1ebfu m\u1ee5c ti\u00eau n\u0103ng su\u1ea5t.","jp":"\u63d0\u6848 B \u306f\u3001\u958b\u767a\u8005\u306b IDE \u304b\u3089\u96e2\u308c\u308b\u3053\u3068\u3092\u8981\u6c42\u3059\u308b\u3053\u3068\u3067\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u306e\u6469\u64e6\u3092\u5f15\u304d\u8d77\u3053\u3057\u3001\u751f\u7523\u6027\u76ee\u6a19\u3092\u640d\u306a\u3044\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Proposal A reduces context switching by providing AI assistance at the point of development without requiring a separate tool.","vi":"\u0110\u1ec1 xu\u1ea5t A gi\u1ea3m vi\u1ec7c chuy\u1ec3n \u0111\u1ed5i ng\u1eef c\u1ea3nh b\u1eb1ng c\u00e1ch cung c\u1ea5p h\u1ed7 tr\u1ee3 AI t\u1ea1i th\u1eddi \u0111i\u1ec3m ph\u00e1t tri\u1ec3n m\u00e0 kh\u00f4ng y\u00eau c\u1ea7u c\u00f4ng c\u1ee5 ri\u00eang.","jp":"\u63d0\u6848 A \u3067\u306f\u3001\u5225\u306e\u30c4\u30fc\u30eb\u3092\u5fc5\u8981\u3068\u305b\u305a\u306b\u958b\u767a\u6642\u70b9\u3067 AI \u652f\u63f4\u3092\u63d0\u4f9b\u3059\u308b\u3053\u3068\u3067\u3001\u30b3\u30f3\u30c6\u30ad\u30b9\u30c8\u306e\u5207\u308a\u66ff\u3048\u3092\u524a\u6e1b\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Proposal B improves workflow velocity because Slack notifications create an asynchronous review queue.","vi":"\u0110\u1ec1 xu\u1ea5t B c\u1ea3i thi\u1ec7n t\u1ed1c \u0111\u1ed9 lu\u1ed3ng c\u00f4ng vi\u1ec7c v\u00ec th\u00f4ng b\u00e1o Slack t\u1ea1o ra h\u00e0ng \u0111\u1ee3i \u0111\u00e1nh gi\u00e1 kh\u00f4ng \u0111\u1ed3ng b\u1ed9.","jp":"\u63d0\u6848 B \u3067\u306f\u3001Slack \u901a\u77e5\u306b\u3088\u3063\u3066\u975e\u540c\u671f\u30ec\u30d3\u30e5\u30fc \u30ad\u30e5\u30fc\u304c\u4f5c\u6210\u3055\u308c\u308b\u305f\u3081\u3001\u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u306e\u901f\u5ea6\u304c\u5411\u4e0a\u3057\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Both proposals are equivalent because the model capabilities are identical regardless of the integration point.","vi":"C\u1ea3 hai \u0111\u1ec1 xu\u1ea5t \u0111\u1ec1u t\u01b0\u01a1ng \u0111\u01b0\u01a1ng v\u00ec kh\u1ea3 n\u0103ng c\u1ee7a m\u00f4 h\u00ecnh gi\u1ed1ng h\u1ec7t nhau b\u1ea5t k\u1ec3 \u0111i\u1ec3m t\u00edch h\u1ee3p.","jp":"\u30e2\u30c7\u30eb\u306e\u6a5f\u80fd\u306f\u7d71\u5408\u30dd\u30a4\u30f3\u30c8\u306b\u95a2\u4fc2\u306a\u304f\u540c\u4e00\u3067\u3042\u308b\u305f\u3081\u3001\u4e21\u65b9\u306e\u63d0\u6848\u306f\u540c\u7b49\u3067\u3059\u3002"}}],"answer":["B","C"],"multi":true,"explain":{"text":"Workflow improvement depends on where assistance is delivered, not solely on the underlying model. IDE integration makes code, selections, diagnostics, diffs, and repository context available at the point where developers work. This reduces context switching and avoids repeatedly transferring code between systems.<br>Routing every request through Slack introduces an additional interaction surface, separates assistance from development context, and increases friction. A Slack record may support auditability, but it does not outweigh the stated productivity objective, and equivalent audit data can ..."}},{"id":"ccarp-q039","n":39,"topic":2,"type":"mcq","stem":{"en":"A document analysis service processes legal filings averaging 80,000 tokens each. Each filing is queried by attorneys an average of 14 times during a case. The current architecture sends the full filing on every query. The CFO has asked you to reduce per-query costs while preserving response quality. The security officer requires that filing contents not be stored outside Fabrikam's tenancy. Which optimization approach should you recommend?","vi":"D\u1ecbch v\u1ee5 ph\u00e2n t\u00edch t\u00e0i li\u1ec7u x\u1eed l\u00fd c\u00e1c h\u1ed3 s\u01a1 ph\u00e1p l\u00fd trung b\u00ecnh m\u1ed7i h\u1ed3 s\u01a1 c\u00f3 80.000 token. M\u1ed7i h\u1ed3 s\u01a1 \u0111\u01b0\u1ee3c lu\u1eadt s\u01b0 truy v\u1ea5n trung b\u00ecnh 14 l\u1ea7n trong m\u1ed9t v\u1ee5 \u00e1n. Ki\u1ebfn tr\u00fac hi\u1ec7n t\u1ea1i s\u1ebd g\u1eedi h\u1ed3 s\u01a1 \u0111\u1ea7y \u0111\u1ee7 cho m\u1ecdi truy v\u1ea5n. Gi\u00e1m \u0111\u1ed1c t\u00e0i ch\u00ednh \u0111\u00e3 y\u00eau c\u1ea7u b\u1ea1n gi\u1ea3m chi ph\u00ed cho m\u1ed7i truy v\u1ea5n trong khi v\u1eabn duy tr\u00ec ch\u1ea5t l\u01b0\u1ee3ng ph\u1ea3n h\u1ed3i. Nh\u00e2n vi\u00ean an ninh y\u00eau c\u1ea7u n\u1ed9i dung h\u1ed3 s\u01a1 kh\u00f4ng \u0111\u01b0\u1ee3c l\u01b0u tr\u1eef b\u00ean ngo\u00e0i n\u01a1i thu\u00ea nh\u00e0 c\u1ee7a Fabrikam. B\u1ea1n n\u00ean gi\u1edbi thi\u1ec7u ph\u01b0\u01a1ng ph\u00e1p t\u1ed1i \u01b0u h\u00f3a n\u00e0o?","jp":"\u6587\u66f8\u5206\u6790\u30b5\u30fc\u30d3\u30b9\u306f\u3001\u305d\u308c\u305e\u308c\u5e73\u5747 80,000 \u30c8\u30fc\u30af\u30f3\u306e\u6cd5\u7684\u7533\u8acb\u3092\u51e6\u7406\u3057\u307e\u3059\u3002\u5404\u7533\u8acb\u66f8\u306f\u3001\u8a34\u8a1f\u4e2d\u306b\u5e73\u5747 14 \u56de\u5f01\u8b77\u58eb\u306b\u3088\u3063\u3066\u7167\u4f1a\u3055\u308c\u307e\u3059\u3002\u73fe\u5728\u306e\u30a2\u30fc\u30ad\u30c6\u30af\u30c1\u30e3\u3067\u306f\u3001\u30af\u30a8\u30ea\u3054\u3068\u306b\u5b8c\u5168\u306a\u30d5\u30a1\u30a4\u30eb\u304c\u9001\u4fe1\u3055\u308c\u307e\u3059\u3002 CFO \u306f\u3001\u5fdc\u7b54\u54c1\u8cea\u3092\u7dad\u6301\u3057\u306a\u304c\u3089\u30af\u30a8\u30ea\u3054\u3068\u306e\u30b3\u30b9\u30c8\u3092\u524a\u6e1b\u3059\u308b\u3088\u3046\u4f9d\u983c\u3057\u307e\u3057\u305f\u3002\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3\u62c5\u5f53\u8005\u306f\u3001\u30d5\u30a1\u30a4\u30eb\u306e\u5185\u5bb9\u3092 Fabrikam \u306e\u30c6\u30ca\u30f3\u30c8\u306e\u5916\u306b\u4fdd\u5b58\u3057\u306a\u3044\u3053\u3068\u3092\u8981\u6c42\u3057\u307e\u3059\u3002 \u3069\u306e\u6700\u9069\u5316\u30a2\u30d7\u30ed\u30fc\u30c1\u3092\u63a8\u5968\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Summarize each filing once at intake and run all subsequent queries against the summary.","vi":"T\u00f3m t\u1eaft t\u1eebng h\u1ed3 s\u01a1 m\u1ed9t l\u1ea7n khi ti\u1ebfp nh\u1eadn v\u00e0 th\u1ef1c hi\u1ec7n t\u1ea5t c\u1ea3 c\u00e1c truy v\u1ea5n ti\u1ebfp theo \u0111\u1ed1i v\u1edbi b\u1ea3n t\u00f3m t\u1eaft.","jp":"\u53d6\u308a\u8fbc\u307f\u6642\u306b\u5404\u7533\u8acb\u3092\u4e00\u5ea6\u8981\u7d04\u3057\u3001\u305d\u306e\u8981\u7d04\u306b\u5bfe\u3057\u3066\u5f8c\u7d9a\u306e\u3059\u3079\u3066\u306e\u30af\u30a8\u30ea\u3092\u5b9f\u884c\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Cache the filing as the prompt prefix for reuse across the 14 queries per case.","vi":"L\u01b0u tr\u1eef t\u1ec7p d\u01b0\u1edbi d\u1ea1ng ti\u1ec1n t\u1ed1 nh\u1eafc nh\u1edf \u0111\u1ec3 s\u1eed d\u1ee5ng l\u1ea1i trong 14 truy v\u1ea5n cho m\u1ed7i tr\u01b0\u1eddng h\u1ee3p.","jp":"\u30d5\u30a1\u30a4\u30ea\u30f3\u30b0\u3092\u30d7\u30ed\u30f3\u30d7\u30c8 \u30d7\u30ec\u30d5\u30a3\u30c3\u30af\u30b9\u3068\u3057\u3066\u30ad\u30e3\u30c3\u30b7\u30e5\u3057\u3001\u30b1\u30fc\u30b9\u3054\u3068\u306b 14 \u500b\u306e\u30af\u30a8\u30ea\u3067\u518d\u5229\u7528\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Index filings in a vector store and retrieve only the relevant passages per query.","vi":"L\u1eadp ch\u1ec9 m\u1ee5c c\u00e1c h\u1ed3 s\u01a1 trong kho vect\u01a1 v\u00e0 ch\u1ec9 truy xu\u1ea5t c\u00e1c \u0111o\u1ea1n c\u00f3 li\u00ean quan cho m\u1ed7i truy v\u1ea5n.","jp":"\u30d9\u30af\u30bf\u30fc \u30b9\u30c8\u30a2\u5185\u306e\u30a4\u30f3\u30c7\u30c3\u30af\u30b9 \u30d5\u30a1\u30a4\u30ea\u30f3\u30b0\u306b\u3088\u308a\u3001\u30af\u30a8\u30ea\u3054\u3068\u306b\u95a2\u9023\u3059\u308b\u30d1\u30c3\u30bb\u30fc\u30b8\u306e\u307f\u304c\u53d6\u5f97\u3055\u308c\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Move the workload to a smaller Claude model to reduce the per-token cost paid.","vi":"Chuy\u1ec3n kh\u1ed1i l\u01b0\u1ee3ng c\u00f4ng vi\u1ec7c sang m\u00f4 h\u00ecnh Claude nh\u1ecf h\u01a1n \u0111\u1ec3 gi\u1ea3m chi ph\u00ed tr\u1ea3 cho m\u1ed7i m\u00e3 th\u00f4ng b\u00e1o.","jp":"\u30ef\u30fc\u30af\u30ed\u30fc\u30c9\u3092\u3088\u308a\u5c0f\u3055\u3044\u30af\u30ed\u30fc\u30c9 \u30e2\u30c7\u30eb\u306b\u79fb\u52d5\u3057\u3066\u3001\u30c8\u30fc\u30af\u30f3\u3054\u3068\u306b\u652f\u6255\u308f\u308c\u308b\u30b3\u30b9\u30c8\u3092\u524a\u6e1b\u3057\u307e\u3059\u3002"}}],"answer":["B"],"multi":false,"explain":{"text":"The 80,000-token filing is a large, stable prefix reused across fourteen requests, making prompt caching the strongest optimization. The first request creates the cache; subsequent identical-prefix requests use lower- priced cache reads while retaining the complete filing, preserving the evidence available to Claude. Anthropic documents cache reads at a fraction of standard input cost and confirms that caches are isolated by organization and, on supported platforms, by workspace. Cached representations remain in memory rather than persistent storage. Options A and C may omit context through su..."}},{"id":"ccarp-q040","n":40,"topic":2,"type":"mcq","stem":{"en":"You are designing a test strategy for a Claude-based pipeline that handles sensitive financial data. Which two test types should be prioritized to cover both safety under attack and cross-component correctness? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"B\u1ea1n \u0111ang thi\u1ebft k\u1ebf chi\u1ebfn l\u01b0\u1ee3c th\u1eed nghi\u1ec7m cho quy tr\u00ecnh x\u1eed l\u00fd d\u1eef li\u1ec7u t\u00e0i ch\u00ednh nh\u1ea1y c\u1ea3m c\u00f3 tr\u1ee5 s\u1edf t\u1ea1i Claude. Hai lo\u1ea1i th\u1eed nghi\u1ec7m n\u00e0o n\u00ean \u0111\u01b0\u1ee3c \u01b0u ti\u00ean \u0111\u1ec3 \u0111\u1ea3m b\u1ea3o c\u1ea3 t\u00ednh an to\u00e0n khi b\u1ecb t\u1ea5n c\u00f4ng v\u00e0 t\u00ednh ch\u00ednh x\u00e1c c\u1ee7a nhi\u1ec1u th\u00e0nh ph\u1ea7n? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u3042\u306a\u305f\u306f\u3001\u6a5f\u5bc6\u306e\u8ca1\u52d9\u30c7\u30fc\u30bf\u3092\u51e6\u7406\u3059\u308b\u30af\u30ed\u30fc\u30c9\u30d9\u30fc\u30b9\u306e\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u306e\u30c6\u30b9\u30c8\u6226\u7565\u3092\u8a2d\u8a08\u3057\u3066\u3044\u307e\u3059\u3002 \u653b\u ne behavior across all components.","vi":"Ki\u1ec3m tra t\u00edch h\u1ee3p x\u00e1c minh h\u00e0nh vi \u0111\u01b0\u1eddng \u1ed1ng t\u1eeb \u0111\u1ea7u \u0111\u1ebfn cu\u1ed1i tr\u00ean t\u1ea5t c\u1ea3 c\u00e1c th\u00e0nh ph\u1ea7n.","jp":"\u3059\u3079\u3066\u306e\u30b3\u30f3\u30dd\u30fc\u30cd\u30f3\u30c8\u306b\u308f\u305f\u308b\u30a8\u30f3\u30c9\u30c4\u30fc\u30a8\u30f3\u30c9\u306e\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u52d5\u4f5c\u3092\u691c\u8a3c\u3059\u308b\u7d71\u5408\u30c6\u30b9\u30c8\u3002"}},{"k":"E","t":{"en":"Unit tests targeting only individual prompt-template rendering logic.","vi":"C\u00e1c b\u00e0i ki\u1ec3m tra \u0111\u01a1n v\u1ecb ch\u1ec9 nh\u1eafm m\u1ee5c ti\u00eau logic k\u1ebft xu\u1ea5t m\u1eabu l\u1eddi nh\u1eafc ri\u00eang l\u1ebb.","jp":"\u500b\u3005\u306e\u30d7\u30ed\u30f3\u30d7\u30c8 \u30c6\u30f3\u30d7\u30ec\u30fc\u30c8 \u30ec\u30f3\u30c0\u30ea\u30f3\u30b0 \u30ed\u30b8\u30c3\u30af\u306e\u307f\u3092\u5bfe\u8c61\u3068\u3057\u305f\u5358\u4f53\u30c6\u30b9\u30c8\u3002"}}],"answer":["A","D"],"multi":true,"explain":{"text":"Adversarial tests directly evaluate behavior under attack, including prompt injection, malformed records, malicious document content, credential-extraction attempts, and unauthorized tool requests. Integration tests provide the complementary coverage required by the question: they verify authentication, retrieval, prompt construction, model invocation, validation, logging, and downstream actions as one end-to-end system.<br>Regression, smoke, and unit testing remain valuable, but they do not jointly satisfy the two stated objectives.<br>A stable regression set measures previously established behavio..."}}]},{"n":3,"title":{"en":"Practice Set 3","vi":"B\u1ed9 \u0111\u1ec1 s\u1ed1 3","jp":"\u7df4\u7fd2\u554f\u984c 3"},"questions":[{"id":"ccarp-q041","n":41,"topic":3,"type":"mcq","stem":{"en":"The platform team at Trenova Systems, Inc. needs to reduce per-query cost and p95 latency for a high-volume Claude pipeline without degrading output quality on the core use case. Which two optimizations directly target both cost and latency simultaneously? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"Nh\u00f3m n\u1ec1n t\u1ea3ng t\u1ea1i Trenova Systems, Inc. c\u1ea7n gi\u1ea3m chi ph\u00ed cho m\u1ed7i truy v\u1ea5n v\u00e0 \u0111\u1ed9 tr\u1ec5 p95 cho quy tr\u00ecnh Claude kh\u1ed1i l\u01b0\u1ee3ng l\u1edbn m\u00e0 kh\u00f4ng l\u00e0m gi\u1ea3m ch\u1ea5t l\u01b0\u1ee3ng \u0111\u1ea7u ra trong tr\u01b0\u1eddng h\u1ee3p s\u1eed d\u1ee5ng c\u1ed1t l\u00f5i. Hai ho\u1ea1t \u0111\u1ed9ng t\u1ed1i \u01b0u h\u00f3a n\u00e0o nh\u1eafm m\u1ee5c ti\u00eau tr\u1ef1c ti\u1ebfp \u0111\u1ed3ng th\u1eddi c\u1ea3 chi ph\u00ed v\u00e0 \u0111\u1ed9 tr\u1ec5? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"Trenova Systems, Inc. \u306e\u30d7\u30e9\u30c3\u30c8\u30d5\u30a9\u30fc\u30e0 \u30c1\u30fc\u30e0\u306f\u3001\u30b3\u30a2 \u30e6\u30fc\u30b9\u30b1\u30fc\u30b9\u306e\u51fa\u529b\u54c1\u8cea\u3092\u4f4e\u4e0b\u3055\u305b\u308b\u3053\u3068\u306a\u304f\u3001\u5927\u5bb9\u91cf\u30af\u30ed\u30fc\u30c9 \u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u306e\u30af\u30a8\u30ea\u3054\u3068\u306e\u30b3\u30b9\u30c8\u3068 p95 \u30ec\u30a4\u30c6\u30f3\u30b7\u3092\u524a\u6e1b\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002 \u30b3\u30b9\u30c8\u3068\u30ec\u30a4\u30c6\u30f3\u30b7\u30fc\u306e\u4e21\u65b9\u3092\u540c\u6642\u306b\u76f4\u63a5\u30bf\u30fc\u30b2\u30c3\u30c8\u306b\u3059\u308b 2 \u3064\u306e\u6700\u9069\u5316\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Enable prompt caching on the static system-prompt prefix to reduce billable input tokens on repeated calls.","vi":"B\u1eadt b\u1ed9 nh\u1edb \u0111\u1ec7m l\u1eddi nh\u1eafc tr\u00ean ti\u1ec1n t\u1ed1 l\u1eddi nh\u1eafc h\u1ec7 th\u1ed1ng t\u0129nh \u0111\u1ec3 gi\u1ea3m m\u00e3 th\u00f4ng b\u00e1o \u0111\u1ea7u v\u00e0o ph\u1ea3 \u30c7\u30eb\u3092\u9078\u629e\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Define the quality bar, latency tolerance, and expected volume for the workload.","vi":"X\u00e1c \u0111\u1ecbnh thanh ch\u1ea5t l\u01b0\u1ee3ng, dung sai \u0111\u1ed9 tr\u1ec5 v\u00e0 kh\u1ed1i l\u01b0\u1ee3ng d\u1ef1 ki\u1ebfn \u200b\u200bcho kh\u1ed1i l\u01b0\u1ee3ng c\u00f4ng vi\u1ec7c.","jp":"\u30ef\u30fc\u30af\u30ed\u30fc\u30c9\u306e\u54c1\u8cea\u57fa\u6e96\u3001\u5f85\u3061\u6642\u9593\u8a31\u5bb9\u5024\u3001\u304a\u3088\u3073\u4e88\u60f3\u3055\u308c\u308b\u91cf\u3092\u5b9a\u7fa9\u3057\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Sign off the production rollout plan with the platform and security teams.","vi":"K\u00fd k\u1ebft k\u1ebf ho\u1ea1ch tri\u1ec3n khai s\u1ea3n xu\u1ea5t v\u1edbi n\u1ec1n t\u1ea3ng v\u00e0 nh\u00f3m b\u1ea3o m\u1eadt.","jp":"\u30d7\u30e9\u30c3\u30c8\u30d5\u30a9\u30fc\u30e0\u304a\u3088\u3073\u30bb\u30ad\u30e5\u30ea\u30c6\u30a3 \u30c1\u30fc\u30e0\u3068\u5b9f\u7a3c\u50cd\u5c55\u958b\u8a08\u753b\u3092\u627f\u8a8d\u3057\u307e\u3059\u3002"}}],"answer":["C","D"],"multi":true,"explain":{"text":"Empirical model testing requires a defined decision frame. Option D must occur first because the quality threshold, acceptable latency, expected request volume, and associated cost envelope determine what constitutes a successful result. Without these criteria, a representative-sample test can produce measurements but cannot support a defensible selection.<br>Option C is the next upstream step. Known model capabilities and the workload profile are used to identify a plausible candidate rather than testing models arbitrarily. Anthropic's model-selection guidance recommends evaluating capability, s..."}},{"id":"ccarp-q046","n":46,"topic":3,"type":"mcq","stem":{"en":"You are preparing an operational runbook for a Claude-based service. Which content is essential to include in the runbook?","vi":"B\u1ea1n \u0111ang chu\u1ea9n b\u1ecb s\u1ed5 s\u00e1ch ho\u1ea1t \u0111\u1ed9ng cho d\u1ecbch v\u1ee5 c\u00f3 tr\u1ee5 s\u1edf t\u1ea1i Claude. N\u1ed9i dung n\u00e0o l\u00e0 c\u1ea7n thi\u1ebft \u0111\u1ec3 \u0111\u01b0a v\u00e0o runbook?","jp":"\u3042\u306a\u305f\u306f\u3001Claude \u30d9\u30fc\u30b9\u306e\u30b5\u30fc\u30d3\u30b9\u306e\u904b\u7528 Runbook \u3092\u6e96\u5099\u3057\u3066\u3044\u307e\u3059\u3002 Runbook \u306b\u542b\u3081\u308b\u5fc5\u8981\u304c\u3042\u308b\u30b3\u30f3\u30c6\u30f3\u30c4\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Dashboard and log references only, without alert definitions, triage steps, escalation paths, or rollback procedures for the on-call engineer to act on.","vi":"Ch\u1ec9 tham chi\u1ebfu b\u1ea3ng th\u00f4ng tin v\u00e0 nh\u1eadt k\u00fd, kh\u00f4ng c\u00f3 \u0111\u1ecbnh ngh\u0129a c\u1ea3nh b\u00e1o, c\u00e1c b\u01b0\u1edbc ph\u00e2n lo\u1ea1i, \u0111\u01b0\u1eddng d\u1eabn b\u00e1o c\u00e1o ho\u1eb7c quy tr\u00ecnh kh\u00f4i ph\u1ee5c \u0111\u1ec3 k\u1ef9 s\u01b0 \u0111ang ho\u1ea1t \u0111\u1ed9ng th\u1ef1c hi\u1ec7n.","jp":"\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3068\u30ed\u30b0\u53c2\u7167\u306e\u307f\u3002\u30a2\u30e9\u30fc\u30c8\u5b9a\u7fa9\u3001\u30c8\u30ea\u30a2\u30fc\u30b8\u624b\u9806\u3001\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3 \u30d1\u30b9\u3001\u30aa\u30f3\u30b3\u30fc\u30eb \u30a8\u30f3\u30b8\u30cb\u30a2\u304c\u5bfe\u5fdc\u3059\u308b\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u624b\u9806\u306f\u542b\u307e\u308c\u307e\u305b\u3093\u3002"}},{"k":"B","t":{"en":"Common alerts and their triage steps, escalation paths, rollback procedures, and references to the relevant dashboards and logs.","vi":"C\u00e1c c\u1ea3nh b\u00e1o ph\u1ed5 bi\u1ebfn v\u00e0 c\u00e1c b\u01b0\u1edbc ph\u00e2n lo\u1ea1i, \u0111\u01b0\u1eddng d\u1eabn b\u00e1o c\u00e1o, quy tr\u00ecnh kh\u00f4i ph\u1ee5c c\u0169ng nh\u01b0 c\u00e1c tham chi\u1ebfu \u0111\u1ebfn b\u1ea3ng th\u00f4ng tin v\u00e0 nh\u1eadt k\u00fd c\u00f3 li\u00ean quan.","jp":"\u4e00\u822c\u7684\u306a\u30a2\u30e9\u30fc\u30c8\u3068\u305d\u306e\u30c8\u30ea\u30a2\u30fc\u30b8\u624b\u9806\u3001\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3 \u30d1\u30b9\u3001\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u624b\u9806\u3001\u95a2\u9023\u3059\u308b\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3068\u30ed\u30b0\u3078\u306e\u53c2\u7167\u3002"}},{"k":"C","t":{"en":"Alert definitions and triage steps only, without escalation paths, rollback procedures, or references to dashboards and logs for on-call use.","vi":"Ch\u1ec9 c\u00e1c \u0111\u1ecbnh ngh\u0129a c\u1ea3nh b\u00e1o v\u00e0 c\u00e1c b\u01b0\u1edbc ph\u00e2n lo\u1ea1i, kh\u00f4ng c\u00f3 \u0111\u01b0\u1eddng d\u1eabn b\u00e1o c\u00e1o, quy tr\u00ecnh kh\u00f4i ph\u1ee5c ho\u1eb7c tham chi\u1ebfu \u0111\u1ebfn b\u1ea3ng th\u00f4ng tin v\u00e0 nh\u1eadt k\u00fd \u0111\u1ec3 s\u1eed d\u1ee5ng khi c\u1ea7n thi\u1ebft.","jp":"\u30a2\u30e9\u30fc\u30c8\u5b9a\u7fa9\u3068\u30c8\u30ea\u30a2\u30fc\u30b8\u624b\u9806\u306e\u307f\u3002\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3 \u30d1\u30b9\u3001\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u624b\u9806\u3001\u307e\u305f\u306f\u30aa\u30f3\u30b3\u30fc\u30eb\u3067\u4f7f\u7528\u3059\u308b\u305f\u3081\u306e\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u3068\u30ed\u30b0\u3078\u306e\u53c2\u7167\u306f\u3042\u308a\u307e\u305b\u3093\u3002"}},{"k":"D","t":{"en":"Escalation paths and rollback procedures only, without alert definitions, triage steps, or dashboard references to guide initial incident response.","vi":"Ch\u1ec9 c\u00f3 \u0111\u01b0\u1eddng d\u1eabn leo thang v\u00e0 quy tr\u00ecnh kh\u00f4i ph\u1ee5c, kh\u00f4ng c\u00f3 \u0111\u1ecbnh ngh\u0129a c\u1ea3nh b\u00e1o, c\u00e1c b\u01b0\u1edbc ph\u00e2n lo\u1ea1i ho\u1eb7c tham chi\u1ebfu b\u1ea3ng th\u00f4ng tin \u0111\u1ec3 h\u01b0\u1edbng d\u1eabn \u1ee9ng ph\u00f3 s\u1ef1 c\u1ed1 ban \u0111\u1ea7u.","jp":"\u30a8\u30b9\u30ab\u30ec\u30fc\u30b7\u30e7\u30f3 \u30d1\u30b9\u3068\u30ed\u30fc\u30eb\u30d0\u30c3\u30af\u624b\u9806\u306e\u307f\u3002\u30a2\u30e9\u30fc\u30c8\u5b9a\u7fa9\u3001\u30c8\u30ea\u30a2\u30fc\u30b8\u624b\u9806\u3001\u307e\u305f\u306f\u521d\u671f\u30a4\u30f3\u30b7\u30c7\u30f3\u30c8\u5bfe\u5fdc\u3092\u30ac\u30a4\u30c9\u3059\u308b\u30c0\u30c3\u30b7\u30e5\u30dc\u30fc\u30c9\u53c2\u7167\u306f\u3042\u308a\u307e\u305b\u3093\u3002"}}],"answer":["B"],"multi":false,"explain":{"text":"An actionable runbook must connect detection, diagnosis, containment, recovery, and escalation.<br>Option B supplies that complete operational chain: alerts identify abnormal conditions; triage procedures guide initial investigation; dashboards and logs provide evidence; escalation paths assign authority; and rollback procedures restore a known-safe state. The runbook should cover model errors, latency degradation, rate limits, tool failures, prompt regressions, cost anomalies, datagovernance events, and dependency outages.<br>Anthropic's operational materials demonstrate incident workflows in which..."}},{"id":"ccarp-q047","n":47,"topic":3,"type":"mcq","stem":{"en":"You are designing a feedback session for a deployment in flight. Which structure best supports productive stakeholder feedback?","vi":"B\u1ea1n \u0111ang thi\u1ebft k\u1ebf m\u1ed9t phi\u00ean ph\u1ea3n h\u1ed3i cho vi\u1ec7c tri\u1ec3n khai tr\u00ean chuy\u1ebfn bay. C\u1ea5u tr\u00fac n\u00e0o h\u1ed7 tr\u1ee3 t\u1ed1t nh\u1ea5t cho ph\u1ea3n h\u1ed3i hi\u1ec7u qu\u1ea3 c\u1ee7a c\u00e1c b\u00ean li\u00ean quan?","jp":"\u3042\u306a\u305f\u306f\u3001\u9032\u884c\u4e2d\u306e\u30c7\u30d7\u30ed\u30a4\u30e1\u30f3\u30c8\u306e\u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af \u30bb\u30c3\u30b7\u30e7\u30f3\u3092\u8a2d\u8a08\u3057\u3066\u3044\u307e\u3059\u3002 \u5229\u5bb3\u95a2\u4fc2\u8005\u306e\u751f\u7523\u7684\u306a\u30d5\u30a3\u30fc\u30c9\u30d0\u30c3\u30af\u3092\u6700\u3082\u3088\u304f\u30b5\u30dd\u30fc\u30c8\u3059\u308b\u69cb\u9020\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Hold an open-ended meeting with no pre-distributed agenda or artifacts, and rely on participants' memory to carry decisions and follow-up owners forward.","vi":"T\u1ed5 ch\u1ee9c m\u1ed9t cu\u1ed9c h\u1ecdp m\u1edf m\u00e0 kh\u00f4ng c\u00f3 ch\u01b0\u01a1ng tr\u00ecnh ngh\u1ecb s\u1ef1 ho\u1eb7c \u0111\u1ed3 t\u1ea1o t\u00e1c \u0111\u01b0\u1ee3c ph\u00e2n ph\u1ed1i tr\u01b0\u1edbc v\u00e0 d\u1ef1a v\u00e0o tr\u00ed nh\u1edb c\u1ee7a nh\u1eefng ng\u01b0\u1eddi tham gia \u0111\u1ec3 \u0111\u01b0a ra c\u00e1c quy\u1ebft \u0111\u1ecbnh v\u00e0 ch\u1ee7 s\u1edf h\u1eefu theo d\u00f5i ti\u1ebfp theo.","jp":"\u4e8b\u524d\u306b\u914d\u5e03\u3055\u308c\u305f\u8b70\u984c\u3084\u6210\u679c\u7269\u306e\u306a\u3044\u81ea\u7531\u5f62\u5f0f\u306e\u4f1a\u8b70\u3092\u958b\u50ac\u3057\u3001\u53c2\u52a0\u8005\u306e\u8a18\u61b6\u306b\u983c\u3063\u3066\u610f\u601d\u6c7a\u5b9a\u3092\u9032\u3081\u3001\u30aa\u30fc\u30ca\u30fc\u3092\u30d5\u30a9\u30ed\u30fc\u30a2\u30c3\u30d7\u3057\u307e\u3059\u3002"}},{"k":"B","t":{"en":"Define a focused agenda, share the artifacts in advance, capture decisions and follow-ups in writing, and confirm action owners and dates.","vi":"X\u00e1c \u0111\u1ecbnh ch\u01b0\u01a1ng tr\u00ecnh ngh\u1ecb s\u1ef1 t\u1eadp trung, chia s\u1ebb tr\u01b0\u1edbc c\u00e1c n\u1ed9i dung, n\u1eafm b\u1eaft c\u00e1c quy\u1ebft \u0111\u1ecbnh v\u00e0 theo d\u00f5i b\u1eb1ng v\u0103n b\u1ea3n, \u0111\u1ed3ng th\u1eddi x\u00e1c nh\u1eadn ch\u1ee7 s\u1edf h\u1eefu h\u00e0nh \u0111\u1ed9ng v\u00e0 ng\u00e0y th\u00e1ng.","jp":"\u7126\u70b9\u3092\u7d5e\u3063\u305f\u8b70\u984c\u3092\u5b9a\u7fa9\u3057\u3001\u6210\u679c\u7269\u3092\u4e8b\u524d\u306b\u5171\u6709\u3057\u3001\u6c7a\u5b9a\u4e8b\u9805\u3068\u30d5\u30a9\u30ed\u30fc\u30a2\u30c3\u30d7\u3092\u66f8\u9762\u3067\u8a18\u9332\u3057\u3001\u30a2\u30af\u30b7\u30e7\u30f3\u306e\u6240\u6709\u8005\u3068\u65e5\u4ed8\u3092\u78ba\u8a8d\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Distribute artifacts at the session start rather than in advance, so stakeholders review materials in real time without preparation before the discussion begins.","vi":"Ph\u00e2n ph\u1ed1i c\u00e1c hi\u1ec7n v\u1eadt ngay khi b\u1eaft \u0111\u1ea7u phi\u00ean thay v\u00ec tr\u01b0\u1edbc, \u0111\u1ec3 c\u00e1c b\u00ean li\u00ean quan xem x\u00e9t t\u00e0i li\u1ec7u theo th\u1eddi gian th\u1ef1c m\u00e0 kh\u00f4ng c\u1ea7n chu\u1ea9n b\u1ecb tr\u01b0\u1edbc khi cu\u1ed9c th\u1ea3o lu\u1eadn b\u1eaft \u0111\u1ea7u.","jp":"\u30a2\u30fc\u30c6\u30a3\u30d5\u30a1\u30af\u30c8\u3092\u4e8b\u524d\u3067\u306f\u306a\u304f\u30bb\u30c3\u30b7\u30e7\u30f3\u958b\u59cb\u6642\u306b\u914d\u5e03\u3059\u308b\u3053\u3068\u3067\u3001\u95a2\u4fc2\u8005\u306f\u30c7\u30a3\u30b9\u30ab\u30c3\u30b7\u30e7\u30f3\u958b\u59cb\u524d\u306e\u6e96\u5099\u306a\u3057\u3067\u30ea\u30a2\u30eb\u30bf\u30a4\u30e0\u3067\u8cc7\u6599\u3092\u78ba\u8a8d\u3067\u304d\u307e\u3059\u3002"}},{"k":"D","t":{"en":"End the session without recording decisions, follow-up items, action owners, or dates, relying on participant memory to carry the session's outcomes forward.","vi":"K\u1ebft th\u00fac phi\u00ean m\u00e0 kh\u00f4ng ghi l\u1ea1i c\u00e1c quy\u1ebft \u0111\u1ecbnh, m\u1ee5c ti\u1ebfp theo, ch\u1ee7 s\u1edf h\u1eefu h\u00e0nh \u0111\u1ed9ng ho\u1eb7c ng\u00e0y th\u00e1ng, d\u1ef1a v\u00e0o tr\u00ed nh\u1edb c\u1ee7a ng\u01b0\u1eddi tham gia \u0111\u1ec3 chuy\u1ec3n ti\u1ebfp k\u1ebft qu\u1ea3 c\u1ee7a phi\u00ean.","jp":"\u6c7a\u5b9a\u4e8b\u9805\u3001\u30d5\u30a9\u30ed\u30fc\u30a2\u30c3\u30d7\u9805\u76ee\u3001\u30a2\u30af\u30b7\u30e7\u30f3\u6240\u6709\u8005\u3001\u307e\u305f\u306f\u65e5\u4ed8\u3092\u8a18\u9332\u305b\u305a\u306b\u30bb\u30c3\u30b7\u30e7\u30f3\u3092\u7d42\u4e86\u3057\u3001\u53c2\u52a0\u8005\u306e\u8a18\u61b6\u306b\u983c\u3063\u3066\u30bb\u30c3\u30b7\u30e7\u30f3\u306e\u7d50\u679c\u3092\u9032\u3081\u307e\u3059\u3002"}}],"answer":["B"],"multi":false,"explain":{"text":"A structured feedback session must enable informed review, traceable decisions, and accountable follow- through. Option B allows stakeholders to examine architecture diagrams, evaluation results, risk registers, or prototypes before the meeting. The focused agenda keeps discussion aligned with decisions that must be made rather than allowing the session to become an unstructured status conversation. Written decision records prevent different participants from leaving with incompatible interpretations. Assigning an owner and due date to every action converts feedback into executable delivery wo..."}},{"id":"ccarp-q048","n":48,"topic":3,"type":"mcq","stem":{"en":"You are integrating AI-assisted tooling into the team's documentation workflow. The team wants generated documentation that stays grounded in the actual code. Which integration approach best fits this requirement?","vi":"B\u1ea1n \u0111ang t\u00edch h\u1ee3p c\u00f4ng c\u1ee5 \u0111\u01b0\u1ee3c h\u1ed7 tr\u1ee3 b\u1edfi AI v\u00e0o quy tr\u00ecnh l\u00e0m vi\u1ec7c v\u1ec1 t\u00e0i li\u1ec7u c\u1ee7a nh\u00f3m. Nh\u00f3m mu\u1ed1n t\u00e0i li\u1ec7u \u0111\u01b0\u1ee3c t\u1ea1o d\u1ef1a tr\u00ean m\u00e3 th\u1ef1c t\u1ebf. Ph\u01b0\u01a1ng ph\u00e1p t\u00edch h\u1ee3p n\u00e0o ph\u00f9 h\u1ee3p nh\u1ea5t v\u1edbi y\u00eau c\u1ea7u n\u00e0y?","jp":"\u3042\u306a\u305f\u306f\u3001AI \u652f\u63f4\u30c4\u30fc\u30eb\u3092\u30c1\u30fc\u30e0\u306e\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8 \u30ef\u30fc\u30af\u30d5\u30ed\u30fc\u306b\u7d71\u5408\u3057\u3066\u3044\u307e\u3059\u3002\u30c1\u30fc\u30e0\u306f\u3001\u5b9f\u969b\u306e\u30b3\u30fc\u30c9\u306b\u57fa\u3065\u3044\u305f\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u3092\u751f\u6210\u3057\u305f\u3044\u3068\u8003\u3048\u3066\u3044\u307e\u3059\u3002 \u3053\u306e\u8981\u4ef6\u306b\u6700\u3082\u9069\u3057\u305f\u7d71\u5408\u30a2\u30d7\u30ed\u30fc\u30c1\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Generate documentation from the model's training-data recall without reading any of the actual repository code, accepting that the output will not reflect the current implementation.","vi":"T\u1ea1o t\u00e0i li\u1ec7u t\u1eeb vi\u1ec7c thu h\u1ed3i d\u1eef li\u1ec7u \u0111\u00e0o t\u u30c8\u306e\u30d1\u30bf\u30fc\u30f3\u3092\u9078\u629e\u3057\u3066\u3044\u307e\u3059\u3002\u30ec\u30a4\u30c6\u30f3\u30b7\u3001\u30b3\u30b9\u30c8\u3001\u76e3\u67fb\u306e\u4e88\u6e2c\u53ef\u80fd\u6027\u304c\u512a\u5148\u3055\u308c\u307e\u3059\u3002 \u3069\u306e\u30d1\u30bf\u30fc\u30f3\u304c\u6700\u3082\u9069\u5408\u3057\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Augmented LLM with retrieval-augmented generation over the indexed authoritative corpus and citation rendering on each answer.","vi":"LLM t\u0103ng c\u01b0\u1eddng v\u1edbi th\u1ebf h\u1ec7 t\u0103ng c\u01b0\u1eddng truy xu\u1ea5t tr\u00ean kho d\u1eef li\u1ec7u c\u00f3 th\u1ea9m quy\u1ec1n \u0111\u01b0\u1ee3c l\u1eadp ch\u1ec9 m\u1ee5c v\u00e0 hi\u1ec3n th\u1ecb tr\u00edch d\u1eabn tr\u00ean m\u1ed7i c\u00e2u tr\u1ea3 l\u1eddi.","jp":"\u30a4\u30f3\u30c7\u30c3\u30af\u30b9\u4ed8\u304d\u306e\u4fe1\u983c\u3067\u304d\u308b\u30b3\u30fc\u30d1\u30b9\u306b\u5bfe\u3059\u308b\u691c\u7d22\u62e1\u5f35\u751f\u6210\u3068\u5404\u56de\u7b54\u306e\u5f15\u7528\u30ec\u30f3\u30c0\u30ea\u30f3\u30b0\u3092\u5099\u3048\u305f\u62e1\u5f35 LLM\u3002"}},{"k":"B","t":{"en":"Multi-agent orchestration with a planner, researcher, and writer agent for every query.","vi":"Ph\u1ed1i h\u1ee3p nhi\u1ec1u t\u00e1c nh\u00e2n v\u1edbi t\u00e1c nh\u00e2n l\u1eadp k\u1ebf ho\u1ea1ch, nh\u00e0 nghi\u00ean c\u1ee9u v\u00e0 t\u00e1c gi\u1ea3 cho m\u1ecdi truy v\u1ea5n.","jp":"\u3059\u3079\u3066\u306e\u30af\u30a8\u30ea\u306b\u5bfe\u3057\u3066\u30d7\u30e9\u30f3\u30ca\u30fc\u3001\u30ea\u30b5\u30fc\u30c1\u30e3\u30fc\u3001\u30e9\u30a4\u30bf\u30fc \u30a8\u30fc\u30b8\u30a7\u30f3\u30c8\u306b\u3088\u308b\u30de\u30eb\u30c1\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8 \u30aa\u30fc\u30b1\u30b9\u30c8\u30ec\u30fc\u30b7\u30e7\u30f3\u3002"}},{"k":"C","t":{"en":"A pure agent loop with open web-browsing tools to surface the most current policy information, without constraining retrieval to the authoritative internal corpus.","vi":"M\u1ed9t v\u00f2ng l\u1eb7p t\u00e1c nh\u00e2n thu\u1ea7n t\u00fay v\u1edbi c\u00e1c c\u00f4ng c\u1ee5 duy\u1ec7t web m\u1edf \u0111\u1ec3 hi\u1ec3n th\u1ecb th\u00f4ng tin ch\u00ednh s\u00e1ch m\u1edbi nh\u1ea5t m\u00e0 kh\u00f4ng h\u1ea1n ch\u1ebf vi\u1ec7c truy xu\u1ea5t v\u00e0o kho d\u1eef li\u1ec7u n\u1ed9i b\u1ed9 c\u00f3 th\u1ea9m quy\u1ec1n.","jp":"\u30aa\u30fc\u30d7\u30f3\u306a Web \u30d6\u30e9\u30a6\u30b8\u30f3\u30b0 \u30c4\u30fc\u30eb\u3092\u5099\u3048\u305f\u7d14\u7c8b\u306a\u30a8\u30fc\u30b8\u30a7\u30f3\u30c8 \u30eb\u30fc\u30d7\u306b\u3088\u308a\u3001\u6a29\u5a01\u3042\u308b\u5185\u90e8\u30b3\u30fc\u30d1\u30b9\u3078\u306e\u691c\u7d22\u3092\u5236\u9650\u3059\u308b\u3053\u3068\u306a\u304f\u3001\u6700\u65b0\u306e\u30dd\u30ea\u30b7\u30fc\u60c5\u5831\u3092\u8868\u793a\u3067\u304d\u307e\u3059\u3002"}},{"k":"D","t":{"en":"A static prompt with the entire policy corpus concatenated into every request.","vi":"M\u1ed9t l\u1eddi nh\u1eafc t\u0129nh ch\u1ee9a to\u00e0n b\u1ed9 kho ch\u00ednh s\u00e1ch \u0111\u01b0\u1ee3c n\u1ed1i v\u00e0o m\u1ecdi y\u00eau c\u1ea7u.","jp":"\u30dd\u30ea\u30b7\u30fc \u30b3\u30fc\u30d1\u30b9\u5168\u4f53\u304c\u5404\u30ea\u30af\u30a8\u30b9\u30c8\u306b\u9023\u7d50\u3055\u308c\u305f\u9759\u7684\u30d7\u30ed\u30f3\u30d7\u30c8\u3002"}}],"answer":["A"],"multi":false,"explain":{"text":"A constrained retrieval-augmented generation architecture best satisfies the grounding, citation, latency, cost, and audit requirements. The system first indexes the approved internal policy corpus.<br>At request time, it retrieves a small set of relevant passages, supplies those passages to Claude with stable source identifiers, and requires the answer to cite the supporting material. Anthropic's searchresult content blocks are specifically designed for this pattern: they allow custom RAG systems to provide source-attributed internal content and enable Claude to render citations against those re..."}},{"id":"ccarp-q052","n":52,"topic":3,"type":"mcq","stem":{"en":"You are a platform architect designing an internal Claude-based assistant that serves both finance analysts and external auditors. Each population must access only documents permitted by its role. Where should role-based access control be enforced in the pipeline?","vi":"B\u1ea1n l\u00e0 ki\u1ebfn \u200b\u200btr\u00fac s\u01b0 n\u1ec1n t\u1ea3ng \u0111ang thi\u1ebft k\u1ebf m\u1ed9t tr\u1ee3 l\u00fd n\u1ed9i b\u1ed9 d\u1ef1a tr\u00ean Claude \u0111\u1ec3 ph\u1ee5c v\u1ee5 c\u1ea3 nh\u00e0 ph\u00e2n t\u00edch t\u00e0i ch\u00ednh v\u00e0 ki\u1ec3m to\u00e1n vi\u00ean b\u00ean ngo\u00e0i. M\u1ed7i qu\u1ea7n th\u1ec3 ch\u1ec9 \u0111\u01b0\u1ee3c truy c\u1eadp nh\u1eefng t\u00e0i li\u1ec7u \u0111\u01b0\u1ee3c ph\u00e9p b\u1edfi vai tr\u00f2 c\u1ee7a n\u00f3. Ki\u1ec3m so\u00e1t quy\u1ec1n truy c\u1eadp d\u1ef1a tr\u00ean vai tr\u00f2 n\u00ean \u0111\u01b0\u1ee3c th\u1ef1c thi \u1edf \u0111\u00e2u trong quy tr\u00ecnh?","jp":"\u3042\u306a\u305f\u306f\u3001\u8ca1\u52d9\u30a2\u30ca\u30ea\u30b9\u30c8\u3068\u5916\u90e8\u76e3\u67fb\u4eba\u306e\u4e21\u65b9\u306b\u30b5\u30fc\u30d3\u30b9\u3092\u63d0\u4f9b\u3059\u308b\u30af\u30ed\u30fc\u30c9\u30d9\u30fc\u30b9\u306e\u793e\u5185\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u3092\u8a2d\u8a08\u3059\u308b\u30d7\u30e9\u30c3\u30c8\u30d5\u30a9\u30fc\u30e0 \u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u3067\u3059\u3002\u5404\u96c6\u56e3\u306f\u3001\u305d\u306e\u5f79\u5272\u306b\u3088\u3063\u3066\u8a31\u53ef\u3055\u308c\u305f\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8\u306e\u307f\u306b\u30a2\u30af\u30bb\u30b9\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u3002 \u30ed\u30fc\u30eb\u30d9\u30fc\u30b9\u306e\u30a2\u30af\u30bb\u30b9\u5236\u5fa1\u306f\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u306e\u3069\u3053\u306b\u9069\u7528\u3059\u308b\u5fc5\u8981\u304c\u3042\u308a\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Inside the system prompt as a natural-language instruction for Claude to ignore unauthorized documents.","vi":"L\u1eddi nh\u1eafc b\u00ean trong h\u1ec7 th\u1ed1ng l\u00e0 h\u01b0\u1edbng d\u1eabn b\u1eb1ng ng\u00f4n ng\u1eef t\u1ef1 nhi\u00ean \u0111\u1ec3 Claude b\u1ecf qua c\u00e1c t\u00e0i li\u1ec7u tr\u00e1i ph\u00e9p.","jp":"\u30b7\u30b9\u30c6\u30e0\u5185\u3067\u306f\u3001\u30af\u30ed\u30fc\u30c9\u306b\u5bfe\u3059\u308b\u81ea\u7136\u8a00\u8a9e\u306e\u6307\u793a\u3068\u3057\u3066\u3001\u672a\u627f\u8a8d\u306e\u6587\u66f8\u3092\u7121\u8996\u3059\u308b\u3088\u3046\u30d7\u30ed\u30f3\u30d7\u30c8\u304c\u8868\u793a\u3055\u308c\u307e\u3059\u3002"}},{"k":"B","t":{"en":"At the retrieval layer, before any role-restricted content reaches the prompt-construction step or the model.","vi":"\u1ede l\u1edbp truy xu\u1ea5t, tr\u01b0\u1edbc khi b\u1ea5t k\u1ef3 n\u1ed9i dung b\u1ecb gi\u1edbi h\u1ea1n vai tr\u00f2 n\u00e0o \u0111\u1ea1t \u0111\u1ebfn b\u01b0\u1edbc x\u00e2y d\u1ef1ng l\u1eddi nh\u1eafc ho\u1eb7c m\u00f4 h\u00ecnh.","jp":"\u53d6\u5f97\u5c64\u3067\u306f\u3001\u5f79\u5272\u304c\u5236\u9650\u3055\u308c\u305f\u30b3\u30f3\u30c6\u30f3\u30c4\u304c\u30d7\u30ed\u30f3\u30d7\u30c8\u69cb\u7bc9\u30b9\u30c6\u30c3\u30d7\u307e\u305f\u306f\u30e2\u30c7\u30eb\u306b\u5230\u9054\u3059\u308b\u524d\u306b\u884c\u308f\u308c\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Nowhere in the pipeline; rely on the model's general refusal behavior to reject unauthorized document access without any enforced access control.","vi":"Kh\u00f4ng c\u00f3 n\u01a1i n\u00e0o trong \u0111\u01b0\u1eddng \u1ed1ng; d\u1ef1a v\u00e0o h\u00e0nh vi t\u1eeb ch\u1ed1i chung c\u1ee7a m\u00f4 h\u00ecnh \u0111\u1ec3 t\u1eeb ch\u1ed1i truy c\u1eadp t\u00e0i li\u1ec7u tr\u00e1i ph\u00e9p m\u00e0 kh\u00f4ng c\u00f3 b\u1ea5t k\u1ef3 bi\u1ec7n ph\u00e1p ki\u1ec3m so\u00e1t truy c\u1eadp n\u00e0o \u0111\u01b0\u1ee3c th\u1ef1c thi.","jp":"\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u306e\u3069\u3053\u306b\u3082\u3042\u308a\u307e\u305b\u3093\u3002\u30e2\u30c7\u30eb\u306e\u4e00\u822c\u7684\u306a\u62d2\u5426\u52d5\u4f5c\u306b\u4f9d\u5b58\u3057\u3066\u3001\u5f37\u5236\u7684\u306a\u30a2\u30af\u30bb\u30b9\u5236\u5fa1\u306a\u3057\u3067\u4e0d\u6b63\u306a\u30c9\u30ad\u30e5\u30e1\u30f3\u30c8 \u30a2\u30af\u30bb\u30b9\u3092\u62d2\u5426\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"After the response is generated, by post-filtering content that should not have been retrieved.","vi":"Sau khi ph\u1ea3n h\u1ed3i \u0111\u01b0\u1ee3c t\u1ea1o ra, b\u1eb1ng c\u00e1ch l\u1ecdc n\u1ed9i dung sau \u0111\u00f3 m\u00e0 l\u1ebd ra kh\u00f4ng n\u00ean truy xu\u1ea5t.","jp":"\u5fdc\u7b54\u304c\u751f\u6210\u3055\u308c\u305f\u5f8c\u3001\u53d6\u5f97\u3059\u3079\u304d\u3067\u306f\u306a\u3044\u30b3\u30f3\u30c6\u30f3\u30c4\u3092\u4e8b\u5f8c\u30d5\u30a3\u30eb\u30bf\u30ea\u30f3\u30b0\u3059\u308b\u3053\u3068\u306b\u3088\u3063\u3066\u884c\u308f\u308c\u307e\u3059\u3002"}}],"answer":["B"],"multi":false,"explain":{"text":"Authorization must be enforced before restricted information enters model context. The retrieval service should authenticate the user, resolve role and document permissions, and filter candidate records before prompt construction. This prevents unauthorized content from appearing in prompts, model traces, cached context, tool results, or generated responses. A system-prompt instruction is behavioral guidance, not an enforceable access-control boundary. Post-generation filtering is also inadequate because the model has already received and processed the restricted data, creating exposure throug..."}},{"id":"ccarp-q053","n":53,"topic":3,"type":"mcq","stem":{"en":"You are designing a content moderation classifier that processes high volumes of usergenerated comments under a tight per-message latency budget using well-defined classification labels. Which model selection best aligns with the workload?","vi":"B\u1ea1n \u0111ang thi\u1ebft k\u1ebf m\u1ed9t tr\u00ecnh ph\u00e2n lo\u1ea1i ki\u1ec3m duy\u1ec7t n\u1ed9i dung \u0111\u1ec3 x\u1eed l\u00fd kh\u1ed1i l\u01b0\u1ee3ng l\u1edbn nh\u1eadn x\u00e9t do ng\u01b0\u1eddi d\u00f9ng t\u1ea1o v\u1edbi ng\u00e2n s\u00e1ch \u0111\u1ed9 tr\u1ec5 cho m\u1ed7i tin nh\u1eafn eo h\u1eb9p b\u1eb1ng c\u00e1ch s\u1eed d\u1ee5ng nh\u00e3n ph\u00e2n lo\u1ea1i \u0111\u01b0\u1ee3c x\u00e1c \u0111\u1ecbnh r\u00f5. L\u1ef1a ch\u1ecdn m\u00f4 h\u00ecnh n\u00e0o ph\u00f9 h\u1ee3p nh\u1ea5t v\u1edbi kh\u1ed1i l\u01b0\u1ee3ng c\u00f4ng vi\u1ec7c?","jp":"\u3042\u306a\u305f\u306f\u3001\u660e\u78ba\u306b\u5b9a\u7fa9\u3055\u308c\u305f\u5206\u985e\u30e9\u30d9\u30eb\u3092\u4f7f\u7528\u3057\u3066\u3001\u30e1\u30c3\u30bb\u30fc\u30b8\u3054\u3068\u306e\u9045\u5ef6\u30d0\u30b8\u30a7\u30c3\u30c8\u306e\u4e0b\u3067\u30e6\u30fc\u30b6\u30fc\u304c\u4f5c\u6210\u3057\u305f\u5927\u91cf\u306e\u30b3\u30e1\u30f3\u30c8\u3092\u51e6\u7406\u3059\u308b\u30b3\u30f3\u30c6\u30f3\u30c4 \u30e2\u30c7\u30ec\u30fc\u30b7\u30e7\u30f3\u5206\u985e\u5b50\u3092\u8a2d\u8a08\u3057\u3066\u3044\u307e\u3059\u3002 \u3069\u306e\u30e2\u30c7\u30eb\u3092\u9078\u629e\u3059\u308b\u306e\u304c\u30ef\u30fc\u30af\u30ed\u30fc\u30c9\u306b\u6700\u3082\u9069\u3057\u3066\u3044\u307e\u3059\u304b?"},"options":[{"k":"A","t":{"en":"Opus, because every moderation decision requires maximum reasoning depth regardless of classification complexity.","vi":"R\u1ea5t ti\u1ebfc, v\u00ec m\u1ecdi quy\u1ebft \u0111\u1ecbnh ki\u1ec3m duy\u1ec7t \u0111\u1ec1u y\u00eau c\u1ea7u \u0111\u1ed9 s\u00e2u l\u00fd lu\u1eadn t\u1ed1i \u0111a b\u1ea5t k\u1ec3 \u0111\u1ed9 ph\u1ee9c t\u1ea1p c\u1ee7a ph\u00e2n lo\u1ea1i.","jp":"\u304a\u3063\u3068\u3001\u5206\u985e\u306e\u8907\u96d1\u3055\u306b\u95a2\u4fc2\u306a\u304f\u3001\u3059\u3079\u3066\u306e\u30e2\u30c7\u30ec\u30fc\u30b7\u30e7\u30f3\u6c7a\u5b9a\u306b\u306f\u6700\u5927\u9650\u306e\u63a8\u8ad6\u306e\u6df1\u3055\u304c\u5fc5\u8981\u3068\u306a\u308b\u305f\u3081\u3067\u3059\u3002"}},{"k":"B","t":{"en":"Haiku, because its latency and cost profile align with high-volume classification workloads that require limited reasoning depth.","vi":"Haiku, v\u00ec \u0111\u1ed9 tr\u1ec5 v\u00e0 h\u1ed3 s\u01a1 chi ph\u00ed c\u1ee7a n\u00f3 ph\u00f9 h\u1ee3p v\u1edbi kh\u1ed1i l\u01b0\u1ee3ng c\u00f4ng vi\u1ec7c ph\u00e2n lo\u1ea1i kh\u1ed1i l\u01b0\u1ee3ng l\u1edbn \u0111\u00f2i h\u1ecfi \u0111\u1ed9 s\u00e2u l\u00fd lu\u1eadn h\u1ea1n ch\u1ebf.","jp":"Haiku \u306f\u3001\u305d\u306e\u30ec\u30a4\u30c6\u30f3\u30b7\u3068\u30b3\u30b9\u30c8 \u30d7\u30ed\u30d5\u30a1\u30a4\u30eb\u304c\u3001\u9650\u3089\u308c\u305f\u63a8\u8ad6\u306e\u6df1\u3055\u3092\u5fc5\u8981\u3068\u3059\u308b\u5927\u91cf\u306e\u5206\u985e\u30ef\u30fc\u30af\u30ed\u30fc\u30c9\u306b\u9069\u5408\u3057\u3066\u3044\u308b\u305f\u3081\u3067\u3059\u3002"}},{"k":"C","t":{"en":"Sonnet, because larger general-purpose models are preferred even when workload latency requirements are strict.","vi":"Sonnet, v\u00ec c\u00e1c m\u00f4 h\u00ecnh c\u00f3 m\u1ee5c \u0111\u00edch chung l\u1edbn h\u01a1n \u0111\u01b0\u1ee3c \u01b0a th\u00edch ngay c\u1ea3 khi y\u00eau c\u1ea7u nghi\u00eam ng\u1eb7t v\u1ec1 \u0111\u1ed9 tr\u1ec5 kh\u1ed1i l\u01b0\u1ee3ng c\u00f4ng vi\u1ec7c.","jp":"Sonnet\u3002\u30ef\u30fc\u30af\u30ed\u30fc\u30c9\u306e\u30ec\u30a4\u30c6\u30f3\u30b7\u8981\u4ef6\u304c\u53b3\u3057\u3044\u5834\u5408\u3067\u3082\u3001\u3088\u308a\u5927\u304d\u306a\u6c4e\u7528\u30e2\u30c7\u30eb\u304c\u512a\u5148\u3055\u308c\u308b\u305f\u3081\u3067\u3059\u3002"}},{"k":"D","t":{"en":"Sonnet with extended thinking enabled, because deeper reasoning should be applied to every moderation request to improve edge-case handling.","vi":"Sonnet v\u1edbi kh\u1ea3 n\u0103ng t\u01b0 duy m\u1edf r\u1ed9ng \u0111\u01b0\u1ee3c k\u00edch ho\u1ea1t, v\u00ec l\u00fd lu\u1eadn s\u00e2u h\u01a1n n\u00ean \u0111\u01b0\u1ee3c \u00e1p d\u1ee5ng cho m\u1ecdi y\u00eau c\u1ea7u ki\u1ec3m duy\u1ec7t \u0111\u1ec3 c\u1ea3i thi\u1ec7n kh\u1ea3 n\u0103ng x\u1eed l\u00fd c\u00e1c tr\u01b0\u1eddng h\u1ee3p ph\u1ee9c t\u1ea1p.","jp":"\u62e1\u5f35\u601d\u8003\u3092\u6709\u52b9\u306b\u3057\u305f\u30bd\u30cd\u30c3\u30c8\u3002\u30a8\u30c3\u30b8\u30b1\u30fc\u30b9\u306e\u51e6\u7406\u3092\u6539\u5584\u3059\u308b\u306b\u306f\u3001\u3059\u3079\u3066\u306e\u30e2\u30c7\u30ec\u30fc\u30b7\u30e7\u30f3 \u30ea\u30af\u30a8\u30b9\u30c8\u306b\u3088\u308a\u6df1\u3044\u63a8\u8ad6\u3092\u9069\u7528\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u305f\u3081\u3067\u3059\u3002"}}],"answer":["B"],"multi":false,"explain":{"text":"Haiku is the appropriate starting point because the workload is high-volume, latency-sensitive, and based on a stable closed set of moderation labels. These characteristics favor a fast, cost-efficient model capable of consistent classification without incurring the additional inference time and expense associated with deeper reasoning.<br>Anthropic's model-selection guidance requires architects to balance capability, speed, and cost rather than automatically selecting the most capable model. Its content-moderation guidance specifically identifies Haiku as a cost-effective option for processing m..."}},{"id":"ccarp-q054","n":54,"topic":3,"type":"mcq","stem":{"en":"A Claude architect is implementing safety controls for a customer-facing advice assistant that must never provide regulated investment recommendations. Which two guardrail implementations most directly enforce this constraint? (Select two.)  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"M\u1ed9t ki\u1ebfn \u200b\u200btr\u00fac s\u01b0 Claude \u0111ang tri\u1ec3n khai c\u00e1c bi\u1ec7n ph\u00e1p ki\u1ec3m so\u00e1t an to\u00e0n cho tr\u1ee3 l\u00fd t\u01b0 v\u1ea5n tr\u1ef1c ti\u1ebfp v\u1edbi kh\u00e1ch h\u00e0ng, ng\u01b0\u1eddi kh\u00f4ng bao gi\u1edd \u0111\u01b0\u1ee3c \u0111\u01b0a ra c\u00e1c khuy\u1ebfn ngh\u1ecb \u0111\u1ea7u t\u01b0 theo quy \u0111\u1ecbnh. Hai c\u00e1ch tri\u1ec3n khai lan can n\u00e0o th\u1ef1c thi r\u00e0ng bu\u1ed9c n\u00e0y m\u1ed9t c\u00e1ch tr\u1ef1c ti\u1ebfp nh\u1ea5t? (Ch\u1ecdn 2.) [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u30af\u30ed\u30fc\u30c9 \u30a2\u30fc\u30ad\u30c6\u30af\u30c8\u306f\u3001\u898f\u5236\u3055\u308c\u305f\u6295\u8cc7\u63a8\u5968\u3092\u6c7a\u3057\u3066\u63d0\u4f9b\u3057\u3066\u306f\u3044\u3051\u306a\u3044\u9867\u5ba  ng\u01b0\u1eddi d\u00f9ng m\u1ed7i ng\u00e0y.","jp":"\u30bb\u30c3\u30b7\u30e7\u30f3\u306e\u9577\u3055\u3092\u5236\u9650\u3057\u3066\u3001\u30e6\u30fc\u30b6\u30fc\u3054\u3068\u306b 1 \u65e5\u306b\u51e6\u7406\u3055\u308c\u308b\u30af\u30a8\u30ea\u306e\u91cf\u3092\u6e1b\u3089\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Log all user queries to a SIEM for post-hoc compliance review.","vi":"Ghi l\u1ea1i t\u1ea5t c\u1ea3 c\u00e1c truy v\u1ea5n c\u1ee7a ng\u01b0\u1eddi d\u00f9ng v\u00e0o SIEM \u0111\u1ec3 \u0111\u00e1nh gi\u00e1 tu\u00e2n th\u1ee7 sau n\u00e0y.","jp":"\u4e8b\u5f8c\u306e\u30b3\u30f3\u30d7\u30e9\u30a4\u30a2\u30f3\u30b9 \u30ec\u30d3\u30e5\u30fc\u306e\u305f\u3081\u306b\u3001\u3059\u3079\u3066\u306e\u30e6\u30fc\u30b6\u30fc \u30af\u30a8\u30ea\u3092 SIEM \u306b\u8a18\u9332\u3057\u307e\u3059\u3002"}},{"k":"E","t":{"en":"Define explicit out-of-scope categories in the system prompt with fixed refusal phrasing for investment advice requests.","vi":"X\u00e1c \u0111\u1ecbnh r\u00f5 r\u00e0ng c\u00e1c danh m\u1ee5c n\u1eb1m ngo\u00e0i ph\u1ea1m vi trong l\u1eddi nh\u1eafc c\u1ee7a h\u1ec7 th\u1ed1ng v\u1edbi c\u1ee5m t\u1eeb t\u1eeb ch\u1ed1i c\u1ed1 \u0111\u1ecbnh \u0111\u1ed1i v\u1edbi c\u00e1c y\u00eau c\u1ea7u t\u01b0 v\u1ea5n \u0111\u1ea7u t\u01b0.","jp":"\u6295\u8cc7\u30a2\u30c9\u30d0\u30a4\u30b9\u306e\u30ea\u30af\u30a8\u30b9\u30c8\u306b\u5bfe\u3059\u308b\u56fa\u5b9a\u306e\u62d2\u5426\u8868\u73fe\u3092\u4f7f\u7528\u3057\u3066\u3001\u30b7\u30b9\u30c6\u30e0 \u30d7\u30ed\u30f3\u30d7\u30c8\u3067\u660e\u793a\u7684\u306a\u7bc4\u56f2\u5916\u306e\u30ab\u30c6\u30b4\u30ea\u3092\u5b9a\u7fa9\u3057\u307e\u3059\u3002"}}],"answer":["B","E"],"multi":true,"explain":{"text":"The required control is best implemented through layered prevention. The system prompt should explicitly classify personalized investment recommendations as out of scope, instruct Claude not to recommend particular securities or transactions, and provide standardized refusal language. Fixed refusal behavior reduces ambiguity and gives the model a clear alternative response when users request prohibited advice or attempt to reframe it indirectly.<br>An output classifier supplies an independent enforcement layer after generation but before delivery.<br>It should detect prohibited recommendation langua..."}},{"id":"ccarp-q055","n":55,"topic":3,"type":"mcq","stem":{"en":"You are responding to a stakeholder request that adds significant scope to a deployment already in flight. Which response best aligns expectations while respecting the stakeholder's underlying need?","vi":"B\u1ea1n \u0111ang ph\u1ea3n h\u1ed3i y\u00eau c\u1ea7u c\u1ee7a b\u00ean li\u00ean quan nh\u1eb1m b\u1ed5 sung ph\u1ea1m vi \u0111\u00e1ng k\u1ec3 cho ho\u1ea1t \u0111\u1ed9ng tri\u1ec3n khai \u0111ang \u0111\u01b0\u1ee3c tri\u1ec3n khai. Ph\u1ea3n \u1ee9ng n\u00e0o ph\u00f9 h\u1ee3p nh\u1ea5t v\u1edbi k\u1ef3 v\u1ecdng \u0111\u1ed3ng th\u1eddi t\u00f4n tr\u1ecdng nhu c\u1ea7u c\u01a1 b\u1ea3n c\u1ee7a c\u00e1c b\u00ean li\u00ean quan?","jp":"\u3042\u306a\u305f\u306f\u3001\u3059\u3067\u306b\u9032\u884c\u4e2d\u306e\u5c55\u958b\u306b\u91cd\u8981\u306a\u7bc4\u56f2\u3092\u8ffd\u52a0\u3059\u308b\u95a2\u4fc2\u8005\u306e\u8981\u6c42\u306b\u5bfe\u5fdc\u3057\u3066\u3044\u307e\u3059\u3002 \u5229\u5bb3\u95a2\u4fc2\u8005\u306e\u6839\u672c\u7684\u306a\u30cb\u30fc\u30ba\u3092\u5c0a\u91cd\u3057\u306a\u304c\u3089\u3001\u671f\u5f85\u306b\u6700\u3082\u5408\u81f4\u3059\u308b\u5bfe\u5fdc\u306f\u3069\u308c\u3067\u3057\u3087\u3046\u304b?"},"options":[{"k":"A","t":{"en":"Hide the scope-addition request from the broader delivery team to avoid a difficult conversation, allowing the change to proceed without team awareness of its timeline implications.","vi":"\u1ea8n y\u00eau c\u1ea7u b\u1ed5 sung ph\u1ea1m vi kh\u1ecfi nh\u00f3m ph\u00e2n ph\u1ed1i r\u1ed9ng h\u01a1n \u0111\u1ec3 tr\u00e1nh m\u1ed9t cu\u1ed9c tr\u00f2 chuy\u1ec7n kh\u00f3 kh\u0103n, cho ph\u00e9p thay \u0111\u1ed5i ti\u1ebfp t\u1ee5c m\u00e0 nh\u00f3m kh\u00f4ng carp-q059","n":59,"topic":3,"type":"mcq","stem":{"en":"You are integrating human review into a high-volume classification pipeline where reviewing every output is infeasible. Which sampling strategy best balances throughput with quality oversight?","vi":"B\u1ea1n \u0111ang t\u00edch h\u1ee3p \u0111\u00e1nh gi\u00e1 c\u1ee7a con ng\u01b0\u1eddi v\u00e0o m\u1ed9t quy tr\u00ecnh ph\u00e2n lo\u1ea1i kh\u1ed1i l\u01b0\u1ee3ng l\u1edbn, trong \u0111\u00f3 vi\u1ec7c xem x\u00e9t m\u1ecdi \u0111\u1ea7u ra l\u00e0 kh\u00f4ng kh\u1ea3 thi. Chi\u1ebfn l\u01b0\u1ee3c l\u1ea5y m\u1eabu n\u00e0o c\u00e2n b\u1eb1ng t\u1ed1t nh\u1ea5t th\u00f4ng l\u01b0\u1ee3ng v\u1edbi gi\u00e1m s\u00e1t ch\u1ea5t l\u01b0\u1ee3ng?","jp":"\u3059\u3079\u3066\u306e\u51fa\u529b\u3092\u30ec\u30d3\u30e5\u30fc\u3059\u308b\u306e\u306f\u4e0d\u53ef\u80fd\u306a\u5927\u91cf\u306e\u5206\u985e\u30d1\u30a4\u30d7\u30e9\u30a4\u30f3\u306b\u4eba\u9593\u306b\u3088\u308b\u30ec\u30d3\u30e5\u30fc\u3092\u7d71\u5408\u3057\u3066\u3044\u307e\u3059\u3002 \u30b9\u30eb\u30fc\u30d7\u30c3\u30c8\u3068\u54c1\u8cea\u76e3\u8996\u306e\u30d0\u30e9\u30f3\u30b9\u3092\u6700\u3082\u3088\u304f\u3068\u308c\u308b\u30b5\u30f3\u30d7\u30ea\u30f3\u30b0\u6226\u7565\u306f\u3069\u308c\u3067\u3059\u304b?"},"options":[{"k":"A","t":{"en":"No sampling, relying entirely on user complaints to reveal quality and safety problems after they affect users.","vi":"Kh\u00f4ng l\u1ea5y m\u1eabu, ho\u00e0n to\u00e0n d\u1ef1a v\u00e0o khi\u1ebfu n\u1ea1i c\u1ee7a ng\u01b0\u1eddi d\u00f9ng \u0111\u1ec3 ph\u00e1t hi\u1ec7n v\u1ea5n \u0111\u1ec1 v\u1ec1 ch\u1ea5t l\u01b0\u1ee3ng, an to\u00e0n sau khi \u1ea3nh h\u01b0\u1edfng \u0111\u1ebfn ng\u01b0\u1eddi d\u00f9ng.","jp":"\u30b5\u30f3\u30d7\u30ea\u30f3\u30b0\u306f\u884c\u308f\u305a\u3001\u54c1\u8cea\u3068\u5b89\u5168\u6027\u306e\u554f\u984c\u304c\u30e6\u30fc\u30b6\u30fc\u306b\u5f71\u97ff\u3092\u4e0e\u3048\u305f\u5f8c\u306b\u660e\u3089\u304b\u306b\u3059\u308b\u305f\u3081\u306b\u3001\u30e6\u30fc\u30b6\u30fc\u306e\u82e6 re the next deadline.","vi":"B\u1eaft \u0111\u1ea7u t\u1ea1o nguy\u00ean m\u1eabu m\u1ed9t tr\u1ee3 l\u00fd chung theo y\u00eau c\u1ea7u r\u1ed9ng r\u00e3i tr\u01b0\u1edbc th\u1eddi h\u1ea1n ti\u1ebfp theo.","jp":"\u6b21\u306e\u7de0\u3081\u5207\u308a\u307e\u3067\u306b\u3001\u5e83\u7bc4\u306a\u8981\u6c42\u306b\u5bfe\u3057\u3066\u6c4e\u7528\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u306e\u30d7\u30ed\u30c8\u30bf\u30a4\u30d4\u30f3\u30b0\u3092\u958b\u59cb\u3057\u307e\u3059\u3002"}},{"k":"C","t":{"en":"Propose a fixed scope that you commit to by default based on your own assumptions.","vi":"\u0110\u1ec1 xu\u1ea5t m\u1ed9t ph\u1ea1m vi c\u1ed1 \u0111\u1ecbnh m\u00e0 b\u1ea1n cam k\u1ebft theo m\u1eb7c \u0111\u1ecbnh d\u1ef1a tr\u00ean c\u00e1c gi\u1ea3 \u0111\u1ecbnh c\u1ee7a ri\u00eang b\u1ea1n.","jp":"\u72ec\u81ea\u306e\u4eee\u5b9a\u306b\u57fa\u3065\u3044\u3066\u3001\u30c7\u30d5\u30a9\u30eb\u30c8\u3067\u30b3\u30df\u30c3\u30c8\u3059\u308b\u56fa\u5b9a\u30b9\u30b3\u30fc\u30d7\u3092\u63d0\u6848\u3057\u307e\u3059\u3002"}},{"k":"D","t":{"en":"Facilitate a structured discovery to define the failing decision and the target metric.","vi":"T\u1ea1o \u0111i\u1ec1u ki\u1ec7n thu\u1eadn l\u1ee3i cho vi\u1ec7c kh\u00e1m ph\u00e1 c\u00f3 c\u1ea5u tr\u00fac \u0111\u1ec3 x\u00e1c \u0111\u1ecbnh quy\u1ebft \u0111\u1ecbnh kh\u00f4ng th\u00e0nh c\u00f4ng v\u00e0 ch\u1ec9 s\u1ed1 m\u1ee5c ti\u00eau.","jp":"\u69cb\u9020\u5316\u3055\u308c\u305f\u691c\u51fa\u3092\u4fc3\u9032\u3057\u3066\u3001\u5931\u6557\u3057\u305f\u610f\u601d\u6c7a\u5b9a\u3068\u76ee\u6a19\u6307\u6a19\u3092\u5b9a\u7fa9\u3057\u307e\u3059\u3002"}}],"answer":["D"],"multi":false,"explain":{"text":"The request is not yet design-ready because it lacks a defined failure, affected user journey, supported decision, target population, and measurable outcome. The architect should therefore facilitate structured discovery rather than prematurely selecting an AI pattern or model.<br>Discovery should identify where the current customer journey breaks down, who experiences the problem, what decision or task requires assistance, what data is available, and which metric would demonstrate improvement. The team can then establish baseline performance, target thresholds, operational constraints, risks, an..."}}]},{"n":4,"title":{"en":"Practice Set 4","vi":"B\u1ed9 \u0111\u1ec1 s\u1ed1 4","jp":"\u7df4\u7fd2\u554f\u984c 4"},"questions":[{"id":"ccarp-q061","n":61,"topic":4,"type":"mcq","stem":{"en":"A loan pre-qualification assistant shows 94 percent approval recommendations that match the human underwriter decision. The fairness team has reviewed approval rate parity across protected groups and reported no significant difference. A board member has asked whether this evidence is sufficient to declare the assistant fair. Which two Discernment-competency findings should you report? (Select two.) Each correct answer presents part of the solution.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","vi":"Tr\u1ee3 l\u00fd s\u01a1 tuy\u1ec3n kho\u1ea3n vay hi\u1ec3n th\u1ecb 94% \u0111\u1ec1 xu\u1ea5t ph\u00ea duy\u1ec7t ph\u00f9 h\u1ee3p v\u1edbi quy\u1ebft \u0111\u1ecbnh b\u1ea3o l\u00e3nh c\u1ee7a con ng\u01b0\u1eddi. Nh\u00f3m c\u00f4ng b\u1eb1ng \u0111\u00e3 xem x\u00e9t s\u1ef1 ngang b\u1eb1ng v\u1ec1 t\u1ef7 l\u1ec7 ph\u00ea duy\u1ec7t gi\u1eefa c\u00e1c nh\u00f3m \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 v\u00e0 b\u00e1o c\u00e1o r\u1eb1ng kh\u00f4ng c\u00f3 s\u1ef1 kh\u00e1c bi\u1ec7t \u0111\u00e1ng k\u1ec3 n\u00e0o. M\u1ed9t th\u00e0nh vi\u00ean h\u1ed9i \u0111\u1ed3ng \u0111\u00e3 h\u1ecfi li\u1ec7u b\u1eb1ng ch\u1ee9ng n\u00e0y c\u00f3 \u0111\u1ee7 \u0111\u1ec3 tuy\u00ean b\u1ed1 tr\u1ee3 l\u00fd h\u1ed9i ch\u1ee3 hay kh\u00f4ng. B\u1ea1n n\u00ean b\u00e1o c\u00e1o hai ph\u00e1t hi\u1ec7n v\u1ec1 N\u0103ng l\u1ef1c nh\u1eadn th\u1ee9c n\u00e0o? (Ch\u1ecdn hai.) M\u1ed7i \u200b\u200bc\u00e2u tr\u1ea3 l\u1eddi \u0111\u00fang tr\u00ecnh b\u00e0y m\u1ed9t ph\u1ea7n c\u1ee7a gi\u1ea3i ph\u00e1p.  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]","jp":"\u30ed\u30fc\u30f3\u4e8b\u524d\u5be9\u67fb\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u306f\u3001\u4eba\u9593\u306e\u5f15\u53d7\u4f1a\u793e\u306e\u6c7a\u5b9a\u3068\u4e00\u81f4\u3059\u308b 94% \u306e\u627f\u8a8d\u63a8\u5968\u3092\u793a\u3057\u307e\u3059\u3002\u516c\u5e73\u6027\u30c1\u30fc\u30e0\u306f\u3001\u4fdd\u8b77\u3055\u308c\u305f\u30b0\u30eb\u30fc\u30d7\u9593\u306e\u652f\u6301\u7387\u306e\u540c\u7b49\u6027\u3092\u8abf\u67fb\u3057\u307e\u3057\u305f\u304c\u3001\u5927\u304d\u306a\u9055\u3044\u306f\u306a\u3044\u3068\u5831\u544a\u3057\u307e\u3057\u305f\u3002\u7406\u4e8b\u4f1a\u30e1\u30f3\u30d0\u30fc\u306f\u3001\u3053\u306e\u8a3c\u62e0\u304c\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u30d5\u30a7\u30a2\u3092\u5ba3\u8a00\u3059\u308b\u306e\u306b\u5341\u5206\u3067\u3042\u308b\u304b\u3069\u3046\u304b\u3092\u5c0b\u306d\u307e\u3057\u305f\u3002 \u8b58\u5225\u80fd\u529b\u306b\u95a2\u3059\u308b\u8abf\u67fb\u7d50\u679c\u3092 2 \u3064\u5831\u544a\u3059\u308b\u5fc5\u8981\u304c\u3042\u308b\u306e\u306f\u3069\u308c\u3067\u3059\u304b? (2 \u3064\u9078\u629e\u3057\u3066\u304f\u3060\u3055\u3044\u3002) \u305d\u308c\u305e\u308c\u306e\u6b63\u89e3\u306f\u3001\u89e3\u6c7a\u7b56\u306e\u4e00\u90e8\u3092\u793a\u3057\u3066\u3044\u307e\u3059\u3002  [Ch\u1ecdn 2 \u0111\u00e1p \u00e1n]"},"options":[{"k":"A","t":{"en":"Approval rate parity does not by itself assess error rate parity across protected groups.","vi":"T\u1ef7 l\u1ec7 ph\u00ea duy\u1ec7t t\u01b0\u01a1ng \u0111\u01b0\u01a1ng kh\u00f4ng t\u1ef1 n\u00f3 \u0111\u00e1nh gi\u00e1 t\u1ef7 l\u1ec7 l\u1ed7i t\u01b0\u01a1ng \u0111\u01b0\u01a1ng gi\u1eefa c\u00e1c nh\u00f3m \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7.","jp":"\u627f\u8a8d\u7387\u306e\u30d1\u30ea\u30c6\u30a3\u81ea\u4f53\u306f\u3001\u4fdd\u8b77\u3055\u308c\u305f\u30b0\u30eb\u30fc\u30d7\u5168\u4f53\u306e\u30a8\u30e9\u30fc\u7387\u306e\u30d1\u30ea\u30c6\u30a3\u3092\u8a55\u4fa1\u3057\u307e\u305b\u3093\u3002"}},{"k":"B","t":{"en":"Match with human underwriters does not establish freedom from underwriter-introduced bias.","vi":"S\u1ef1 ph\u00f9 h\u1ee3p v\u1edbi c\u00e1c nh\u00e0 b\u1ea3o l\u00e3nh l\u00e0 con ng\u01b0\u1eddi kh\u00f4ng t\u1ea1o ra s\u1ef1 t\u1ef1 do kh\u1ecfi s\u1ef1 thi\u00ean v\u1ecb do ng\u01b0\u1eddi b\u1ea3o l\u00e3nh \u0111\u01b0a ra.","jp":"\u4eba\u9593\u306e\u5f15\u53d7\u4f1a\u793e\u3068\u306e\u30de\u30c3\u30c1\u30f3\u30b0\u306f\u3001\u5f15\u53d7\u4f1a\u793e\u306b\u3088\u3063\u3066\u3082\u305f\u3089\u3055\u308c\u308b\u30d0\u30a4\u30a2\u30b9\u304b\u3089\u306e\u81ea\u7531\u3092\u78ba\u7acb\u3059\u308b\u3082\u306e\u3067\u306f\u3042\u308a\u307e\u305b\u3093\u3002"}},{"k":"C","t":{"en":"The 94 percent match rate is sufficient evidence of fairness for the assistant's decisions.","vi":"T\u1ef7 l\u1ec7 tr\u00f9ng kh\u1edbp 94% l\u00e0 \u0111\u1ee7 b\u1eb1ng ch\u1ee9ng v\u1ec1 s\u1ef1 c\u00f4ng b\u1eb1ng cho c\u00e1c quy\u1ebft \u0111\u1ecbnh c\u1ee7a tr\u1ee3 l\u00fd.","jp":"94 \u30d1\u30fc\u30bb\u30f3\u30c8\u306e\u4e00\u81f4\u7387\u306f\u3001\u30a2\u30b7\u30b9\u30bf\u30f3\u30c8\u306e\u6c7a\u5b9a\u304c\u516c\u5e73\u3067\u3042\u308b\u3053\u3068\u306e\u5341\u5206\u306a\u8a3c\u62e0\u3067\u3059\u3002"}},{"k":"D","t":{"en":"The fairness team's review process likely missed at least some of the protected groups studied.","vi":"Qu\u00e1 tr\u00ecnh xem x\u00e9t c\u1ee7a nh\u00f3m c\u00f4ng b\u1eb1ng c\u00f3 th\u1ec3 \u0111\u00e3 b\u1ecf s\u00f3t \u00edt nh\u1ea5t m\u1ed9t s\u1ed1 nh\u00f3m \u0111\u01b0\u1ee3c b\u1ea3o v\u1ec7 \u0111\u01b0\u1ee3c nghi\u00ean c\u1ee9u.","jp":"\u516c\u5e73\u6027\u30c1\u30fc\u30e0\u306e\u5be9\u67fb\u30d7\u30ed\u30bb\u30b9\u3067\u306f\u3001\u8abf\u67fb\u5bfe\u8c61\u3068\u306a\u3063\u305f\u4fdd\u8b77\u30b0\u30eb\u30fc\u30d7\u306e\u5c11\u306a\u304f\u3068\u3082\u4e00\u90e8\u304c\u898b\u9003\u3055\u308c\u305f\u53ef\u80fd\u6027\u304c\u3042\u308a\u307e\u3059\u3002"}},{"k":"E","t":{"en":"A larger sample is needed before any meaningful fairness claim can be made about the model.","vi":"C\u1ea7n c\u00f3 m\u1ed9t m\u1eabu l\u1edbn h\u01a1n tr\u01b0\u1edbc khi \u0111\u01b0a ra b\u1ea5t k\u1ef3 tuy\u00ean b\u1ed1 c\u00f4ng b\u1eb1ng c\u00f3 \u00fd ngh\u0129a n\u00e0o v\u1ec1 m\u00f4 h\u00ecnh.","jp":"\u30e2\u30c7\u30eb\u306b\u95a2\u3057\u3066\u610f\u5473\u306e\u3042\u308b\u516c\u5e73\u6027\u3092\u4e3b\u5f35\u3059\u308b\u306b\u306f\u3001\u3088\u308a\u5927\u304d\u306a\u30b5\u30f3\u30d7\u30eb\u304c\u5fc5\u8981\u3067\u3059\u3002"}}],"answer":["A","B"],"multi":true,"explain":{"text":"Approval-rate parity measures whether groups receive positive recommendations at similar rates. It does not establish whether false approvals, false denials, sensitivity, specificity, or calibration are comparable across those groups. A system can therefore satisfy aggregate approval parity while imposing materially different error burdens on protected populations. The evaluation must include subgroup confusion matrices, false- positive and false-negative rates, calibration, intersectional analysis, and confidence intervals.<br>The 94 percent agreement rate measures fidelity to human underwriter ..."}},{"id":"ccarp-q062","n":62,"topic":4,"type":"mcq","stem":{"en":"You are operating an interactive assistant whose dominant performance constraint is perturn latency. Quality on routine turns is already acceptable. Which configuration adjustment most directly improves latency without disproportionately damaging quality?","vi":"B\u1ea1n \u0111ang v\u1eadn h\u00e0nh m\u1ed9t tr\u1ee3 l\u00fd t\u01b0\u01a1ng t\u00e1c c\u00f3 h\u1ea1n ch\u1ebf v\u1ec1 hi\u1ec7u su\u1ea5t ch\u1ee7 y\u1ebfu l\u00e0 \u0111\u1ed9 tr\u1ec5 ho\u00e0n to\u00e0n. Ch\u1ea5t l\u01b0\u1ee3ng \u1edf c\u00e1c l\u01b0\u1ee3t quay th\u01b0\u1eddng l\u1ec7 \u0111\u00e3 c\u00f3 th\u1ec3 ch\u1ea5p nh\u1eadn \u0111\u01b0\u1ee3c. \u0110i\u1ec1u ch\u1ec9nh c\u1ea5u h\u00ecnh n\u00e0o tr\u1ef1c ti\u1ebfp c\u1ea3i thi\u1ec7n \u0111\u1ed9 tr\u1ec5 nh\u1ea5t m\u00e0 kh\u00f4ng l\u00e0m gi\u1ea3m ch\u1ea5t l\u01b0\u1ee3ng m\u1ed9t c\u00e1ch t\u01b0\u01a1ng x\u1ee9ng?","jp":"\u3
